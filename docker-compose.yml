name: jd-bank

# HOST PORTS: jd-bank publishes on the 254xx/255xx range, NOT the service defaults.
# This dev box runs several Docker projects at once (a pre-rename `agent-harness-*`
# stack still holds 5432/7474/7687, and other apps hold 15432/17474/19432/27474…), so
# claiming the standard ports means `make up` dies with "port is already allocated".
# In-container service-to-service addressing is UNCHANGED (`postgres:5432`,
# `bolt://neo4j:7687`) — only the host publication moved. Override per-port if you must.
services:
  # ─── Data Tier ───────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: harness
    ports: ["${JD_PG_PORT:-25432}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d harness"]
      interval: 5s
      timeout: 3s
      retries: 10

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/harnesspass
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_heap_max__size: 1G
    ports: ["${JD_NEO4J_HTTP_PORT:-25474}:7474", "${JD_NEO4J_BOLT_PORT:-25687}:7687"]
    volumes: [neo4jdata:/data]
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p harnesspass 'RETURN 1'"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    ports: ["${JD_REDIS_PORT:-25379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ─── App Tier ────────────────────────────────────────────────────────────
  api:
    build:
      context: ./core
      dockerfile: Dockerfile
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --reload
    ports: ["${JD_API_PORT:-25800}:8000"]
    environment: &app_env
      # EVERY value here is `${VAR:-<dev default>}` ON PURPOSE, and it is a security
      # property, not a style: a hardcoded literal cannot be overridden by the operator's
      # repo-root `.env`, so a setting the production startup check (P0.2,
      # core/src/settings.py) demands would be UNSATISFIABLE and every service would
      # refuse to start forever. `DATABASE_URL` and `NEO4J_PASSWORD` were literals until
      # 2026-08-09 and were exactly that trap. `tests/unit/test_compose_env_delivery.py`
      # now fails if a setting named in a refusal message is missing here or pinned to a
      # literal. NB pydantic's own `env_file=".env"` resolves inside the container (/app
      # = ./core) and is NOT how the repo-root `.env` reaches these services — compose
      # interpolation, right here, is.
      #
      # ── Deployment posture (P0.2) ── `production` makes the startup check binding.
      # Development is the default so nobody gets production behaviour by accident.
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://app:app@postgres:5432/harness}
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-harnesspass}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      # Ollama runs on metal on a TRUSTED INTERNAL HOST (`aria-gb10-2`) — NOT on the dev
      # box, and NOT `host.docker.internal` (which is what this said until we checked).
      # Overridable, so the hostname is config and not a fact welded into the repo.
      # Verified from inside the `gates` container: reachable, `nomic-embed-text` present,
      # 768-dim (ADR-002). So an inference-touching test is NOT blocked by `gates` being
      # self-contained — a constraint that had been deferring work on the strength of an
      # unchecked assumption. See ADR-003.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://aria-gb10-2:11434/v1}
      # NN #5 host allowlist. The default repeats `settings.allowed_inference_hosts`
      # rather than being empty: `${VAR:-}` would deliver an EMPTY allowlist, which
      # refuses the internal Ollama host itself and breaks `make embed`.
      ALLOWED_INFERENCE_HOSTS: ${ALLOWED_INFERENCE_HOSTS:-aria-gb10-2,localhost,127.0.0.1,host.docker.internal}
      AGENT_MODEL: qwen2.5-coder:14b
      EMBED_MODEL: nomic-embed-text
      MAX_REVIEW_ITERATIONS: "5"
      COVERAGE_THRESHOLD: "80"
      # ── Auth / CAS SSO (ADR-008) ── OFF by default (dev/CI never touch cas.sfu.ca).
      # Enable for a real login test via .env (gitignored): CAS_ENABLED=true,
      # BOOTSTRAP_ADMINS=<your-sfu-id>, and CAS_VERIFY_TLS=false if the container's cert
      # chain rejects cas.sfu.ca. CAS_DEV_FAKE_USER exercises the session machinery
      # WITHOUT the SFU round-trip (useful when localhost isn't a whitelisted service).
      CAS_ENABLED: ${CAS_ENABLED:-false}
      CAS_SERVICE_BASE_URL: ${CAS_SERVICE_BASE_URL:-http://localhost:25800}
      # Derive the CAS service origin from X-Forwarded-Host instead of the pinned one.
      # A client-controllable header; production refuses to start with it on.
      CAS_SERVICE_FROM_REQUEST: ${CAS_SERVICE_FROM_REQUEST:-false}
      CAS_VERIFY_TLS: ${CAS_VERIFY_TLS:-true}
      CAS_DEV_FAKE_USER: ${CAS_DEV_FAKE_USER:-}
      BOOTSTRAP_ADMINS: ${BOOTSTRAP_ADMINS:-}
      # The synthetic dev actor and the role it holds — the reason CAS-off is a dev-only
      # posture. Must never be blank (it would write an empty audit actor).
      CAS_ANONYMOUS_USER: ${CAS_ANONYMOUS_USER:-dev-anonymous}
      CAS_DEV_DEFAULT_ROLE: ${CAS_DEV_DEFAULT_ROLE:-admin}
      # HTTPS-only session cookie. Must be true in production (and needs an https
      # CAS_SERVICE_BASE_URL, or the cookie is never sent and login cannot complete).
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    extra_hosts:
      # Kept: testcontainers still resolves sibling containers via the host gateway. It is
      # no longer how Ollama is reached.
      - "host.docker.internal:host-gateway"
    volumes:
      - ./core:/app
      # Read-only dashboards (Phase 4.6c) serve committed pipeline artifacts. `docs/`
      # lives at the repo ROOT (not under ./core, which is /app), so bind it read-only —
      # these pages only ever READ it. See settings.baseline_summary_path.
      - ./docs:/docs:ro
    depends_on:
      postgres: { condition: service_healthy }
      neo4j: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    build:
      context: ./core
      dockerfile: Dockerfile
    command: arq src.worker.main.WorkerSettings
    environment: *app_env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes: ["./core:/app"]
    depends_on:
      postgres: { condition: service_healthy }
      neo4j: { condition: service_healthy }
      redis: { condition: service_healthy }

  # ─── Gate runner (Docker-only testing, ADR-006) ──────────────────────────
  # One-shot, CI-identical suite: static + unit(cov) + integration. Integration
  # tests use testcontainers → the Docker socket is mounted here (in-compose mount
  # works on Linux AND Docker Desktop, avoiding host-path quirks), and
  # TESTCONTAINERS_HOST_OVERRIDE makes the sibling containers reachable via the host
  # gateway. Ryuk disabled (reaper is unreliable in Docker-in-Docker). Not started by
  # `up` (profile: tools); invoked via `make gates` / `docker compose run --rm gates`.
  gates:
    profiles: ["tools"]
    build:
      context: ./core
      dockerfile: Dockerfile
    environment:
      <<: *app_env
      # Hermetic tests: pin auth OFF regardless of a local .env CAS toggle, so `make
      # gates` never runs in CAS mode or inherits a real BOOTSTRAP_ADMINS.
      CAS_ENABLED: "false"
      CAS_DEV_FAKE_USER: ""
      BOOTSTRAP_ADMINS: ""
      # …and pinned to development, for the same hermetic reason: `ENVIRONMENT` is now
      # interpolated from the host environment, and an operator (or a CI runner) with
      # ENVIRONMENT=production exported would otherwise make the whole suite refuse to
      # construct Settings. The gate suite tests the production check; it does not run
      # under it. A literal here is correct — this block is the one place it is.
      ENVIRONMENT: "development"
      # The data stores, pinned for the SAME reason. These were anchor literals until
      # 2026-08-09; making them `${VAR:-…}` (so production can supply real credentials)
      # silently made the gate suite inherit whatever DSN the operator's shell or
      # repo-root .env carries. `alembic/env.py` falls back to
      # `get_settings().database_url`, so an ambient production DSN could be reached
      # from a gate run. Integration tests use testcontainers and do not connect to
      # these today — this makes that a guarantee rather than an accident.
      DATABASE_URL: postgresql+asyncpg://app:app@postgres:5432/harness
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: harnesspass
      REDIS_URL: redis://redis:6379/0
      TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal
      TESTCONTAINERS_RYUK_DISABLED: "true"
      DOCKER_HOST: unix:///var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./core:/app
      - /var/run/docker.sock:/var/run/docker.sock
      # THIS FILE, read-only. `tests/unit/test_compose_env_delivery.py` asserts that
      # every setting the P0.2 startup check can demand is actually deliverable through
      # the `&app_env` anchor above — the guard was inert for exactly one reason, that
      # `ENVIRONMENT` appeared in `.env.example` and nowhere in compose. The container
      # binds only ./core, so the file has to be mounted to be checked.
      - ./docker-compose.yml:/docker-compose.yml:ro
    command: ["pytest", "-q"]

  # ─── Archive baseline (Phase 2.5) ────────────────────────────────────────
  # Runs the shipped validator + gate runner over the real SFU JD archive and writes
  # the segmented quality-baseline data. The archive lives OUTSIDE the repo and is
  # READ-ONLY (CLAUDE.md "External read-only paths"), so it is bound `:ro`.
  #
  # JD_ARCHIVE_PATH is deliberately NOT defaulted to any developer's real path — the
  # fallback is a repo-relative `./archive`, and if that is empty the runner REFUSES to
  # run rather than emitting a confident, fully-stamped baseline of nothing:
  #
  #   make baseline JD_ARCHIVE_PATH=/path/to/SFU_JDs
  #   make baseline JD_ARCHIVE_PATH=/path/to/SFU_JDs BASELINE_ARGS="--sample 30"
  #
  # Not started by `up` (profile: tools). No DB, no Redis, no Neo4j: the baseline is a
  # pure read of the archive through jd_core, and it persists nothing.
  baseline:
    profiles: ["tools"]
    build:
      context: ./core
      dockerfile: Dockerfile
    environment:
      PYTHONPATH: /app
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./core:/app
      - ${JD_ARCHIVE_PATH:-./archive}:/archive:ro
      # Working output (gitignored): all three artifacts, including the bulk rows.jsonl.
      - ${JD_BASELINE_OUT:-./out/baseline}:/out
      # The COMMITTED audit trail: summary.json + errors.jsonl. A baseline that only
      # exists in an ignored directory is not an audit trail.
      - ./docs/baseline:/committed
    command: ["python", "-m", "src.jd_bank.baseline"]

  # ─── Tier-1 exact-duplicate report (Phase 3.1) ───────────────────────────
  # Deliberately does NOT bind the archive. There is exactly one chain in this repo
  # that walks it (the baseline, above) and HANDOFF says "do not hand-roll a second
  # path" — so the dedup report reads the baseline's `rows.jsonl`, which already
  # carries a sha256 for every one of the 14,565 files, and groups it with the SAME
  # code the database pass uses. Run `make baseline` first.
  #
  #   make baseline JD_ARCHIVE_PATH=/path/to/SFU_JDs
  #   make dedup
  #
  # Not started by `up` (profile: tools). No DB: this is the report, not the pass.
  dedup:
    profiles: ["tools"]
    build:
      context: ./core
      dockerfile: Dockerfile
    environment:
      PYTHONPATH: /app
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./core:/app
      # Reads rows.jsonl; writes the raw group dump back beside it (both gitignored).
      - ${JD_BASELINE_OUT:-./out/baseline}:/out
      # The COMMITTED finding: docs/dedup/summary.json.
      - ./docs/dedup:/committed
    command: ["python", "-m", "src.jd_bank.dedup"]

  # ─── Archive ingest driver (Phase 3.2a) ──────────────────────────────────
  # UNLIKE baseline/dedup above, this one WRITES to Postgres — it is what fills
  # source_documents / parsed_jds for the first time. Everything after it (Phase 3.2b
  # embeddings, Tier-2/3 dedup, clustering) depends on these rows existing.
  #
  #   make ingest JD_ARCHIVE_PATH=/path/to/SFU_JDs
  #   make ingest JD_ARCHIVE_PATH=/path/to/SFU_JDs INGEST_ARGS="--limit 200"
  #
  # NB it is INGEST_ARGS, not BASELINE_ARGS — the Makefile's `ingest` target passes
  # $(INGEST_ARGS). Copy the wrong variable name here and the limit is silently
  # dropped: you get a full 14,565-file ingest where you asked for a smoke test.
  #
  # Not started by `up` (profile: tools). Needs Postgres (env copied from the
  # `api`/`worker` anchor via `<<: *app_env`); does NOT need Neo4j or Ollama — this
  # phase persists parsed JDs, it does not embed them yet.
  ingest:
    profiles: ["tools"]
    build:
      context: ./core
      dockerfile: Dockerfile
    environment:
      <<: *app_env
    volumes:
      - ./core:/app
      - ${JD_ARCHIVE_PATH:-./archive}:/archive:ro
    depends_on:
      postgres: { condition: service_healthy }
    command: ["python", "-m", "src.jd_bank.ingest", "--archive-root", "/archive"]

  # ─── Embeddings (Phase 3.2b) ──────────────────────────────────────────────
  # parsed_jds (Postgres) -> Neo4j's vector index. UNLIKE ingest, this needs BOTH
  # data stores AND a reachable Ollama (`OLLAMA_BASE_URL`, from `*app_env` ->
  # `aria-gb10-2`, ADR-003) — it is the first thing in this repo that calls a live
  # model endpoint outside of tests. No archive bind: it reads `parsed_jds`, it does
  # not walk the archive (run `make ingest` first).
  #
  #   make embed
  #   make embed EMBED_ARGS="--limit 200"
  #
  # Not started by `up` (profile: tools). The COMMITTED artifact
  # (docs/embeddings/summary.json) carries counts and stamps ONLY — never a vector.
  embed:
    profiles: ["tools"]
    build:
      context: ./core
      dockerfile: Dockerfile
    environment:
      <<: *app_env
    volumes:
      - ./core:/app
      - ./docs/embeddings:/committed
    depends_on:
      postgres: { condition: service_healthy }
      neo4j: { condition: service_healthy }
    command: ["python", "-m", "src.jd_bank.embeddings"]

  # ─── Harmonized-role embeddings (Phase 5.4b) ──────────────────────────────
  # `embed` covers the ARCHIVE; this covers the Bank's own output — one (:JDRole)
  # vector per cluster, so the Builder's "start from an existing JD" can find a
  # harmonized role semantically and not only by title. Same dependencies as
  # `embed` (Postgres + Neo4j + Ollama) and migration 003 applied.
  #
  #   make embed-roles
  #   make embed-roles EMBED_ROLES_ARGS="--limit 50"
  #
  # Not started by `up` (profile: tools). Deliberately NOT run from `approve` —
  # publishing must never depend on the GPU.
  embed-roles:
    profiles: ["tools"]
    build:
      context: ./core
      dockerfile: Dockerfile
    environment:
      <<: *app_env
    volumes:
      - ./core:/app
      - ./docs/embeddings:/committed
    depends_on:
      postgres: { condition: service_healthy }
      neo4j: { condition: service_healthy }
    command: ["python", "scripts/embed_roles.py"]

  # ─── Tier-2 near-duplicate dedup (Phase 3.3) ──────────────────────────────
  # MinHash-candidate, exact-Jaccard-scored, DB-reconciled `dedup_edges` rows at
  # `tier=NEAR_DUPLICATE`. Needs Postgres (source_documents / parsed_jds — run
  # `make ingest` first) AND the archive bind (`dedup.text_source: raw_clean`, the
  # shipped default, re-reads bytes from `storage_ref` — see `jd_bank.dedup.near.
  # text.ArchiveTextSource`). Neo4j is needed ONLY if `dedup.cosine_confirm_min` is
  # set — it ships `null` (HR-139), so this service does not depend on Neo4j by
  # default; if HR turns the cosine confirm on, run `make up` first so Neo4j is
  # reachable (`__main__.py` opens a driver only when the rulebook asks for one).
  #
  #   make near-dup
  #   make near-dup NEARDUP_ARGS="--limit 200"
  #
  # Not started by `up` (profile: tools). Committed artifacts (counts/stamps/
  # filenames ONLY — never document text): docs/dedup/near-dup-summary.json,
  # docs/dedup/near-dup-adjudication-sample.csv.
  near-dup:
    profiles: ["tools"]
    build:
      context: ./core
      dockerfile: Dockerfile
    environment:
      <<: *app_env
    volumes:
      - ./core:/app
      - ${JD_ARCHIVE_PATH:-./archive}:/archive:ro
      - ./docs/dedup:/committed
    depends_on:
      postgres: { condition: service_healthy }
    command: ["python", "-m", "src.jd_bank.dedup.near"]

  # ─── Tier-3 role-equivalence dedup (Phase 3.4b) ───────────────────────────
  # SAME-ROLE `dedup_edges` rows at `tier=ROLE_EQUIVALENT`. Reuses the 2.4c comparison
  # maths (`build_job_signals` -> skill_overlap + seniority_closeness +
  # score_job_similarity) with an idf corpus computed in the runner, and the hard
  # family-band conflict veto. UNLIKE near-dup it needs BOTH Postgres AND Neo4j (the doc
  # vectors Phase 3.2b wrote) and NO archive bind — it reads signals from `parsed_jds`
  # and vectors from Neo4j, never the raw files. Run `make ingest` then `make embed`
  # first. It only READS Neo4j (never constructs an embed client), so no Ollama.
  #
  #   make dedup-role
  #   make dedup-role DEDUPROLE_ARGS="--limit 200"
  #
  # Not started by `up` (profile: tools). Committed artifacts (counts/stamps/filenames
  # ONLY — never document text): docs/dedup/role-equiv-summary.json,
  # docs/dedup/role-equiv-adjudication-sample.csv.
  dedup-role:
    profiles: ["tools"]
    build:
      context: ./core
      dockerfile: Dockerfile
    environment:
      <<: *app_env
    volumes:
      - ./core:/app
      - ./docs/dedup:/committed
    depends_on:
      postgres: { condition: service_healthy }
      neo4j: { condition: service_healthy }
    command: ["python", "-m", "src.jd_bank.dedup.role"]

  # ─── Phase-3.5 role clustering (report-only) ──────────────────────────────
  # Connected components over the ADMITTED Tier-1/2/3 `dedup_edges` graph + the HR
  # eyeball report. Reads NEAR/ROLE edges from Postgres and synthesizes EXACT
  # connectivity from `source_documents.sha256`; NO archive bind. Neo4j is OPTIONAL
  # (the `documents_with_vector` report column only — clustering itself is over the edge
  # graph), so it is listed as a dependency for the convenience of the default run;
  # `--no-vectors` runs Postgres-only. Run `make ingest`, `make near-dup` and `make
  # dedup-role` first.
  #
  #   make cluster
  #   make cluster CLUSTER_ARGS="--limit 500"
  #
  # PERSISTS NOTHING — writes no `Cluster` row (Phase 4). Not started by `up` (profile:
  # tools). Committed artifacts (counts/stamps/filenames ONLY — never document text):
  # docs/cluster/cluster-summary.json, cluster-report.csv, cluster-members.csv.
  cluster:
    profiles: ["tools"]
    build:
      context: ./core
      dockerfile: Dockerfile
    environment:
      <<: *app_env
    volumes:
      - ./core:/app
      - ./docs/cluster:/committed
    depends_on:
      postgres: { condition: service_healthy }
      neo4j: { condition: service_healthy }
    command: ["python", "-m", "src.jd_bank.cluster"]

  # ─── Phase-4.1 harmonization measurement (report-only) ────────────────────
  # Drive the pure `merge_cluster` engine over the real JDFN role clusters (recomputed
  # in-process from the `dedup_edges` graph) and MEASURE the distributions the 9
  # harmonization.yaml knobs (HR-167..175) cut on. WJQ (CUPE) members are excluded and
  # counted. Needs Postgres (parsed_jds + dedup_edges — run `make ingest`, `make
  # near-dup`, `make dedup-role` first); does NOT need Neo4j or Ollama (clustering is over
  # the edge graph, and merge_cluster is pure/LLM-free).
  #
  #   make harmonize-measure
  #   make harmonize-measure HARMONIZE_ARGS="--limit 2000"
  #
  # PERSISTS NOTHING and picks NO knob value (the coder MEASURES, the orchestrator
  # DECIDES). Not started by `up` (profile: tools). Committed artifacts
  # (counts/labels/stamps ONLY — never document text): docs/harmonize/summary.json,
  # docs/harmonize/clusters.csv.
  harmonize:
    profiles: ["tools"]
    build:
      context: ./core
      dockerfile: Dockerfile
    environment:
      <<: *app_env
    volumes:
      - ./core:/app
      - ./docs/harmonize:/committed
    depends_on:
      postgres: { condition: service_healthy }
    command: ["python", "-m", "src.jd_bank.harmonize"]

  # ─── Phase-4.4a canonical-draft producer (WRITES DRAFT canonical_jds) ──────
  # Drive the Phase-4 pipeline over the real JDFN role clusters (recomputed in-process
  # from the `dedup_edges` graph) and PERSIST the result as DRAFT `canonical_jds` rows —
  # the 4.4 review work-list. UNLIKE `harmonize` this WRITES to Postgres (clusters /
  # canonical_jds / audit_log). Idempotent + never clobbers a reviewer-touched canonical;
  # NOTHING publishes (non-negotiable #1). Needs Postgres (parsed_jds + dedup_edges — run
  # `make ingest`, `make near-dup`, `make dedup-role` first); no Neo4j (clustering is over
  # the edge graph). The FULL pipeline (4.2a rewrite + 4.2b audit) needs a reachable Ollama
  # on `aria-gb10-2` (OLLAMA_BASE_URL, from `*app_env`, ADR-003) — so the real run is
  # LOCAL-ONLY; `CANONICAL_ARGS="--no-llm"` persists the deterministic 4.1 merge draft only
  # and needs no model endpoint.
  #
  #   make canonical-drafts
  #   make canonical-drafts CANONICAL_ARGS="--no-llm"
  #   make canonical-drafts CANONICAL_ARGS="--limit 500"
  #
  # Not started by `up` (profile: tools). The COMMITTED artifact
  # (docs/canonical/summary.json) carries COUNTS + STAMPS only — never JD text.
  canonical:
    profiles: ["tools"]
    build:
      context: ./core
      dockerfile: Dockerfile
    environment:
      <<: *app_env
    volumes:
      - ./core:/app
      - ./docs/canonical:/committed
    depends_on:
      postgres: { condition: service_healthy }
    command: ["python", "-m", "src.jd_bank.canonical"]

  # ─── Phase-4.2a LLM rewrite golden (opt-in, LOCAL-ONLY) ────────────────────
  # Runs the live rewrite golden against the REAL chat model on `aria-gb10-2`
  # (OLLAMA_BASE_URL, ADR-003) — NEVER part of `make gates` / CI (a cloud runner cannot
  # route to a private internal host, and the whole suite must not depend on a live
  # endpoint). Needs NO data stores: the golden builds a MergedRole in-memory and asserts
  # the validator post-state of the reworded draft (a RELATION, never verbatim model text).
  # Self-skips per-test if the endpoint is unreachable (off-VPN). Mirrors `embed` /
  # `harmonize`; not started by `up` (profile: tools).
  #
  #   make rewrite-golden
  rewrite:
    profiles: ["tools"]
    build:
      context: ./core
      dockerfile: Dockerfile
    environment:
      <<: *app_env
    volumes:
      - ./core:/app
    command: ["pytest", "tests/live/test_rewrite_live.py", "-m", "live", "--timeout=300", "-q"]

  # ─── Phase-4.2b LLM quality-AUDIT golden (opt-in, LOCAL-ONLY) ───────────────
  # Runs the live nuanced quality-audit golden against the REAL chat model on `aria-gb10-2`
  # (OLLAMA_BASE_URL, ADR-003) — NEVER part of `make gates` / CI (a cloud runner cannot route
  # to a private internal host, and the whole suite must not depend on a live endpoint). Needs
  # NO data stores: the golden builds an SFUJobDescription in-memory and asserts the audit's
  # post-state (every surviving issue quotes the JD verbatim — a RELATION, never verbatim model
  # text). Self-skips per-test if the endpoint is unreachable (off-VPN). Mirrors `rewrite`; not
  # started by `up` (profile: tools).
  #
  #   make quality-golden
  quality:
    profiles: ["tools"]
    build:
      context: ./core
      dockerfile: Dockerfile
    environment:
      <<: *app_env
    volumes:
      - ./core:/app
    command: ["pytest", "tests/live/test_quality_live.py", "-m", "live", "--timeout=300", "-q"]

volumes:
  pgdata:
  neo4jdata:
