name: jd-bank

services:
  # ─── Data Tier ───────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: harness
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d harness"]
      interval: 5s
      timeout: 3s
      retries: 10

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/harnesspass
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_heap_max__size: 1G
    ports: ["7474:7474", "7687:7687"]
    volumes: [neo4jdata:/data]
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p harnesspass 'RETURN 1'"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ─── App Tier ────────────────────────────────────────────────────────────
  api:
    build:
      context: ./core
      dockerfile: Dockerfile
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --reload
    ports: ["8000:8000"]
    environment: &app_env
      DATABASE_URL: postgresql+asyncpg://app:app@postgres:5432/harness
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: harnesspass
      REDIS_URL: redis://redis:6379/0
      OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
      AGENT_MODEL: qwen2.5-coder:14b
      EMBED_MODEL: nomic-embed-text
      MAX_REVIEW_ITERATIONS: "5"
      COVERAGE_THRESHOLD: "80"
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Linux: reach Ollama on metal
    volumes: ["./core:/app"]
    depends_on:
      postgres: { condition: service_healthy }
      neo4j: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    build:
      context: ./core
      dockerfile: Dockerfile
    command: arq src.worker.main.WorkerSettings
    environment: *app_env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes: ["./core:/app"]
    depends_on:
      postgres: { condition: service_healthy }
      neo4j: { condition: service_healthy }
      redis: { condition: service_healthy }

  frontend:
    build:
      context: ./core
      dockerfile: Dockerfile
    command: flask --app frontend.app run --host 0.0.0.0 --port 5000 --debug
    ports: ["5000:5000"]
    environment:
      API_BASE_URL: http://api:8000
      FLASK_SECRET_KEY: dev-only-change-me
    volumes: ["./core:/app"]
    depends_on: [api]

  # ─── Gate runner (Docker-only testing, ADR-006) ──────────────────────────
  # One-shot, CI-identical suite: static + unit(cov) + integration. Integration
  # tests use testcontainers → the Docker socket is mounted here (in-compose mount
  # works on Linux AND Docker Desktop, avoiding host-path quirks), and
  # TESTCONTAINERS_HOST_OVERRIDE makes the sibling containers reachable via the host
  # gateway. Ryuk disabled (reaper is unreliable in Docker-in-Docker). Not started by
  # `up` (profile: tools); invoked via `make gates` / `docker compose run --rm gates`.
  gates:
    profiles: ["tools"]
    build:
      context: ./core
      dockerfile: Dockerfile
    environment:
      <<: *app_env
      TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal
      TESTCONTAINERS_RYUK_DISABLED: "true"
      DOCKER_HOST: unix:///var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./core:/app
      - /var/run/docker.sock:/var/run/docker.sock
    command: ["pytest", "-q"]

  # ─── Archive baseline (Phase 2.5) ────────────────────────────────────────
  # Runs the shipped validator + gate runner over the real SFU JD archive and writes
  # the segmented quality-baseline data. The archive lives OUTSIDE the repo and is
  # READ-ONLY (CLAUDE.md "External read-only paths"), so it is bound `:ro`.
  #
  # JD_ARCHIVE_PATH is deliberately NOT defaulted to any developer's real path — the
  # fallback is a repo-relative `./archive`, and if that is empty the runner REFUSES to
  # run rather than emitting a confident, fully-stamped baseline of nothing:
  #
  #   make baseline JD_ARCHIVE_PATH=/path/to/SFU_JDs
  #   make baseline JD_ARCHIVE_PATH=/path/to/SFU_JDs BASELINE_ARGS="--sample 30"
  #
  # Not started by `up` (profile: tools). No DB, no Redis, no Neo4j: the baseline is a
  # pure read of the archive through jd_core, and it persists nothing.
  baseline:
    profiles: ["tools"]
    build:
      context: ./core
      dockerfile: Dockerfile
    environment:
      PYTHONPATH: /app
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./core:/app
      - ${JD_ARCHIVE_PATH:-./archive}:/archive:ro
      # Working output (gitignored): all three artifacts, including the bulk rows.jsonl.
      - ${JD_BASELINE_OUT:-./out/baseline}:/out
      # The COMMITTED audit trail: summary.json + errors.jsonl. A baseline that only
      # exists in an ignored directory is not an audit trail.
      - ./docs/baseline:/committed
    command: ["python", "-m", "src.jd_bank.baseline"]

  # ─── Tier-1 exact-duplicate report (Phase 3.1) ───────────────────────────
  # Deliberately does NOT bind the archive. There is exactly one chain in this repo
  # that walks it (the baseline, above) and HANDOFF says "do not hand-roll a second
  # path" — so the dedup report reads the baseline's `rows.jsonl`, which already
  # carries a sha256 for every one of the 14,565 files, and groups it with the SAME
  # code the database pass uses. Run `make baseline` first.
  #
  #   make baseline JD_ARCHIVE_PATH=/path/to/SFU_JDs
  #   make dedup
  #
  # Not started by `up` (profile: tools). No DB: this is the report, not the pass.
  dedup:
    profiles: ["tools"]
    build:
      context: ./core
      dockerfile: Dockerfile
    environment:
      PYTHONPATH: /app
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./core:/app
      # Reads rows.jsonl; writes the raw group dump back beside it (both gitignored).
      - ${JD_BASELINE_OUT:-./out/baseline}:/out
      # The COMMITTED finding: docs/dedup/summary.json.
      - ./docs/dedup:/committed
    command: ["python", "-m", "src.jd_bank.dedup"]

volumes:
  pgdata:
  neo4jdata:
