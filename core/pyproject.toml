[project]
name = "jd-bank-core"
version = "2.0.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "ASYNC"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency-injection defaults (Depends/Query/Path) are idiomatic, not B008 bugs.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]

[tool.ruff.lint.isort]
# `src` is our package; the local `alembic/` migrations dir must NOT make the
# third-party `alembic` distribution be classified as first-party.
known-first-party = ["src"]
known-third-party = ["alembic"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.mypy]
strict = true
python_version = "3.11"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["testcontainers.*", "arq.*", "docx", "docx.*", "striprtf.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# `-m "not live"` is the critical line: the `gates` compose service's DEFAULT command
# is a bare `pytest -q` (docker-compose.yml), and `testpaths = ["tests"]` means that
# bare invocation collects `tests/live` too. CI (ubuntu-latest) can never reach
# `aria-gb10-2` (ADR-003) and never will, so live tests must be DESELECTED by
# default, not merely skippable — a marker alone is not enough. The Makefile and
# ci.yml also pass `-m "not live"` explicitly on the commands that matter; this is
# what protects every OTHER way of invoking pytest in this container.
addopts = "--strict-markers -m \"not live\""
markers = [
    "live: opt-in, LOCAL-ONLY test against a real Ollama endpoint (aria-gb10-2). Never runs in `make gates` / CI — see ADR-003. Run via `make gates-live`.",
]

[tool.coverage.run]
source = ["src"]
omit = ["src/worker/main.py"]  # worker entry covered by integration, not unit
