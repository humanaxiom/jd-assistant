[project]
name = "agent-harness-core"
version = "2.0.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "ASYNC"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency-injection defaults (Depends/Query/Path) are idiomatic, not B008 bugs.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]

[tool.ruff.lint.isort]
# `src` is our package; the local `alembic/` migrations dir must NOT make the
# third-party `alembic` distribution be classified as first-party.
known-first-party = ["src"]
known-third-party = ["alembic"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.mypy]
strict = true
python_version = "3.11"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["testcontainers.*", "arq.*", "docx", "docx.*", "striprtf.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]
omit = ["src/worker/main.py"]  # worker entry covered by integration, not unit
