# Guided-authoring question set for the CUPE (WJQ) Builder — Phase E, restructured J2.
#
# jd_bank-LOCAL authoring DATA — the UX content a manager is walked through, NOT the
# scoring rulebook. Same class as `composer_questions_v1.yaml` (the JDFN set) and loaded
# the same way: it changes no JD's score/grade/gate, so it is neither a hashed rule file
# nor an HR-register decision. (The OPTION LISTS the J2 controls offer — frequencies,
# levels, scales, lead phrases, limits — are rulebook data in `cupe_form.yaml` and ARE
# registered, HR-246 … HR-252. This file only words the questions.)
#
# SOURCE: SFU HR's "WJQ Custom Part I: Job Description" form (S13, vendored in
# fixtures/hr/cupe/) and the CUPE JD Writing Guide (S14). J2 (2026-10-19) rewrote the
# hints that CONTRADICTED those sources (hr-gap-analysis.md §4 P2): section 5 asked who
# supervises (HR's levels measure independence, not supervision received); section 11
# listed shifts / on-call / travel (HR files those under Occupational Requirement(s));
# section 12 asked for certifications (HR's levels are about learning); minor functions
# said "incidental" (HR: "annually and periodically"); major functions asked for a % of
# time (HR's form asks how often — (D)/(W)/(M)/(S)). The question ORDER is the form's
# order, so an author can follow a paper WJQ down the page.
#
# ⚠ `section` is an `SFUSection` — the JDFN template's section vocabulary — because that
# is what `Question.section` is typed as and what the live authoring panel groups by.
# TEN of the WJQ's fourteen sections have no JDFN counterpart; their text is collected
# under `additional_context`, which is EXACTLY where `parser/wjq.py` stores them. The
# `group` field carries the WJQ's own section name so the UI shows the form's real
# structure — presentation, not scoring.
#
# NOT ASKED, on purpose:
#   * `employee_group` — fixed to `cupe` by the assembler (it selects the bar the draft
#     is judged against, so an author must not be able to change it).
#   * HR's "Classification & Grade Approved" / Effective Date / Approved by / Next
#     Review — the "FOR USE BY HUMAN RESOURCES" box (HR-240). The author gives the
#     CURRENT classification instead.
#   * SFU's About/territorial/EDI boilerplate — the WJQ form does not contain it (HR-201).
#   * Section 14, APPROVAL AND REVIEW — signatures and dates are printed BLANK on the
#     export; typing an approval into the content would be an unverifiable claim of
#     sign-off (NN #1).
version: composer_questions_wjq_v1

questions:
  # --- 1. POSITION IDENTIFICATION ---------------------------------------------------
  - id: title
    section: identification
    group: 1 · Position Identification
    prompt: What is the department position title?
    hint: >-
      The title as it appears on the form's "Department Position Title" line. Describe
      the role, not the person.
    target: title
    required: true
  - id: department
    section: identification
    group: 1 · Position Identification
    prompt: Which department is this position in?
    hint: ""
    target: department
    required: false
  - id: position_number
    section: identification
    group: 1 · Position Identification
    prompt: What is the position number (or numbers)?
    hint: >-
      One job description can cover several positions — list each number, separated by
      commas. Leave blank if the position has not been numbered yet.
    target: position_number
    required: false
  - id: current_classification
    section: identification
    group: 1 · Position Identification
    prompt: What is the position's current classification?
    hint: >-
      The classification the position holds today ("Current Position Classification").
      Leave blank for a new position. The classification and grade HR approves go in
      HR's own box ("For use by Human Resources"), which the export leaves blank.
    target: current_classification
    required: false
  - id: supervisor_title
    section: identification
    group: 1 · Position Identification
    prompt: What is the evaluating supervisor's title?
    hint: The title of the supervisor who will review and sign Part 1.
    target: supervisor_title
    required: false
  - id: date_completed
    section: identification
    group: 1 · Position Identification
    prompt: Date completed
    hint: ""
    target: date_completed
    required: false
  - id: completed_by
    section: identification
    group: 1 · Position Identification
    prompt: Part 1 is being completed by
    hint: ""
    target: completed_by
    required: false

  # --- 2. POSITION SUMMARY ----------------------------------------------------------
  - id: position_summary
    section: position_summary
    group: 2 · Position Summary
    prompt: Summarise the major functions of this position.
    hint: >-
      A summary of the major functions of the position in three or four sentences.
    target: position_summary
    required: true

  # --- 3/4. MAJOR + MINOR FUNCTIONS -------------------------------------------------
  - id: major_functions
    section: duties
    group: 3 · Major Functions
    prompt: What are the major functions of the position?
    hint: >-
      List the duties and responsibilities in order of frequency, and say how often
      each is done: (D) Daily, (W) Weekly, (M) Monthly or (S) Semester. Start each with
      an action verb and say what is done, how, and why.
    target: major_functions
    required: true
  - id: minor_functions
    section: duties
    group: 4 · Minor Functions
    prompt: What are the minor functions?
    hint: >-
      Duties and responsibilities that occur annually and periodically throughout the
      year. HR's guide asks for this line last: "Performs other duties and
      responsibilities consistent with the job description and classification on
      request."
    target: minor_functions
    required: false

  # --- 5. LEVEL OF INDEPENDENCE -----------------------------------------------------
  - id: level_of_independence_levels
    section: additional_context
    group: 5 · Level of Independence
    prompt: Which ONE level best describes the independence of a fully trained employee?
    hint: >-
      Check one box that best describes the level of independence that can be
      exercised within the position by a fully trained employee.
    target: level_of_independence_levels
    required: false
  - id: level_of_independence
    section: additional_context
    group: 5 · Level of Independence
    prompt: Anything to add?
    hint: >-
      If you chose the project-by-project level, provide examples of project work here.
    target: level_of_independence
    required: false

  # --- 6. TRAINING EXERCISED --------------------------------------------------------
  - id: training_exercised_levels
    section: additional_context
    group: 6 · Training Exercised
    prompt: What training does the position provide?
    hint: If the position provides training, check each description that applies.
    target: training_exercised_levels
    required: false
  - id: training_exercised
    section: additional_context
    group: 6 · Training Exercised
    prompt: Anything to add?
    hint: ""
    target: training_exercised
    required: false

  # --- 7. DIRECTION EXERCISED -------------------------------------------------------
  - id: direction_exercised_levels
    section: additional_context
    group: 7 · Direction Exercised
    prompt: What direction does the position exercise?
    hint: Check each description that applies.
    target: direction_exercised_levels
    required: false
  - id: direction_exercised
    section: additional_context
    group: 7 · Direction Exercised
    prompt: Anything to add?
    hint: ""
    target: direction_exercised
    required: false

  # --- 8. INTERNAL AND EXTERNAL CONTACTS --------------------------------------------
  - id: contacts
    section: relationships
    group: 8 · Internal and External Contacts
    prompt: Who does the position deal with, for how long and how often?
    hint: >-
      Specific positions within your own department, other departments, students,
      faculty, on/off campus vendors, etc. Duration is per contact: less than 1 hour,
      1-2 hours or more than 2 hours at a time; frequency is occasional, frequent or
      continuous. "Inside / outside SFU" is for the Bank — the form does not print it.
    target: contacts
    required: false

  # --- 9. IMPACT OF ERRORS ----------------------------------------------------------
  - id: impact_of_errors
    section: additional_context
    group: 9 · Impact of Errors
    prompt: What is the impact if an error is made in this work?
    hint: >-
      A few examples of the most common errors and of uncommon ones — what goes wrong,
      who it affects, and how it is normally caught or corrected.
    target: impact_of_errors
    required: false

  # --- 10. EFFORT -------------------------------------------------------------------
  - id: effort_rows
    section: additional_context
    group: 10 · Effort
    prompt: What concentrated effort does the work require?
    hint: >-
      Concentrated periods of auditory (hearing/listening), visual (seeing), perceptual
      (understanding/comprehending) and physical dexterity effort (finger/hand
      movements, eye/hand coordination, lifting, carrying, pushing, pulling, reaching —
      and sitting, standing or walking). For each, the concentrated duration and how
      often.
    target: effort_rows
    required: false
  - id: effort
    section: additional_context
    group: 10 · Effort
    prompt: Anything to add?
    hint: ""
    target: effort
    required: false

  # --- 11. WORKING CONDITIONS -------------------------------------------------------
  - id: location_rows
    section: additional_context
    group: 11 · Working Conditions
    prompt: Where is the work performed, and for how many of the weekly hours?
    hint: >-
      Office, laboratory, outside work site, etc., and the hours spent there out of the
      total hours worked per week (e.g. "General office — 35 / 35").
    target: location_rows
    required: false
  - id: uncomfortable_rows
    section: additional_context
    group: 11 · Working Conditions
    prompt: What uncomfortable or distracting conditions is the incumbent exposed to?
    hint: >-
      On a regular basis — interruptions, distracting noise, odours, dust, drafts,
      temperature extremes, fumes, vibrations, etc. — and how often.
    target: uncomfortable_rows
    required: false
  - id: hazard_rows
    section: additional_context
    group: 11 · Working Conditions
    prompt: What potential health or safety hazards is the incumbent exposed to?
    hint: >-
      E.g. complaints or verbal/physical abuse, noise, chemicals, repetitive movements,
      heights, bio-hazardous waste — and how often. Shift work, on-call and travel are
      not working conditions on HR's form: put them under Occupational Requirement(s)
      in section 13.
    target: hazard_rows
    required: false
  - id: working_conditions
    section: additional_context
    group: 11 · Working Conditions
    prompt: Anything to add?
    hint: ""
    target: working_conditions
    required: false

  # --- 12. CONTINUING EDUCATION -----------------------------------------------------
  - id: continuing_education_levels
    section: additional_context
    group: 12 · Continuing Education
    prompt: What continuing education does the position require?
    hint: Check each description that applies.
    target: continuing_education_levels
    required: false
  - id: continuing_education
    section: additional_context
    group: 12 · Continuing Education
    prompt: Anything to add?
    hint: ""
    target: continuing_education
    required: false

  # --- 13. QUALIFICATIONS -----------------------------------------------------------
  - id: education
    section: qualifications
    group: 13 · Qualifications
    prompt: What is the highest level of formal schooling required?
    hint: >-
      The minimum required to satisfactorily perform the work — not the ideal. One per
      line.
    target: education
    required: false
  - id: certification
    section: qualifications
    group: 13 · Qualifications
    prompt: In addition to formal education, what certification or program of study is required?
    hint: One per line, or "None".
    target: certification
    required: false
  - id: experience_years
    section: qualifications
    group: 13 · Qualifications
    prompt: How many years of minimum experience are required?
    hint: A number of years.
    target: experience_years
    required: false
  - id: experience
    section: qualifications
    group: 13 · Qualifications
    prompt: What kind of experience?
    hint: The experience those years are in. One per line.
    target: experience
    required: false
  - id: equivalency
    section: qualifications
    group: 13 · Qualifications
    prompt: Is an equivalent combination of education, certification and experience acceptable?
    hint: ""
    target: equivalency
    required: false
  - id: equivalency_rationale
    section: qualifications
    group: 13 · Qualifications
    prompt: If it is NOT acceptable, why not?
    hint: >-
      HR's guide: "If you make this choice, you must describe the rationale."
    target: equivalency_rationale
    required: false
  - id: occupational_skills
    section: qualifications
    group: 13 · Qualifications
    prompt: "Occupational Skills: what skills are specifically required?"
    hint: >-
      Measurable, with a level where it matters (e.g. "55 wpm keyboarding", "standard
      office applications at an intermediate level"). Optionally start a line with
      "Knowledge of" or "Ability to".
    target: occupational_skills
    required: false
  - id: occupational_requirements
    section: qualifications
    group: 13 · Qualifications
    prompt: "Occupational Requirement(s): any non-skill requirements?"
    hint: >-
      E.g. ability to work shifts and/or be on-call; travel periodically outside the
      lower mainland; a valid driver's licence; lifting, moving or carrying equipment
      or materials over 10 kg. One per line, or "None".
    target: occupational_requirements
    required: false
