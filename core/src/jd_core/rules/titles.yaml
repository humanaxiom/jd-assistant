# SFU job titles — RULEBOOK AS DATA (CLAUDE.md §2).
#
# TWO tables live here:
#   `restricted` — title phrases SFU reserves (Part 3.5). RULEBOOK-SOURCED.
#   `families`   — the seniority ladder used to classify a title. NOT in the
#                  rulebook (see the provenance warning on it below). HR-059.
#
# A title phrase (matched casefolded, as a substring of the JD title) that SFU
# reserves for a specific context. `reserved_for_employee_group` is non-null only
# when the restriction is checkable from the JD alone; the others need context a
# validator cannot verify, so they are advisory (`severity: info`).
#
# `severity` must be one of the JDIssueSeverity literal (jd_core.models.quality).
# `rule_id` names the catalogued gate (rule_catalog.yaml) the match raises — the
# loader rejects a rule_id that is not in the catalog.
#
# provenance:
#   rulebook: docs/rulebook/sfu-jd-standards.txt — Part 3.5 (restricted titles)
#   provenance doc: docs/rulebook/sfu-reference.md §2 (Job Titling Guide, Toolkit p18-19)
#   hris: packages/pipeline/src/pipeline/quality/jd_rules.py :: _authoring_gates
#     ("executive director" -> employee_group must be apex, severity low;
#     "registrar" and "human resources" -> severity info, context not checkable)
version: jd_rules_sfu_v3

# The seniority ladder a job title is classified onto, senior -> junior. Consumed
# by the title-family classifier (jd_core.models.bank.TitleFamily is this list,
# plus the explicit "unmapped" state) and, later, by title normalization in
# dedup Tier-3 and by the composer's facets.
#
# ⚠ PROVENANCE — NOT SFU-PUBLISHED. hris's schema called this "SFU's official
# title ladder (Toolkit p18-19)". docs/rulebook/sfu-jd-standards.txt contains no
# such ladder: `chief` never appears in it, and the single occurrence of "VP"
# (Part 3.5) lists VP as a RESTRICTED title, not a family. The ladder is
# hris_calibration — an inherited default nobody at SFU has ratified — and it is
# registered as `open` (HR-059). Same class of unfalsifiable-SFU-claim as HR-029.
# It is the *seniority* dimension only; the *functional* dimension (analyst /
# officer / coordinator …) IS rulebook-sourced (Part 3.3 Application Table) and
# lands with the classifier.
families:
  - vp
  - chief
  - director
  - manager
  - lead
  - associate
  - assistant

restricted:
  - key: executive_director
    rule_id: SFU-AUTH-TITLE-EXEC-DIR
    phrase: executive director
    reserved_for_employee_group: apex
    severity: low
    note: Reserved for APEX-classified roles.
  - key: registrar
    rule_id: SFU-AUTH-TITLE-REGISTRAR
    phrase: registrar
    reserved_for_employee_group: null
    severity: info
    note: Reserved for registrarial roles within AVPSI Student Services.
  - key: human_resources
    rule_id: SFU-AUTH-TITLE-HR
    phrase: human resources
    reserved_for_employee_group: null
    severity: info
    note: Reserved for roles within SFU HR; elsewhere use "personnel".
