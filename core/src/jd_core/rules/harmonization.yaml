# Deterministic harmonization merge engine (Phase 4.1) — rulebook-as-data (CLAUDE.md §2).
#
# WHAT THIS FILE DECIDES
# ----------------------
# HOW a cluster's member JDs are merged into a single canonical *draft* — which
# scalar/text section wins, how duties are deduped and ordered, and how the KSA
# (Qualifications) block is rebuilt from the cluster's skill/education/experience
# evidence. It decides NOTHING about how a JD is SCORED or APPROVED: the approval bar
# lives in the HASHED files (gates/scoring/rule_catalog/...). A merge-policy change
# must therefore NOT churn `rules_version` — that digest identifies *which rules
# scored a JD*, and re-tuning a merge knob scores nothing. So, exactly like
# `dedup.yaml` / `embeddings.yaml` / `segmentation.yaml`, this file is REGISTERED and
# on the decision surface but EXCLUDED from `rules_version` (`loader._UNHASHED_FILES`).
#
# PROVENANCE + CALIBRATION
# ------------------------
# EVERY value here is `our_invention`, `status: open` (HR-167…HR-175). SFU publishes no
# harmonization policy, and hris harmonized via an LLM prompt only — there is no
# deterministic merge policy to have inherited. All defaults below are PROVISIONAL
# STARTING VALUES, to be calibrated by a post-run measurement pass over the real JDFN
# role clusters (mirroring 3.5's measure-after pattern) — NOT settled numbers. Each
# register entry says so in `why_it_matters`.
#
# OUT OF SCOPE (do not add knobs for these here): %-rebalance of duty allocations, any
# LLM rewrite / anti-fabrication pass, diff/change-log, review queue, DB persistence.

version: jd_rules_sfu_v4

# --- which FORMS the producer authors a draft for (CUPE Phase D) --------------------
# The document templates the canonical-draft producer harmonizes, in PRIORITY order. A
# cluster's canonical is authored on the FIRST listed template that has members in that
# cluster; members on any other template are dropped from the merge and COUNTED (never
# silently). `jd_core.quality.validators.template_of` decides a member's template — the
# same separator `applies_to` (Phase B) and `thresholds_for` (Phase C) already use.
#
# It is a priority list rather than a set because `canonical_jds` is UNIQUE on
# (cluster_id, version): a cluster can hold exactly one draft, so a MIXED cluster needs
# a rule for which form wins. `jdfn` first keeps every mixed cluster authoring exactly
# what it authored before this knob existed — JDFN is the control, as it was in B and C.
# Dropping `wjq` from the list restores the pre-Phase-D behaviour exactly. HR-206.
templates_harmonized: [jdfn, wjq]

# --- section selection (scalars / text) --------------------------------------------
# How the canonical TITLE is chosen. `modal_normalized`: group members by their
# `normalize_title` stem, take the most-populous group (the modal role), and within it
# pick the representative raw title by SHORTEST then lexicographic — a deterministic
# tie-break, not the caller's input order. `first_raw`: the lexicographically-first raw
# title, modality ignored. No rewrite (that is 4.2). HR-167.
title_policy: modal_normalized

# How the POSITION SUMMARY representative is picked (verbatim, NO rewrite — 4.2 rewrites).
# `within_target_then_central`: among member summaries whose word count falls in SFU's
# published 100–150 target (`thresholds.summary_min_words`/`summary_max_words` — one
# rulebook fact, one home), pick the most-central (highest token-Jaccard to the others);
# if none is in range, fall back to the most-central over all. `most_central` skips the
# in-range preference. HR-168.
summary_policy: within_target_then_central

# What to do with ADDITIONAL CONTEXT across members. `drop`: omit it (a union of
# per-member contextual notes is noisy and often position-specific). `longest`: carry the
# single longest member note verbatim. HR-169.
#
# This top-level value is the JDFN policy (as the top-level thresholds are the JDFN
# profile) — see the `wjq:` block below for why the WJQ needs a different one.
additional_context_policy: drop

# --- what the WJQ does differently (CUPE Phase E) -----------------------------------
# `additional_context` means something completely different on the two forms. On a JDFN
# JD it is an optional trailing note. On the WJQ it is where the parser stores SEVEN OF
# THE FOURTEEN SECTIONS — the point-factor blocks (`wjq.context_sections`) — which is
# why Phase A's 4,000-char truncation was a defect worth re-parsing the archive over.
#
# MEASURED on the live Bank 2026-08-17: 95.4% of CUPE source documents (4,237 of 4,440)
# carry it, averaging 5,524 characters — and **0 of 553 CUPE canonical drafts had any**,
# because the harmonizer applied `drop`. The Bank was discarding half of every CUPE
# form at merge time. HR-207.
wjq:
  additional_context_policy: longest

# --- the three member-level sections 4.1 merges (S-5, 2026-08-20) -------------------
# Until 2026-08-20 the merge left DECISION MAKING, PROBLEM SOLVING and RELATIONSHIPS at
# their model defaults for every cluster of every form, and said so honestly via
# `sections_not_merged`. MEASURED consequence (docs/baseline/jdfn-remeasure-2026-08-19.md):
# the rewrite's anti-fabrication guard refuses to let the model CREATE a section the
# grounded draft does not have — correctly — so 685 post-guard JDFN drafts carried none
# of the three, mean score 66.42, and all three completeness rules fired on 100% of
# drafts. A finding present on every draft is a constant, not a signal.
#
# The content was in the sources the whole time: 97.0% of JDFN documents carry
# `decision_making`, 44.9% `problem_solving`, 97.4% `relationships`. The merge dropped it
# before the rewrite ever saw it, so NO draft the pipeline produced could be complete.
#
# ⚠ The fix is NOT to loosen the guard. Pre-guard, 1,084 JDFN drafts carried a Decision
# Making section the model invented from an empty draft — an 18.19-point lift made of
# fabricated content. Merging the sections puts GROUNDED text where the guard expects it
# and brings those points back honestly.
#
# Each policy: `drop` (the pre-2026-08-20 behaviour — content lost, and
# `sections_not_merged` reports it), `longest` (the single richest member's section
# verbatim — the representative-member shape HR-207/HR-168 use), or `union` (pool across
# the members that state it, folding near-identical statements at
# `duty_dedup_jaccard_min` — one Jaccard, one home). All three are `open`.

# HR-210. `union`: Decision Making is a list of discrete scope statements, structurally
# a DUTY list rather than prose — and the engine's settled policy for statement lists is
# union + Jaccard dedup, not a representative. A harmonized role's decision scope is the
# scope its positions actually state.
decision_making_policy: union

# HR-211. `union`, matching HR-210 — the two sections are the same SHAPE and a split
# policy would be a special case nobody asked for. ⚠ This is the knob most likely to be
# wrong: at 44.9% source presence, a cluster where half the members state the section
# and half do not is a genuine question about what the harmonized role should say, and
# the union answers it by pooling only the members that spoke. Silence is not a
# statement, so nothing is invented to fill the gap — but HR may prefer `longest`.
problem_solving_policy: union

# Decision Making: which items say the decisions that follow are REFERRED to the
# supervisor rather than made by the incumbent (HR-282), and what each referred decision
# is prefixed with (HR-283).
#
# 🔴 MEASURED: the old APSA questionnaire asks two Decision Making questions — "Give
# some typical examples of the most important decisions the incumbent is expected to
# make…" and "Give some examples of the types of decisions the incumbent would refer to
# his/her supervisor." — and the answer to each follows its question. Over the whole
# archive (14,522 parses, in-process), 4,115 documents carry the refer question: in
# 2,928 the referred answer is fused into the question's own item, and 5,721 referred
# items follow it as items of their own. The merge POOLS and SORTS this section across
# members (HR-210), so the question no longer sits before its answers, and once the
# rewrite strips the question (HR-275) nothing says those decisions are referred. On the
# round-2 pilot (cb73e45c) "Decisions regarding the expenditure of University funds"
# came out as a decision the incumbent makes.
#
# So, per MEMBER and before pooling (while the order still says which is which): an item
# matching a marker starts a REFERRED run — its own text after the marker, and every
# following item until the next questionnaire prompt (`rewrite.form_instructions`) or
# template lead-in (`rewrite.fragment_pattern`). The marker text itself is removed; each
# referred decision is prefixed with the label, unless it already starts "Refer…". The
# rewrite then may not ground a decision in a referred item without keeping the referral
# (`rewrite/harmonize.py`). Markers are matched on the word sequence, punctuation and
# case aside. ⚠ Changes the DETERMINISTIC draft too (it is a merge rule) — that is the
# point: the deterministic draft carried the same ambiguity.
#
# Review of c873b13 (the same 4,115 archive documents): the refer prompt is also written
# "her/his", "his or her" and "the" supervisor (each variant is ALSO a questionnaire
# prompt in `rewrite.form_instructions`, so the rewrite strips it too); only a marker that
# IS a questionnaire prompt starts a run whatever follows it — "Refers decisions
# regarding X to the Director." is a complete referral and labels nothing after it.
referred_decision_markers:
  - Give some examples of the types of decisions the incumbent would refer to his/her supervisor.
  - Give some examples of the types of decisions the incumbent would refer to her/his supervisor.
  - Give some examples of the types of decisions the incumbent would refer to his or her supervisor.
  - Give some examples of the types of decisions the incumbent would refer to the supervisor.
  # The v9 full pass (2026-10-27): the refer question in the questionnaire's OTHER
  # editions and typos, which the five above missed — so their referred decisions read
  # as decisions the incumbent makes (82e5c2d0: "Decisions the incumbent would refer to
  # his/her supervisor: Matters falling outside…; staff terminations; etc." came out as
  # "Staff terminations"). MEASURED over the 14,522 v9 parses: each wording below and the
  # documents carrying it unlabelled — 46 "Examples of the types…", 14 "…to this/her
  # supervisor" (sic), 9 "Types of decisions…", 8 "Give some typical examples of the
  # types…", 8 "Examples of Decisions referred to Supervisor", 9 "…to the Associate
  # Director, Clinical Services", 7 "Decisions the incumbent would refer to his/her
  # supervisor", 5 "…his I her…" (OCR), 3 each for the rest. Longest first: a marker
  # also matches inside a longer one, and the first that matches wins. Each is a
  # questionnaire prompt too (`rewrite.form_instructions`, HR-275).
  - Give some typical examples of the types of decisions the incumbent would refer to his/her supervisor.
  - Give some typical examples of the most important decisions the incumbent would refer to his/her supervisor.
  - Give some examples of the types of decisions the incumbent would refer to this/her supervisor.
  - Give some examples of the types of decisions the incumbent would refer to his I her supervisor.
  - Examples of the types of decisions the incumbent would refer to his/her supervisor.
  - Examples of the types of decisions the incumbent would refer to her/his supervisor.
  - Examples of decisions the incumbent would refer to his/her supervisor.
  - Examples of the types of decisions referred to the supervisor.
  - Examples of decisions the incumbent is expected to refer.
  - Examples of decisions referred to supervisor.
  - Types of decisions the incumbent would refer to his/her supervisor.
  - Decisions the incumbent would refer to the Associate Director, Clinical Services.
  - Decisions the incumbent would refer to the Director.
  - Decisions the incumbent would refer to his/her supervisor.
  - Refers decisions regarding
referred_decision_label: "Refers to the supervisor:"

# What ENDS a referred run besides the next questionnaire prompt: a template LEAD-IN line
# — one ending on a colon or on "regarding" / "concerning" / "related to" / "responsible
# for" / "such as" / "following" with no full stop ("Makes decisions regarding:"). HR-289.
# Review of c873b13: the run used to end at anything `rewrite.fragment_pattern` matched,
# which includes a list item ending "," or ";" — so in 136 archive documents the referred
# decisions after "Major equipment purchases;" were left reading as decisions the
# incumbent MAKES (621 items).
referred_decision_run_end_pattern:
  pattern: '(?:\:|\b(?:regarding|concerning|related to|responsible for|such as|following))\s*$'
  ignore_case: true

# HR-212. `longest`, NOT `union` — deliberately different from the two above.
# `relationships` is a STRUCTURED object whose `supervisory` field is prose describing
# one reporting structure; pooling two supervisory lines invents a third that no source
# wrote. `longest` carries one member's object verbatim. (`union` is available and pools
# the internal/external contact lists while still taking `supervisory` from a single
# member — more complete, and noisier, since a 132-member cluster's pooled contact list
# describes no single position.)
relationships_policy: longest

# The presence booleans (`about_sfu_present`, `territorial_acknowledgement_present`,
# `employment_equity_present`). `or_across_members`: assert present iff ANY member had it
# (honest — a draft does not carry the boilerplate TEXT, so a re-parse still trips the
# footer/About gates; see bank/render.py). `all_present`: always assert present. ⚠ This
# flips to `all_present` ONLY IF HR ratifies composer auto-insert of the footer
# (HR-pending) — do NOT pre-empt that ruling by shipping `all_present`. HR-170.
boilerplate_presence_policy: or_across_members

# --- duty union / dedup / reorder --------------------------------------------------
# Token-Jaccard at or above which two duty STATEMENTS are treated as the same duty and
# collapsed onto one representative. PROVISIONAL — to be calibrated against real clusters.
# Also reused for near-identical QUALIFICATION text dedup (one Jaccard, one home). HR-171.
duty_dedup_jaccard_min: 0.7

# The maximum number of deduped duties carried into the draft. Above this, the top-by-
# member-coverage duties are kept and the draft is FLAGGED `duties_over_max` (never a
# silent drop). Set to the model's own `SFUJobDescription.duties` cap of 12 (MEASURED:
# deduped-duty count spikes at exactly 12 — 237 real clusters sit at the model ceiling —
# and a cap of 10 flagged 20.8% of clusters, 288 of which held 11–12 duties the model
# could keep; at 12 the flag fires only when the model cap forces a real drop, 4.8%).
# HR-172.
max_duties: 12

# --- KSA rebuild (Qualifications) --------------------------------------------------
# The fraction of members that must require a skill token for it to be CORE (its
# representative qualification survives; below this it is incidental and dropped — SFU is
# minimum-not-desired, so one-offs are not carried as "desired"). At or above (`>=`).
# PROVISIONAL — to be calibrated against real clusters. HR-173.
core_skill_min_fraction: 0.5

# How SECURITY qualifications are combined. `union`: keep every distinct security
# requirement any member states (deduped near-identical). `core_only`: keep a security
# requirement only when required by >= `core_skill_min_fraction` of members. HR-174.
security_policy: union

# How the EDUCATION and EXPERIENCE bars are chosen across members. `max`: take the
# highest bar any member states, and emit the representative qualification whose parsed
# bar matches it. `modal`: take the most common bar instead. HR-175.
seniority_bar_policy: max
