# Tier-2 near-duplicate detection (Phase 3.3) — rulebook-as-data (CLAUDE.md §2).
#
# WHAT THIS FILE DECIDES
# -----------------------
# Nothing here changes what the VALIDATOR computes about a JD. It decides which
# DOCUMENTS are similar to each other — never a score, grade, gate or finding on any
# one JD. Same category as `segmentation.yaml` and `embeddings.yaml`: registered, on
# the decision surface, drift-checked against the register, but excluded from
# `rules_version` (`loader._UNHASHED_FILES`) because retuning `jaccard_min` cannot make
# a single JD's ValidationReport look stale. `Dedup.stamp` is this file's own content
# identity, and it is THAT stamp — not `rules_version` — that rides in
# `DedupEdge.method` (`f"minhash+jaccard@{dedup.stamp[-12:]}"`), so a stale edge is
# visible in the row itself.
#
# EVERY DEFAULT BELOW WAS MEASURED against the real archive (14,565 files, 12,494
# distinct contents) — see HANDOFF 2026-07-13 and the register entries HR-131…HR-140.
# None of it is SFU's: JD Bank's Tier-2 dedup is new work, and SFU publishes no
# near-duplicate policy.
#
# THE TWO FINDINGS THAT SHAPE THIS FILE
# --------------------------------------
# 1. Document cosine is USELESS on this corpus (nearest-neighbour median 0.988, 98% at
#    or above the inherited `comparison.clone_threshold` of 0.92) — a cosine bar would
#    confirm almost everything. Word-5-gram Jaccard discriminates sharply (nearest-
#    neighbour median 0.126 vs random-pair median 0.0022). So Jaccard drives, and the
#    cosine confirm (`cosine_confirm_min`) ships OFF (`null`).
# 2. The label set (`fixtures/labels/pairs.csv`) does NOT work as a precision/recall
#    oracle here: same-position "negatives" have HIGHER median Jaccard (0.30) than
#    cross-position LSH "candidates" (0.58) — SFU's redundancy is cross-position
#    cloning, not within-position revision (Tier-1 found the same shape: 77% of exact
#    groups span more than one position). See `dedup/near/report.py` and
#    `tests/unit/test_dedup_near_fixture.py` for the CI gate this drives to instead: a
#    pinned behavioural fixture, not a percentage against 101 unreliable labels.

version: jd_rules_sfu_v4

# --- what text is shingled ---------------------------------------------------------
# `raw_clean` (the incumbent-scrubbed extracted text, re-read from `storage_ref` and
# re-extracted — Postgres holds no text column) vs `serialized` (the PARSED JD run
# through `jd_core.bank.embed_text.serialize_document`, Phase 3.2b's pipeline).
# MEASURED: raw text covers 14,452 of 14,565 documents; parsed/serialized text covers
# only 9,517 (34.5% of the corpus serializes to EMPTY — the WJQ-template gap HANDOFF
# already documents). Scoring on `serialized` would silently exclude the very JDs most
# likely to be duplicates of each other (`transition` era is 52.7% unparseable), which
# is exactly the "metrics computed on a corpus quietly missing a third of itself" trap
# 2.6 already taught this project once. `raw_clean` rescues 98.6% of the 5,012
# zero-serialization files. Both branches are implemented — a knob whose alternative is
# unimplemented is the `cluster_algo` bug (HR-123's own warning) in a new place.
text_source: raw_clean

# --- shingling ----------------------------------------------------------------------
# Word grams, not character grams: SFU JDs share the same vocabulary/template
# university-wide, so character n-grams would collide constantly and discriminate
# nothing. MEASURED all-pairs median Jaccard by k: k=4 -> 0.0039, k=5 -> 0.0022 (the
# widest separation from the near-neighbour median of 0.126), k=7 -> 0.0009 but the
# near-neighbour median also falls to 0.10 at k=7 (starts losing true twins). k=5 is
# the sweet spot.
shingle_size: 5

# SFU's own mandated About-SFU / territorial-acknowledgement / Employment-Equity text
# (`boilerplate.yaml`) is byte-identical across thousands of JDs and would otherwise
# inflate every pair's shingle overlap by a constant amount unrelated to whether the
# JDs describe the same role. MEASURED effect is small but real (all-pairs p90: 0.0311
# redacted vs 0.036 raw). Reuses HR-058's existing mechanism
# (`jd_core.quality.boilerplate.redact_passages`) rather than a second redactor — one
# rulebook fact, one home.
redact_boilerplate: true

# A signature built from fewer than this many shingles is not computed at all — the
# document is counted (`documents_below_min_shingles`), never silently dropped or
# scored against a near-empty set. MEASURED: excludes 70 of 14,522 parsed JDs (0.48%)
# — a guard-rail, not a filter, mirroring `embeddings.min_section_chars`'s "excludes 7"
# shape.
min_shingles: 20

# --- MinHash / LSH: the CANDIDATE INDEX, never the score -----------------------------
# See `jd_core.bank.minhash` module docstring: the score a caller keeps is ALWAYS
# exact Jaccard, recomputed on the two documents' shingle sets. MinHash's own
# estimator error (sigma ~= 0.088 at num_perm=128, worst case J=0.5) is far too coarse
# to threshold a similarity DECISION on — it only decides which pairs are worth an
# exact comparison at all.
#
# MEASURED: pure Python (no numpy — not needed) computes MinHash signatures for the
# whole corpus in ~3.5 minutes.
num_perm: 128

# bands * rows MUST equal num_perm (loader-enforced — the rulebook fails to load
# otherwise). S-curve midpoint (1/bands)^(1/rows) = 0.707. MEASURED on the full corpus
# (jaccard_min=0.85): 23,705 LSH candidate pairs -> 15,080 near-dup edges.
#
# CHANGED from bands=32/rows=4 (midpoint 0.420) after the docx table/content-control
# extraction fix (PR #30) and the WJQ parser (PR #32) recovered ~20.7M chars for a third
# of the archive. That text is dominated by SFU's shared WJQ template scaffolding (14
# section headings, checkbox boilerplate, instruction lines), which is near-identical
# across all ~4,300 WJQ files -> at the loose 0.420 midpoint they collided into mega-
# buckets and blew past `max_candidate_pairs` (measured 98,193+ candidates, the valve
# fired and refused to truncate). The 0.707 midpoint filters that low-Jaccard boilerplate
# noise WITHOUT losing edges: 15,080 vs 15,082 edges (a 2-edge / 0.01% difference), 4x
# fewer candidates, and back under the valve. The boilerplate never became an edge at
# jaccard_min=0.85 anyway — it was pure candidate-generation waste. (Redacting WJQ
# template boilerplate the way `redact_boilerplate` handles JDFN's About-SFU/territorial
# text is a Phase-3.5 clustering-quality follow-up, not needed here.)
bands: 16
rows: 8

# The score threshold an LSH candidate must clear (on EXACT Jaccard, never the MinHash
# estimate) to become a `DedupEdge`. MEASURED edge counts over the whole corpus at
# several thresholds: 0.9 -> 11,398 edges * 0.85 -> 14,312 edges (SHIPPED) * 0.8 ->
# 15,877 * 0.7 -> 19,110. Random-pair Jaccard p99.9 is 0.30, so 0.85 sits far into the
# tail — a random pair essentially never reaches it. REGISTERED `open`: this is the
# number a human reviewer must ultimately rule on (HR-138), not an engineering default
# to quietly ship and forget.
jaccard_min: 0.85

# An optional confirm: veto an LSH-candidate/Jaccard-qualifying pair if the DOCUMENT
# cosine similarity (Neo4j vectors, Phase 3.2b) sits below this. `null` = OFF.
# MEASURED: 98% of non-identical nearest-neighbour cosines sit at or ABOVE 0.92 (median
# 0.988) — a cosine confirm at any realistic bar would confirm almost every pair
# Jaccard already qualified, i.e. it is a filter that can (almost) never reject, the
# same "HR-121 SFU-STRUCT-HOW-WHY" failure shape inverted. It is also UNAVAILABLE for
# 34.5% of the corpus (no vectors for WJQ-template files that serialize to empty), so
# gating on it would silently run a DIFFERENT policy on WJQ files than on JDFN files.
# The code path is implemented and tested (so this is real the day HR turns it on);
# shipped `null` because turning it on today would not filter anything real.
cosine_confirm_min: null

# `content` (SHIPPED): Tier-2 runs over DISTINCT CONTENTS (Tier-1's 12,494 sha256
# groups), not the 14,452 hashed files — an edge is written between the two groups'
# Tier-1 representatives. `file`: every individual file is its own unit. MEASURED
# consequence: two 11-member exact-duplicate groups that are near-dups of each other
# would emit 121 edges under `file` scope and 1 under `content` scope. `content` is
# also what makes the EXACT/NEAR ladder safe by construction (see
# `dedup/near/runner.py`): a sha256 group is one node, so a byte-identical pair can
# never even become a CANDIDATE for a NEAR edge — no separate "already has an EXACT
# edge" check is needed or correct (Tier-1's default topology is `star`, not `clique`,
# so that check would miss most of a large group's internal pairs). Both scopes are
# implemented.
edge_scope: content

# A safety valve, not a policy lever: if the LSH banding would generate more candidate
# pairs than this, the pass RAISES rather than silently truncating the candidate list
# (which would silently under-report edges with no record that it happened). MEASURED
# 70,752 candidates at the shipped banding — this sits comfortably above that with
# headroom for a re-tuned banding or a grown archive, while still catching a
# misconfiguration (e.g. bands/rows chosen so loosely that every document becomes a
# candidate of every other). Registered TRIVIAL (see decision_register.yaml `trivial:`)
# — it cannot change a result, only refuse to produce one.
max_candidate_pairs: 250000

# --- the JD Builder's near-duplicate AUTHORING guard (Phase 5.9) ---------------------
# `jd_bank/composer/duplicates.py`. While an author composes a NEW JD, show which
# existing harmonized roles look like the same role, so they clone one instead of
# authoring SFU's 10th "Academic Advisor". ADVISORY ONLY (NN #1): it never blocks
# submission, never publishes, and the validator remains the sole oracle for
# approvability.
#
# THERE IS NO THRESHOLD KNOB HERE, AND THAT IS THE FINDING.
# Measured over the live `jd_role_embeddings` index (1,797 role vectors) BEFORE this
# was specified:
#   * same-title role pairs (genuine duplicates, n=2,618): median cosine 0.9335;
#   * a role's nearest UNRELATED neighbour (n=200): median 0.9604 — HIGHER than a real
#     twin. The absolute number does not separate the two populations at all.
#   * consequently any cutoff is a constant dressed as a measurement: at 0.90 the guard
#     fires on 99.2% of drafts at 22% precision; at 0.97 it still fires on 24% and loses
#     most true duplicates. A top1-top2 margin rule fails the same way (0.0065 vs
#     0.0052).
#   * RANKING, however, works: for the 790 roles that have a same-title sibling, the
#     sibling is top-5 for 76% and top-10 for 84%.
# So the guard ships a RANKED LIST and renders no score, no percentage and no
# similarity number anywhere — the same defect commit 89d0c74 fixed for title search
# (every row rendering "81%" off a 0.013 spread). A `cosine_min` added here tomorrow
# would be that defect returning; the absence is pinned by
# `test_composer_duplicates.py::test_related_role_never_carries_a_similarity_number`.
authoring_guard:
  # How many semantically-related roles the panel offers at most. A ranked shortlist,
  # not a search page: the measured hit rate is concentrated at the top (a same-title
  # sibling is top-5 for 76% of roles, and only 8 points more by top-10), so rows 6-10
  # buy little and dilute a panel the author reads while typing. Registered `open`
  # (HR-195) — how much advice is too much is a judgement, not a measurement.
  max_matches: 5
  # The minimum length of the SERIALIZED draft (`embed_text.serialize_document`, the
  # same text the role vectors were built from) before the guard spends a GPU round
  # trip on it. MEASURED: a 500-char draft retrieves its own twin BETTER than the full
  # document (14/20 vs 11/20 in top-5) — 500 chars is about a Position Summary, which
  # retrieves its parent role at 0.968-0.987 — and below ~500 retrieval degrades but
  # does not collapse. So this is the point at which the answer starts being worth
  # asking for, not a quality bar on the draft. Registered `open` (HR-196).
  #
  # It is a length FLOOR, never the empty-text guard: an empty/whitespace serialization
  # is refused separately, unconditionally, and FIRST — because Ollama embeds "" into a
  # constant vector that is a plausible nearest neighbour to EVERYTHING (measured live:
  # every empty query returned the identical role at exactly 0.8038). Raising this floor
  # can never make that refusal redundant, and lowering it can never switch it off — see
  # `roles.py`'s "NEVER embed ''" guard, same reason.
  min_draft_chars: 500

  # How long the whole guard may take before the Builder gives up on it and renders the
  # compliance panel without it.
  #
  # WHY A TIMEOUT AND NOT JUST THE DEGRADE PATH. `find_related_roles` already degrades on
  # any RAISE, which covers an inference host that is down: the embedding client's
  # connect timeout is 5s, so a REFUSED connection fails fast. What a try/except cannot
  # cover is a host that ACCEPTS and then stalls — a GPU wedged mid-`make embed-roles`, a
  # firewall that DROPs after accept. There the client's own read budget (600s, retried)
  # would hold the request AND its checked-out database session for the better part of an
  # hour, and a handful of concurrent Checks would exhaust the connection pool and stop
  # the Builder serving anything at all. This bounds that to one number.
  #
  # 5 seconds is a page-load's worth of patience: a successful pass is an embed call plus
  # one vector query plus two small SQL reads (well under a second in normal operation),
  # so this is far above the working case and far below "the author thinks the Builder is
  # broken". Registered `open` (HR-197) — how long an advisory panel is worth waiting for
  # is an operational judgement, not a measurement. Deliberately scoped to THIS call and
  # not pushed into the embedding client's global defaults: the archive embedding runs
  # batch thousands of documents and may legitimately want a long read timeout.
  timeout_seconds: 5.0
