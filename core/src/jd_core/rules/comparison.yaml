# JD-to-JD comparison: similarity, clustering, drift — RULEBOOK AS DATA (CLAUDE.md §2).
#
# The calibration behind three pure modules: `bank/similarity.py` (how alike are two
# JDs, and is the second a clone or a new job?), `bank/clustering.py` (which JDs form
# a redundancy cluster?) and `bank/drift.py` (how far has a posting diverged from its
# canonical role?).
#
# ⚠ PROVENANCE — NOT ONE NUMBER BELOW IS SFU-PUBLISHED. SFU publishes no similarity
# formula, no clone score, no cluster threshold and no drift metric;
# `docs/rulebook/sfu-jd-standards.txt` contains none of these words.
#
# The 22 calibration numbers (HR-082 … HR-103) are `hris_calibration` — inherited from
# the hris pipeline. The EXCEPTIONS are `our_invention`, because hris had no equivalent
# to inherit and calling them `hris_calibration` would be the same provenance lie
# pointing the other way:
#   * `exact_edge_topology` (HR-123, Phase 3.1) — hris had no Tier-1 dedup edges at all.
#   * the ParsedJD -> JobSignals adapter knobs (HR-149 … HR-154, Phase 3.4a): the skill
#     keyword-bag source kinds / stopwords / min-token-len, the spelled-out year map, and
#     the education + experience source kinds. hris fed its similarity/drift maths from a
#     skill ontology + idf corpus JD Bank does not have; these MEASURED defaults are how a
#     parsed SFU JD becomes comparison features instead (ADR-007). Each is honest about
#     its degradation (a keyword bag is not an ontology; 41% of JDs yield no skills).
#   * the Tier-3 role-equivalence knobs (HR-155 … HR-160, Phase 3.4b): the blended
#     `role_equiv_threshold`, the family->seniority-band ladder + `max_band_gap` "conflict
#     veto", the `group_conflict_veto`, the candidate-generation `candidate_k`, and
#     `seed_from_near_dup`. hris had no Tier-3 role-equivalence pass to inherit; these are
#     JD Bank's own, MEASURED on the real archive (see each key's comment + register entry).
# Pinned by `test_the_comparison_defaults_are_registered_as_nobodys_standard`.
#
# Two of the inherited numbers come closest to an SFU source and STILL do not clear the
# bar:
#
#   * the drift escalations (an education-level change; a > 5 direct-reports change).
#     hris cited them to "SFU Toolkit p26 / sfu-reference.md §5" and the shipped
#     rulebook contains NO re-evaluation criteria at all — only l.22, "Major revisions
#     can trigger re-evaluation", which quantifies nothing. The intent is plausibly
#     SFU's; the NUMBERS are ours. Registered `hris_calibration`, exactly like the nine
#     invented coded terms (HR-029) and the seniority ladder (HR-059). Do not dress
#     them up as an SFU standard.
#   * the cloning rule. sfu-reference.md §4 cites Toolkit p10 for "identical duties +
#     supervisor + title + qualifications"; hris APPROXIMATED that as a 0.92 cosine.
#     A score is not an identity check. Ours.
#
# hris: packages/pipeline/src/pipeline/bank/{similarity,clustering,drift}.py.
#
# NOT WIRED TO ANYTHING (yet). The similarity/drift maths takes a skill ontology and
# an idf corpus that JD Bank does not have — see the module docstrings. The values are
# landed, tested and registered; Phase 3 (dedup & clustering) is where they first
# decide something. Registering them now is the point: they must not arrive as
# undeclared defaults inside a feature PR.
version: jd_rules_sfu_v4

# ── Version stamps ───────────────────────────────────────────────────────────
# Identity, not policy: what a persisted neighbour/cluster was produced BY. Bump
# `sim_version` whenever a weight, a threshold or the formula below changes, so an
# old row stays reconcilable.
sim_version: jd_sim_v2
# Connected components is the deliberate Iteration-1 choice: simple + explainable.
# If it over-merges on the real archive (one giant blob), Louvain is the documented
# fallback.
#
# ⚠ THIS STAMP CANNOT LIE ANY MORE (Phase 3.1). It used to accept ANY non-empty
# string, so writing `louvain` here would have STAMPED every persisted cluster
# `louvain` while `build_clusters` went on running connected components — a
# provenance falsehood (CLAUDE.md #6). It is now a closed set (`ClusterAlgorithm`)
# of the algorithms we actually implement, AND `build_clusters` dispatches on it. So
# naming Louvain is no longer a data edit: it is a data edit plus the code, together,
# or the rulebook refuses to load.
cluster_algo: connected_components

# ── Tier-1 exact-duplicate dedup (Phase 3.1) ─────────────────────────────────
# How a group of N BYTE-IDENTICAL archive files is recorded in `dedup_edges`. HR-123.
#
#   star    N-1 edges, from a canonical representative to each other member.
#   clique  N(N-1)/2 edges — every unordered pair.
#
# MEASURED on the real archive (14,565 files, our own `compute_sha256`): 1,037 groups,
# 3,009 files, 1,972 redundant copies, largest group 11. star = 1,972 edges;
# clique = 4,068. Both are implemented and both are cheap TODAY — the choice is about
# what the edge MEANS and how it grows, not about this corpus:
#
#   * Byte-identity is an EQUIVALENCE relation. The clique's extra 2,096 edges are all
#     derivable by transitivity from the star: they state nothing new.
#   * `build_clusters` (connected components) recovers the identical group from either.
#   * Growth: star is LINEAR in group size, clique QUADRATIC. Tiers 2 and 3 write into
#     this same table with far larger, far less clean groups, and a table whose *exact*
#     tier is already quadratic sets the wrong precedent for the ones that hurt.
#     ⚠ That linearity is EARNED, not free: the pass is additive, so the representative
#     is PINNED to the one a group's edges already hang off. Re-deriving it per run lets
#     a late, earlier-sorting duplicate re-anchor the star — measured on a group of 6 in
#     reverse order: 15 edges, the full clique. See `dedup/tier1.py :: _anchors`.
#
# `clique` exists for the reader who wants every pair addressable by a single row
# lookup rather than by traversal. Nobody has ratified either — HR-123, `open`.
exact_edge_topology: star

# ── Education: ONE ladder for the whole rulebook ─────────────────────────────
# hris kept this fact TWICE — `drift._EDU_ORDINAL` (a name -> ordinal dict) and
# `similarity._EDU_ORDER` (a tuple whose index IS that ordinal) — with nothing keeping
# them in step. They are one fact and they get one home. The ordinal a rung carries is
# its INDEX here (high_school 0 … phd 4), so drift's ordinals and similarity's ordinal
# closeness cannot disagree, and re-ordering the ladder moves both at once.
education_ladder: [high_school, associate, bachelors, masters, phd]

# Free-text cues that place an education requirement on the ladder. Lower-cased
# SUBSTRING matches, deliberately small and conservative: an unrecognised requirement
# yields *no* level, and drift never escalates on a level it could not read.
#
# The TRY ORDER is derived, not written down: most-senior rung first (the reverse of
# the ladder), which is what makes "Master's degree" a masters and not the generic
# "degree" -> bachelors rung. hris wrote that sequence out by hand next to the ladder —
# a second knob holding the same fact.
education_text_cues:
  high_school: ["high school", high-school, "secondary school"]
  associate: [associate, diploma]
  bachelors: [bachelor, bsc, b.sc, undergraduate, baccalaureate, degree]
  masters: [master, msc, m.sc, mba]
  phd: [phd, ph.d, doctora, dphil]

# Which QUALIFICATION KINDS an education requirement may be read out of (Phase 3.4a,
# the ParsedJD -> JobSignals adapter). NOT the `education` kind alone, and NOT all kinds
# either — `[education, knowledge]`, because two facts pull in opposite directions:
#   * SFU's JDFN template embeds the degree inside the `knowledge` blob — e.g.
#     "Bachelor's degree in Computing Science or related discipline, and five years of
#     related experience" is filed under kind=knowledge, not kind=education. So `knowledge`
#     is REQUIRED beyond `education`.
#   * the bachelors cue list contains the bare substring `degree` (see education_text_cues),
#     and SFU's CUPE clerical JDs are full of "55 wpm keyboarding skill with a high degree
#     of accuracy" filed under kind=skill/ability — which `degree` misreads as a bachelors.
# MEASURED over the whole v2 corpus with the real `education_level_from_quals`:
#   * all-6 kinds:            8,417 extractions, but 1,161 are "degree of ..." false-positive
#                             bachelors (18.6% of all bachelors — a systematic clerical bias);
#   * [education, knowledge]: 7,880 (93.6% of the all-6 win) with only 4 such FPs (-99.7%);
#   * [education] alone:      3,307 (loses the JDFN knowledge-blob degrees).
# So `[education, knowledge]` keeps almost the whole win and removes almost all the noise.
# It is DATA: adding skill/ability back re-injects the "degree of accuracy" FPs. HR-153.
education_source_kinds: [education, knowledge]

# ── Similarity: sim = w_vec*vector + w_skill*skills + w_sen*seniority ────────
# Title-agnostic BY CONSTRUCTION: titles are not a term of the score, so "Software
# Engineer" and "Applications Programmer" can be the same role. The weights must sum
# to 1.0 (the loader enforces it) — that is what makes the score a 0-1 number the
# thresholds below can be compared against.
#
# Skills weigh as much as the embedding because on real JDs the summary embedding
# captures generic tone (every "university admin" JD looks alike), so distinctive
# skill agreement has to carry equal weight to avoid over-merging. That was an hris
# judgement about the HRIS corpus — it has never been checked against SFU's archive.
weight_vector: 0.45
weight_skill: 0.45
weight_seniority: 0.10

# Only surface a neighbour at or above this overall similarity (the noise floor).
sim_threshold: 0.60
# Near-identical -> reads as a true clone (needs no re-evaluation). An APPROXIMATION
# of the Toolkit's cloning rule, which is an identity check, not a score.
clone_threshold: 0.92
# Minimum idf-weighted skill overlap for two JDs to be CLUSTERED (merged). Sharing
# only ubiquitous skills (low idf) falls below it; sharing distinctive skills clears
# it. Read by the Phase-3 edge builder — nothing calls it yet.
min_cluster_skill_overlap: 0.30

# Partial credit when two skills share an ontology family but are not identical:
# `postgresql` vs `mysql` earns half of an exact match.
family_weight: 0.5
# Catch-all ontology families that grant NO family credit — being "some other skill"
# together is not evidence of anything.
non_matchable_families: [other, domain]

# Tokens stripped from a title before it is compared — seniority/level markers, so
# "Senior Developer II" and "Developer" normalise to one stem. Note the overlap with
# `titles.yaml :: family_keywords` is NOT a duplicated fact: these tokens are DISCARDED
# here and CLASSIFIED there ("senior" is a stopword but no family; "director" is a
# family but never a stopword). Two vocabularies, two jobs.
title_stopwords:
  - senior
  - sr
  - junior
  - jr
  - lead
  - principal
  - staff
  - associate
  - assistant
  - intern
  - trainee
  - i
  - ii
  - iii
  - iv
  - v
  - "1"
  - "2"
  - "3"
  - "4"
  - "5"

# ── Skills: the keyword-bag adapter (Phase 3.4a) ─────────────────────────────
# `bank/signals.py` derives a per-JD skill SET from the parsed qualifications so the
# 2.4c similarity/clustering/drift maths finally has an input. This is NOT a skill
# ontology (SFU publishes none, and the archive's skill vocabulary is 5,584 free-text
# tokens — building an ontology is a project of its own, needing a JD SME; deferred,
# see ADR-007). It is a KEYWORD BAG: lowercase `[a-z0-9]+` tokens, minus a stopword
# list and minus tokens shorter than `skill_min_token_len`. idf-weighting — which is
# what actually rescues this bag into signal — is Phase 3.4b.
#
# Which qual kinds feed skills. `skill`/`knowledge`/`ability` — NOT `experience` or
# `education`, which inject year-counts and degree words as if they were skills. Note
# `knowledge` also feeds education detection above: the same blob legitimately carries
# both a degree and a domain ("Computing Science"). HR-149.
skill_source_kinds: [skill, knowledge, ability]
# Tokens shorter than this are dropped before they reach the bag (drops 1-2 char noise
# like "a", "of", "hr"). HR-151.
skill_min_token_len: 3
# The NOISE words stripped from the bag. MEASURED: these are the 20 most frequent
# tokens across the archive's 5,584-token skill vocabulary — `ability, excellent,
# knowledge, ...` — and they dominate it, so without this list the bag is meaningless.
# ⚠ HONEST CONSEQUENCE: real signal like `management` / `applications` is stripped too;
# that is acceptable ONLY because the bag is not an ontology and idf (3.4b) is what will
# separate distinctive skills from ubiquitous ones. Do not read this as a curated skill
# list. AND this list does NOT make the bag clean — grammatical noise survives it
# (measured corpus-wide: `and` 8,528, `combination` 4,666, `the` 4,201, plus `bachelor`
# leaking out of the knowledge blob). The 20 tokens are the worst offenders, not a
# filter; the bag is genuinely meaningless until idf weights it in 3.4b. HR-150.
skill_stopwords:
  - ability
  - excellent
  - knowledge
  - skills
  - with
  - experience
  - work
  - degree
  - good
  - related
  - level
  - high
  - education
  - management
  - accuracy
  - years
  - equivalent
  - word
  - training
  - applications

# What an UNKNOWN signal is worth on the 0-1 seniority scale — an absent experience
# bar, or an education level that is not on the ladder. 0.7 is a guess: high enough
# not to punish a JD for what it does not say, low enough not to reward it.
unknown_signal_closeness: 0.7
# How many years apart two roles must be before experience closeness bottoms out at 0
# (hris divided the year gap by a hardcoded 10.0).
experience_span_years: 10.0

# ── Clustering ───────────────────────────────────────────────────────────────
# The cluster threshold is DERIVED, never stored: `max(sim_threshold, floor)` — see
# `Comparison.cluster_threshold`. Shipping the answer (0.80) as a third key would be
# two knobs holding one value with nothing keeping them in step (the `max_listed`
# landmine). Cluster only on strong edges (well above the per-JD "show me similar"
# floor) to favour precision.
cluster_threshold_floor: 0.80
# Fewer members than this and it is not a redundancy cluster. A singleton has nothing
# to be redundant WITH; whether a mere PAIR is worth harmonizing is an HR call.
min_cluster_size: 2

# ── Drift: how far a posting has diverged from its canonical role ────────────
# Skill-set Jaccard-distance cutoffs (0 = identical skill sets, 1 = disjoint). Tuned
# conservatively — prefer calling a borderline case "minor" over crying "major".
drift_minor_at: 0.25
drift_major_at: 0.50

# On top of skill churn, a change to the TECHNICAL KNOWLEDGE REQUIRED escalates drift
# to "major" on its own. Each escalation fires only when BOTH sides state a value and
# they differ, so a missing or unparseable requirement never manufactures drift.
#
# A material move of the experience bar, in years (>= this many).
material_years_delta: 2
# A material change of supervisory scope, in direct reports (MORE than this many).
material_reports_delta: 5

# The first explicit year-count in a free-text experience requirement ("5 years",
# "3+ years"). No number -> no signal. This is the DIGIT primitive; spelled-out numbers
# are handled by `experience_word_numbers` below (which the reader tries in parallel and
# takes whichever match comes first). HR-102.
experience_years_pattern:
  pattern: '(\d{1,2})\s*\+?\s*year'
  ignore_case: true
# Spelled-out year counts. MEASURED, and a real bug the digit pattern alone caused: SFU's
# JDFN template WRITES YEARS OUT — "five years of related experience", "(one|two|…|ten)
# years" — so the digit-only regex matched only 226 JDFN JDs where 4,585 of 4,888 are
# derivable. The word->int map is DATA (non-negotiable #2 — the number words are NOT
# hardcoded in drift.py); `Comparison.experience_word_year_pattern` DERIVES the matcher
# from these keys (single source of truth), requiring the word be followed by "year" just
# as the digit pattern is, so "an equivalent combination" never reads as a year count.
# `a`/`an` are deliberately EXCLUDED (an unmeasured call; "a year" is rare in these
# requirements and mapping it to 1 risks reading determiners as counts). HR-152.
experience_word_numbers:
  one: 1
  two: 2
  three: 3
  four: 4
  five: 5
  six: 6
  seven: 7
  eight: 8
  nine: 9
  ten: 10
  eleven: 11
  twelve: 12
  thirteen: 13
  fourteen: 14
  fifteen: 15
  sixteen: 16
  seventeen: 17
  eighteen: 18
  nineteen: 19
  twenty: 20
# Which QUALIFICATION KINDS the adapter reads the experience bar from, IN ORDER: the
# `experience` quals are authoritative and tried first; `knowledge` is the FALLBACK,
# because JDFN spells the years inside the same knowledge blob that carries the degree
# ("...and five years of related experience"). Order is policy (fallback, not union): a
# JD stating "2 years" under experience and "10 years" inside a knowledge blob reads as
# 2, not 10. `experience` alone would miss every JDFN JD whose bar lives only in the
# blob. Held as DATA, not a literal tuple in signals.py (non-negotiable #2). HR-154.
experience_source_kinds: [experience, knowledge]
# The first direct-reports count in a free-text supervisory statement ("supervises 4
# coordinators" -> 4; "manages a team of 8" -> 8). A qualitative statement ("supervises
# the comms team") names no number -> no signal. Heuristic: the first small integer.
supervisory_reports_pattern:
  pattern: '\b(\d{1,3})\b'
  ignore_case: false

# ── Tier-3 role-equivalence (Phase 3.4b) ─────────────────────────────────────
# The runner (`jd_bank/dedup/role/runner.py`) writes `DedupEdge(tier=ROLE_EQUIVALENT)`
# for pairs that are the SAME ROLE (possibly DIFFERENT text — that is Tier-3's added
# value over Tier-2's near-dup). It reuses this file's now-wired maths: `build_job_signals`
# -> `skill_overlap` (idf-weighted, computed in the runner) + `seniority_closeness` +
# `score_job_similarity`. NOTHING here is SFU-published and NOTHING is inherited from hris;
# every value is `our_invention`, MEASURED on the real archive. HR-155 … HR-160.
#
# The blended score two JDs must clear to be ROLE-EQUIVALENT (on `score_job_similarity`).
# MEASURED: on real pairs, Tier-2 near-dup weak-positives vs random-same-function negatives
# separate at 0.5 -> 99.2% pos / 3.0% neg. ⚠ HONEST CAVEAT: the positives are Tier-2
# near-dup weak labels (vector-dominated); genuinely-different-text same-role pairs lean on
# skill overlap and there is NO honest precision/recall gate (the 3.3 lesson) — so this
# ships with a pinned fixture + a stratified adjudication sample, NOT a CI P/R gate. The
# score is BIMODAL: 41% of JDs have empty skills and floor ~0.52 on vector+seniority alone;
# skill-overlapping pairs reach 0.9+. That is honest, not a bug. HR-158 (the number).
role_equiv_threshold: 0.5

# The family -> seniority-BAND map for the hard "conflict veto": a pair whose title
# seniority-bands are MORE THAN `max_band_gap` rungs apart is NEVER role-equivalent,
# whatever the blended score. The bands are the reverse-index of the HR-059 seniority
# ladder (`titles.yaml :: families`), highest first — DATA, so the family names are NOT
# hardcoded in the runner (non-negotiable #2). ⚠ PARTIAL BY DESIGN: `unmapped` carries NO
# band (it is deliberately absent below), and 70% of archive titles are `unmapped` (the
# HR-059 ladder classifies only ~30%), so the veto fires ONLY when BOTH sides map. On the
# laddered 30% it cleanly stops director<->assistant merges; the threshold does the rest.
# HR-155.
family_band_ladder:
  vp: 6
  chief: 5
  director: 4
  manager: 3
  lead: 2
  associate: 1
  assistant: 0
# MORE than this many bands apart -> the conflict veto fires (drops the pair before
# scoring). 1 keeps adjacent rungs (manager<->lead) admissible while vetoing
# director<->assistant. HR-156.
max_band_gap: 1

# The SOFT veto: drop a pair whose two `employee_group`s are BOTH known and DIFFER (an
# APSA role is not a CUPE role). Vetoes ONLY when both sides state a group — never when
# either is null (an unknown is not a conflict). `true` = on. HR-157.
group_conflict_veto: true

# Candidate generation: k nearest cosine neighbours per JD (within its `function` bucket)
# become candidate pairs. A STARTING value to be tuned by the adjudication sample — not a
# measured optimum. Larger = more candidates (recall) at more scoring cost. HR-159.
candidate_k: 25

# Also SEED candidates from Tier-2 `NEAR_DUPLICATE` edges: a near-dup IS role-equivalent,
# so those pairs are guaranteed-admissible candidates (and reach Tier-3 even when a JD has
# no vector — it scores with vector_score 0.0). `true` = seed. HR-160.
seed_from_near_dup: true

# ── Clustering: the Phase-3.5 role-cluster runner (report-only) ───────────────
# `jd_bank/cluster/runner.py` groups JDs into role clusters by connected-components over
# the ADMITTED Tier-1/2/3 edge graph and writes an HR "eyeball" report. It persists
# NOTHING (the `Cluster` table + its `canonical_jds` CASCADE are Phase 4). Every value is
# `our_invention`, MEASURED against the live `dedup_edges` graph (15,072 NEAR + 133,842
# ROLE edges). HR-161 … HR-166.
#
# ⚠ Why a SCALAR threshold over the mixed tiers is WRONG, and what replaces it. The three
# tiers do NOT share a score scale: EXACT=1.0, NEAR∈[0.85,1.0], ROLE∈[0.5,1.0] and ROLE is
# BIMODAL (41% skill-empty pairs floor ~0.52). Clustering NEAR+ROLE at the raw 0.5 bar
# collapses via transitive closure into ONE 8,884-JD blob — 61% of the archive. MEASURED
# sweep of the ROLE gate -> largest cluster: 0.5->8884, 0.6->1940, 0.65->1302, 0.7->696,
# 0.75->132, 0.8->61. The blob breaks at 0.75 (first gate with no cluster >200). So EXACT
# and NEAR are always-in; ROLE is gated at `cluster_role_equiv_min`, and the runner then
# calls `build_clusters(threshold=0.0)` on the ADMITTED edges (the tier gate + the ROLE
# gate did the thresholding upstream — do NOT re-threshold on the incomparable raw score).
#
# ⚠ The derived `cluster_threshold` / `cluster_threshold_floor` (HR-095/HR-096) are
# RETIRED FOR THIS PATH: `build_clusters(threshold=0.0)` bypasses them. They remain for any
# other `build_clusters` caller, and `min_cluster_size` (HR-097) still excludes singletons.
#
# Which tiers connect a cluster. EXACT + NEAR always-in; ROLE additionally gated by
# `cluster_role_equiv_min`. HR-161.
cluster_tiers: [exact, near_duplicate, role_equivalent]
# The ROLE_EQUIVALENT edge-score gate for clustering. 0.75 is the measured knee where the
# archive-wide blob breaks (sweep above). ABOVE the Tier-3 `role_equiv_threshold` (0.5) BY
# DESIGN: Tier-3 edges are pairwise, clustering is transitive, so the bar to MERGE must be
# higher than the bar to record a single same-role pair. HR-162.
cluster_role_equiv_min: 0.75
# The cohesion cap: a cluster whose MAPPED members span more than this many seniority
# bands is FLAGGED (never split) for HR eyes. = `max_band_gap` by intent — the same "how
# far apart is too far" call, applied to the whole cluster rather than one edge. HR-163.
cluster_max_band_spread: 1
# Flag a cluster that mixes more than one KNOWN employee group. ⚠ The band/group cohesion
# checks are NEAR-INERT on this corpus (70% of titles are family=unmapped, 64% group-null,
# and at the edge level the veto drops just 30 of 148,914) — the ROLE gate, the size cap
# and the human eyeball do the real work. Kept as a cheap correctness backstop. HR-164.
cluster_group_homogeneous: true
# A cluster larger than this is FLAGGED as oversize. At gate 0.75 the clusters with >50
# members are [132, 108, 74, 57, 52] — exactly the ones an HR reviewer must eyeball. Flag,
# not split: a report surfaces them, it does not silently break them up. HR-165.
cluster_max_size: 50
# How a cluster picks the member every other member's drift is measured against, and the
# row the report names. `max_parse_confidence` (tie-break: the `order_key` archive order)
# anchors on the best-parsed member. A closed set (a data-only switch to an unimplemented
# policy fails at load). HR-166.
cluster_representative_policy: max_parse_confidence
