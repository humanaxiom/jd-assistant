# Regex rules as DATA — compiled once by the loader (CLAUDE.md §2).
#
# Each entry is {pattern: <python re source>, ignore_case: <bool>}. The loader
# compiles with re.IGNORECASE when ignore_case is true.
#
# provenance:
#   rulebook: docs/rulebook/sfu-jd-standards.txt
#     - Part 2B position-not-incumbent (no first-person voice)
#     - Part 11.6 duty time-allocations total 100%
#     - l.240 degree requirement names a discipline + an equivalency path
#     - Part 3.5 "Senior" is reserved for roles supervising junior peers
#   hris: packages/pipeline/src/pipeline/quality/jd_rules.py — _INCUMBENT_RE plus
#     the inline regexes in _quality_gates / _qualifications / _authoring_gates.
#     hris applied `degree_mention` and `related_discipline` to an already
#     casefolded haystack (no flags); ignore_case: true is equivalent and lets a
#     validator run them against raw text.
version: jd_rules_sfu_v4

# First-person markers -> incumbent-focused (not position-focused) writing.
incumbent:
  pattern: '\bmy\b|\bmyself\b|\bi am\b'
  ignore_case: true

# Per-duty time allocations in the template's "(NN%)" format. Only parenthesized
# percentages count, which keeps false positives low.
duty_allocation:
  pattern: '\((\d{1,3})\s*%\)'
  ignore_case: false

# A stated degree requirement.
degree_mention:
  pattern: '\b(bachelor|master|phd|doctorate|degree)\b'
  ignore_case: true

# ...which must allow related/relevant disciplines.
related_discipline:
  pattern: '(related|relevant)\s+(discipline|field)|or\s+other\s+relevant'
  ignore_case: true

# The reserved "Senior" title prefix.
senior_title:
  pattern: '\bsenior\b'
  ignore_case: true
