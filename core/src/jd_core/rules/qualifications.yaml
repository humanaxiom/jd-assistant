# SFU Qualifications / KSA rules — RULEBOOK AS DATA (CLAUDE.md §2).
#
# provenance:
#   rulebook: docs/rulebook/sfu-jd-standards.txt
#     - Part 5.1 knowledge modifiers: EXCELLENT / WORKING / [NO MODIFIER]
#     - Part 5.2 skill modifiers: BASIC / INTERMEDIATE / ADVANCED / EXPERT
#     - Part 5.3 abilities: 'Format: "Ability to [observable behavior]"'
#     - Part 5.4 KSA order: Knowledge -> Skills -> Abilities
#     - l.240 equivalency statement; l.264 banned "may include"/"assets"/"preferences"
#   provenance doc: docs/rulebook/sfu-reference.md §6
#   hris: packages/pipeline/src/pipeline/quality/jd_rules.py ::
#     _VALID_KNOWLEDGE_MODIFIERS, _VALID_SKILL_MODIFIERS, _KSA_RANK,
#     _BANNED_QUALIFICATION_PHRASES, _EQUIVALENT_COMBINATION, and the
#     ("ability to", "able to") prefix check in _authoring_gates.
version: jd_rules_sfu_v4

# Accepted proficiency modifiers (compared lowercased). "none" is the explicit
# sentinel for the rulebook's "[NO MODIFIER] knowledge" tier.
knowledge_modifiers: [excellent, working, none]
skill_modifiers: [basic, intermediate, advanced, expert]

# Qualifications must run Knowledge -> Skills -> Abilities (Part 5.4). Ranks are
# compared pairwise; a later item with a lower rank is out of order.
ksa_rank:
  knowledge: 0
  skill: 1
  ability: 2

# Phrases the Toolkit bans from Qualifications — they signal *desired*, not the
# *minimum* needed to perform at the full working level.
banned_phrases:
  - may include
  - assets
  - preferences

# WHERE they are banned (HR-120). `qualifications` = the parsed Qualifications section
# only; `document` = the whole JD.
#
# It shipped as `document` until Phase 2.6, and that was a DEFECT, not a policy: the
# rule's own catalog text says "phrases the Toolkit bans from **Qualifications**". The
# 2.5 archive baseline measured the cost — a duty reading "responsibilities may include
# arranging catering…" or "manages capital assets" raised a QUALIFICATIONS finding, and
# SFU-QUAL-BANNED-PHRASE drove **all 104** SFU-APPROVE-QUAL-MINIMUM blocks on the
# current-practice cohort, making it the #2 operative gate in the entire approval bar on
# the strength of matches in the wrong section.
#
# Fixing the scope CHANGES WHO GETS APPROVED, so it is a registered decision with the
# measured before/after (HR-120), not a cleanup. `document` remains selectable — one
# YAML word — if HR rules that these phrases have no place anywhere in a JD.
banned_phrase_scope: qualifications

# The required equivalency path ("...or an equivalent combination of education,
# training and experience"). Matched as a casefolded substring.
equivalent_combination: equivalent combination

# An ability must read as observable behaviour: it starts with one of these.
ability_prefixes:
  - ability to
  - able to
