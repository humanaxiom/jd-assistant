      - schedules
      - screens
      - selects
      - services
      - sorts
      - suggests
      - supervises
      - tests
      - trains
      - transcribes
      - transfers
      - troubleshoots
      - verifies
    provenance: sfu_rulebook
    source_part: Glossary
    why_it_matters: >-
      The glossary is a CLOSED list: a duty beginning with any verb outside it is
      flagged (SFU-STRUCT-ACTION-VERB, `low`, non-blocking). Ordinary, perfectly
      good verbs are absent — "supports", "delivers", "liaises", "administrates",
      "writes", "edits", "responds", "escalates" — so well-written duties are
      penalised for word choice. It also contains two adjectives (HR-043, HR-044)
      and both "assemble" and "assembles". The whole list is pinned here so it
      cannot be edited without SFU HR being told. Same provenance caveat as HR-043:
      the glossary is in the JD Toolkit, which is not shipped in this repo.
    impact_if_changed: >-
      Adding verbs reduces a very common false positive; removing any tightens it.
      Score and checklist only today — but if SFU-STRUCT-ACTION-VERB were ever
      gated (HR-004) or promoted to the severity floor (HR-057), this list would
      become the approval bar.
    status: open

  - id: HR-056
    question: >-
      Must every JD's Relationships section open with SFU's standard sentence,
      verbatim?
    config:
      file: markers.yaml
      path: markers.relationships_header
    current_default: establishes and maintains relationships and alliances
    provenance: sfu_rulebook
    source_part: Part 2F
    why_it_matters: >-
      A literal case-folded substring test. SFU's boilerplate, transcribed — but a
      JD that paraphrases it is flagged (SFU-GATE-REL-HEADER, `low`, non-blocking).
      The composer restores the boilerplate anyway, which is why this is a nudge
      rather than a bar.
    impact_if_changed: Score and checklist only.
    status: open

  # ═══ THE SECOND ROUTE TO BLOCKING ═══════════════════════════════════════════

  - id: HR-057
    question: >-
      Which rules are severe enough that their mere presence blocks approval —
      whatever the score, and without being named in any gate?
    config:
      file: rule_catalog.yaml
      path: rule_catalog.rules_by_severity.high
    current_default:
      - SFU-COMP-DUTIES
      - SFU-COMP-QUALS
      - SFU-COMP-SUMMARY
    provenance: our_invention
    why_it_matters: >-
      THERE ARE TWO ROUTES TO BLOCKING, NOT ONE. A rule blocks if it is named in a
      gate's rule_ids (pinned by HR-004) — OR if its severity reaches the severity
      floor (HR-003, currently `high`), because SFU-APPROVE-SEVERITY-FLOOR blocks on
      *any* finding at or above it. So raising a `low` drafting nudge like
      SFU-STRUCT-ACTION-VERB to `high` would silently make a non-approved verb block
      a JD, with no edit to gates.yaml at all. This entry pins the membership of
      every tier that reaches the floor, so that promotion cannot happen quietly.
    impact_if_changed: >-
      Anything added to this list starts blocking approval. Note the list adjusts
      itself: if HR lowers the severity floor (HR-003) to `medium`, the `medium`
      tier becomes a blocking tier too, appears on the decision surface, and the
      build fails until it is registered here as well.
    status: open

  # ═══ SFU'S OWN BOILERPLATE FAILS SFU'S OWN LEXICON ══════════════════════════

  - id: HR-058
    question: >-
      SFU's mandatory, "do not edit" About SFU paragraph contains the word
      "compassionate" — which our lexicon flags as a coded term. Every compliant JD
      is penalised. What should give?
    config:
      file: coded_terms.yaml
      path: coded_terms.medium.compassionate
    current_default: '"caring"'
    provenance: hris_calibration
    why_it_matters: >-
      SFU's pre-populated About-SFU block reads "We are unconventional, fearless,
      COMPASSIONATE, approachable and ready." The template says do not edit it. Our
      lexicon files "compassionate" at `medium` — one of the nine terms that are NOT
      on SFU's own published list (HR-029). Measured on a clean JD: WITHOUT the
      About-SFU paragraph, score 91.5 / grade A, no coded-term finding. WITH it —
      i.e. exactly as SFU mandates — score 81.5 / grade B, one `medium` coded-term
      finding. A JD is penalised 10 points for obeying SFU, and penalised again
      (SFU-COMP-ABOUT) if it leaves the paragraph out. It cannot win. This is almost
      certainly the highest-frequency false positive in the system, and because it
      fires on nearly every compliant JD it systematically DEPRESSES THE WHOLE
      ARCHIVE BASELINE — the very baseline the score floor (HR-001) is supposed to
      be ratified against. Ratify HR-001 with this fixed, or the floor is calibrated
      against a 10-point artefact.
    impact_if_changed: >-
      Three ways out, all config: drop "compassionate" from the lexicon (it is not
      SFU's term anyway); demote it to `low`; or exclude the About-SFU boilerplate
      from the lexicon's scan (a validator scope change — NOT free, see HR-041 for
      the same shape of problem). Left as-is deliberately: this register documents
      the behaviour, it does not change it.
    status: open

# ═════════════════════════════════════════════════════════════════════════════
# TRIVIAL — on the decision surface, deliberately NOT a decision for HR.
#
# The coverage check (loader.check_register) demands that EVERY parameter on the
# decision surface is either an entry above or an exemption here WITH A REASON.
# Nothing may be silently skipped. Two honest kinds of exemption:
#   * not a decision at all (presentation, or definitional given something else);
#   * decided elsewhere — `covered_by` names the entry that pins it (validated).
# ═════════════════════════════════════════════════════════════════════════════
