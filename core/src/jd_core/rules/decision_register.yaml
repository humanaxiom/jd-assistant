  # --- rule severities ---------------------------------------------------------
  # A rule's `default_severity` is NOT merely a score weight. It has THREE effects,
  # and an exemption here is only sound because all three are pinned elsewhere:
  #   1. score cost                    -> pinned by the penalties, HR-008..HR-011
  #   2. blocking BY NAME              -> pinned by HR-004 (gates.blocking_rule_ids)
  #   3. blocking BY SEVERITY FLOOR    -> pinned by HR-057
  #      (rule_catalog.rules_by_severity.high). This is the one an earlier draft of
  #      this register MISSED: a `low` nudge promoted to `high` starts blocking
  #      approval through SFU-APPROVE-SEVERITY-FLOOR without appearing in any gate.
  #      HR-057 pins the membership of every tier that reaches the floor, so that
  #      promotion now breaks the build.
  # With (1), (2) and (3) all pinned, the individual severity values below are not a
  # SEPARATE decision — any change that matters moves one of the three.

  # definitional: the three `high` rules (their tier membership is HR-057)
  - config: {file: rule_catalog.yaml, path: rule_catalog.SFU-COMP-SUMMARY.default_severity}
    reason: >-
      Definitional: a document with no Position Summary is not a job description.
      `high` is what makes the severity floor (HR-003) and the un-waivable
      mandatory-sections gate (HR-006) agree about it. Membership of the `high`
      tier — the tier that trips the floor — is pinned by HR-057.
    covered_by: HR-057
  - config: {file: rule_catalog.yaml, path: rule_catalog.SFU-COMP-DUTIES.default_severity}
    reason: >-
      Definitional: a document with no duties is not a job description. `high` tier
      membership is pinned by HR-057; the un-waivable gate by HR-006.
    covered_by: HR-057
  - config: {file: rule_catalog.yaml, path: rule_catalog.SFU-COMP-QUALS.default_severity}
    reason: >-
      Definitional: a document with no qualifications is not a job description.
      `high` tier membership is pinned by HR-057; the un-waivable gate by HR-006.
    covered_by: HR-057

  # the rest: the severity value itself is not a separate decision, because all
  # three of its effects are pinned (see the note above). Each `covered_by` names
  # the entry that carries the substantive question about that rule.
  - config: {file: rule_catalog.yaml, path: rule_catalog.SFU-COMP-RELATIONSHIPS.default_severity}
    reason: >-
      Its score cost is pinned by HR-008..HR-011, its blocking-by-name by HR-004,
      and its blocking-by-severity-floor by HR-057. A `low` completeness nudge.
    covered_by: HR-057
  - config: {file: rule_catalog.yaml, path: rule_catalog.SFU-COMP-ABOUT.default_severity}
    reason: >-
      Missing "About SFU" boilerplate — `low`, and boilerplate the composer restores.
      Score cost HR-008..HR-011; blocking by name HR-004; by severity floor HR-057.
      (What that boilerplate then does to the coded-term lexicon IS a decision —
      HR-058.)
    covered_by: HR-058
  - config: {file: rule_catalog.yaml, path: rule_catalog.SFU-COMP-EDI.default_severity}
    reason: >-
      Missing Employment Equity statement — `low`, and it DOES block, via the
      EDI-footer gate (pinned by HR-004). Its sibling, the territorial
      acknowledgement, is registered as HR-039 because its WORDING is an open
