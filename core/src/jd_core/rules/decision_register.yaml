  - id: HR-038
    question: Should a Position Summary shorter than 100 words be a defect at all?
    config:
      file: rule_catalog.yaml
      path: rule_catalog.SFU-STRUCT-SUMMARY-TOO-SHORT.default_severity
    current_default: low
    provenance: prior_calibration
    tier: hr_policy
    why_it_matters: >-
      The summary-length rule is split in two precisely so this question can be
      answered separately (HR-019/HR-020): the over-run blocks approval, the
