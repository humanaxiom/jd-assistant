    covered_by: HR-004
  - config: {file: rule_catalog.yaml, path: rule_catalog.SFU-STRUCT-SUMMARY-TOO-LONG.default_severity}
    reason: >-
      `low`, but blocking by name (HR-004, HR-020). All three effects of the severity
