  # ═══ THE SECOND ROUTE TO BLOCKING ═══════════════════════════════════════════

  - id: HR-057
    question: >-
      Which rules are severe enough that their mere presence blocks approval —
      whatever the score, and without being named in any gate?
    config:
      file: rule_catalog.yaml
      path: rule_catalog.rules_by_severity.high
    current_default:
      - SFU-COMP-DUTIES
      - SFU-COMP-QUALS
      - SFU-COMP-SUMMARY
    provenance: our_invention
    tier: hr_policy
    why_it_matters: >-
      THERE ARE TWO ROUTES TO BLOCKING, NOT ONE. A rule blocks if it is named in a
      gate's rule_ids (pinned by HR-004) — OR if its severity reaches the severity
      floor (HR-003, currently `high`), because SFU-APPROVE-SEVERITY-FLOOR blocks on
      *any* finding at or above it. So raising a `low` drafting nudge like
      SFU-STRUCT-ACTION-VERB to `high` would silently make a non-approved verb block
      a JD, with no edit to gates.yaml at all. This entry pins the membership of
      every tier that reaches the floor, so that promotion cannot happen quietly.
    impact_if_changed: >-
      Anything added to this list starts blocking approval. Note the list adjusts
      itself: if HR lowers the severity floor (HR-003) to `medium`, the `medium`
      tier becomes a blocking tier too, appears on the decision surface, and the
      build fails until it is registered here as well.
    status: open

  # ═══ SFU'S OWN BOILERPLATE FAILS SFU'S OWN LEXICON ══════════════════════════

  - id: HR-058
    question: >-
      SFU's mandatory, "do not edit" About SFU paragraph contains the word
      "compassionate" — which our lexicon flags as a coded term. Every compliant JD
      is penalised. What should give?
    config:
      file: coded_terms.yaml
      path: coded_terms.medium.compassionate
    current_default: '"caring"'
    provenance: prior_calibration
    tier: hr_policy
    why_it_matters: >-
      ⚠ THE FALSE POSITIVE IS FIXED (Phase 2.5-prep) — the QUESTION IS STILL OPEN.
      Read the history, then what is left to decide.

      HISTORY. SFU's pre-populated About-SFU block reads "We are unconventional,
      fearless, COMPASSIONATE, approachable and ready." The template says do not edit
      it. Our lexicon files "compassionate" at `medium` — one of the nine terms that
      are NOT on SFU's own published list (HR-029). Measured on a clean JD: WITHOUT
      the About-SFU paragraph, score 91.5 / grade A, no coded-term finding. WITH it —
      i.e. exactly as SFU mandates — score 81.5 / grade B, one `medium` coded-term
      finding. A JD was penalised 10 points for obeying SFU, and penalised again
      (SFU-COMP-ABOUT) if it left the paragraph out. It could not win. Because it
      fired on nearly every compliant JD it systematically DEPRESSED THE WHOLE ARCHIVE
      BASELINE — the very baseline the score floor (HR-001) is to be ratified against.

      WHAT WAS DONE. Of the three ways out, we took the third: the coded-term scan no
      longer looks inside SFU's mandated boilerplate. That is a decision in its own
      right and it is registered as its own entry — HR-107, provenance
      `our_invention`, status open — with the mandated text itself at HR-104 (About
      SFU), HR-105 (territorial) and HR-106 (equity). The archive baseline is now
      measured with the artefact removed, so HR-001 can be ratified against a real
      number. Behaviour is pinned by tests both ways: paragraph present -> no
      coded-term finding AND no SFU-COMP-ABOUT; paragraph absent -> SFU-COMP-ABOUT
      still fires.

      WHAT IS STILL OPEN, AND WHY THIS ENTRY STAYS. The scan exemption made the JD
      stop losing points; it did NOT settle whether "compassionate" belongs in the
      lexicon at all. It is still `medium` — so a JD that uses the word in its OWN
      prose (a Health & Counselling JD asking for "compassionate client care") is
      still docked 10 points and a grade for a word SFU itself uses approvingly and
      never published as coded. That is the question below, and it is HR's.
    impact_if_changed: >-
      The remaining choice, both config: drop "compassionate" from the lexicon
      (`coded_terms.medium`) — it is not SFU's term anyway (HR-029) — or demote it to
      `low` (`coded_terms.low`, 5 points instead of 10, and it cannot drag a grade).
      Doing NEITHER is also a choice: the word stays a `medium` finding everywhere
      except inside SFU's own mandated sentences. Whichever way HR goes, the scan
      exemption (HR-107) stands on its own — a scanner should not mark down text SFU
      forbids the author to edit, whatever the lexicon ends up saying.
    status: open

  # ═══ TITLES: THE SENIORITY LADDER ═══════════════════════════════════════════

  - id: HR-059
    question: >-
      What are SFU's job-title seniority levels — the ladder every title is
      classified onto (and, later, compared and de-duplicated by)?
    config:
      file: titles.yaml
      path: titles.families
    current_default:
      - vp
      - chief
      - director
      - manager
      - lead
      - associate
      - assistant
    provenance: prior_calibration
    tier: hr_informed
    why_it_matters: >-
      the earlier build shipped this ladder claiming it as "SFU's official title ladder (Toolkit
      p18-19)". IT IS NOT IN THE RULEBOOK. docs/rulebook/sfu-jd-standards.txt has no
      title-family ladder at all: `chief` does not appear anywhere in it, and the
      only occurrence of "VP" (Part 3.5) lists VP as a RESTRICTED title — a title
      you may not use — not as a seniority family. So the seven rungs below are an
      inherited guess, and the guess is load-bearing: the ladder is the seniority
      dimension of title classification, it will normalize titles for dedup Tier-3
      (deciding whether "Manager, Research" and "Research Lead" are the same role),
      and it drives the composer's facets. A missing rung is not a cosmetic gap — a
      ladder with no `supervisor` or `coordinator` rung cannot classify those
      titles at all, and they fall to `unmapped`. This is HR-029's problem (nine
      coded terms SFU never published, shipped as if it had) in the title dimension.
    impact_if_changed: >-
      Config only — add, remove or reorder rungs in titles.yaml. Nothing here blocks
      approval; no gate reads it. But HR should either point us at the real SFU
      ladder (the Job Titling Guide / Toolkit p18-19, which this repo does not
      hold), confirm these seven, or replace them. NOTE the SEPARATE functional
      dimension (assistant / coordinator / analyst / officer / specialist /
      consultant / manager / associate director / director / executive) IS
      rulebook-sourced — Part 3.3's Application Table — and is not in question here.
    status: open

  - id: HR-060
    question: >-
      When a job title carries TWO seniority words — "Associate Director" is both an
      associate and a director — which one decides the family?
    config:
      file: titles.yaml
      path: titles.family_match_order
    current_default:
      - vp
      - chief
      - manager
      - director
      - lead
      - assistant
      - associate
    provenance: prior_calibration
    tier: technical
    why_it_matters: >-
      The classifier tries the families in THIS order and the first keyword that
      matches wins. That makes the order a policy statement, not an implementation
      detail, and it is deliberately NOT the seniority ladder of HR-059: `manager` is
      tried before `director`, which is the *entire* reason "Associate Director,
      Advancement" classifies as a manager rather than a director. Likewise
      `assistant` before `associate`. Shuffle two rungs and real titles change family
      with no other edit anywhere. The earlier build buried this ordering in a Python tuple with a
      one-line comment; SFU has never been asked whether an Associate Director is a
      manager.
    impact_if_changed: >-
      Config only. Reordering changes which family a *multi-keyword* title lands in —
      it cannot change a title that carries only one family keyword. Nothing blocks
      approval on it (no gate reads the family); it feeds titling advice, and will
      feed title normalization for dedup Tier-3 and the composer's facets.
    status: open

  - id: HR-061
    question: >-
      Which title words signal each seniority family?
    config:
      file: titles.yaml
      path: titles.family_keywords
    current_default:
      vp: ["vice president", "associate vice", " avp ", " vp "]
      chief: ["chief", " cio ", " cfo ", " cto ", " ceo ", " coo "]
      manager: ["associate director", "manager", "supervisor"]
      director: ["director"]
      lead: ["team lead", " lead "]
      assistant: ["assistant"]
      associate: ["associate", "representative"]
    provenance: prior_calibration
    tier: hr_informed
    why_it_matters: >-
      This is the ladder of HR-059 made operational: a rung with no keyword can never
      be matched, and a word missing from a rung sends every title carrying it to
      `unmapped`. The list is small and inherited — `supervisor` is a manager,
      `representative` is an associate, and nothing here recognises `coordinator`,
      `officer`, `analyst` or `specialist` as a seniority at all (they are the
      FUNCTIONAL dimension, HR-063). The space-padded entries (" vp ", " cio ") match
      a whole word only; the unpadded ones are substrings, so "manager" also matches
      "Managerial Accountant".
    impact_if_changed: >-
      Config only. Adding a word makes titles carrying it classify into that family;
      removing one sends them to `unmapped` (visible, not silent). Advisory — no gate
      reads it.
    status: open

  - id: HR-062
    question: >-
      SFU writes a supervisory title as "Manager, Laboratory Operations" and a
      non-supervisory one as "Laboratory Operations Manager" (Part 3.4). WHICH
      families, written first and followed by a comma, actually signal supervision?
    config:
      file: titles.yaml
      path: titles.comma_supervisory_families
    current_default: [chief, director, lead, manager, vp]
    provenance: prior_calibration
    tier: hr_informed
    why_it_matters: >-
      The comma FORMAT rule is SFU's (Part 3.4). The set of families it applies to is
      not: The earlier build chose these five. It is the guard that stops "Software Developer,
      Platform" reading as a supervisory title, so it must exclude non-role prefixes
      — but it also decides that a `lead` supervises and an `associate` does not,
      which is a real HR judgement nobody made. Note `lead` is in the set even though
      SFU's own ladder does not exist (HR-059), so this compounds an unratified
      default with another one.
    impact_if_changed: >-
      Config only; advisory. It sets `TitleClassification.comma_supervisory`, which
      is surfaced to reviewers and (later) used to sanity-check a JD's Relationships
      section against its title. No gate reads it.
    status: open

  - id: HR-063
    question: >-
      What are the functional title types — SFU's Job-Title Application Table?
    config:
      file: titles.yaml
      path: titles.functions
    current_default:
      - assistant
      - coordinator
      - analyst
      - officer
      - specialist
      - consultant
      - manager
      - associate_director
      - director
      - executive
    provenance: sfu_rulebook
    tier: hr_informed
    source_part: Part 3.3
    why_it_matters: >-
      The SECOND, independent title dimension: what the title *word* means, as
      against how senior it is. "Data Analyst" has no rung on the seniority ladder
      (family `unmapped`) but a perfectly clear function (`analyst`). Unlike the
      ladder of HR-059 this table IS SFU's — it is transcribed from the Total Comp
      Learning Series' Application Table — so the question for HR is not "is this
      right" but "is this still current, and is it complete". A missing row means
      every title using that word falls to `unmapped`.
    impact_if_changed: >-
      Config plus a one-line type change: `jd_core.models.bank.TitleFunction` is the
      type mirror of this list and the loader REFUSES TO START if the two disagree,
      so a row cannot be added to the YAML alone. Advisory — no gate reads it.
    status: open

  - id: HR-064
    question: >-
      "Executive Director" and "Associate Director" both contain "Director". Which
      functional type wins?
    config:
      file: titles.yaml
      path: titles.function_match_order
    current_default:
      - executive
      - associate_director
      - director
      - manager
      - consultant
      - specialist
      - officer
      - analyst
      - coordinator
      - assistant
    provenance: prior_calibration
    tier: technical
    why_it_matters: >-
      The Application Table (HR-063) is SFU's; the ORDER its rows are tried in is not
      — the earlier build chose it, and it is what resolves the overlaps. `executive` is tried
      first, so "Executive Director" is an executive (consistent with SFU reserving
      that title for APEX roles, Part 3.5 / SFU-AUTH-TITLE-EXEC-DIR); then
      `associate_director`, so "Associate Director" is not a director. Both readings
      are defensible and neither is written down by SFU. Reorder and titles change
      function.
    impact_if_changed: >-
      Config only, and only for titles carrying two function words. Advisory.
    status: open

  - id: HR-065
    question: >-
      Which words in a title map it onto each functional type?
    config:
      file: titles.yaml
      path: titles.function_keywords
    current_default:
      executive: ["executive"]
      associate_director: ["associate director"]
      director: ["director"]
      manager: ["manager"]
      consultant: ["consultant"]
      specialist: ["specialist"]
      officer: ["officer"]
      analyst: ["analyst"]
      coordinator: ["coordinator"]
      assistant: ["assistant"]
    provenance: sfu_rulebook
    tier: hr_informed
    source_part: Part 3.3
    why_it_matters: >-
      Each function is matched by its own name, so the keywords are a direct
      transcription of the Application Table's title words — that part is SFU's. What
      is NOT SFU's is that they are matched as bare substrings anywhere in the title:
      "Chief Information Officer" therefore reads as function `officer`, and any
      title containing "Assistant" reads as `assistant` however senior it is. HR
      should confirm the words; the matching strategy is ours to answer for.
    impact_if_changed: >-
      Config only; advisory. Every keyword must belong to a function that exists in
      HR-063 or the rulebook fails to load.
    status: open

  # ═══ ADVISORY HAY SIGNALS — none of this is SFU's ═══════════════════════════
  #
  # SFU classifies APSA/Excluded jobs with the Hay Guide Chart-Profile Method. The
  # point charts are PROPRIETARY and SFU publishes none of them, so JD Bank never
  # assigns a grade and structurally cannot (`HaySignals` has no field for one).
  # What it does is read a JD's own sections and emit an advisory low/moderate/high
  # SIGNAL per Hay factor, with the phrases that drove it, to help Compensation
  # LEVEL a role.
  #
  # EVERY word and EVERY number in hay_signals.yaml is prior_calibration — invented
  # in the earlier pipeline, never published by SFU, never ratified by anyone. This is
  # HR-029 (nine coded terms SFU never published) and HR-059 (a title ladder SFU
  # never published) in a third dimension. It is registered honestly rather than
  # presented as an SFU standard.

  - id: HR-066
    question: >-
      Which words in a JD's education requirement mean "graduate-level"?
    config:
      file: hay_signals.yaml
      path: hay_signals.edu_high
    current_default: [phd, doctora, master]
    provenance: prior_calibration
    tier: hr_informed
    why_it_matters: >-
      The single biggest contributor to the Know-How signal (HR-073 gives it 3.0
      points, more than any other). Matched as substrings of the `education`
      qualifications only: "doctora" catches doctoral/doctorate, "master" catches
      master's — and also "Masters of the craft" or a "Mastercard" reconciliation
      duty, if either ever appeared in an education line.
    impact_if_changed: >-
      Config only. Advisory: it moves a Hay SIGNAL, never a grade and never a gate.
    status: open

  - id: HR-067
    question: >-
      Which words in a JD's education requirement mean "undergraduate"?
    config:
      file: hay_signals.yaml
      path: hay_signals.edu_mid
    current_default: [bachelor, undergraduate, degree]
    provenance: prior_calibration
    tier: hr_informed
    why_it_matters: >-
      The fallback when no graduate cue is found (2.0 points, HR-073). Note `degree`
      is deliberately broad and will also match "Master's degree" — harmless only
      because the graduate cue is tested first. A JD saying "Diploma or equivalent"
      scores nothing here.
    impact_if_changed: >-
      Config only; advisory.
    status: open

  - id: HR-068
    question: >-
      Which language in the Problem Solving section signals independent, non-routine
      thinking?
    config:
      file: hay_signals.yaml
      path: hay_signals.ps_challenge
    current_default:
      - independent
      - judgment
      - judgement
      - novel
      - complex
      - ambiguous
      - unprecedented
      - analyze
      - analyse
      - evaluate
      - interpret
      - strategic
      - non-routine
      - creative
    provenance: prior_calibration
    tier: hr_informed
    why_it_matters: >-
      Each distinct phrase found adds a full point (HR-076) — more than the entire
      section is worth for existing — so a JD's Problem-Solving signal is close to a
      count of how many of these 14 words its author happened to use. It rewards a
      vocabulary, not a role: "Resolves novel, ambiguous, complex problems requiring
      independent judgment" scores 5 for one sentence. Both spellings of
      judgment/judgement and analyze/analyse are listed, so a JD using both would
      double-count.
    impact_if_changed: >-
      Config only; advisory. Adding words makes the signal easier to raise.
    status: open

  - id: HR-069
    question: >-
      Which language in the Problem Solving section signals routine, closely
      supervised work — and should it really SUBTRACT?
    config:
      file: hay_signals.yaml
      path: hay_signals.ps_routine
    current_default:
      - routine
      - defined procedure
      - established procedure
      - under supervision
      - close supervision
      - step-by-step
      - prescribed
      - clearly defined
    provenance: prior_calibration
    tier: hr_informed
    why_it_matters: >-
      These are the only NEGATIVE cues in the whole estimator (HR-076 weights each hit
      -1.0). A JD that accurately describes a junior role — "handles routine issues
      using established procedure, under close supervision" — is pushed to a low
      Problem-Solving signal, which is the intent; but the same words in a senior JD
      ("establishes the procedures others follow") are penalised just as hard, because
      the match is a bare substring with no sense of who is doing what. Note "under
      supervision" does NOT match "under close supervision" (the words are not
      adjacent) — "close supervision" is what catches it.
    impact_if_changed: >-
      Config only; advisory. Setting the weight to 0 (HR-076) neutralises the list
      without deleting it.
    status: open

  - id: HR-070
    question: >-
      Which language in the Impact of Decision Making section signals freedom to act
      and magnitude of impact?
    config:
      file: hay_signals.yaml
      path: hay_signals.acc_autonomy
    current_default:
      - without approval
      - without prior approval
      - autonomous
      - independently
      - authority
      - approve
      - sign
      - budget
      - strategic
      - organization-wide
      - institution
      - significant impact
      - accountable
      - final decision
      - discretion
    provenance: prior_calibration
    tier: hr_informed
    why_it_matters: >-
      The whole Accountability signal, one point per distinct phrase (HR-079). Known
      quirks HR should see rather than have hidden: `sign` is a substring, so it also
      fires on "design" and "significant"; `approve` fires on "requires approval from
      the Director", which is the OPPOSITE of autonomy; and `without approval` /
      `without prior approval` overlap, so "without prior approval" scores one, not
      two ("without approval" is not a substring of it). `institution` fires on the
      boilerplate word "institution" wherever it appears.
    impact_if_changed: >-
      Config only; advisory — this can never produce a grade.
    status: open

  - id: HR-071
    question: >-
      Which Toolkit skill modifiers count as "advanced" depth for the Know-How
      signal?
    config:
      file: hay_signals.yaml
      path: hay_signals.advanced_skill_modifiers
    current_default: [advanced, expert]
    provenance: prior_calibration
    tier: hr_informed
    why_it_matters: >-
      SFU's Toolkit defines the skill modifier scale (basic / intermediate / advanced
      / expert). Which END of it counts as depth is the earlier build's call: `intermediate` scores
      nothing today, so a JD requiring six intermediate skills reads as no more
      skilled than one requiring none.
    impact_if_changed: >-
      Config only; advisory.
    status: open

  - id: HR-072
    question: >-
      Which Toolkit knowledge modifiers count as top-level knowledge?
    config:
      file: hay_signals.yaml
      path: hay_signals.excellent_knowledge_modifiers
    current_default: [excellent]
    provenance: prior_calibration
    tier: hr_informed
    why_it_matters: >-
      The knowledge scale is excellent / working / none. Only `excellent` scores
      (1.0, HR-073) — `working` knowledge contributes nothing at all.
    impact_if_changed: >-
      Config only; advisory.
    status: open

  - id: HR-073
    question: >-
      How much is each Know-How signal worth?
    config:
      file: hay_signals.yaml
      path: hay_signals.know_how_points
    current_default:
      education_graduate: 3.0
      education_undergraduate: 2.0
      many_advanced_skills: 2.0
      some_advanced_skills: 1.0
      excellent_knowledge: 1.0
      supervisory_scope: 1.0
      broad_qualifications: 1.0
    provenance: prior_calibration
    tier: technical
    why_it_matters: >-
      The weights that turn a JD into a Know-How score, which HR-075 then turns into
      low/moderate/high. Education dominates: a graduate degree alone (3.0) is worth
      as much as supervising staff PLUS excellent knowledge PLUS a broad
      qualification set (1.0 each), and it alone reaches the `moderate` cutoff. SFU
      has published no weighting at all — these seven numbers are somebody else's
      judgement about what makes a job senior.
    impact_if_changed: >-
      Config only; advisory. Changing a weight re-levels every JD's Know-How signal.
      Nothing blocks approval on it and no grade is ever derived from it.
    status: open

  - id: HR-074
    question: >-
      How many advanced skills is "many", and how many qualification kinds is "broad"?
    config:
      file: hay_signals.yaml
      path: hay_signals.know_how_counts
    current_default:
      advanced_skills_for_many: 3
      qualification_kinds_for_broad: 4
    provenance: prior_calibration
    tier: technical
    why_it_matters: >-
      The two counting cliffs inside Know-How. 3 advanced/expert skills scores 2.0;
      2 scores 1.0 — a one-skill difference halves the contribution. 4 distinct
      qualification kinds (of the six the template has: education, experience,
      knowledge, skill, ability, security) scores 1.0 for "breadth", which rewards a
      JD for filling in more sections as much as for the role being broader.
    impact_if_changed: >-
      Config only; advisory.
    status: open

  - id: HR-075
    question: >-
      At what Know-How score does a role read as moderate, and at what score high?
    config:
      file: hay_signals.yaml
      path: hay_signals.know_how_levels
    current_default:
      moderate: 3.0
      high: 5.0
    provenance: prior_calibration
    tier: technical
    why_it_matters: >-
      The cutoffs that turn the score into the only thing a human sees. With HR-073's
      weights, `moderate` (3.0) is reached by a graduate degree ALONE, and `high`
      (5.0) needs roughly a graduate degree plus three advanced skills. Below 3.0 the
      role reads `low`. The earlier build hardcoded these as `_level(score, mod=3, hi=5)` in a
      Python default argument.
    impact_if_changed: >-
      Config only; advisory — a Hay SIGNAL, never a Hay grade. Two levels may not
      share a cutoff, and every level except `low` (the floor) must have one, or the
      rulebook does not load.
    status: open

  - id: HR-076
    question: >-
      How much is each Problem-Solving signal worth — and how much does routine
      language cost?
    config:
      file: hay_signals.yaml
      path: hay_signals.problem_solving_points
    current_default:
      section_item: 0.5
      challenge_hit: 1.0
      routine_hit: -1.0
    provenance: prior_calibration
    tier: technical
    why_it_matters: >-
      A single challenge word (HR-068) is worth twice as much as an entire written
      Problem Solving entry, and a single routine word (HR-069) cancels a challenge
      word outright. That makes the Problem-Solving signal mostly a word count. The
      NEGATIVE weight is the only one in the estimator and is the strongest claim it
      makes: that describing supervision honestly is evidence of a less demanding
      role.
    impact_if_changed: >-
      Config only; advisory. Set `routine_hit` to 0.0 to keep the routine lexicon as
      evidence while removing its penalty.
    status: open

  - id: HR-077
    question: >-
      How many Problem Solving entries are worth scoring before length stops counting?
    config:
      file: hay_signals.yaml
      path: hay_signals.problem_solving_counts
    current_default:
      section_items_scored: 3
    provenance: prior_calibration
    tier: technical
    why_it_matters: >-
      Credit for merely HAVING a section, capped at 3 entries (1.5 points) so a JD
      cannot inflate its signal by padding the list. Length is not depth — but the
      cap also means the 4th genuinely distinct problem a role solves counts for
      nothing.
    impact_if_changed: >-
      Config only; advisory.
    status: open

  - id: HR-078
    question: >-
      At what Problem-Solving score does a role read as moderate, and at what score
      high?
    config:
      file: hay_signals.yaml
      path: hay_signals.problem_solving_levels
    current_default:
      moderate: 1.5
      high: 3.0
    provenance: prior_calibration
    tier: technical
    why_it_matters: >-
      With HR-076's weights, a JD with three Problem Solving entries and no challenge
      vocabulary at all scores exactly 1.5 and reads `moderate` — the signal can be
      earned by writing three sentences. `high` needs three challenge words net of
      any routine language. The earlier build hardcoded these as `mod=1.5, hi=3`.
    impact_if_changed: >-
      Config only; advisory.
    status: open

  - id: HR-079
    question: >-
      How much is each Accountability signal worth?
    config:
      file: hay_signals.yaml
      path: hay_signals.accountability_points
    current_default:
      section_item: 0.5
      autonomy_hit: 1.0
      supervisory_scope: 2.0
      external_breadth: 1.0
    provenance: prior_calibration
    tier: technical
    why_it_matters: >-
      Supervising staff is worth 2.0 — twice any single autonomy phrase, and twice
      what supervision is worth to Know-How (HR-073 gives it 1.0). Whether "freedom to
      act" should be dominated by headcount at all is a real Hay question, and this
      answers it by default. External breadth (HR-080) adds a point for having enough
      external contacts listed.
    impact_if_changed: >-
      Config only; advisory. The Accountability signal never becomes an
      Accountability grade.
    status: open

  - id: HR-080
    question: >-
      How many Impact-of-Decision-Making entries are scored, and how many external
      relationships count as "breadth of impact"?
    config:
      file: hay_signals.yaml
      path: hay_signals.accountability_counts
    current_default:
      section_items_scored: 3
      external_for_breadth: 3
    provenance: prior_calibration
    tier: technical
    why_it_matters: >-
      `external_for_breadth: 3` says a role dealing with three external parties has
      institution-scale impact and one dealing with two does not. It counts LIST
      ENTRIES, so a JD that writes "Vendors, government, and peer institutions" as a
      single line scores 0 while one that writes three lines scores 1 — the same
      role, formatted differently.
    impact_if_changed: >-
      Config only; advisory.
    status: open

  - id: HR-081
    question: >-
      At what Accountability score does a role read as moderate, and at what score
      high?
    config:
      file: hay_signals.yaml
      path: hay_signals.accountability_levels
    current_default:
      moderate: 2.0
      high: 4.0
    provenance: prior_calibration
    tier: technical
    why_it_matters: >-
      With HR-079's weights, supervising staff alone (2.0) reaches `moderate` with no
      decision-making language whatsoever, and `high` (4.0) is two autonomy phrases
      away. The earlier build hardcoded these as `mod=2, hi=4`.
    impact_if_changed: >-
      Config only; advisory.
    status: open

# ═════════════════════════════════════════════════════════════════════════════
# JD-TO-JD COMPARISON (comparison.yaml) — similarity, clustering, drift.
#
# ⚠ PROVENANCE, UP FRONT: every entry below is `prior_calibration`. SFU publishes no
# similarity formula, no clone score, no cluster threshold and no drift metric —
# `docs/rulebook/sfu-jd-standards.txt` contains none of it. Two come close and still
# do not clear the `sfu_rulebook` bar, and the distinction is the whole point of the
# provenance column (HR-029 / HR-059 are the same lesson):
#
#   * the DRIFT ESCALATIONS (HR-100, HR-101). The earlier build cited them to "SFU's re-evaluation
#     criteria, Toolkit p26" — via docs/rulebook/sfu-reference.md §5, which is the earlier build's
#     own extract, not the rulebook. The shipped rulebook has NO re-evaluation
#     criteria at all: only l.22, "Major revisions can trigger re-evaluation", which
#     quantifies nothing. The intent is plausibly SFU's; the numbers are ours.
#   * the CLONE SCORE (HR-093). The Toolkit's cloning rule is an IDENTITY check
#     (identical duties + supervisor + title + qualifications). The earlier build approximated it
#     with a cosine. A score is not an identity check.
#
# NOTHING READS THESE YET (Phase 3 will). They are registered now, before the feature
# that needs them, so they cannot arrive as undeclared defaults inside a feature PR.
# ═════════════════════════════════════════════════════════════════════════════

  - id: HR-082
    question: >-
      Are these the education levels JD Bank recognises, in this order —
      high school < associate < bachelors < masters < phd?
    config:
      file: comparison.yaml
      path: comparison.education_ladder
    current_default: [high_school, associate, bachelors, masters, phd]
    provenance: prior_calibration
    tier: hr_informed
    why_it_matters: >-
      This is the ONE education ladder in the rulebook, and it is an ordinal scale, not
      a list: a rung's position IS its value. Drift reads an education change off it
      (HR-100's sibling escalation) and similarity measures how far apart two roles sit
      on it. The earlier build held the same fact twice — a name->ordinal dict in drift.py and a
      tuple in similarity.py — with nothing keeping them in step. Re-ordering it, or
      inserting a rung, silently re-scales both. SFU's rulebook names no education
      ladder; it requires the minimum education be STATED (Part 5), not that it be
      graded.
    impact_if_changed: >-
      Config only, but it re-scales two metrics at once. Adding a rung (e.g. a
      professional designation) also widens the ladder, which shrinks every education
      distance in `seniority_closeness` — a JD Bank-wide effect from a one-line edit.
      Each rung needs a matching cue list (HR-083); the loader refuses a rung with no
      cues.
    status: open

  - id: HR-083
    question: >-
      Which words in a free-text qualification place it on each rung of the education
      ladder — and is "degree", with no adjective, a bachelors?
    config:
      file: comparison.yaml
      path: comparison.education_text_cues
    current_default:
      high_school: ["high school", high-school, "secondary school"]
      associate: [associate, diploma]
      bachelors: [bachelor, bsc, b.sc, undergraduate, baccalaureate, degree]
      masters: [master, msc, m.sc, mba]
      phd: [phd, ph.d, doctora, dphil]
    provenance: prior_calibration
    tier: hr_informed
    why_it_matters: >-
      These substrings are how a written requirement ("Master's degree in a related
      discipline") becomes a rung. The cues are tried MOST-SENIOR FIRST — derived from
      the ladder, not written down separately — which is the only reason that example
      reads as `masters` and not as the generic `degree` -> `bachelors` rung. Two
      judgement calls are baked in: bare "degree" counts as a bachelors (an SFU JD
      that says "university degree" gets a rung it never asked for), and "diploma" is
      an associate (SFU's own usage varies). An unrecognised requirement yields NO
      level, and drift then never escalates on it — deliberately conservative.
    impact_if_changed: >-
      Config only. Note the cross-file guard: `hay_signals.yaml`'s education cues
      (`edu_high` / `edu_mid`) must all appear here, so DELETING a cue that Hay also
      reads is a LOAD ERROR, not a silent Know-How regression.
    status: open

  - id: HR-084
    question: How much of the JD-similarity score is the summary-embedding cosine?
    config:
      file: comparison.yaml
      path: comparison.weight_vector
    current_default: 0.45
    provenance: prior_calibration
    tier: technical
    why_it_matters: >-
      `sim = 0.45*vector + 0.45*skills + 0.10*seniority`. The earlier build rebalanced the embedding
      DOWN to parity with skills because on real JDs the summary embedding mostly
      captures generic institutional tone — every "university admin" JD reads alike —
      so an embedding-led score over-merges. That was a judgement about the earlier corpus,
      made against a skill graph JD Bank does not have; it has never been checked
      against SFU's archive.
    impact_if_changed: >-
      The three weights must sum to 1.0 (the loader enforces it), so moving one means
      moving another. Every threshold below (HR-092, HR-093, HR-095) is calibrated
      against THIS mix — retuning the weights invalidates them.
    status: open

  - id: HR-085
    question: How much of the JD-similarity score is idf-weighted skill overlap?
    config:
      file: comparison.yaml
      path: comparison.weight_skill
    current_default: 0.45
    provenance: prior_calibration
    tier: technical
    why_it_matters: >-
      Skills carry EQUAL weight to the embedding — the deliberate anti-over-merge
      choice (see HR-084). In JD Bank this weight currently multiplies a number nothing
      can compute: a parsed SFU JD has no skill set, no skill ontology and no idf
      corpus. Phase 3 has to build all three before this weight means anything, and
      whatever it builds them from will change what "skill overlap" IS.
    impact_if_changed: >-
      Must be re-decided WITH the Phase-3 skill representation, not before it. Weights
      must sum to 1.0.
    status: open

  - id: HR-086
    question: >-
      How much of the JD-similarity score is seniority (experience + education)
      closeness?
    config:
      file: comparison.yaml
      path: comparison.weight_seniority
    current_default: 0.1
    provenance: prior_calibration
    tier: technical
    why_it_matters: >-
      The tie-break term: 10% of the score. It is what stops a Coordinator and a
      Director with identical skill vocabulary scoring as the same role — and at 0.10
      it barely does. SFU cares a great deal about level (the whole Hay method is about
      level), so a 10% weight may be far too low; it is also the term whose inputs are
      most often missing, and a missing input scores 0.7 (HR-090) rather than 0.
    impact_if_changed: >-
      Raising it makes the score more level-sensitive and less likely to merge a junior
      and a senior variant of one role — probably desirable for SFU, and testable
      against the archive in Phase 3. Weights must sum to 1.0.
    status: open

  - id: HR-087
    question: >-
      When two skills are not the same but belong to the same ontology family
      (postgresql / mysql), what fraction of an exact match do they earn?
    config:
      file: comparison.yaml
      path: comparison.family_weight
    current_default: 0.5
    provenance: prior_calibration
    tier: technical
    why_it_matters: >-
      Half credit. It decides how generously the scorer treats "similar but not the
      same" expertise, which for JDs is precisely the interesting case (a JD asking for
      Tableau vs one asking for Power BI). Too generous and unrelated roles merge; too
      strict and genuinely redundant JDs never cluster.
    impact_if_changed: >-
      Config only. Meaningless until Phase 3 supplies a skill ontology — and the
      ontology's own granularity will matter more than this number.
    status: open

  - id: HR-088
    question: >-
      Which ontology families are so generic that sharing one is worth nothing —
      currently "other" and "domain"?
    config:
      file: comparison.yaml
      path: comparison.non_matchable_families
    current_default: [domain, other]
    provenance: prior_calibration
    tier: technical
    why_it_matters: >-
      The catch-all families. Without this exclusion every skill pair that fell into
      the ontology's junk drawer would earn HR-087's partial credit, and the skill
      component would drift towards "everything overlaps a bit".
    impact_if_changed: >-
      Config only. The names must match the Phase-3 ontology's own family names — a
      typo silently re-enables credit for the junk drawer, which is why the value is
      pinned here rather than left as a set literal in Python.
    status: open

  - id: HR-089
    question: >-
      Which title words are ignored when two titles are compared for sameness — is
      "Senior Developer II" the same title as "Developer"?
    config:
      file: comparison.yaml
      path: comparison.title_stopwords
    current_default:
      - "1"
      - "2"
      - "3"
      - "4"
      - "5"
      - assistant
      - associate
      - i
      - ii
      - iii
      - intern
      - iv
      - jr
      - junior
      - lead
      - principal
      - senior
      - sr
      - staff
      - trainee
      - v
    provenance: prior_calibration
    tier: technical
    why_it_matters: >-
      Yes, today: every one of these tokens is DISCARDED before titles are compared, so
      "Senior Developer II" and "Developer" are one title, and a cluster of them reports
      one distinct title, not three. That is exactly what SFU's harmonization wants for
      the *skills* comparison — and exactly wrong for reporting, because SFU's own
      Part 3.6 says "Senior" is reserved for roles supervising junior roles in the same
      area. The word carries meaning; the normalizer throws it away.
    impact_if_changed: >-
      Config only, but it moves BOTH the same-title flag in the clone verdict and the
      `distinct_titles` metric a cluster reports. Dropping `principal` (or adding
      `head`) silently re-groups every title in the archive. Note this list is NOT the
      seniority ladder in titles.yaml (HR-059) — different vocabulary, different job:
      discarded here, classified there.
    status: open

  - id: HR-090
    question: >-
      When a JD does not state an experience bar or an education level, how close do we
      assume the two roles are — currently 0.7 out of 1?
    config:
      file: comparison.yaml
      path: comparison.unknown_signal_closeness
    current_default: 0.7
    provenance: prior_calibration
    tier: technical
    why_it_matters: >-
      A pure guess, and it fires constantly: a JD Bank JD has NO structured education
      level or years bar at all, so on today's data every seniority comparison would
      take this default on both halves and score exactly 0.7. High enough not to punish
      a JD for what it does not say; low enough not to reward it. Nobody has validated
      that 0.7 is the right neutral.
    impact_if_changed: >-
      Config only, but it is the most-taken branch in `seniority_closeness`. Setting it
      to 0.0 would treat silence as maximum distance (punishing terse JDs); 1.0 would
      treat silence as agreement (merging everything).
    status: open

  - id: HR-091
    question: >-
      How many years of experience apart must two roles be before they count as
      completely different in seniority?
    config:
      file: comparison.yaml
      path: comparison.experience_span_years
    current_default: 10.0
    provenance: prior_calibration
    tier: technical
    why_it_matters: >-
      the earlier build divided the year gap by a hardcoded 10.0, so a 2-year role and a 12-year role
      score ZERO on experience closeness, while 2 and 7 score 0.5. Ten years is a whole
      career stage; for SFU's grade structure the meaningful distance may be far
      shorter.
    impact_if_changed: >-
      Config only. Narrowing it makes experience a sharper discriminator (fewer merges
      across levels); widening it makes it nearly inert.
    status: open

  - id: HR-092
    question: >-
      How similar must two JDs be before we show one as a "similar role" at all
      (the noise floor)?
    config:
      file: comparison.yaml
      path: comparison.sim_threshold
    current_default: 0.6
    provenance: prior_calibration
    tier: technical
    why_it_matters: >-
      Two jobs: it is the floor below which a neighbour is not surfaced to a human, AND
      it is one of the two inputs to the derived cluster threshold (HR-096) — raise it
      above 0.80 and clustering tightens with it. It is also the score above which a
      different-title/different-department match is called a NEW JOB needing Hay
      evaluation (`clone_verdict`), which is a recommendation to Compensation.
    impact_if_changed: >-
      Too low and reviewers drown in weak matches; too high and real redundancy is never
      surfaced. This is the number Phase 2.5's archive baseline should be used to
      calibrate — it cannot be judged in the abstract.
    status: open

  - id: HR-093
    question: >-
      At what similarity score do we call two JDs a CLONE (identical role, no
      re-evaluation needed)?
    config:
      file: comparison.yaml
      path: comparison.clone_threshold
    current_default: 0.92
    provenance: prior_calibration
    tier: hr_informed
    why_it_matters: >-
      The most consequential number in this file, because its verdict goes to
      Compensation: "clone" means no Hay re-evaluation. SFU's actual cloning rule
      (Toolkit p10, via sfu-reference.md §4) is an IDENTITY check — identical duties AND
      supervisor AND title AND qualifications — and the earlier build replaced it with a 0.92 cosine
      plus same-title plus same-department. A score can be 0.92 while the duties differ.
      This is an approximation of a rule SFU wrote precisely, and it is ours.
      ⚠ MEASURED ON THIS CORPUS AND FOUND WRONG (Phase 3.3, HANDOFF 2026-07-13). Over
      300 random JDs, EXCLUDING self AND excluding exact-duplicate content (different
      `text_sha256`, so Tier-1's 1,972 byte-identical files cannot inflate this): the
      nearest non-identical neighbour's document cosine is min 0.877 · p10 0.953 ·
      median 0.988 — 98% (250/255) sit AT OR ABOVE 0.92. A 0.92 bar declares almost the
      whole archive a clone of something; document-level cosine barely discriminates at
      all on a corpus where every JD is written in the same register, the same
      template, the same vocabulary. Tier-2 (`dedup.yaml`) does NOT use this value — it
      scores exact shingle Jaccard, never cosine (HR-138) — and its OPTIONAL cosine
      confirm (HR-139, shipped OFF for the identical reason) is a separate, freshly
      measured number, not this one. This threshold must be RE-DERIVED against the real
      vector distribution before Tier-3 (embedding + skill similarity) uses it for
      anything — carrying the earlier 0.92 forward unexamined would have been exactly the
      "faithful port, wrong here" trap (CLAUDE.md, the `render.py` lesson).
    impact_if_changed: >-
      Advisory today (nothing calls it — Tier-2 does not read it, and Tier-3 does not
      exist yet). Before it is EVER shown to a reviewer, or used to gate anything, the
      honest fix may be to stop approximating: check the identity conditions SFU
      actually names, and use the score only to shortlist candidates. At minimum, any
      future caller must re-derive this against the measured nearest-neighbour
      distribution above (median 0.988) rather than trust the inherited the earlier build number —
      0.92 is below the P10 of ordinary non-duplicate neighbours on this corpus, so it
      would not merely mis-calibrate, it would invert: it declares typical dissimilar
      JDs "close" more often than not.
    status: open

  - id: HR-094
    question: >-
      How much DISTINCTIVE skill overlap must two JDs share before they may be merged
      into one cluster?
    config:
      file: comparison.yaml
      path: comparison.min_cluster_skill_overlap
    current_default: 0.3
    provenance: prior_calibration
    tier: technical
    why_it_matters: >-
      The gate that stops JDs merging on generic tone alone: sharing only ubiquitous
      skills (communication, MS Office — low idf) falls below it; sharing distinctive
      skills clears it. Without it, connected-components clustering on embedding-led
      similarity collapses into one giant blob.
    impact_if_changed: >-
      Config only, and NOTHING READS IT YET — the Phase-3 edge builder will. It is
      registered now precisely so it does not arrive as an undeclared default inside
      that PR. It depends entirely on an idf corpus that does not exist yet.
    status: open

  - id: HR-095
    question: >-
      How strong must an edge be to merge two JDs into a redundancy cluster (the floor,
      independent of the noise floor)?
    config:
      file: comparison.yaml
      path: comparison.cluster_threshold_floor
    current_default: 0.8
    provenance: prior_calibration
    tier: technical
    why_it_matters: >-
      A precision call: cluster only on STRONG edges, well above the per-JD "show me
      similar" floor of 0.60, because clustering merges roles and a false merge produces
      a canonical JD that describes two different jobs. Connected components is
      transitive, so one bad edge can chain two clusters together — the threshold is the
      only thing holding that back (with HR-094).
    impact_if_changed: >-
      This is THE lever on how much of the archive gets harmonized. Lower it and clusters
      grow (and over-merge); raise it and the Bank finds no redundancy to consolidate.
      Phase 3 must justify it against the real corpus, not inherit it. ⚠ RETIRED FOR THE
      PHASE-3.5 CLUSTER PATH: the clustering runner calls `build_clusters(threshold=0.0)`
      on edges already gated by tier + `cluster_role_equiv_min` (HR-162), so this floor no
      longer decides which JDs cluster. It remains live for any OTHER `build_clusters`
      caller that relies on the derived `cluster_threshold`.
    status: open

  - id: HR-096
    question: >-
      DERIVED — the effective cluster threshold: max(sim_threshold,
      cluster_threshold_floor). Is a derived-not-duplicated threshold the right shape?
    config:
      file: comparison.yaml
      path: comparison.cluster_threshold
    current_default: 0.8
    provenance: prior_calibration
    tier: technical
    why_it_matters: >-
      the earlier build wrote `CLUSTER_THRESHOLD = max(SIM_THRESHOLD, 0.80)`: the cluster threshold is
      never allowed below the noise floor. Shipping the ANSWER (0.80) as a third YAML key
      would be two knobs holding one value with nothing keeping them in step — the exact
      `max_listed` landmine on the backlog. So it is computed, and this entry pins the
      computed value: raise HR-092 (the noise floor) above 0.80 and the effective cluster
      threshold moves with it, and this register entry breaks the build until HR is told.
    impact_if_changed: >-
      Not directly settable — it changes only when HR-092 or HR-095 changes. It is on the
      register because the number REVIEWERS care about is the effective one, and because
      it is the tripwire proving the two knobs stayed in step. ⚠ RETIRED FOR THE PHASE-3.5
      CLUSTER PATH: that runner passes `threshold=0.0` to `build_clusters` and gates ROLE
      edges upstream via `cluster_role_equiv_min` (HR-162), so this derived value no longer
      gates clustering. It survives only for any other caller that omits an explicit
      threshold.
    status: open

  - id: HR-097
    question: Is a pair of near-duplicate JDs already a "cluster", or does it take three?
    config:
      file: comparison.yaml
      path: comparison.min_cluster_size
    current_default: 2
    provenance: prior_calibration
    tier: hr_informed
    why_it_matters: >-
      A singleton has nothing to be redundant WITH, so it is not a cluster — that much is
      definitional. Whether a mere PAIR is worth harmonizing into a canonical JD is not:
      it is an HR judgement about where the Bank's effort goes, and the earlier build settled it with
      an inline `>= 2`.
    impact_if_changed: >-
      Config only. Raising it to 3 hides every two-JD redundancy from the Bank — which may
      be most of the archive's real duplication (two departments with the same
      Coordinator role).
    status: open

  - id: HR-098
    question: >-
      How much can a posting's skill set diverge from its canonical role before the drift
      is called MINOR?
    config:
      file: comparison.yaml
      path: comparison.drift_minor_at
    current_default: 0.25
    provenance: prior_calibration
    tier: hr_informed
    why_it_matters: >-
      A Jaccard distance of 0.25 — one skill added to a set of three. The earlier build tuned this
      conservatively (prefer calling a borderline case "minor" over crying "major"). SFU's
      rulebook has no skill-churn metric at all: it says a JD should be reviewed annually
      and that "major revisions can trigger re-evaluation" (l.22), and quantifies nothing.
    impact_if_changed: >-
      Config only; drift is ADVISORY and blocks nothing (it flags a posting worth a second
      look at review time). Nothing reads it yet — a JD Bank JD has no skill set.
    status: open

  - id: HR-099
    question: >-
      And at what divergence is a posting's drift MAJOR — i.e. worth a re-evaluation
      conversation?
    config:
      file: comparison.yaml
      path: comparison.drift_major_at
    current_default: 0.5
    provenance: prior_calibration
    tier: hr_informed
    why_it_matters: >-
      Half the skill set changed. It is the number that decides which postings appear on
      a reviewer's "these have drifted" list, so it sets the review workload. The loader
      enforces minor < major.
    impact_if_changed: >-
      Config only; advisory. Same caveat as HR-098 — this is a metric SFU never published.
    status: open

  - id: HR-100
    question: >-
      How many years may a posting's experience bar move from its canonical role's before
      it counts as a change to the technical knowledge required?
    config:
      file: comparison.yaml
      path: comparison.material_years_delta
    current_default: 2
    provenance: prior_calibration
    tier: hr_informed
    why_it_matters: >-
      SFU's re-evaluation criteria (as the earlier build recorded them from Toolkit p26 — NOT in the
      rulebook this repo ships) make "qualifications that change the technical knowledge
      required" a major trigger in its own right, whatever the skills did. The earlier build keyed that
      on two signals and QUANTIFIED one of them itself: a >= 2-year move. SFU does not
      quantify it anywhere. The 2 is ours.
    impact_if_changed: >-
      Config only; advisory. An escalation fires only when BOTH sides state a number, so a
      missing requirement never manufactures drift.
    status: open

  - id: HR-101
    question: >-
      Is a change of MORE THAN 5 direct reports a material change of supervisory scope?
    config:
      file: comparison.yaml
      path: comparison.material_reports_delta
    current_default: 5
    provenance: prior_calibration
    tier: hr_informed
    why_it_matters: >-
      This is the entry most likely to be mistaken for an SFU standard, so: The earlier build cited it
      to "SFU's explicit supervisory-scope threshold (Toolkit p23-24)", and the rulebook
      in this repo contains NO such rule — no re-evaluation criteria at all. The only
      direct-reports number in it is Part 2G's drafting advice to state an "approximate
      range only (e.g. up to 10 direct reports)". The threshold may well be SFU's; we
      cannot show it from what we hold, so it is registered as inherited calibration and
      NOT as a rulebook transcription (the HR-029 / HR-059 rule).
    impact_if_changed: >-
      Config only; advisory. If SFU confirms the Toolkit rule, this entry becomes
      `ratified` with a source — that is the win condition, and it needs the Toolkit PDF,
      not a code change.
    status: open

  - id: HR-102
    question: >-
      How is a years-of-experience requirement read out of free text — is "3+ years" a 3?
    config:
      file: comparison.yaml
      path: comparison.experience_years_pattern
    current_default: '(\d{1,2})\s*\+?\s*year'
    provenance: prior_calibration
    tier: technical
    why_it_matters: >-
      The regex takes the FIRST year-count it finds, so "3 to 5 years" reads as 3 (the
      minimum — defensible) and "5 years in a role requiring 2 years of supervision" reads
      as 5 (the first, not the relevant one). It is capped at two digits. This is the
      DIGIT primitive only: SFU's JDFN template spells years out ("five years"), and those
      are handled by the sibling `experience_word_numbers` (HR-152, added Phase 3.4a),
      which the reader searches in parallel and merges by first-position. This is a
      heuristic feeding HR-100's escalation, and it is data so that fixing it is a config
      change, not a code change.
    impact_if_changed: >-
      Config only; advisory. Text that names no number yields no signal and never
      escalates.
    status: open

  - id: HR-103
    question: >-
      How is a direct-reports count read out of a free-text supervisory statement?
    config:
      file: comparison.yaml
      path: comparison.supervisory_reports_pattern
    current_default: \b(\d{1,3})\b
    provenance: prior_calibration
    tier: technical
    why_it_matters: >-
      The first small integer ANYWHERE in the supervisory statement. "Supervises 4
      coordinators" -> 4; "manages a team of 8" -> 8; "supervises 2 FTE across 3
      campuses" -> 2 (right, by luck); "supervises staff in 3 buildings" -> 3 (wrong).
      the earlier build documented it as a heuristic and so do we. It feeds HR-101's escalation, which
      is the drift signal that maps most directly to an SFU re-evaluation trigger — so its
      false positives matter.
    impact_if_changed: >-
      Config only; advisory. A qualitative statement ("supervises the comms team") names no
      number and never escalates, which is the conservative half of the design.
    status: open

  # ═══ SFU'S MANDATED BOILERPLATE, AND WHAT WE MAY NOT MARK DOWN ══════════════
  # The four entries below are HR-058's fix. Three of them are SFU's own text; the
  # fourth — the one HR must actually look at — is OURS: the decision that a scanner
  # may not penalise text SFU forbids the author to edit.

  - id: HR-104
    question: >-
      Is this SFU's current "About SFU" paragraph, word for word — the pre-populated
      block the template says not to edit?
    config:
      file: boilerplate.yaml
      path: boilerplate.about_sfu
    current_default:
      - >-
        We are Canada's engaged university, defined by our dynamic integration of
        innovative education, cutting-edge research, and far-reaching community
        engagement.
      - We are unconventional, fearless, compassionate, approachable and ready.
      - We celebrate the diversity of people, ideas and cultures.
    provenance: sfu_rulebook
    tier: hr_policy
    source_part: Part 1.5
    why_it_matters: >-
      This text is now load-bearing, not decoration: the coded-term scan (Part 6)
      SKIPS it (HR-107), because SFU's own second sentence contains "compassionate",
      which our lexicon files at `medium` (HR-058). Get the wording wrong and the
      exemption silently stops applying — the JD is docked 10 points again and nothing
      fails. Two things HR should know. (a) OUR COPY MAY BE STALE: it is transcribed
      from our copy of the rulebook, not from SFU's live source. (b) THE ARCHIVE
      DISAGREES WITH THE RULEBOOK: SFU's own new-template JDs carry only the first TWO
      sentences — the third ("We celebrate the diversity...") is absent from the
      template we have. That is precisely why the block is a LIST of passages and each
      is matched on its own: a whole-paragraph match would have failed on the real
      archive and left the false positive in place.
    impact_if_changed: >-
      Config only. Correcting a word restores the exemption for JDs carrying the
      corrected text and withdraws it from JDs carrying the old text — so if SFU has
      revised this paragraph, BOTH wordings belong in this list until the archive is
      re-issued. Adding a passage that is not SFU's would hand every JD quoting it a
      free pass from the coded-term scan, which is the only real abuse route here.
    status: open

  - id: HR-105
    question: >-
      Is this SFU's current official territorial acknowledgement — including the
      spelling of every Nation's name?
    config:
      file: boilerplate.yaml
      path: boilerplate.territorial_acknowledgement
    current_default:
      - >-
        Simon Fraser University respectfully acknowledges the xwmethkweyem
        (Musqueam), Skwxwu7mesh Uxwumixw (Squamish), selilwetal (Tsleil-Waututh),
        q'ic'ey' (Katzie), kwikwetl'em (Kwikwetlem), Qayqayt, Kwantlen, Semiahmoo
        and Tsawwassen peoples on whose unceded traditional territories our three
        campuses reside.
    provenance: sfu_rulebook
    tier: hr_policy
    source_part: Part 1.6
    why_it_matters: >-
      CLAUDE.md's standing open flag, and HR-039's missing half. HR-039 records that
      the system "only checks presence, never text — there is no configured canonical
      wording anywhere in the rulebook data, and deciding the wording implies ADDING a
      config key to hold it." THIS IS THAT KEY — but adding it VERIFIES NOTHING. Three
      wordings are now known to exist and no two agree: our rulebook copy (above, an
      ASCII transliteration that is almost certainly NOT SFU's current orthography for
      the Nations' names), the archive template (English names only), and whatever SFU
      publishes today. Getting an Indigenous Nation's name wrong is not a typo. NOTE:
      nothing today reads this text as an acknowledgement CHECK — SFU-COMP-TERRITORIAL
      still only checks presence — so this key does not yet enforce a wording on
      anyone. It exists because the acknowledgement is mandated boilerplate and
      therefore, like About SFU, exempt from the coded-term scan (HR-107); it happens
      to contain no coded term today, so the exemption is currently a no-op that
      guards against a future lexicon addition.
    impact_if_changed: >-
      Must be verified against SFU's official text before ANY external distribution
      (Phase 6 sign-off; blocks publish, not development). Deciding to ENFORCE the
      wording — i.e. having SFU-COMP-TERRITORIAL compare text rather than detect
      presence — is a separate decision (HR-039) and would be a validator change, not
      a config edit.
    status: open

  - id: HR-106
    question: >-
      Is this SFU's current Employment Equity statement, word for word?
    config:
      file: boilerplate.yaml
      path: boilerplate.employment_equity
    current_default:
      - Simon Fraser University is committed to the principle of Employment Equity.
    provenance: sfu_rulebook
    tier: hr_policy
    source_part: Part 1.6
    why_it_matters: >-
      The second of the two statements Part 1.6 says MUST appear on every SFU JD. Same
      shape as HR-105: transcribed from our copy of the rulebook, unverified against
      SFU's live source, and held here because mandated boilerplate is exempt from the
      coded-term scan (HR-107). It contains no coded term today, so the exemption is a
      no-op for it — it is registered so that it cannot QUIETLY become one.
    impact_if_changed: >-
      Config only. Presence is still what SFU-COMP-EDI checks (and that gate DOES block
      approval — HR-004); this key does not change that.
    status: open

  - id: HR-107
    question: >-
      Should our scanners mark down text that SFU wrote, pre-populated, and forbids
      the JD author to edit?
    config:
      file: boilerplate.yaml
      path: boilerplate.coded_term_scan_exempt
    current_default:
      - about_sfu
      - territorial_acknowledgement
      - employment_equity
    provenance: our_invention
    tier: hr_policy
    why_it_matters: >-
      WE SAY NO, AND THIS IS US SAYING IT — not SFU. It is the fix for HR-058, and the
      only entry in this group that is a judgement rather than a transcription. Before
      it, a JD that obeyed SFU scored 91.5/A without the About-SFU paragraph and
      81.5/B with it — because SFU's own sentence says "compassionate", which our
      lexicon (HR-028/HR-029) files at `medium`. Removing the paragraph to dodge that
      tripped SFU-COMP-ABOUT instead. The JD could not win, on nearly every compliant
      JD in the archive, systematically depressing the very baseline the score floor
      (HR-001) is to be ratified against. So the Part-6 scan no longer looks inside the
      blocks named here. SCOPE, precisely: the exemption is granted to SFU's TEXT,
      never to a section — only a verbatim mandated passage (whitespace / case /
      smart-quote insensitive, nothing else) is skipped, so coded language cannot be
      smuggled past the scan by putting it under an "About SFU" heading, by quoting a
      fragment, or by splicing words into a mandated sentence. Every other scan
      (placeholders, banned qualification phrases, duty percentages, and the PRESENCE
      gates SFU-COMP-ABOUT / -TERRITORIAL / -EDI) still reads the whole document.
    impact_if_changed: >-
      Empty this list and HR-058 returns in full: every compliant JD in the archive is
      docked 10 points and a grade for SFU's own word. Alternatives HR may prefer
      instead of (or as well as) this: drop "compassionate" from the lexicon entirely —
      it is one of the nine terms SFU never published (HR-029) — or demote it to `low`.
      Those are lexicon decisions and are separately open. Note the exemption is
      currently doing work ONLY for `about_sfu`; the other two blocks carry no coded
      term today and are listed so that the same class of defect cannot reappear the
      day a term is added to the lexicon.
    status: open

  # ═══ HOW THE SCANNERS READ A JD'S TEXT ══════════════════════════════════════

  - id: HR-108
    question: >-
      When a document's formatting splits a phrase in two, may a scanner still read it
      as one phrase — and if so, may it read ACROSS a paragraph break?
    config:
      file: textnorm.yaml
      path: textnorm.collapse_across_paragraph_break
    current_default: false
    provenance: our_invention
    tier: technical
    why_it_matters: >-
      SFU's rulebook was written for people reading Word documents; our scanners read an
      `antiword` dump. `antiword` HARD-WRAPS the legacy `.doc` corpus, so a JD that
      plainly says "…or an equivalent combination of education, training and
      experience…" reaches the scanner as "equivalent\n      combination" — and was
      reported as MISSING the equivalency path. MEASURED on the real archive (a random
      400-document `.doc` sample, extracted through our own ingest): SFU-QUAL-EQUIVALENT
      fired 74 times, and 39 of those are this artefact — 9.75% of legacy JDs marked
      down for text they plainly contain. Exactly the HR-058 defect in a new place:
      penalising a JD for how a converter wrapped it. So a whitespace RUN collapses to
      one space and the wrongly-missing text is found (the same sample also GAINS 3
      findings the wrap was hiding — 1 leftover "start with an action verb…" template
      instruction, 2 real "may include" phrases — all three verified genuine). THE
      DECISION IS HOW FAR THE COLLAPSE GOES. Collapse across a PARAGRAPH break too and
      normalization starts INVENTING findings out of two unrelated paragraphs. All
      three of these are real, and none fire under the shipped default: "Decides what"
      + "By whom is set elsewhere." becomes the placeholder marker "what by", which
      feeds the NON-OVERRIDABLE no-placeholders gate (HR-047) — a permanently
      un-approvable JD, no waiver, manufactured by a text transform; "Duties may" +
      "Include other tasks." becomes the banned phrase "may include" (medium, -10); and
      "Coordinates on" + "call centre staffing." becomes a working-condition marker. We
      ship `false`: collapse a wrap, treat a blank line as a boundary a term cannot
      cross.
    impact_if_changed: >-
      Set it `true` and a term may match across a paragraph break: a phrase an
      extraction split across paragraphs is caught, at the price of the three invented
      findings above (one of them non-overridable). What it does NOT cost today: on the
      same 400-`.doc` / 599-`.docx` archive samples, `true` and `false` produce
      BYTE-IDENTICAL findings — no archive document currently has a term straddling a
      paragraph break. So the boundary costs nothing of the antiword win and is pure
      insurance against the invented-finding class. That result is NOT vacuous: the
      boundary is actually exercised on 100% of the `.doc` corpus (498/498 carry blank
      lines) and on 47% of `.docx` (373/799) — it engages, and still changes nothing.
      ⚠ SEPARATELY, A PARTIAL GAP AND NOT A DECISION: a paragraph break is detected as
      a BLANK LINE. `ingest/extract.py` joins `.docx` paragraphs with a single "\n" and
      drops empty ones — but `if p.text` only drops the TRULY empty ones, so a
      whitespace-only paragraph (" ") survives and yields "\n \n", which IS a boundary.
      Measured on 799 archive `.docx`: 101 carry a literal blank line, 329 a
      whitespace-only paragraph, and 373 (47%) do get a paragraph boundary. The gap is
      the OTHER ~53%, whose adjacent paragraphs are separated by a single "\n" and are
      therefore still joined for matching. It protects the legacy `.doc` corpus in full,
      which is where the wrapping problem actually lives. Closing the `.docx` half means
      changing the extractor's paragraph separator, which rewrites stored raw text the
      segmenter reads: a separate change, on the backlog. Note finally what is NOT here. Dropping
      zero-width characters, soft hyphens and BOMs, and folding smart quotes and
      ligatures to ASCII, are MECHANICAL text facts, not decisions — there is no
      defensible rulebook in which "comp<zero-width-space>assionate" escapes a scan for
      "compassionate" — so they live in code and are not configurable. They also move
      almost nothing on today's archive: 600 sampled `.docx` carry ZERO such characters.
      This entry is the part of the fold that actually changes findings.
    status: open

  # ═══════════════════════════════════════════════════════════════════════════
  # PHASE 2.5 — THE ARCHIVE BASELINE'S SEGMENTATION (segmentation.yaml)
  #
  # These ten do not change what the validator computes about ANY JD. They decide
  # something arguably more consequential: **which population the approval bar is
  # ratified against.** 2.5 is the trial of a bar that is entirely `our_invention`
  # (the score floor of 60, the grade floor of C, the severity floor, the 14-rule
  # blocking set, the 2 non-overridable gates — none ratified by SFU), and the number
  # that trial produces depends on which files are counted.
  #
  # It matters because the archive fails by ERA, not by quality: SFU-COMP-TERRITORIAL /
  # -ABOUT / -EDI fire on nearly every pre-2019 JD because those sections DID NOT EXIST
  # in the template those JDs were authored under — and SFU-APPROVE-EDI-FOOTER *blocks*.
  # Measured on the first 1,500 files (all old-era): SFU-COMP-EDI and -TERRITORIAL fire
  # on 1,494 of 1,494, and the approval rate is 0.0%. On a 40-file spread across the
  # whole archive, the same rules give a median of 37.5 for `old` and 68.3 for `new`.
  # A blended, whole-corpus number would report the archive as catastrophically
  # non-compliant when much of it is simply OLD. So the segmentation IS the finding, and
  # every knob that draws its boundaries is a decision SFU HR must make.
  #
  # They are configured OUTSIDE the rulebook on purpose (see loader.ConfigRoot):
  # `rules_version` means "the rules that produced this report", and folding a
  # non-scoring knob into its digest would make every stamped report look stale on a
  # change that cannot move a single score.
  # ═══════════════════════════════════════════════════════════════════════════

  - id: HR-109
    question: >-
      What marks a JD as having been authored under SFU's CURRENT template — and should
      that mark override the JD's date?
    config:
      file: segmentation.yaml
      path: segmentation.era_template_token
    current_default: JDFN
    provenance: our_invention
    tier: hr_informed
    why_it_matters: >-
      This is the most consequential line in the file, because era is what the archive
      actually fails on. The Phase-0 census (§4b) found body headings unusable as an era
      signal across the whole 2008-2021 middle band and concluded that era "is most
      reliably inferred from the JDFN filename token, not body headings" — so we read the
      token. `JDFN` is SFU's own job-description form marker; it appears in 4,637 of the
      14,565 files (re-measured against the archive; the census says 4,637 too).
      ⚠ THE PART AN HR REVIEWER MUST ACTUALLY RULE ON: the token OVERRIDES the date band,
      IN BOTH DIRECTIONS. A file carrying `JDFN` is classified `new` however old its
      date. MEASURED CONSEQUENCE: 50 real files carry `JDFN` with a pre-2019 date (1 in
      2010, 1 in 2012, 1 in 2015, 2 in 2016, 20 in 2017, 25 in 2018) and are therefore
      judged `new` — i.e. held to the CURRENT approval bar — despite predating the band
      that otherwise defines it. We ship the override because a JD written on the current
      form should be judged against the current form, whatever year it was filed. It is a
      judgement, not a fact, and it is why this entry exists.
    impact_if_changed: >-
      Retire the token (or empty it) and era collapses to the date bands alone: those 50
      files fall back to `old`/`transition`, and — far more importantly — the `new`
      segment stops meaning "authored under the current template" and starts meaning only
      "filed after 2018", which re-imports every mis-dated re-save into the population the
      bar is being ratified against. Change the token string and it matches nothing: every
      file falls to its date band and the override silently stops existing. Nothing about
      any JD's SCORE moves either way — only which files' scores are averaged together.
      ⚠⚠ THE ARCHIVE BASELINE DISPROVED THE MODEL THIS ENTRY ASSUMES. We assumed SFU made
      ONE transition. IT MADE TWO, FOUR YEARS APART:
      (1) the JDFN TEMPLATE rolled out in 2019 (1 file in 2010 … 332 in 2019, 1,131 in
      2020); and
      (2) the TERRITORIAL ACKNOWLEDGEMENT / EDI FOOTER became standard practice only in
      2023-2024. MEASURED presence by year across all 6,259 `new`-era JDs — 2019 0.2% ·
      2020 0.8% · 2021 1.4% · 2022 1.0% · 2023 10.0% · 2024 63.1% · 2025 84.9% ·
      2026 88.6%. It is a rollout STILL IN PROGRESS, not a settled standard.
      `new` captures transition (1), and is then judged by SFU-APPROVE-EDI-FOOTER — a
      BLOCKING gate that only transition (2) satisfies. So a 2019 JDFN document, authored
      CORRECTLY under the template of its day, is un-approvable for lacking a paragraph
      that did not yet exist. THE COST, MEASURED: `new`-era approval is 10.0%;
      current-practice approval is 71.9%. Same rulebook, same bar, two populations —
      A SEVENFOLD GAP, and every point of it is a date, not a quality difference. The gate
      itself is NOT wrong: a raw-text scan of all 6,259 new-era JDs puts
      SFU-COMP-TERRITORIAL's false-positive rate at ~0.2% (10 files). The archive
      genuinely does not have the paragraph yet.
      ✅ PHASE 2.6 TOOK OPTION (a): A FOURTH BAND, `current`, FROM 2024 (HR-122) — the
      year footer adoption crosses 50% (11% in 2023 -> 63% in 2024). The model, not the
      token, was what the baseline disproved, so the model is what changed.
      WHAT THIS ENTRY STILL DECIDES, AND IT IS UNCHANGED: the token is still `JDFN` and it
      still overrides a pre-2019 date for those 50 files. One thing about it DID change,
      and it is the reason a naive fourth band would not have worked: the token used to
      win OUTRIGHT, in both directions. Every JD SFU writes today carries `JDFN`, so a
      token that wins outright would have pulled every 2024+ file straight back into
      `new` and collapsed the new band on the day it was added. The token now PROMOTES an
      old file up the ladder and never demotes a current one down it.
      ✅ MEASURED, full-archive re-run: `old` 3,339 and `transition` 4,964 are UNCHANGED
      (re-banding the top of the ladder cannot move a file across the bottom of it), and
      the old 6,262-file `new` era splits into **`new` 5,228 (2019-2023)** and **`current`
      1,034 (2024+)**. Approval: `new` **1.0%**, `current` **61.2%** — against the 10.0%
      that the merged band used to report. The merged number was an average of two
      populations that share a template and nothing else.
      OPTION (b) IS STILL LIVE AND IS STILL HR'S: define the era by the FOOTER'S PRESENCE
      rather than by a date. It is the truer signal — it is how the 874-JD current-practice
      cohort in HR-001 is defined, and a date band provably cannot reproduce that cohort
      (see HR-122) — but it makes era depend on document CONTENT, so `file_facets` would
      stop being a pure, never-raising function of a filename. That is an architectural
      change, not a knob, and we have not taken it.

  - id: HR-110
    question: Where does the OLD template era end?
    config:
      file: segmentation.yaml
      path: segmentation.era_old_max_year
    current_default: 2009
    provenance: our_invention
    tier: hr_informed
    why_it_matters: >-
      The census (§4a) puts the OLD band at 1967-2009 — paper-derived, `.doc`-dominated,
      lettered section headings, an incumbent NAME field. Re-measured on the leading
      YYYYMMDD filename prefix (present on all 14,565 files): 3,339 files fall at or below
      2009. These JDs predate the About-SFU paragraph, the territorial acknowledgement and
      the Employment Equity statement entirely, so three completeness rules and a BLOCKING
      gate fire on essentially all of them. Reporting that as "non-compliance" would be
      reporting that they are old.
    impact_if_changed: >-
      Moves the OLD/TRANSITION boundary. Every file in the years that change sides moves
      segment, so both segments' score distributions and approval rates move — with no
      change to any JD's score. The bands must stay ordered (`era_old_max_year` below
      `era_transition_max_year`) or the config refuses to load, because a `transition`
      segment nothing can land in is a segment that silently reports nothing.
      ⚠ THE BASELINE SHOWED THE THREE-BAND MODEL IS THE WRONG SHAPE (see HR-109 for the
      evidence): SFU made TWO transitions, four years apart — the template in 2019 and the
      territorial/EDI footer in 2023-2024 — and this ladder only has a rung for the first.
      The OLD/TRANSITION boundary itself is not what is wrong (nothing in the baseline
      contradicts 2009), but the ladder it sits on is incomplete, so ratifying this band
      in isolation would ratify a model the data does not support. Read HR-109, HR-110 and
      HR-111 together, or not at all.
      ✅ PHASE 2.6 GAVE THE LADDER ITS MISSING RUNG (HR-122: `current`, from 2024). THIS
      BOUNDARY IS UNCHANGED at 2009 — the baseline never contradicted it — but it can now
      be ratified as part of a model the data actually supports, which is the whole reason
      it was held back. MEASURED, and the number that matters for THIS band is that it
      did not move: re-banding the top of the ladder cannot move a file across the bottom
      of it. `old` is 3,339 files before and after.

  - id: HR-111
    question: Where does the TRANSITION era end and the CURRENT template era begin?
    config:
      file: segmentation.yaml
      path: segmentation.era_transition_max_year
    current_default: 2018
    provenance: our_invention
    tier: hr_informed
    why_it_matters: >-
      The bar is FOR the current-template population, so this line decides who the bar is
      actually being tried on. The census (§4a) puts TRANSITION at 2010-2018 and NEW at
      2019+, and the JDFN rollout confirms the cliff: 25 JDFN files in 2018, then 332 in
      2019 and 1,131 in 2020. Re-measured on the leading date prefix: 5,014 files in
      2010-2018 and 6,212 from 2019. Anything above this year is `new` — there is
      deliberately no upper bound, so a file dated 2030 cannot fall off the end of the
      ladder into no segment at all.
    impact_if_changed: >-
      Directly changes the population the approval bar is ratified against, which is the
      whole point of Phase 2.5. Lower it and pre-current-template JDs are judged by the
      current bar; raise it and genuinely current JDs are excused from it. Note the JDFN
      token (HR-109) already overrides this for 50 files, so the two entries interact and
      should be read together.
      ⚠⚠ AND THE BASELINE SHOWED THIS BOUNDARY IS IN THE WRONG PLACE FOR THE JOB IT IS
      DOING. `new` (2019+) is meant to be "the population the bar is FOR". It is not.
      MEASURED: `new`-era approval is 10.0%, while approval among JDs that actually carry
      SFU's mandated acknowledgement is 71.9% — a SEVENFOLD gap produced entirely by
      SFU-APPROVE-EDI-FOOTER blocking 86.2% of the `new` era, because the acknowledgement
      only became standard practice in 2023-2024 (year-by-year adoption in HR-109). Judged
      by this boundary, the archive looks catastrophically non-compliant. Judged by the
      population the bar is really for, it PASSES — 99.4% clear the score floor, median
      77.3, zero F grades (HR-001).
      ✅ PHASE 2.6 FIXED THE LADDER, NOT THIS BOUNDARY. The 2018 default is UNCHANGED, and
      that is deliberate: 2018/2019 is where the JDFN TEMPLATE rollout really happened (25
      JDFN files in 2018, 332 in 2019, 1,131 in 2020), and nothing in the baseline
      contradicts it. What was wrong was that `new` had no CEILING — so it was made to
      carry a second rollout it knows nothing about. It now ends in 2023, and `current`
      (2024+) carries the footer era (HR-122). `new` therefore means what this entry
      always claimed it meant: "authored under the JDFN template, before the
      acknowledgement became standard practice".
      ✅ MEASURED after the 2.6 re-banding: `new` is now **5,225 scored files (2019-2023)**
      with **1.0% approval** and a median of 68.3, while `current` (2024+, 1,034 files) runs
      at **61.2%**. THE 1.0% IS NOT A QUALITY VERDICT AND MUST NOT BE READ AS ONE: 5,146 of
      those 5,171 blocks are SFU-APPROVE-EDI-FOOTER, i.e. the paragraph that did not exist
      yet. It is the cleanest statement of the whole finding — hold the template era to the
      footer era's bar and essentially nothing passes, at a median score of 68.
      Read with HR-109 and HR-122. Moving THIS year still moves who is judged by the
      current-template bar at all, and it remains `open`.

  - id: HR-112
    question: >-
      A JDFN filename carries TWO dates. Which one says "this is the current version of
      this position"?
    config:
      file: segmentation.yaml
      path: segmentation.prefer_revision_date_for_version
    current_default: true
    provenance: our_invention
    tier: technical
    why_it_matters: >-
      The archive is a revision history, not a set of current JDs: the census (§7b) counts
      ~8,160 files that are a non-first version of an already-seen position. The
      `latest_per_position` population exists to recover the CURRENT JD for each position,
      and "latest" needs a date. A JDFN filename gives two — the leading (original /
      effective) YYYYMMDD and the trailing `JDFN_<GROUP>_<YYYYMMDD>` revision date. We
      take the revision date when there is one. MEASURED: 4,494 real files carry a revision
      token, and on 2,857 of them the revision date DIFFERS from the leading date — so this
      is not a formality, it re-picks the current JD for thousands of positions. (Measured
      on the first 1,500 files, this population shifts the median score from 25.3 to 27.8:
      superseded drafts really are worse than the JDs that replaced them.)
    impact_if_changed: >-
      Set it `false` and versions are ordered by the leading date alone — for a position
      whose JD was created in 2018 and revised in 2024, the 2018 file can win, and the
      baseline reports a superseded draft as the position's current JD. The 143 JDFN files
      with no revision token, and the 9,928 non-JDFN files, are unaffected either way (they
      have only one date to use).

  - id: HR-113
    question: >-
      Are files with no readable position ID part of the "current JD" population, or
      excluded from it?
    config:
      file: segmentation.yaml
      path: segmentation.keep_files_without_position_id
    current_default: true
    provenance: our_invention
    tier: hr_informed
    why_it_matters: >-
      ~7% of the archive (993 of 14,565 files by our own pattern — see HR-114) carries no
      zero-padded position ID at all, so it cannot be de-versioned: there is no position to
      be the latest version OF. We keep them, each as its own position. The alternative is
      to drop them — which would silently shrink the decision-relevant population by about
      a thousand JDs, and would do so NON-RANDOMLY (un-IDed files skew old and skew toward
      the irregular filenames the census flags), quietly biasing the very number the
      approval bar is about to be judged against.
    impact_if_changed: >-
      Set it `false` and the `latest_per_position` population loses ~993 files. Every
      distribution, grade count and approval rate reported for that population moves, and
      the files it loses are not a random sample of the archive. No JD's score changes.

  - id: HR-114
    question: What counts as a position ID in a filename?
    config:
      file: segmentation.yaml
      path: segmentation.position_id_pattern
    current_default: '(?<![0-9])(0[0-9]{7})(?![0-9])'
    provenance: our_invention
    tier: technical
    why_it_matters: >-
      The position ID is what turns 14,565 FILES into POSITIONS, and therefore what the
      entire `latest_per_position` population rests on. We claim only the ZERO-PADDED
      8-digit PeopleSoft number. The zero-padding is what makes it safe: a date (YYYYMMDD)
      and a JDFN revision date both begin `19` or `20`, so a leading `0` cannot collide
      with either. Older UNPADDED IDs (e.g. `43353` in `20060411_43353Technician.doc`) are
      deliberately NOT claimed: a 5-digit matcher would also claim years, grades and
      percentages, and a wrong position ID silently MERGES two unrelated positions into
      one revision chain — which would delete a real JD from the current-JD population.
      MEASURED, by running THIS pattern over all 14,565 real filenames: 13,572 files carry
      an ID and 993 carry none. ⚠ THE NUMBER OF DISTINCT POSITIONS IS NOT ONE NUMBER — it
      depends on how a BUNDLED filename is counted (HR-116): 5,327 distinct positions
      under the shipped `first` grouping, 5,541 counting every ID in every name. THE
      CENSUS (§7b) REPORTED 5,436, WHICH IS NEITHER — a ~2% divergence from the shipped
      figure. It is recorded here, unresolved, rather than explained away: the census's
      own method is not reproducible from its write-up, and an earlier draft of this entry
      "reconciled" the gap to ~0.2% against a distinct-ID count (5,428) that was an
      artefact of the measuring command and not a property of this pattern at all. Do not
      let a number into this register that nobody has re-measured.
    impact_if_changed: >-
      Loosen it to catch the unpadded legacy IDs and more files gain a position — at the
      risk of false IDs that merge unrelated positions and drop real current JDs from the
      population. Tighten it and more files fall to HR-113's "no position ID" bucket. Both
      change the size and membership of `latest_per_position`; neither changes any score.

  - id: HR-115
    question: How is a file's date read out of its name?
    config:
      file: segmentation.yaml
      path: segmentation.file_date_pattern
    current_default: '^((?:19|20)\d{2})(\d{2})(\d{2})'
    provenance: our_invention
    tier: technical
    why_it_matters: >-
      Era (HR-110 / HR-111) is a function of this date, so a JD whose date cannot be read
      cannot be placed in an era band. The archive's naming convention (census §3) is
      `YYYYMMDD_<positionID>_<role-slug>`, and MEASURED, the leading prefix is present on
      all 14,565 files — so today nothing falls to the `unknown` era. An unparseable or
      impossible date (`20211301` is not a month) yields no date and an `unknown` era
      rather than a guess or a crash: the file is still counted, in a segment that says
      plainly that we could not classify it.
    impact_if_changed: >-
      A pattern that fails to match sends files to the `unknown` era, where they are
      counted but excluded from every era comparison — the baseline would quietly narrow
      without appearing to lose anything. A pattern that matches the WRONG digits (e.g. a
      trailing revision date) would silently re-band files across eras.

  - id: HR-116
    question: >-
      A filename can bundle SEVERAL positions into one document. Which position does that
      document belong to?
    config:
      file: segmentation.yaml
      path: segmentation.position_id_grouping
    current_default: first
    provenance: our_invention
    tier: technical
    why_it_matters: >-
      Real filenames bundle positions —
      `20220201_00114560,_00114369,_00132130_JDFN_APSA_20220201.docx` is one document
      describing three. We ship `first`: the file is attributed to the first ID in its
      name. ⚠ THE LIMITATION IS THE CENSUS'S OWN, AND IT IS REAL (§7b): grouping by the
      first ID OVER-counts the first position's revision history and UNDER-counts the
      others, which lose a version they genuinely have — so a bundled position can be
      represented in `latest_per_position` by an older standalone JD than the bundle that
      actually supersedes it. `first` ships because it reproduces the census's method, and
      the census is the number every other claim in this phase is cross-checked against.
      The alternative (`all` — the file belongs to every ID it names, and survives if it is
      the current version for any of them) is IMPLEMENTED, not hypothetical: this is a
      `Literal`, not a free string, so a data-only switch to a strategy nobody wrote fails
      loudly instead of silently doing nothing. Every ID in a bundle is recorded on the row
      (`position_ids`) whichever way this is set, so no evidence is lost.
    impact_if_changed: >-
      Set it to `all` and each bundled document counts as the current JD of every position
      it names: the under-count is removed, `latest_per_position` grows, and positions that
      are only described by a bundle stop being represented by a stale standalone file. It
      is the more defensible reading of what a bundle IS; it is not the census's, which is
      the only reason it is not the default. No JD's score changes either way.

  - id: HR-117
    question: How is a JD's REVISION date read out of its name?
    config:
      file: segmentation.yaml
      path: segmentation.revision_date_pattern
    current_default: 'JDFN_[A-Z]+_((?:19|20)\d{2})(\d{2})(\d{2})'
    provenance: our_invention
    tier: technical
    why_it_matters: >-
      This is the date HR-112 chooses to trust, so the two stand or fall together: if this
      pattern stops matching, `prefer_revision_date_for_version` silently has nothing to
      prefer and every file falls back to its leading date, with no error and no visible
      change. MEASURED: it matches 4,494 of the 4,637 JDFN files (143 carry no revision
      token), and on 2,857 of those the revision date differs from the leading date.
    impact_if_changed: >-
      Re-picks which file is the current version for thousands of positions, or — if it
      matches nothing — quietly disables HR-112 altogether. That silent-disable is the
      failure mode worth watching: the baseline would still run, still stamp itself, and
      still report a number, computed over a different population than the register says.

  - id: HR-118
    question: How is the employee group (APSA / APEX / CUPE / POLY) read out of a name?
    config:
      file: segmentation.yaml
      path: segmentation.employee_group_pattern
    current_default: 'JDFN_([A-Z]+)'
    provenance: our_invention
    tier: technical
    why_it_matters: >-
      The employee group is recorded on every row so the baseline can be read by bargaining
      unit — which matters because the CUPE template line genuinely differs from APSA/APEX
      and, per the census (§4b caveat), does NOT always carry the territorial-acknowledgement
      footer. Three of twenty modern `.docx` sampled were CUPE and legitimately lacked it. A
      CUPE JD therefore trips SFU-COMP-TERRITORIAL for following ITS OWN template, and
      without this field that would be invisible in the aggregate — it would just look like
      CUPE JDs are worse. MEASURED over all 14,565 filenames, this pattern yields 12 distinct
      values across 4,536 files: APSA 3,351 / CUPE 771 / APEX 329 / POLY 49 — the four real
      bargaining units — plus 36 files whose group token is TYPO'D OR TRUNCATED IN THE SOURCE
      FILENAME (ASPA 26, ASAP 2, D 2, B 2, S 1, CUPS 1, ASPSA 1, APA 1). Those 36 are
      reported exactly as found. The baseline does not silently repair the archive's own
      data: `ASPA` is a real transposition in a real filename, and a matcher that quietly
      "corrected" it would be inventing a fact about SFU's records.
    impact_if_changed: >-
      Only the group label moves; era, population and score are all unaffected. But losing
      it would hide a template-line confound inside the headline non-compliance number,
      which is exactly the class of error Phase 2.5 exists to avoid. Widening the pattern to
      absorb the 36 typo'd tokens into their intended units would make the by-group numbers
      tidier and the archive's data-quality problem invisible — which is a decision, not a
      cleanup, and would belong here.

  # ═══════════════════════════════════════════════════════════════════════════
  # PROMOTED FROM `trivial` BY THE PHASE-2.5 BASELINE
  #
  # This was an explicit `trivial:` exemption ("a `low` drafting nudge"). The archive
  # baseline measured how often it actually fires, and a `low` nudge that lands on 78%
  # of everything SFU writes is not a nudge — it is a systematic markdown. The standing
  # rule says: if a default looks wrong, REGISTER IT AS `open`, do not quietly patch it.
  # So it is registered, and nothing about it has been changed.
  # ═══════════════════════════════════════════════════════════════════════════

  - id: HR-119
    question: >-
      Should a duty that does not spell out HOW and WHY it is performed be marked down —
      when almost every job description SFU writes omits it?
    config:
      file: rule_catalog.yaml
      path: rule_catalog.SFU-STRUCT-HOW-WHY.default_severity
    current_default: low
    provenance: prior_calibration
    tier: hr_policy
    why_it_matters: >-
      SFU's Part 2C asks that a duty say what is done, HOW it is done and WHY. The rule
      fires once per duty that carries no "how/why" clause. It does NOT block approval —
      it only costs score — which is why it sat in the register's `trivial` list as a
      "low drafting nudge" until Phase 2.5 measured it.
      ⚠ IT IS THE LARGEST SINGLE DEPRESSANT ON THE ENTIRE SCORE DISTRIBUTION. MEASURED:
        * it fires on 4,865 of 6,259 `new`-era JDs — **77.7%**;
        * on the current-practice cohort (874 JDs, defined in HR-001) it fires on
          **869 of 874 — 99.4%**;
        * on the 246 current-practice JDs that cannot be approved, **98.0%**; and
        * on the 628 that CAN be approved, **628 of 628 — 100%**.
      Read the last two lines together. This rule fires on essentially every JD SFU
      writes, approved and blocked alike. A finding that is present on 100% of the JDs we
      are willing to approve is not distinguishing anything — it is a constant subtracted
      from every score in the corpus. Either SFU's authors are near-universally ignoring
      Part 2C (possible, and worth telling them), or the parser's notion of a "how/why
      clause" is too narrow (also possible, and untested). We do not yet know which, and
      that is exactly why this is registered rather than tuned.
      It is the top candidate for the next false-positive investigation — and the one to
      look at BEFORE anyone concludes anything from the shape of the score distribution.
    impact_if_changed: >-
      It is `low`, so each finding costs little — but at ~4,865 firings across the new era
      it is doing more to the median score than any other rule in the rulebook. Demoting
      it to `info` would lift scores corpus-wide; promoting it toward the severity floor
      (HR-003 / HR-057) would make it BLOCKING and instantly un-approve ~99% of everything
      SFU currently writes. That asymmetry is the reason this is now a registered decision
      and not a `trivial:` exemption.
      ✅ PHASE 2.6 ANSWERED THE QUESTION 2.5 LEFT OPEN, AND IT WAS THE SECOND ANSWER: THE
      RULE IS BROKEN, NOT SFU'S WRITING. `SFU-STRUCT-HOW-WHY` reads `SFUDuty.how_why`, and
      our deterministic segmenter LEAVES THAT FIELD EMPTY — always, by construction
      (`segmenter.py`: "how_why left empty"; it has no way to split a duty's how/why
      sub-points out of a regex-parsed line). So `not d.how_why` was true for every duty
      of every JD and the rule COULD NOT NOT FIRE. The 100% figure was never a fact about
      SFU's job descriptions; it was a fact about our parser. (This is the Phase-2.4
      `render.py` lesson again: faithful to the earlier build, wrong here — in the earlier build an LLM populated
      `how_why`, so the same rule worked there.)
      THE FIX IS NOT THIS KNOB. The severity still ships at `low` and this entry stays
      `open` — because `low` is the right severity for the rule IF it is ever evaluable,
      and demoting it to `info` would have been the wrong fix twice over: `info` costs
      zero score (checked, not assumed — `scoring.severity_penalty.info` is 0.0), so
      scores would have risen while the finding still landed on every JD in every report.
      That hides the constant instead of removing it. The rule is instead marked
      `evaluable: false` (HR-121) — catalogued, silent, and reinstatable in one YAML line
      when Phase 4's extractor populates the field.
      ✅ MEASURED, full-archive re-run: the finding is gone from all 8,593 files it fired
      on (0 archive-wide; 0 of 628 approved -> 0 of 687). **Every score that carried the
      finding rose — all 8,593 of them — and NOT ONE SCORE FELL.** Said exactly: across
      the 14,522 scored files, 9,217 rose, 5,305 are unchanged and 0 fell (the two 2.6
      fixes combined); the 5,305 are the JDs that had no duties for the rule to fire on.
      "Every score in the archive rose" would be false, and a false number under a
      ✅ MEASURED banner is precisely what this register exists to prevent.
      The current-practice cohort (n=874) moved as follows — median **77.3 -> 79.0**, mean 76.4
      -> **79.5**, grades **5 A / 509 B / 355 C / 5 D -> 81 A / 551 B / 240 C / 2 D** (zero
      F throughout), and the share clearing the score floor of 60 went 99.4% -> **99.8%**.
      IT MOVED ZERO APPROVALS, and that is the honest headline: the rule never blocked, and
      no JD was blocked by the score/grade floors ALONE, so retiring it changed what every
      JD is WORTH without changing what any JD is PERMITTED. (The +59 approvals in this
      re-run are HR-120's, not this one's.) It also makes HR-001/002/003 measurable for the
      first time against a distribution that is not being pushed down by a constant.
    status: open

  # ═══════════════════════════════════════════════════════════════════════════
  # PHASE 2.6 — the three defects the 2.5 baseline exposed, FIXED and re-measured.
  #
  # These three were never HR questions. They were our bugs, and they distorted the very
  # numbers HR would have been ratifying — so they were fixed and the archive was
  # re-baselined BEFORE anything went to HR. All three CHANGE THE APPROVAL BAR, so all
  # three are registered decisions carrying the measured before/after, not quiet patches.
  # HR-041, HR-109, HR-110, HR-111 and HR-119 (above) carry the same numbers from the
  # other side.
  # ═══════════════════════════════════════════════════════════════════════════

  - id: HR-120
    question: >-
      Should the banned-phrase check ("may include", "assets", "preferences") search only
      the Qualifications section — or the whole job description?
    config:
      file: qualifications.yaml
      path: qualifications.banned_phrase_scope
    current_default: qualifications
    provenance: sfu_rulebook
    tier: hr_policy
    source_part: Part 2H
    why_it_matters: >-
      SFU bans these phrases FROM QUALIFICATIONS: they advertise *desired* extras where
      the rulebook wants the *minimum* needed to do the job. Until Phase 2.6 we searched
      the WHOLE DOCUMENT for them, which is not what the rule says and not what SFU asked
      for — so a duty reading "responsibilities may include arranging catering" or
      "manages capital assets" raised a QUALIFICATIONS finding and BLOCKED APPROVAL
      through SFU-APPROVE-QUAL-MINIMUM.
      ⚠ THE 2.5 BASELINE MEASURED WHAT THAT COST, AND IT WAS NOT A ROUNDING ERROR. On the
      current-practice cohort (874 JDs — definition in HR-001), 246 could not be approved
      and SFU-APPROVE-QUAL-MINIMUM blocked 104 of them — **all 104 raised by this one
      rule**, making it the #2 operative gate in the entire approval bar, ahead of
      everything except the summary word-count. For comparison, the score floor everybody
      argues about blocks 5.
      ✅ MEASURED AFTER THE FIX (Phase 2.6, full archive re-run), on the current-practice
      cohort of 874:
        * SFU-QUAL-BANNED-PHRASE fires on **0 files** (was 104 — every one of them a match
          in the wrong section);
        * SFU-APPROVE-QUAL-MINIMUM blocks **0** (was 104), and drops out of the operative
          bar entirely;
        * **approval 628 -> 687 (71.9% -> 78.6%)** — precisely the 59 JDs this gate was the
          SOLE blocker of, which is the ceiling this fix was predicted to have and did;
        * blocked JDs 246 -> 187. The remaining bar is SUMMARY-LENGTH 134 · QUAL-EQUIVALENT
          42 · EDI-FOOTER 10 · SUMMARY-CONDITIONS 9 · MANDATORY-SECTIONS 7 · SEVERITY-FLOOR
          7 · SCORE-FLOOR 2 · GRADE-FLOOR 2 · KSA-ORDER 1.
      Archive-wide the rule falls from 1,600 files (11.0%) to **10 (0.1%)**.
    impact_if_changed: >-
      Set it back to `document` and the whole-document scan returns, along with the 104
      blocks — every facilities, finance and property JD in the archive is a candidate,
      and a reviewer must waive each one by hand with a written reason.
      ⚠ THE NEW QUESTION THIS FIX HANDS HR: correctly scoped, the rule is **nearly inert**
      (10 files in 14,522). SFU's three banned phrases barely occur in the Qualifications
      sections SFU actually writes. Either that is fine — the rule is a guard-rail nobody
      hits — or the list is missing the phrases its authors really use, in which case the
      phrases (HR-041), not the scope, are what needs HR's attention.
      The ceiling was known BEFORE the fix and is worth stating, because it is lower than
      it looks: of the 104 JDs this gate blocked, only 59 were blocked by NOTHING ELSE —
      the other 45 also trip SUMMARY-LENGTH or QUAL-EQUIVALENT and stay blocked either
      way. So the fix could not have lifted approval past 78.6% (628 -> 687) whatever it
      did, and "naive 628 + 104" was never on offer.
      HONEST LIMIT OF THE NARROWED SCOPE: a phrase that lives ONLY in a Qualifications
      *header* line ("Qualifications may include:") is no longer seen — the segmenter
      drops lines ending in ":" as headers rather than requirements. And a JD with no
      parseable Qualifications section at all cannot trip this rule; that is safe only
      because SFU-COMP-QUALS then fires and blocks it NON-OVERRIDABLY through
      SFU-APPROVE-MANDATORY-SECTIONS, which is strictly stricter than the gate it
      escapes. Both are pinned by tests, neither is hidden.
    status: open

  - id: HR-121
    question: >-
      Which quality rules may the deterministic engine raise at all — and which are
      retired because the parsed JD does not carry the data they judge?
    config:
      file: rule_catalog.yaml
      path: rule_catalog.unevaluable_rule_ids
    current_default:
      - SFU-STRUCT-HOW-WHY
    provenance: our_invention
    tier: hr_policy
    why_it_matters: >-
      A rule that CANNOT NOT FIRE is not a quality signal. It is a constant subtracted
      from every score, and it tells a reviewer nothing about the JD in front of them.
      This entry is the list of rules the engine therefore stays silent on, and it exists
      because Phase 2.5 found one.
      SFU-STRUCT-HOW-WHY (HR-119) asks whether each duty spells out HOW and WHY it is
      performed — a real SFU expectation (Part 2C). It reads `SFUDuty.how_why`. Our
      deterministic segmenter **never populates that field** ("how_why left empty" — it
      cannot split a duty's sub-points out of a regex-parsed line), so the test
      `not d.how_why` was true for every duty of every JD, by construction. MEASURED
      (2.5): it fired on 77.7% of the new era, 99.4% of current practice, and **100% of
      the 628 JDs the bar would approve**. It was measuring our parser, not SFU's writing.
      The rule is retired, not deleted: it stays catalogued with its text, its severity
      and its rulebook citation, and `evaluable: true` reinstates it with NO code change.
      ✅ MEASURED AFTER THE FIX (Phase 2.6, full archive re-run): the finding disappears
      from all **8,593** files it fired on (59.2% of the archive). **Every score that
      carried it rose; NOT ONE SCORE FELL.** Precisely: of the 14,522 scored files, 9,217
      rose, 5,305 are unchanged (they had no duties for the rule to fire on) and 0 fell —
      the two 2.6 fixes combined. Even inside the 874-JD cohort, 4 scores do not move.
      "Every score in the archive rose" is NOT true and is not claimed.
      On the current-practice cohort (874 JDs): median **77.3 -> 79.0**, mean 76.4 ->
      **79.5**, grades **5 A / 509 B / 355 C / 5 D -> 81 A / 551 B / 240 C / 2 D** (zero F
      before and after), score floor cleared by 99.4% -> **99.8%**, and the score floor's
      rejections fall from 5 to 2.
      AND IT MOVED **ZERO APPROVALS** — the rule never blocked, and nothing was blocked by
      the floors alone. It changed what every JD is WORTH, not what any JD is PERMITTED.
      Say that plainly to HR: the score distribution they are about to ratify HR-001/002/003
      against has moved up by ~2 points and gained 76 A grades, and not one JD changed
      status. That is what a constant looks like when you remove it.
    impact_if_changed: >-
      Adding a rule here silences its finding wherever it fired and lifts the score of
      every JD that carried it; removing one does the reverse. That is a change to the
      approval bar by any other name, which is why the whole set is pinned here rather
      than left to 29
      per-rule flags — flip `evaluable` on any rule and this list moves and the build
      fails until HR is told.
      REINSTATE SFU-STRUCT-HOW-WHY when a producer actually populates `how_why`: the
      Phase-4.2 `sfu_jd_extract` LLM pass is the one on the plan (it is what populated the
      field in the earlier build, which is why the rule worked there and not here). Then re-baseline
      and tell HR what the finding rate on real JDs turns out to be — that number has
      never been measured, because until now the rule could not produce one.
      A rule in this list may NOT also sit in a blocking gate: the rulebook refuses to
      load, because a gate keyed to a rule nobody raises is a gate that can never fire —
      a false safety guarantee. SFU-STRUCT-HOW-WHY blocks nothing, so it retires cleanly.
    status: open

  - id: HR-122
    question: >-
      Where does the CURRENT era begin — i.e. from what year is a JD judged by the bar
      that assumes SFU's territorial acknowledgement and EDI footer?
    config:
      file: segmentation.yaml
      path: segmentation.era_new_max_year
    current_default: 2023
    provenance: our_invention
    tier: hr_informed
    why_it_matters: >-
      This is the fourth era band the 2.5 baseline said we needed, and the fix to the
      modelling error registered as HR-109 / HR-110 / HR-111. SFU made TWO transitions,
      four years apart: the JDFN TEMPLATE in 2019, and the TERRITORIAL / EDI FOOTER in
      2023-24. The three-band model had a rung for the first only — and then judged the
      whole `new` era with SFU-APPROVE-EDI-FOOTER, a BLOCKING gate that only the second
      satisfies. A 2019 JDFN document, authored correctly under the template of its day,
      was un-approvable for missing a paragraph that did not yet exist. MEASURED: 10.0%
      approval for `new` against 71.9% among JDs that actually carry the acknowledgement —
      a SEVENFOLD gap that was pure date and no quality.
      2024 IS THE YEAR THE SECOND ROLLOUT CROSSES 50%. Measured footer adoption by year:
      0.2% (2019) · 1.0% (2020) · 1.4% (2021) · 1.0% (2022) · 11.2% (2023) · **63.3%
      (2024)** · 84.9% (2025) · 88.6% (2026). So `new` ends in 2023 and `current` begins
      in 2024 — the first year in which carrying the acknowledgement is the norm rather
      than the exception, which is exactly the population the bar is written for.
      ✅ MEASURED AFTER THE FIX (Phase 2.6, full archive re-run). The 6,262-file `new` era
      splits into **`new` 5,228 (2019-2023)** and **`current` 1,034 (2024+)**; `old` (3,339)
      and `transition` (4,964) are untouched. Approval, which was reported as a single
      meaningless 10.0%, resolves into:
        * `new` (2019-2023): **1.0%**, median 68.3 — and 5,146 of its 5,171 blocks are
          SFU-APPROVE-EDI-FOOTER. It is not a quality verdict. It is the footer, and it is
          the clearest possible statement of the modelling error: judge the template era by
          the footer era's bar and nothing passes, at a median score of 68.
        * `current` (2024+): **61.2%**, median 78.0, 85.9% clear the score floor.
      The two bands now say two different, true things. The merged band said one false one.
    impact_if_changed: >-
      No JD's SCORE moves — segmentation decides which files a number is computed OVER,
      never what any of them is worth, and `segmentation.yaml` is excluded from the
      rulebook's content hash for exactly that reason (`rules_version` does not churn).
      What moves is WHICH POPULATION SFU'S APPROVAL BAR IS RATIFIED AGAINST, which is the
      most consequential judgement in the whole baseline. Lower the year and JDs written
      before the footer was standard are held to a bar they could not have met; raise it
      and genuinely current JDs are excused from it.
      ⚠ THE `current` BAND IS NOT THE SAME THING AS THE 874-JD "CURRENT PRACTICE" COHORT
      (HR-001), AND IT MUST NOT BE PASSED OFF AS IT. That cohort is defined on validator
      post-state — the JDs on which SFU-COMP-TERRITORIAL did not fire, i.e. those that
      actually CARRY the acknowledgement. A date band cannot reproduce it, because the 2024
      rollout is 63% complete, not 100%. MEASURED: the `current` band holds **1,034** JDs
      against the cohort's **874**, and they agree on only **795**. **239** JDs dated 2024+
      STILL DO NOT CARRY the acknowledgement (in the band, not in the cohort — and 249 of
      the band's 401 blocks are the footer gate), and **79** JDs that DO carry it predate
      2024 (in the cohort, not in the band). So the band reads **61.2%** approval where the
      cohort reads **78.6%**. THE BAND IS NOT THE COHORT AND MUST NOT BE QUOTED AS IT: quote
      the cohort when the claim is about the BAR, and the band when the claim is about a
      DATE. The 17-point gap between them is the rollout's remaining 37%, nothing else.
      The alternative HR may still prefer (HR-109 option (b)) is to define the era by the
      FOOTER'S PRESENCE rather than by a date. It is the truer signal, and it is what the
      cohort already does — but it makes era depend on document CONTENT, so `file_facets`
      would stop being a pure, never-raising function of a filename and would need the
      extracted text. That is a real architectural change to `facets.py`, not a knob.
    status: open

  - id: HR-123
    question: >-
      When N archive files are BYTE-IDENTICAL, how is that fact recorded — as N-1 edges
      to one representative file (a star), or as an edge between every pair (a clique)?
    config:
      file: comparison.yaml
      path: comparison.exact_edge_topology
    current_default: star
    provenance: our_invention
    tier: technical
    why_it_matters: >-
      This is the shape of the archive's duplication as JD Bank will store it, and it is
      the first thing Phase 3 writes. It exists as a knob at all because of what it sits
      on top of — a PROVENANCE FIX, not a preference.
      THE BUG IT REPLACES. `source_documents.sha256` was UNIQUE and `ingest_document`
      returned the existing row on a duplicate hash. So the table was a ledger of
      distinct CONTENT while every consumer read it as a ledger of the ARCHIVE.
      ✅ MEASURED over all 14,565 files with this repo's own `compute_sha256` (NOT the
      Phase 0 census's md5+shell toolchain — a different pipeline, so it was re-verified
      rather than quoted): 1,037 SHA-256 groups hold more than one file, 3,009 files sit
      in one, and 1,972 of those are byte-for-byte redundant copies. Under the old
      schema those 1,972 files would have been ingested and their FILENAMES DISCARDED —
      no row, no record they ever existed. "Which archive files produced this canonical
      JD?" was unanswerable (non-negotiable #6), and `DedupTier.EXACT` / `dedup_edges`
      were dead code, because an edge needs two source ids and the duplicate never got
      one. Migration 0002 makes the ledger one row per FILE; this parameter decides how
      the duplication is then SAID.
      ✅ MEASURED, the shape that decides the answer: 616 groups of 2, 207 of 3, 87 of 4,
      49 of 5, 32 of 6, 17 of 7, 17 of 8, 6 of 9, 4 of 10, 2 of 11. LARGEST GROUP: 11.
      star = 1,972 edges; clique = 4,068. Both are affordable TODAY, so the choice is
      about meaning and growth, not about this corpus:
        * byte-identity is an EQUIVALENCE relation, so the clique's extra 2,096 edges are
          all derivable from the star by transitivity — they state nothing new;
        * `build_clusters` (connected components) recovers the IDENTICAL group from
          either, so no downstream consumer can tell them apart;
        * star grows LINEARLY in group size, clique QUADRATICALLY — and Tiers 2 and 3
          write into this same table with far larger and far messier groups.
      ⚠ THE LINEARITY IS A PROPERTY OF THE CODE, AND IT HAD TO BE EARNED — do not read it
      as a mathematical given. The Tier-1 pass is ADDITIVE (it never deletes an edge), so
      if the representative is re-derived as "first by sort order" on every run, a
      duplicate arriving with an earlier-sorting path RE-ANCHORS the star and the previous
      star's edges remain. MEASURED on a group of 6 ingested in reverse order, one pass per
      arrival: 15 EDGES — THE FULL CLIQUE — across 5 anchors, where a clean star is 5.
      Every edge true, every edge redundant, and this bullet quietly false. The
      representative is therefore PINNED: a group keeps the anchor its edges already hang
      off, so a late arrival adds exactly one edge. Pinned by
      `test_the_star_stays_linear_under_worst_case_arrival_order`, which fails with exactly
      15 edges if the anchor is removed. HR is ratifying the pinned behaviour.
      `clique` is implemented, not merely named: a knob whose alternative does nothing is
      exactly the `cluster_algo` landmine this same PR is disarming.
    impact_if_changed: >-
      No JD's score, grade or approval moves — this decides what the dedup FINDING looks
      like in the database, never what any JD is worth. What moves is the cost and the
      addressability of the edge table: `clique` makes every pair of identical files
      answerable by a single row lookup instead of by graph traversal (2.1x the rows
      here; on a group of 100 it would be 50x). Flipping it does not invalidate existing
      rows — both topologies orient every edge by the SAME total order (the archive path,
      never "from the representative"), so a star's edges are a strict subset of the
      clique's, and re-running Tier-1 after the flip simply ADDS the missing pairs.
      ⚠ THAT SUBSET PROPERTY IS EARNED, AND IT IS NOT WHAT THE DATABASE ENFORCES. The
      `uq_dedup_pair_tier` constraint is on the ORDERED pair, so it would happily accept
      `(b, a)` alongside `(a, b)`. Only the orientation rule prevents it — and the first
      cut of the star-stability fix broke exactly this by orienting star edges FROM the
      pinned representative, which points backwards for every member that sorts before it.
      MEASURED on 6 duplicates arriving in reverse order: 4 of the 5 star edges reversed,
      and a subsequent flip to `clique` produced 19 EDGES WITH 4 MIRRORED PAIRS (a clean
      clique on 6 is 15, with none) — i.e. this very paragraph was false of the code.
      WHO the representative is and WHICH WAY AN EDGE POINTS are now strictly separate
      questions. Pinned by `test_tier1_never_writes_both_directions_of_a_pair` (which now
      runs AFTER a re-anchor — on a fresh pass the two coincide, so a fresh pass cannot
      catch a violation) and by
      `test_flipping_to_clique_after_a_re_anchor_writes_no_mirrored_pairs`.
      ⚠ WHAT THIS IS *NOT* A DECISION ABOUT: whether the duplicates get collapsed. They
      do not, at any setting. Nothing in this knob can delete an archive file's row.
    status: open

  # --- Phase 3.2b: embeddings (embeddings.yaml) --------------------------------
  # Nothing below moves a JD's score, grade or approval — `embeddings.yaml` is
  # excluded from `rules_version` (`loader._UNHASHED_FILES`) for exactly that reason.
  # Every entry is `our_invention`: SFU publishes no embedding policy, and the earlier build had
  # none either (JD Bank's Tier-3 dedup and search are new work, not a port).

  - id: HR-124
    question: >-
      Which embedding model turns a parsed JD's text into the vector JD Bank stores
      and searches on?
    config:
      file: embeddings.yaml
      path: embeddings.model
    current_default: nomic-embed-text
    provenance: our_invention
    tier: technical
    why_it_matters: >-
      ✅ VERIFIED live from inside the `gates` container (ADR-003, amended 2026-07-13):
      `aria-gb10-2` is reachable, `nomic-embed-text` is present, and it returns 768-dim
      vectors matching the Neo4j vector index `core/db/migrations/002_jd_vectors.cypher`
      already mandates. ✅ MEASURED: the SAME text returns a BYTE-IDENTICAL vector across
      repeated calls, and a batched call returns the identical vectors to one-at-a-time
      — which is what makes `text_sha256`-keyed idempotency (the store's skip-first
      pass, the runner's in-run memo) sound, and what makes batch size an OPERATIONAL
      setting (`settings.embed_batch_size`) rather than a rulebook decision: it cannot
      change the output, only the throughput.
    impact_if_changed: >-
      Moves `embeddings.stamp` (`embed_stamp`), which is what the store's skip-first
      comparison keys on — so swapping the model forces a full re-embed of the archive,
      MERGEd in place onto the same `(source_document_id | source_document_id:section)`
      node ids, no orphans. It must also return `embeddings.dimensions`-dim vectors
      (HR-125) or every write to the Neo4j vector index fails outright.
    status: open

  - id: HR-125
    question: >-
      How many dimensions does an embedding have, and does everything that needs to
      agree on that number actually agree?
    config:
      file: embeddings.yaml
      path: embeddings.dimensions
    current_default: 768
    provenance: our_invention
    tier: technical
    why_it_matters: >-
      This number lives in THREE homes that cannot see each other: the model's own
      output, `core/db/migrations/002_jd_vectors.cypher`'s `vector.dimensions` on BOTH
      `jd_document_embeddings` and `jd_section_embeddings` (hardcoded — Cypher cannot
      read this YAML), and here. The loader validates YAML, not a live Neo4j instance
      or a live Ollama call, so nothing at LOAD time can catch the three drifting apart
      — only the opt-in, local-only live golden test (`tests/live`, never in `make
      gates` / CI — ADR-003: CI cannot reach `aria-gb10-2`) asserts
      `len(vector) == rules.embeddings.dimensions` against the real endpoint, and only
      an integration test's `SHOW VECTOR INDEXES` assertion catches the migration
      drifting from this value.
    impact_if_changed: >-
      A mismatch between this value and the model's REAL output dimensionality makes
      every Neo4j write to the vector index fail (or, worse, silently index a vector of
      the wrong length if Neo4j ever stopped enforcing it). A mismatch between this
      value and the CYPHER migration's `vector.dimensions` requires a NEW migration
      (Neo4j vector indexes are not alterable in place) — this YAML value alone changes
      nothing in the already-applied index.
    status: open

  - id: HR-126
    question: >-
      How much of a parsed JD's serialized text is actually sent to the embedding
      model before it is truncated?
    config:
      file: embeddings.yaml
      path: embeddings.max_chars
    current_default: 10000
    provenance: our_invention
    tier: technical
    why_it_matters: >-
      ⚠️ RE-MEASURED 2026-07-21 over the v2 (post-WJQ) corpus — the ORIGINAL basis for
      10,000 is now FALSIFIED. The original numbers (median 2,559 · p99 5,993 · p99.9
      8,870 · MAX 8,987 · ZERO exceed 10,000, "10,000 truncates nothing") were measured
      BEFORE the WJQ template parser + docx table/content-control recovery pulled dense
      real text back into the serialization. Re-measured over all 14,522 v2 parsed JDs:
      median 3,909 · p99 11,816 · p99.9 12,825 · MAX 13,486 — and **1,400 documents
      (~9.6%) now exceed 10,000 and are TRUNCATED** (whole-unit, so their document
      vector is built on partial text). The server still 400s at 8,192 tokens; dense WJQ
      text runs closer to ~1.1–1.2 chars/token, so ~11 of those 1,400 are so dense that
      even the 10,000-char-TRUNCATED text still exceeds 8,192 tokens → a live 400 → the
      runner skips them (0 doc vector; `bad_requests=11` in the last embed run).
    impact_if_changed: >-
      ⚠️ There is NO single `max_chars` that both avoids truncation AND avoids the 400:
      many WJQ docs are genuinely longer than the model's 8,192-token window (MAX 13,486
      chars ≈ ~11k tokens). Lowering `max_chars` reduces 400s but truncates EVEN MORE of
      the 1,400 (worse information loss). Raising it truncates fewer but 400s more of the
      dense tail. This is now an OPEN DESIGN DECISION, not a knob tweak — options to
      weigh at the post-run session (each needs the Ollama host on `aria-gb10-2`, so it
      waits until the full canonical run frees the GPU, and every claim must be
      re-measured against the archive): (a) keep truncating + add a progressive
      re-truncation on a single-item 400 so the ~11 densest still get a (shorter) vector
      instead of none; (b) chunk long docs into multiple embeddings and pool/mean them
      for the document vector (no loss, real design change); (c) lean on the already-
      present SECTION vectors for long docs and treat the doc vector as best-effort;
      (d) lower `max_chars` to a token-safe floor and accept the wider truncation.
      The runner today catches a 400, isolates it (re-issues the batch ONE TEXT AT A
      TIME so one over-long JD costs only itself, not the up-to-63 batched with it), and
      records `bad_requests` — but the over-long JD then silently has no document vector,
      so this is not a free lunch. See HANDOFF "post-run" + `docs/embeddings/summary.json`.
      ✅ RESOLVED 2026-07-22 (design, pre-re-embed): `max_chars` is KEPT at 10,000 and the
      decision is (a)+(c) — a `max_chars_fallback` ladder (HR-193) rescues the ~11
      over-window docs into best-effort shorter vectors, and the doc vector is treated as
      best-effort for the long tail (per-section vectors carry the role signal). (b) and
      (d) rejected. Full rationale + the re-embed/verify command:
      `docs/embeddings/max-chars-decision.md`. The re-embed itself waits on `aria-gb10-2`
      (busy with the full canonical run) and every count must be re-measured after.
    status: open

  - id: HR-127
    question: >-
      How short can one section's text be before it is not worth giving its own
      embedding at all?
    config:
      file: embeddings.yaml
      path: embeddings.min_section_chars
    current_default: 40
    provenance: our_invention
    tier: technical
    why_it_matters: >-
      A near-empty section (one word, or a stray period the segmenter left behind)
      produces a vector cosine similarity treats unreliably, and an unhelpfully "close"
      neighbour is worse than an honest gap. ✅ MEASURED over all 14,522 parsed JDs:
      this threshold excludes exactly 1 position-summary and 6 duty-blocks — a
      guard-rail nobody trips much, not a filter that trims real content out of the
      corpus.
    impact_if_changed: >-
      Raising it starts excluding genuinely short-but-real sections from getting a
      `JDSection` node (a real, if terse, position summary loses its own embedding and
      falls back to being findable only via the whole-document vector). Lowering it to
      0 disables the guard-rail outright and lets a near-empty section get a vector.
    status: open

  - id: HR-128
    question: >-
      Does the JD's TITLE become part of the whole-document embedding, or is the
      document vector title-agnostic like the rest of the similarity score?
    config:
      file: embeddings.yaml
      path: embeddings.include_title_in_document
    current_default: false
    provenance: our_invention
    tier: technical
    why_it_matters: >-
      `jd_core.bank.similarity`'s module docstring promises the overall score is
      "title-agnostic BY CONSTRUCTION" — "Software Engineer", "Developer II" and
      "Applications Programmer" can score as the same role because titles are not a
      term of the score. If the title were folded into the document text, that
      guarantee would be broken through the back door: `weight_vector` would now be
      scoring title similarity too, silently. `false` keeps the promise true at the
      vector layer, not just at the maths layer.
    impact_if_changed: >-
      Flipping to `true` smuggles the title back into "title-agnostic" similarity and
      moves EVERY document embedding (a full re-embed via `embeddings.stamp`) plus every
      downstream similarity ranking and Tier-3 dedup edge that reads it. Pinned by
      mutation in `test_embed_text.py`: flip it via `model_copy` and the title appears
      in the serialized text; the shipped default omits it.
    status: open

  - id: HR-129
    question: >-
      Which parts of a parsed JD make up the WHOLE-DOCUMENT text an embedding model
      sees?
    config:
      file: embeddings.yaml
      path: embeddings.document_sections
    current_default:
      - position_summary
      - duties
      - decision_making
      - problem_solving
      - relationships
      - qualifications
      - additional_context
    provenance: our_invention
    tier: technical
    why_it_matters: >-
      This IS what "this JD's content" means for retrieval, dedup Tier-3 and search —
      the vector is only as good as what it was computed over. `identification` is
      deliberately excluded (structured columns — department, grade, position number —
      not prose a similarity search should match on), and the three boilerplate blocks
      (`about_sfu` / territorial-ack / EDI footer) are excluded because they are
      presence BOOLEANS on the parsed model with no text at all: serializing the PARSED
      JD (never raw extracted text) keeps SFU's mandated, byte-identical boilerplate out
      of every JD's vector for free, with no exemption list to maintain (unlike HR-058's
      coded-term scan, which has to redact it explicitly because it scans raw text).
    impact_if_changed: >-
      Adding or removing a section moves `embeddings.stamp` and forces a full re-embed.
      A section name outside `jd_core.rules.loader._CONTENT_SECTIONS` fails to load —
      the rulebook refuses a section `embed_text.py` has no producer for, the same "a
      gate that can never fire" failure applied to a section that could never serialize
      anything.
    status: open

  - id: HR-130
    question: >-
      Which sections get their OWN separate embedding (a `JDSection` node), in
      addition to the whole-document vector?
    config:
      file: embeddings.yaml
      path: embeddings.section_vectors
    current_default: [position_summary, duties, qualifications]
    provenance: our_invention
    tier: technical
    why_it_matters: >-
      These are the three sections with a NAMED downstream consumer TODAY:
      `comparison.yaml`'s own docstring calls the similarity term "the summary
      embedding" (`position_summary`); `duties` is the clearest single role signal a
      parsed JD carries; `qualifications` is the proposed skill source for Tier-3 dedup
      / `skill_overlap` once a skill ontology exists (2.4c's similarity module,
      currently unwired). `decision_making` / `problem_solving` / `relationships` /
      `additional_context` are in the DOCUMENT vector (HR-129) but have no named
      per-section consumer yet, so they get no separate node.
    impact_if_changed: >-
      Adding a section here creates a new class of `JDSection` node (storage cost, more
      retrieval surface, one more embed call per affected JD) and moves `embeddings.
      stamp`. REMOVING one DELETES every `JDSection` node of that kind on the next run
      — the pass reconciles, it does not only MERGE. That is deliberate and it is
      load-bearing: a MERGE-only pass would leave the orphaned vectors LIVE IN THE
      QUERYABLE INDEX, so `db.index.vector.queryNodes` would go on returning a section
      this rulebook no longer says exists, and Tier-3 dedup / search (3.3, 3.4) would
      retrieve it. Pinned by `test_dropping_a_section_vector_prunes_its_nodes`.
      Every member MUST also be a member of `document_sections` (HR-129,
      loader-enforced) — a section vector for content the document text does not
      include would embed something the document vector cannot be compared against.
    status: open

  # --- Phase 3.3: Tier-2 near-duplicate detection (dedup.yaml) -----------------
  # Nothing below moves a JD's score, grade or approval — `dedup.yaml` is excluded
  # from `rules_version` (`loader._UNHASHED_FILES`) for exactly that reason. It
  # decides which DOCUMENTS are similar to each other, never what any one of them is
  # worth. Every entry is `our_invention`: SFU publishes no near-duplicate policy, and
  # the earlier build had none either. Every default is MEASURED on the real archive (14,565 files,
  # 12,494 distinct contents) — see HANDOFF 2026-07-13 and `dedup.yaml`'s header.

  - id: HR-131
    question: >-
      What TEXT does Tier-2 compare — the raw extracted (incumbent-scrubbed) text, or
      the parsed JD serialized the way Phase 3.2b embeds it?
    config:
      file: dedup.yaml
      path: dedup.text_source
    current_default: raw_clean
    provenance: our_invention
    tier: technical
    why_it_matters: >-
      ✅ MEASURED: raw extracted text is available for 14,452 of 14,565 archive files;
      the PARSED/serialized text (`jd_core.bank.embed_text.serialize_document`) is
      available for only 9,517, because 34.5% of parsed JDs (5,012 of 14,522) serialize
      to EMPTY — the WJQ-template gap HANDOFF already documents (a different document
      template the segmenter cannot read; `transition` era is 52.7% unparseable).
      `raw_clean` rescues 98.6% of those 5,012 files for shingling. Scoring on
      `serialized` text alone would silently run Tier-2 over roughly two-thirds of the
      archive and bias the finding against the eras most likely to actually contain
      duplicates — precisely the "metrics computed on a corpus quietly missing a third
      of itself" trap 2.6 already caught once (HOW-WHY, HR-121). Both branches are
      IMPLEMENTED (`ArchiveTextSource` / `SerializedTextSource`,
      `jd_bank.dedup.near.text`) — a knob whose alternative does nothing is the
      `cluster_algo` landmine HR-123 already fixed once, in a new place.
    impact_if_changed: >-
      Moves `dedup.stamp`, forcing a full Tier-2 re-run (the reconcile prunes every
      edge the new config no longer implies and inserts/updates the rest — see
      `dedup/near/runner.py`). Switching to `serialized` would silently drop Tier-2
      coverage on the WJQ-heavy eras until a WJQ parser lands (already tracked as a
      blocker for Phase 3.5 clustering, HANDOFF "THE BIG NEW FINDING").
    status: open

  - id: HR-132
    question: >-
      How many consecutive words make up one shingle — the unit Tier-2's Jaccard
      similarity is computed over?
    config:
      file: dedup.yaml
      path: dedup.shingle_size
    current_default: 5
    provenance: our_invention
    tier: technical
    why_it_matters: >-
      ✅ MEASURED all-pairs median Jaccard by word-gram width k: k=4 -> 0.0039, k=5 ->
      0.0022 (the widest separation from the nearest-neighbour median of 0.126), k=7 ->
      0.0009 but the nearest-neighbour median ALSO falls to 0.10 at k=7 — i.e. k=7
      starts losing true near-duplicate pairs, not just random ones. k=5 is the
      measured sweet spot. Character n-grams were ruled out without a separate
      measurement run: every SFU JD shares the same vocabulary and template, so
      character grams would collide constantly and discriminate nothing — the same
      failure mode document cosine has on this corpus (see HR-138).
    impact_if_changed: >-
      Moves `dedup.stamp` and every shingle set in the corpus — forces a full Tier-2
      re-run. A smaller k raises Jaccard scores across the board (more coincidental
      overlap) and would require `jaccard_min` (HR-138) to be re-derived, not just
      re-read at the old value; a larger k risks losing true near-duplicates the way
      k=7 measurably does. Pinned by `test_shingles.py`: changing `shingle_size` from
      5 to 4 changes the shingle SET for the same text, not merely its size.
    status: open

  - id: HR-133
    question: >-
      Is SFU's own mandated boilerplate (About-SFU / territorial acknowledgement /
      Employment Equity) cut out of a JD's text before it is shingled?
    config:
      file: dedup.yaml
      path: dedup.redact_boilerplate
    current_default: true
    provenance: our_invention
    tier: technical
    why_it_matters: >-
      SFU's mandated text (`boilerplate.yaml`) is byte-identical across thousands of
      JDs — reusing HR-058's exact mechanism (`jd_core.quality.boilerplate.
      redact_passages`, never a second redactor) keeps it from inflating every pair's
      shingle overlap by a constant unrelated to whether the two JDs describe the same
      role. ✅ MEASURED effect on this corpus is small but real: all-pairs p90 Jaccard
      is 0.0311 redacted vs 0.036 raw — the boilerplate is contributing real, if modest,
      coincidental overlap. `false` would let two otherwise-unrelated JDs share only
      the mandated paragraphs and still register meaningful shingle overlap.
    impact_if_changed: >-
      Moves `dedup.stamp`, forcing a full Tier-2 re-run. `false` raises Jaccard scores
      slightly for every pair that carries the mandated text (the growing share of the
      archive with the acknowledgement/EDI footer — HANDOFF's adoption curve), which
      would also need `jaccard_min` re-derived rather than merely re-read. Pinned by
      mutation: two JDs sharing ONLY SFU's mandated text score near-zero Jaccard
      redacted, and a large positive Jaccard unredacted (`test_shingles.py`).
    status: open

  - id: HR-134
    question: >-
      How few shingles can a document have before Tier-2 refuses to build a MinHash
      signature for it at all?
    config:
      file: dedup.yaml
      path: dedup.min_shingles
    current_default: 20
    provenance: our_invention
    tier: technical
    why_it_matters: >-
      A document with almost no shingles produces a signature LSH will bucket almost
      randomly — not a genuine similarity signal, just noise that happens to collide.
      ✅ MEASURED over the archive's raw-clean text: this threshold excludes 70 of
      14,522 parsed JDs (0.48%) — a guard-rail nobody trips much, not a filter that
      trims real content, mirroring `embeddings.min_section_chars`'s "excludes 7"
      shape and register entry (HR-127).
    impact_if_changed: >-
      A document below this threshold is COUNTED (`documents_below_min_shingles`),
      never silently dropped — visible in `docs/dedup/near-dup-summary.json`. Lowering
      it lets near-empty documents into the candidate pool (noisy, low-precision
      matches); raising it excludes more of the legitimately short/legacy corpus from
      Tier-2 entirely. Moves `dedup.stamp`.
    status: open

  - id: HR-135
    question: >-
      How many MinHash permutations make up one document's signature?
    config:
      file: dedup.yaml
      path: dedup.num_perm
    current_default: 128
    provenance: our_invention
    tier: technical
    why_it_matters: >-
      The MinHash estimator's standard error is sqrt(J(1-J)/num_perm) — at 128 that is
      sigma ~= 0.088 in the worst case (J=0.5), far too coarse to threshold a similarity
      DECISION on. That is exactly why `jd_core.bank.minhash` never scores on the
      estimate: MinHash is only the CANDIDATE INDEX, and the actual score is always
      exact Jaccard recomputed on the two shingle sets. ✅ MEASURED: pure Python (no
      `numpy` — not needed, see `jd_core.bank.minhash`'s module docstring) computes
      MinHash signatures for the whole corpus in ~3.5 minutes at this value.
    impact_if_changed: >-
      Moves `dedup.stamp`, forcing a full Tier-2 re-run. Must stay a multiple that
      `bands * rows` can factor exactly (loader-enforced — the rulebook FAILS TO LOAD
      otherwise, `test_dedup_rules.py`). Lowering it speeds up signature computation but
      widens the estimator's error (irrelevant to the SCORE, since that is always exact
      Jaccard, but it widens which candidates the LSH banding surfaces in the first
      place). Raising it slows computation for no benefit to precision, since the score
      is never the estimate.
    status: open

  - id: HR-136
    question: >-
      How many LSH bands is a MinHash signature split into?
    config:
      file: dedup.yaml
      path: dedup.bands
    current_default: 16
    provenance: our_invention
    tier: technical
    why_it_matters: >-
      Together with `rows` (HR-137), this decides the LSH "S-curve" — the probability
      that two documents become a CANDIDATE (worth an exact-Jaccard comparison) as a
      function of their true Jaccard similarity. The curve's 50% midpoint is
      `(1/bands)^(1/rows)` — DERIVED, never a stored key (`Dedup.s_curve_threshold`), so
      it cannot drift from `bands`/`rows` the way a hand-maintained third number could.
      ✅ MEASURED at bands=16/rows=8: midpoint 0.707, 23,705 candidate pairs -> 15,080
      near-dup edges over the whole corpus. CHANGED from bands=32/rows=4 (midpoint 0.420)
      after the docx extraction fix (PR #30) + WJQ parser (PR #32) recovered ~20.7M chars
      dominated by SFU's shared WJQ template scaffolding, near-identical across ~4,300
      WJQ files: at the loose 0.420 midpoint those collided into mega-buckets and blew
      past `max_candidate_pairs` (98,193+ candidates, the valve fired). 0.707 filters that
      low-Jaccard boilerplate noise WITHOUT losing edges (15,080 vs 15,082 — a 2-edge /
      0.01% difference), 4x fewer candidates. The boilerplate never became an edge at
      `jaccard_min` = 0.85 (HR-138) anyway — it was pure candidate-generation waste.
    impact_if_changed: >-
      Moves `dedup.stamp`. Must satisfy `bands * rows == num_perm` (HR-135/HR-137,
      loader-enforced — the rulebook fails to load otherwise). More bands / fewer rows
      per band raises the candidate-generation recall (more true near-duplicates
      surfaced as candidates) at the cost of more candidate pairs to exact-Jaccard-score
      — bounded by `max_candidate_pairs`, the safety valve (trivial exemption, below).
    status: open

  - id: HR-137
    question: >-
      How many MinHash values make up one LSH band (the other half of the S-curve,
      alongside `bands`)?
    config:
      file: dedup.yaml
      path: dedup.rows
    current_default: 8
    provenance: our_invention
    tier: technical
    why_it_matters: >-
      See HR-136 — `bands` and `rows` are a single decision (the LSH banding) split
      across two registered fields because both are independently meaningful numbers a
      reviewer could ask about, not because they are two separate policy calls. The
      measured basis (midpoint 0.707, 23,705 candidates -> 15,080 edges, and why it was
      changed from 32/4 after the corpus grew) is recorded once, on HR-136, rather than
      duplicated here.
    impact_if_changed: >-
      Identical mechanism to HR-136: moves `dedup.stamp`, must satisfy
      `bands * rows == num_perm` (loader-enforced), and retunes the S-curve midpoint
      together with `bands`.
    status: open

  - id: HR-138
    question: >-
      At what EXACT-Jaccard shingle similarity does a candidate pair become a
      `DedupEdge` at `tier=NEAR_DUPLICATE`?
    config:
      file: dedup.yaml
      path: dedup.jaccard_min
    current_default: 0.85
    provenance: our_invention
    tier: technical
    why_it_matters: >-
      THE most consequential number in this file — it is the line between "these two
      files are the same JD, lightly re-saved or reformatted" and "these two files
      happen to share some template language". ✅ MEASURED edge counts over the whole
      corpus at several thresholds: 0.9 -> 11,398 edges * 0.85 -> 14,312 edges (SHIPPED)
      * 0.8 -> 15,877 * 0.7 -> 19,110. ✅ MEASURED random-pair Jaccard p99.9 is 0.30, so
      0.85 sits far into the tail of what an unrelated pair could plausibly reach by
      chance. ⚠ THE LABEL SET DOES NOT CALIBRATE THIS NUMBER. `fixtures/labels/
      pairs.csv` (101 pairs, 12 near-dup positives, `best_guess_label`, authored in
      Phase 0 citing a census this repo later found wrong) measures same-position
      "negative" pairs at median Jaccard 0.30 and cross-position LSH "candidate" pairs
      at median Jaccard 0.58 — the negatives are MORE similar than the candidates, at
      every threshold tried the hard-negative rate exceeds the weak-positive rate, and
      69-73% of near-dup edges this pass would write are cross-position (Tier-1 found
      the identical shape: 77% of exact-duplicate groups span more than one position —
      SFU's redundancy is cross-position CLONING, not within-position revision). This
      is THE number a human reviewer with real JD-reading judgement must ultimately
      rule on, not a percentage optimised against a label set that measures the wrong
      thing.
    impact_if_changed: >-
      Moves `dedup.stamp`. THE RECONCILE, not mere addition, is what makes this safe to
      retune: raising it DELETES every existing NEAR_DUPLICATE edge that no longer
      qualifies (`dedup/near/runner.py`'s plan/present/insert/update/prune shape,
      mirroring 3.2b's embedding reconcile) rather than leaving a database full of
      edges a config that no longer exists produced. Lowering it surfaces more edges
      for human adjudication (`docs/dedup/near-dup-adjudication-sample.csv`) at lower
      average precision.
    status: open

  - id: HR-139
    question: >-
      Does Tier-2 additionally require a minimum DOCUMENT COSINE similarity (Neo4j
      vectors) before a Jaccard-qualifying candidate becomes an edge?
    config:
      file: dedup.yaml
      path: dedup.cosine_confirm_min
    current_default: null
    provenance: our_invention
    tier: technical
    why_it_matters: >-
      ✅ MEASURED (HANDOFF 2026-07-13, and the basis of the amended HR-093): over 300
      random JDs excluding self and byte-identical content, nearest-neighbour document
      cosine is min 0.877, p10 0.953, median 0.988 — 98% (250/255) sit AT OR ABOVE the
      inherited `comparison.clone_threshold` of 0.92. A cosine confirm at any realistic
      bar would confirm almost every Jaccard-qualifying pair — "a filter that can never
      reject", the same failure shape as HR-121's `SFU-STRUCT-HOW-WHY` (a finding that
      could never NOT fire), inverted into a gate that could never NOT pass. It is also
      UNAVAILABLE for 34.5% of the corpus (no vectors for documents that serialize to
      empty — the WJQ gap, HR-131), so turning it on would silently run a DIFFERENT
      policy on WJQ files (Jaccard alone) than on JDFN files (Jaccard + cosine) with no
      flag distinguishing the two in the data. The code path IS implemented and tested
      (`jd_bank.dedup.near.runner`, reading Neo4j vectors directly — it never
      constructs an embed client) so the knob is real the day HR turns it on; it ships
      `null` (OFF) because turning it on today would not filter anything real.
    impact_if_changed: >-
      Moves `dedup.stamp`. A non-null value vetoes a Jaccard-qualifying candidate pair
      whose cosine sits below it; a pair with a missing vector on either side is
      accepted on Jaccard alone (its `method` string says so, e.g.
      `minhash+jaccard@<stamp>` with no `+cosine` suffix) rather than silently
      excluded — a cosine-blind policy for a third of the corpus is a real and visible
      state, not a silent gap.
    status: open

  - id: HR-140
    question: >-
      Does Tier-2 compare DISTINCT CONTENTS (one unit per Tier-1 sha256 group) or
      every individual FILE?
    config:
      file: dedup.yaml
      path: dedup.edge_scope
    current_default: content
    provenance: our_invention
    tier: technical
    why_it_matters: >-
      ✅ MEASURED consequence: two 11-member Tier-1 exact-duplicate groups that are
      near-duplicates of each other would emit 121 `DedupEdge` rows under `file` scope
      (11 x 11, since NONE of the internal pairs carry an EXACT edge under Tier-1's
      default `star` topology — only 5 of the 11 members' 15 possible pairs, in a
      6-member group, hub on the representative) and exactly 1 under `content` scope.
      `content` scope is ALSO what makes the EXACT/NEAR ladder correct BY CONSTRUCTION:
      a sha256 group is a single node, so a byte-identical pair can never even become a
      candidate for a spurious NEAR edge. The naive alternative — "skip a pair if it
      already carries an EXACT edge" — is WRONG and quietly so, because Tier-1's `star`
      topology means most of a large identical group's internal pairs carry NO EXACT
      edge at all; a 6-member byte-identical group under `star` has only 5 of 15 pairs
      covered. Pinned by `test_a_six_member_exact_duplicate_group_gets_zero_near_edges`
      — a pair-sized test cannot catch this, because `star` and `clique` coincide on a
      pair of two. Both scopes are IMPLEMENTED — a knob whose alternative does nothing
      is the `cluster_algo` landmine (HR-123) in a new place.
    impact_if_changed: >-
      Moves `dedup.stamp`, forcing a full Tier-2 re-run. `file` scope produces
      dramatically more edges for large exact-duplicate groups (quadratic in group
      size) with zero new information over `content` scope's one edge per group pair —
      Tier-1's `redundant_files` count already says how many files that is. `file`
      scope would ALSO require re-introducing the "already has an EXACT edge" check
      this design deliberately avoids, and getting it right for a non-star topology
      (HR-123's `clique` alternative) is exactly the kind of quiet correctness trap
      this decision exists to close off.
    status: open

  # ═══ WJQ / CUPE TEMPLATE (Phase 3.4) ════════════════════════════════════════
  # A SECOND document template. Everything below is `our_invention` and `open`: SFU
  # publishes no machine-readable WJQ schema, and the earlier build never taught a parser this form.
  # `wjq.yaml` is HASHED (part of `rules_version`), unlike segmentation/embeddings/dedup —
  # it decides which text becomes a WJQ JD's summary/duties/qualifications, which changes
  # what the validator computes about that JD.

  - id: HR-141
    question: >-
      How do we recognise that a job description is on SFU's CUPE / Weighted Job
      Questionnaire template rather than the APSA/APEX/POLY one?
    config:
      file: wjq.yaml
      path: wjq.marker_primary
    current_default:
      - WEIGHTED JOB QUESTIONNAIRE
    provenance: our_invention
    tier: technical
    why_it_matters: >-
      Detection is whole-document, case-insensitive, and MARKER-based, never
      filename-based (the `JDFN_CUPE` filename token covers only ~771 files, so trusting
      the name would miss ~85% of the WJQ corpus). It is also TWO-TIER: this DEFINITIVE
      title phrase alone routes a document to WJQ, because a JDFN JD would never carry it;
      the looser union markers (`LOCAL 3338` / `C.U.P.E`, `wjq.marker_corroborating`)
      route only in pairs, because each ALSO appears when a JDFN JD merely cites the union
      in a duty. ✅ MEASURED: a bare `LOCAL 3338` misrouted 69 real JDFN JDs (old 7 /
      transition 51 / new 11) — emptying their rich parse and stamping them `wjq`, which
      excluded the 11 `new`-era ones from the very cohort HR ratifies the bar against.
      Under the shipped two-tier rule ~29% of the archive routes to WJQ. The title phrase
      SURVIVES antiword on legacy `.doc`.
    impact_if_changed: >-
      Moves `rules_version` (this file is hashed). Dropping the primary phrase (or
      loosening the corroboration to 1) re-admits the union-citation misroute; adding a
      too-common phrase would pull JDFN JDs onto the WJQ path (they parse to ~nothing).
      Pinned by mutation (`test_parser_wjq.py`: remove the marker from a WJQ fixture -> it
      routes JDFN; a JDFN doc citing "CUPE, Local 3338" routes `jdfn`, not `wjq`).
    status: open

  - id: HR-142
    question: >-
      What does a WJQ duty's `(D)` / `(W)` / `(M)` / `(S)` frequency tag mean, and should
      it be captured as a field on the duty?
    config:
      file: wjq.yaml
      path: wjq.frequency_markers
    current_default:
      D: daily
      W: weekly
      M: monthly
      S: semester
    provenance: our_invention
    tier: hr_informed
    why_it_matters: >-
      SFU's WJQ MAJOR FUNCTIONS section tags each duty with how often it is performed.
      The user's decision (Phase 3.4) is to ADD a `frequency` field to `SFUDuty`
      (additive, optional; JDFN duties leave it `None`), strip the marker from the duty
      statement, and store the meaning here. The detection is anchored to a STANDALONE,
      UPPERCASE `(D)/(W)/(M)/(S)` token — the false-positive guard against lowercase
      `(s)` mid-word (`location(s)`, ✅ present in the archive), which must never read as
      a frequency.
    impact_if_changed: >-
      Moves `rules_version`. Pinned by mutation (`test_parser_wjq.py`: a duty with a
      trailing `(D)` gets `frequency == "daily"` and the marker stripped; a duty
      containing `location(s)` is neither split nor tagged).
    status: open

  - id: HR-143
    question: >-
      Should CUPE / WJQ-template job descriptions be excluded from the "current practice"
      cohort that the JDFN approval bar is ratified against?
    config:
      file: segmentation.yaml
      path: segmentation.wjq_excluded_from_current_practice
    current_default: true
    provenance: our_invention
    tier: hr_policy
    why_it_matters: >-
      The WJQ questionnaire is a DIFFERENT template with no About-SFU / territorial footer
      by design, so `SFU-APPROVE-EDI-FOOTER` fails it for a reason that has nothing to do
      with its quality — scoring it on the JDFN bar is a category error. ✅ MEASURED: the
      WJQ marker's era split is old 1,848 / transition 1,991 / new 1,011 / current 182, so
      without this exclusion 1,193 newly-parseable WJQ files (v2 router) would flow into
      the 874-JD cohort and move the number HR ratifies. Whether CUPE gets an approval bar
      of its OWN is a SEPARATE deferred HR decision — deliberately NOT built here.
    impact_if_changed: >-
      Does not move `rules_version` (segmentation.yaml is unhashed) but moves
      `Segmentation.stamp`. `false` lets WJQ JDs into `current_practice_cohort` and shifts
      its approval rate. Pinned by mutation (`test_baseline_aggregate.py`: a current-era
      WJQ file is in the cohort under `false`, excluded under `true`).
    status: open

  - id: HR-144
    question: >-
      What are the 14 section headings of the WJQ template, and how is each recognised
      (numbering, `(CONTINUED)` recurrence, line-wrap)?
    config:
      file: wjq.yaml
      path: wjq.section_headings
    current_default:
      position_identification: [POSITION IDENTIFICATION]
      position_summary: [POSITION SUMMARY]
      major_functions: [MAJOR FUNCTIONS]
      minor_functions: [MINOR FUNCTIONS]
      level_of_independence: [LEVEL OF INDEPENDENCE, LEVEL OF]
      training_exercised: [TRAINING EXERCISED]
      direction_exercised: [DIRECTION EXERCISED]
      internal_external_contacts: [INTERNAL AND EXTERNAL CONTACTS]
      impact_of_errors: [IMPACT OF ERRORS]
      effort: [EFFORT]
      working_conditions: [WORKING CONDITIONS]
      continuing_education: [CONTINUING EDUCATION]
      qualifications: [QUALIFICATIONS]
      approval_review: [APPROVAL AND REVIEW]
    provenance: our_invention
    tier: technical
    why_it_matters: >-
      This vocabulary is how a WJQ document is cut into sections, so it directly decides
      which text becomes a JD's `position_summary` / `duties` / `qualifications` — which
      is why the whole file is hashed. ✅ MEASURED heading counts (e.g. POSITION
      IDENTIFICATION 2,109 · MAJOR FUNCTIONS 2,091 · QUALIFICATIONS present in nearly
      every file). `LEVEL OF` is the wrap variant of `LEVEL OF INDEPENDENCE`; a repeated
      heading with a `(CONTINUED)` suffix concatenates onto the same section.
    impact_if_changed: >-
      Moves `rules_version`. A heading that stops matching drops its whole section's
      text from the parse. Pinned by mutation (`test_wjq_rules.py`: rename a heading and
      a WJQ parse test goes red; `test_rules_version.py` proves the hash moved).
    status: open

  - id: HR-145
    question: >-
      Where do the WJQ point-factor (Hay) sections go — and is IMPACT OF ERRORS mapped to
      the JDFN Decision-Making / Problem-Solving fields?
    config:
      file: wjq.yaml
      path: wjq.context_sections
    current_default:
      - level_of_independence
      - training_exercised
      - direction_exercised
      - impact_of_errors
      - effort
      - working_conditions
      - continuing_education
    provenance: our_invention
    tier: hr_informed
    why_it_matters: >-
      These seven checkbox/point-factor sections are stored VERBATIM in
      `additional_context` (lossless), NOT mapped to `decision_making` / `problem_solving`
      — which are left EMPTY. WJQ carries no Hay Accountability / Problem-Solving prose,
      and force-mapping IMPACT OF ERRORS -> decision_making would feed
      `bank/hay_signals.py` a bogus signal. ✅ MEASURED: the checkbox glyphs are
      unreliable (present in 280/2,553 `.docx`, 0/2,473 `.doc`), so the sections are
      treated as plain text. The embedding-quality concern (checkbox boilerplate diluting
      WJQ vectors) is an explicit Phase-3.5 follow-up, NOT solved here.
    impact_if_changed: >-
      Moves `rules_version`. Removing a section here drops it from `additional_context`.
      Pinned by mutation (`test_wjq_rules.py`).
    status: open

  - id: HR-146
    question: >-
      How is each WJQ qualification classified as education / experience / skill /
      ability?
    config:
      file: wjq.yaml
      path: wjq.qualification_cues
    current_default:
      education: [formal education]
      experience: [number of years, years of minimum experience, minimum experience]
      skill: [occupational skill]
      ability: [occupational requirement]
    provenance: our_invention
    tier: technical
    why_it_matters: >-
      The WJQ QUALIFICATIONS section is a sequence of instruction-led blocks; a cue line
      switches the `kind` of the qualifications that follow it (`SFUQualification.kind`).
      Grounded in the real form's wording ("Formal education qualifications…",
      "Occupational Skills…", "Occupational Requirement(s)…", "the number of years of
      minimum experience…"). `kind` feeds the KSA-order gate, so it is on the hashed
      surface.
    impact_if_changed: >-
      Moves `rules_version`. Pinned by mutation (`test_parser_wjq.py`: qualifications get
      the expected kinds).
    status: open

  - id: HR-147
    question: >-
      Which WJQ POSITION IDENTIFICATION field labels supply the JD's title, department,
      position number and grade?
    config:
      file: wjq.yaml
      path: wjq.id_labels
    current_default:
      title: [Department Position Title, Position Title]
      department: [Department Name]
      position_number: [Position Number(s), Position Number]
      grade: [Classification & Grade Approved, Classification and Grade Approved]
    provenance: our_invention
    tier: technical
    why_it_matters: >-
      These inline labels are read to populate `title` / `department` / `position_number`
      / `grade`. ✅ MEASURED: the `.docx` template carries `Department Position Title`;
      many `.doc` renders omit it, so `title` falls back to `Untitled Position` rather
      than misreading the SFU/CUPE banner line (the base parser's WJQ title misread was
      one of the finding's symptoms). Reading the label — not a hardcoded column — is
      what makes the extraction data-driven.
    impact_if_changed: >-
      Moves `rules_version`. Pinned by mutation (`test_parser_wjq.py`: rename the title
      label and `title` becomes `Untitled Position` — proving it reads the data, not a
      hardcode).
    status: open

  - id: HR-148
    question: What employee group does the WJQ marker imply?
    config:
      file: wjq.yaml
      path: wjq.employee_group
    current_default: cupe
    provenance: our_invention
    tier: technical
    why_it_matters: >-
      CUPE 3338 is the WJQ bargaining unit (the JDFN template covers APSA/APEX/POLY, which
      are Hay-graded). Set on the parsed JD's `employee_group` so the two templates cannot
      cross-apply. Held as data and validated against the `SFUEmployeeGroup` vocabulary at
      load, rather than hardcoded in `parser/wjq.py`.
    impact_if_changed: >-
      Moves `rules_version`. Pinned by mutation (`test_parser_wjq.py`: a parsed WJQ JD has
      `employee_group == "cupe"`).
    status: open

  # ═══ COMPARISON SIGNALS: the ParsedJD -> JobSignals adapter (Phase 3.4a) ═════
  # ADR-007. The 2.4c similarity/clustering/drift maths finally gets an input, derived
  # from a parsed SFU JD by `bank/signals.py`. Everything here is `our_invention` and
  # `open`: SFU publishes no skill ontology, no skill stopword list and no rule for
  # reading a years bar out of prose; the earlier build had an ontology + idf corpus JD Bank does not.
  # Each default below is MEASURED against the live archive, and each carries an HONEST
  # consequence (a keyword bag is not an ontology; 41% of JDs yield no skills). These are
  # comparison.yaml fields, which IS hashed — correct: they change what the clusterer
  # computes.

  - id: HR-149
    question: >-
      Which qualification kinds are treated as the source of a JD's SKILLS?
    config:
      file: comparison.yaml
      path: comparison.skill_source_kinds
    current_default: [ability, knowledge, skill]
    provenance: our_invention
    tier: hr_informed
    why_it_matters: >-
      The skill keyword-bag is built ONLY from these kinds. `skill`/`knowledge`/`ability`
      carry what a role needs to know and do; `experience` and `education` are
      deliberately EXCLUDED because they inject year-counts ("five years") and degree
      words ("bachelor") into the bag as if they were skills. MEASURED context: 41% of
      archive JDs have zero qualifications of any kind, so their skill bag is empty — an
      honest consequence, not a bug (`build_job_signals` returns `frozenset()`). Note
      `knowledge` ALSO feeds education detection (HR-153): the same JDFN blob legitimately
      states both a degree and a domain.
    impact_if_changed: >-
      Moves `rules_version`. Adding `experience`/`education` would pollute the bag with
      seniority tokens; dropping `knowledge` would empty the bag for JDFN JDs that state
      their competencies only in the knowledge blob. Pinned by mutation in
      `test_bank_signals.py`.
    status: open

  - id: HR-150
    question: >-
      Which noise tokens are stripped from the skill keyword-bag?
    config:
      file: comparison.yaml
      path: comparison.skill_stopwords
    current_default:
      - ability
      - accuracy
      - applications
      - degree
      - education
      - equivalent
      - excellent
      - experience
      - good
      - high
      - knowledge
      - level
      - management
      - related
      - skills
      - training
      - with
      - word
      - work
      - years
    provenance: our_invention
    tier: technical
    why_it_matters: >-
      MEASURED: these are the 20 most frequent tokens across the archive's 5,584-token
      skill vocabulary, and they dominate it — `ability, excellent, knowledge, skills,
      with, experience, work, degree, good, related, ...`. Without stripping them the bag
      is meaningless (every JD "overlaps" on `ability` and `experience`). ⚠ HONEST
      CONSEQUENCE: genuinely contentful tokens like `management` and `applications` are
      stripped too. That is acceptable ONLY because this is a keyword bag, not an
      ontology, and idf-weighting (Phase 3.4b) is what will actually separate distinctive
      skills from ubiquitous ones — a stopword list is the crude stand-in until then. Do
      NOT read this as a curated skill vocabulary.
    impact_if_changed: >-
      Moves `rules_version`. Emptying it re-floods the bag with the top-20 noise (pinned
      by mutation in `test_bank_signals.py`: a CUPE skill-list JD's bag gains `experience`
      / `knowledge` once the list is emptied). A real fix is idf, not a longer list.
    status: open

  - id: HR-151
    question: >-
      What is the minimum length of a skill keyword?
    config:
      file: comparison.yaml
      path: comparison.skill_min_token_len
    current_default: 3
    provenance: our_invention
    tier: technical
    why_it_matters: >-
      Tokens shorter than this are dropped before they reach the bag, removing 1-2 char
      noise (`a`, `of`, stray list-numbering). 3 keeps `hr`, `it`, `qa`? — no, those are
      length 2 and are dropped; a genuinely 2-letter skill acronym would be lost, which is
      the cost of a blunt length cut and another reason the bag is a stopgap for idf.
    impact_if_changed: >-
      Moves `rules_version`. Raising it drops more short tokens; lowering it to 1 lets
      single characters in. Pinned by mutation in `test_bank_signals.py`.
    status: open

  - id: HR-152
    question: >-
      Are SPELLED-OUT year counts ("five years") read as an experience bar, and which
      words map to which numbers?
    config:
      file: comparison.yaml
      path: comparison.experience_word_numbers
    current_default:
      eight: 8
      eighteen: 18
      eleven: 11
      fifteen: 15
      five: 5
      four: 4
      fourteen: 14
      nine: 9
      nineteen: 19
      one: 1
      seven: 7
      seventeen: 17
      six: 6
      sixteen: 16
      ten: 10
      thirteen: 13
      three: 3
      twelve: 12
      twenty: 20
      two: 2
    provenance: our_invention
    tier: technical
    why_it_matters: >-
      A real, MEASURED bug in the digit-only `experience_years_pattern` (HR-102): SFU's
      JDFN template WRITES YEARS OUT — "five years of related experience", "(one|two|…|ten)
      years" — so the digit regex matched only 226 JDFN JDs where 4,585 of 4,888 are
      derivable. The number words are DATA (non-negotiable #2 — NOT hardcoded in
      `drift.py`); `Comparison.experience_word_year_pattern` derives the matcher from these
      keys (single source of truth), requiring the count be followed by "year" exactly as
      the digit path does, so a bare determiner never reads as a year count. `a`/`an` are
      deliberately EXCLUDED — an unmeasured call, and mapping determiners to 1 risks false
      counts; flagged for review.
    impact_if_changed: >-
      Moves `rules_version`. Emptying the map turns word support off (digits still work) —
      pinned by mutation in `test_bank_drift.py` / `test_bank_signals.py`: a JDFN blob
      "five years of related experience" yields None once the map is emptied, proving the
      fix is load-bearing.
    status: open

  - id: HR-153
    question: >-
      Which qualification kinds may an EDUCATION requirement be read out of?
    config:
      file: comparison.yaml
      path: comparison.education_source_kinds
    current_default: [education, knowledge]
    provenance: our_invention
    tier: hr_informed
    why_it_matters: >-
      Two facts pull in opposite directions and `[education, knowledge]` is the balance
      point. (1) SFU's JDFN template files the degree inside the `knowledge` blob —
      "Bachelor's degree in Computing Science or related discipline, and five years of
      related experience" is kind=knowledge, not kind=education — so `knowledge` is
      REQUIRED beyond `education`. Scoped to JDFN, reading `kind == education` alone finds
      a degree in only ~40 of ~10,000 JDFN JDs. (2) BUT the bachelors cue list contains the
      bare substring `degree`, and SFU's CUPE clerical JDs say "55 wpm keyboarding skill
      with a high degree of accuracy" under kind=skill/ability, which `degree` misreads as
      a bachelors. MEASURED over the WHOLE v2 corpus with the real `education_level_from_quals`:
      all-6-kinds -> 8,417 extractions but 1,161 are "degree of ..." FALSE-POSITIVE
      bachelors (18.6% of all bachelors, a systematic clerical-typist upward bias);
      [education, knowledge] -> 7,880 (93.6% of the all-6 win) with only 4 such FPs (-99.7%);
      [education] alone -> 3,307 (loses the JDFN blob degrees). So `[education, knowledge]`
      keeps almost the whole win and removes almost all the noise, and it is DATA.
    impact_if_changed: >-
      Moves `rules_version`. Adding `skill`/`ability` back re-injects the ~1,161 "degree of
      accuracy" false positives; dropping `knowledge` loses the JDFN blob degrees. Pinned by
      mutation in `test_bank_drift.py` / `test_bank_signals.py`: a JD whose only degree
      signal is in a `knowledge` qual yields None under `[education]`, and a `skill` qual
      saying "high degree of accuracy" yields an ordinal once `skill` is added back.
    status: open

  - id: HR-154
    question: >-
      Which qualification kinds is a JD's EXPERIENCE bar read from, and in what fallback
      order?
    config:
      file: comparison.yaml
      path: comparison.experience_source_kinds
    current_default: [experience, knowledge]
    provenance: our_invention
    tier: hr_informed
    why_it_matters: >-
      The adapter reads the years bar from these kinds IN ORDER — the first that yields any
      count wins. `experience` quals are authoritative; `knowledge` is the JDFN fallback,
      because JDFN spells the years inside the same knowledge blob that carries the degree
      ("...and five years of related experience"). Order is policy, not cosmetic: a JD
      stating "2 years" under experience and "10 years" inside a knowledge blob reads as 2,
      not 10 (fallback, not union). Held as DATA so this matches its siblings HR-149
      (skills) / HR-153 (education) rather than being a bare literal tuple in signals.py —
      the standing rule is that every non-trivial signal-source decision is on the surface.
    impact_if_changed: >-
      Moves `rules_version`. `[experience]` alone would miss every JDFN JD whose bar lives
      only in the knowledge blob; reordering to `[knowledge, experience]` would let a blob
      count override an explicit experience qual. Pinned by mutation in
      `test_bank_signals.py` (a knowledge-only JD yields its blob years; emptying the
      fallback loses them).
    status: open

  # ─── Tier-3 role-equivalence (Phase 3.4b) ───────────────────────────────────
  # The runner writes `DedupEdge(tier=ROLE_EQUIVALENT)` for SAME-ROLE pairs. Every
  # value below is JD Bank's own (the earlier build had no Tier-3 pass) and MEASURED on the archive.

  - id: HR-155
    question: >-
      Which title seniority bands are "too far apart to be the same role", and where does
      each title family sit on that band ladder?
    config:
      file: comparison.yaml
      path: comparison.family_band_ladder
    current_default:
      assistant: 0
      associate: 1
      chief: 5
      director: 4
      lead: 2
      manager: 3
      vp: 6
    provenance: our_invention
    tier: hr_informed
    why_it_matters: >-
      This is the HARD constraint on role-equivalence: a pair whose title families sit
      more than `max_band_gap` (HR-156) bands apart is NEVER role-equivalent, whatever the
      blended score. The bands are the reverse-index of the HR-059 seniority ladder
      (`titles.yaml :: families`), highest first. ⚠ PARTIAL BY DESIGN: `unmapped` carries
      NO band (the loader FORBIDS giving it one), and MEASURED 70% of archive titles are
      `unmapped` — the HR-059 ladder classifies only ~30% — so the veto fires ONLY when
      BOTH sides map. On that 30% it cleanly stops director<->assistant merges; the
      threshold (HR-158) does the rest. Note the ladder itself is inherited the earlier build
      calibration nobody at SFU has ratified (HR-059), so this band map inherits that
      caveat: it is a defensible ordering, not an SFU standard.
    impact_if_changed: >-
      Moves `rules_version`. Collapsing all families to one band disables the veto;
      giving adjacent families the same band widens what counts as "same band". Pinned by
      mutation in `test_dedup_role_pure.py` (a director<->assistant pair is dropped
      pre-scoring even at blended 1.0; setting `max_band_gap` high lets it survive) and by
      the loader refusing to load an `unmapped` band.
    status: open

  - id: HR-156
    question: >-
      How many seniority bands apart may two titles be and still be considered the same
      role?
    config:
      file: comparison.yaml
      path: comparison.max_band_gap
    current_default: 1
    provenance: our_invention
    tier: hr_informed
    why_it_matters: >-
      The conflict veto (HR-155) fires when the two families' bands differ by MORE than
      this. 1 keeps adjacent rungs admissible (a Manager and a Lead can still be scored as
      the same role) while vetoing a two-rung gap (Director vs Lead) and anything wider
      (Director vs Assistant). It only bites on the ~30% of pairs where BOTH titles map to
      a band.
    impact_if_changed: >-
      Moves `rules_version`. 0 would require the SAME band exactly; a large value disables
      the veto entirely (everything is "close enough"). Pinned by mutation in
      `test_dedup_role_pure.py`.
    status: open

  - id: HR-157
    question: >-
      Should two JDs from DIFFERENT employee groups (e.g. APSA vs CUPE) be barred from
      being the same role?
    config:
      file: comparison.yaml
      path: comparison.group_conflict_veto
    current_default: true
    provenance: our_invention
    tier: hr_informed
    why_it_matters: >-
      A SOFT veto: when `true`, a pair whose two `employee_group`s are BOTH known and
      DIFFER is dropped before scoring — an APSA role and a CUPE role are governed by
      different agreements and instruments and are not the same position. It vetoes ONLY
      when both sides state a group; an unknown group is NOT a conflict (a null never
      vetoes), so a JD whose group could not be read is still eligible.
    impact_if_changed: >-
      Moves `rules_version`. `false` lets cross-group pairs through to scoring. Pinned by
      mutation in `test_dedup_role_pure.py` (an apsa<->cupe pair is dropped, but an
      apsa<->null pair is never dropped; turning the veto off lets the apsa<->cupe pair
      survive).
    status: open

  - id: HR-158
    question: >-
      What blended similarity score must two JDs reach before they are recorded as the
      SAME ROLE (role-equivalent)?
    config:
      file: comparison.yaml
      path: comparison.role_equiv_threshold
    current_default: 0.5
    provenance: our_invention
    tier: technical
    why_it_matters: >-
      The threshold on the blended `score_job_similarity` (vector + idf-weighted skill
      overlap + seniority). MEASURED: on real pairs, Tier-2 near-dup weak-positives vs
      random-same-function negatives separate at 0.5 -> 99.2% positive / 3.0% negative. ⚠
      HONEST CAVEAT (the SAME lesson as 3.3's `jaccard_min`, HR-138): the positives are
      Tier-2 near-dup WEAK LABELS and are vector-dominated; genuinely-different-text
      same-role pairs lean on skill overlap, and there is NO honest precision/recall oracle
      — so this ships with a pinned behavioural fixture + a stratified adjudication sample
      (`docs/dedup/role-equiv-adjudication-sample.csv`), and CI is NOT gated on P/R. The
      blended score is BIMODAL: 41% of JDs have empty skills and floor ~0.52 on
      vector+seniority alone; skill-overlapping pairs reach 0.9+. Honest, not a bug.
    impact_if_changed: >-
      Moves `rules_version` AND re-reconciles every Tier-3 edge (the threshold rides in the
      edge `method` stamp, so a retune UPDATES or PRUNES existing rows, never leaves them
      stale). Raising it demands more agreement; lowering it merges more aggressively.
      Pinned by mutation in `test_dedup_role_pure.py` (0.5 in / 0.4999 out at the default;
      raising the threshold drops a boundary pair) and by the integration reconcile test.
    status: open

  - id: HR-159
    question: >-
      How many nearest neighbours per JD are generated as role-equivalence CANDIDATES?
    config:
      file: comparison.yaml
      path: comparison.candidate_k
    current_default: 25
    provenance: our_invention
    tier: technical
    why_it_matters: >-
      Candidate generation buckets JDs by their functional title `function` and, within a
      bucket, takes each JD's top-`candidate_k` cosine neighbours as candidate pairs (plus
      the Tier-2 near-dup seeds, HR-160). This is a candidate-GENERATION knob (recall vs
      cost), NOT a decision about whether a given pair is the same role — the veto (HR-155)
      and threshold (HR-158) decide that. ⚠ A STARTING VALUE, not a measured optimum:
      cosine is saturated on this corpus (98% of JDs have a neighbour >= 0.92), so k-NN
      alone returns a dense blob and 25 is a first cut to be TUNED by the adjudication
      sample once a human has labelled candidates.
    impact_if_changed: >-
      Moves `rules_version`. Larger = more candidates surfaced (more recall, more scoring
      cost); it does not change any surviving edge's score. Pinned by the pure candidate
      test. ⚠ PERF FOLLOW-UP (not a 3.4b blocker): candidate generation is O(bucket²) —
      Python all-pairs cosine within each `function` bucket. The largest real bucket is
      `unmapped` (~8,215 docs) -> ~44 min for that bucket, ~1 hour whole-archive; it
      COMPLETES (candidates are k-bounded, no overflow). The 3.5-era optimization is to
      use the existing Neo4j 768-dim cosine vector index for true top-k retrieval instead
      of the all-pairs scan.
    status: open

  - id: HR-160
    question: >-
      Should every Tier-2 near-duplicate pair be treated as a guaranteed role-equivalence
      candidate?
    config:
      file: comparison.yaml
      path: comparison.seed_from_near_dup
    current_default: true
    provenance: our_invention
    tier: technical
    why_it_matters: >-
      When `true`, every existing `DedupEdge(tier=NEAR_DUPLICATE)` pair is admitted as a
      candidate in addition to the cosine k-NN — a near-dup IS role-equivalent, so it must
      not be missed. It also lets a pair reach Tier-3 when one side has NO document vector
      (118 empty-serialization + 11 token-limit JDs): such a pair cannot be a cosine
      neighbour, but it can be a near-dup seed, and it scores with `vector_score` 0.0 on
      skill + seniority alone.
    impact_if_changed: >-
      Moves `rules_version`. `false` restricts candidates to cosine k-NN and silently drops
      the vector-less near-dups. Pinned by the pure candidate test (a near-dup-seeded pair
      with no vector still scores).
    status: open

  # ── Clustering: the Phase-3.5 role-cluster runner (report-only). HR-161…HR-166.
  - id: HR-161
    question: >-
      Which dedup tiers (exact, near-duplicate, role-equivalent) may connect two JDs into
      the same role cluster?
    config:
      file: comparison.yaml
      path: comparison.cluster_tiers
    current_default: [exact, near_duplicate, role_equivalent]
    provenance: our_invention
    tier: technical
    why_it_matters: >-
      Clustering runs connected-components over the `dedup_edges` graph. EXACT (byte-
      identical, score 1.0) and NEAR (MinHash/Jaccard >= 0.85) are always-in: they are
      strong, well-scaled evidence of the same role. ROLE_EQUIVALENT edges are additionally
      gated by `cluster_role_equiv_min` (HR-162), because the raw Tier-3 score is bimodal
      and clustering over it at the Tier-3 bar collapses the archive into one blob. Dropping
      a tier here removes a whole class of evidence; adding a tier JD Bank does not write is
      inert (no such edge exists).
    impact_if_changed: >-
      Moves `rules_version`. Report-only — persists nothing. Pinned by mutation in the pure
      admit tests (an EXACT edge is dropped when `exact` is removed from the set) and by the
      integration clustering test.
    status: open

  - id: HR-162
    question: >-
      How strong must a role-equivalence (Tier-3) edge be before it is allowed to MERGE two
      JDs into the same cluster?
    config:
      file: comparison.yaml
      path: comparison.cluster_role_equiv_min
    current_default: 0.75
    provenance: our_invention
    tier: technical
    why_it_matters: >-
      THE load-bearing clustering decision, and it is ABOVE the Tier-3 `role_equiv_threshold`
      (0.5, HR-158) BY DESIGN: Tier-3 records a same-role PAIR, clustering takes the
      TRANSITIVE CLOSURE, so the bar to merge must be higher than the bar to record one edge.
      MEASURED sweep of the ROLE gate against the largest resulting cluster: 0.5->8884-JD
      blob (61% of the archive), 0.6->1940, 0.65->1302, 0.7->696, 0.75->132, 0.8->61. 0.75 is
      the knee — the first gate at which no cluster exceeds ~200 members and the archive-wide
      blob breaks apart. ⚠ The Tier-3 ROLE score is BIMODAL (41% skill-empty pairs floor
      ~0.52 on vector+seniority alone), which is exactly why a low gate over-merges. ⚠ Note
      that once the runner calls `build_clusters(threshold=0.0)` on the admitted edges, the
      DERIVED `cluster_threshold` (HR-096) / `cluster_threshold_floor` (HR-095) no longer
      gate this path — this knob replaces them for clustering.
    impact_if_changed: >-
      Moves `rules_version`. Report-only. THE blob lever: lower it and clusters merge into a
      giant blob (0.5 -> 8,884 JDs in one), raise it and the Bank finds less redundancy to
      harmonize. Pinned by mutation in the "blob guard" test — a fixture whose low-score ROLE
      edges transitively merge a blob at 0.5 but NOT at 0.75; setting this knob to 0.5 makes
      the blob reappear (red).
    status: open

  - id: HR-163
    question: >-
      How many seniority bands may a role cluster's members span before it is flagged for HR
      review?
    config:
      file: comparison.yaml
      path: comparison.cluster_max_band_spread
    current_default: 1
    provenance: our_invention
    tier: hr_informed
    why_it_matters: >-
      The cohesion cap on seniority: a cluster whose MAPPED members (the ~30% on the HR-059
      family band ladder) span more than this many bands is FLAGGED (never split) as
      possibly welding a director to an assistant. Set to `max_band_gap` (HR-156) by intent
      — the same "how far apart is too far" call, applied to the whole cluster rather than a
      single edge. ⚠ NEAR-INERT on this corpus: 70% of titles are `unmapped` (no band), so
      the check bites only where both a spread and a mapping exist; the ROLE gate and the
      size cap do the real work. A cheap correctness backstop, honestly weak.
    impact_if_changed: >-
      Moves `rules_version`. Report-only — it sets a `constraint_violations` flag and the
      report's sort order, never the cluster membership. Pinned by mutation in the pure
      cohesion-cap test (a band-0/1/2 chain flags `band_spread` at 1 but not when raised).
    status: open

  - id: HR-164
    question: >-
      Should a role cluster that mixes more than one known employee group (e.g. APSA + CUPE)
      be flagged for HR review?
    config:
      file: comparison.yaml
      path: comparison.cluster_group_homogeneous
    current_default: true
    provenance: our_invention
    tier: hr_informed
    why_it_matters: >-
      The cohesion cap on employee group: when `true`, a cluster spanning more than one
      KNOWN `employee_group` is FLAGGED (never split). An unknown group is never a mix (a
      null never flags). ⚠ NEAR-INERT: `employee_group` is non-null on only 36% of JDs, so
      most clusters cannot trip this at all — it catches the clear APSA<->CUPE case a
      null-group JD bridged, and nothing more. The ROLE gate + the human eyeball carry the
      cohesion argument; this is a backstop.
    impact_if_changed: >-
      Moves `rules_version`. Report-only (a flag + sort order, not membership). Pinned by
      mutation in the pure cohesion-cap test (a null-group-bridged APSA+CUPE cluster flags
      `group_mix` when `true`, and does not when `false`).
    status: open

  - id: HR-165
    question: >-
      Above how many members is a role cluster flagged as oversize (too big for one canonical
      JD without HR eyes)?
    config:
      file: comparison.yaml
      path: comparison.cluster_max_size
    current_default: 50
    provenance: our_invention
    tier: hr_informed
    why_it_matters: >-
      The cohesion cap on size: a cluster with more than this many members is FLAGGED (never
      split). MEASURED at gate 0.75 the clusters with >50 members are [132, 108, 74, 57, 52]
      — exactly the ones an HR reviewer must eyeball before they become a single canonical
      role. A flag, not a split: a report surfaces them; it does not silently break a real
      role apart on a member count.
    impact_if_changed: >-
      Moves `rules_version`. Report-only. Lower it and more clusters carry the `oversize`
      flag (more HR review); raise it and the biggest clusters pass unremarked. Pinned by
      mutation in the pure cohesion-cap test.
    status: open

  - id: HR-166
    question: >-
      How does a role cluster pick the member that every other member's drift is measured
      against (and that the report names)?
    config:
      file: comparison.yaml
      path: comparison.cluster_representative_policy
    current_default: max_parse_confidence
    provenance: our_invention
    tier: hr_informed
    why_it_matters: >-
      The cluster's drift/report anchor. `max_parse_confidence` picks the best-parsed
      member (tie-break: the `order_key` archive order, deterministic), so the within-cluster
      drift roll-up compares every member to the most reliably-read JD rather than an
      arbitrary one. A closed set (like `cluster_algo`, HR-093): a data-only switch to an
      unimplemented policy fails to LOAD rather than stamping a report with an anchor the
      runner never used.
    impact_if_changed: >-
      Moves `rules_version`. Report-only — it changes which member is the drift baseline and
      the `representative_filename` column, never the cluster membership. Pinned by the pure
      representative test (highest parse_confidence wins; ties break on `order_key`).
    status: open

  # ── Harmonization: the Phase-4.1 deterministic merge engine. HR-167…HR-175.
  # Every default is our_invention and PROVISIONAL — SFU publishes no harmonization
  # policy and the earlier build harmonized via an LLM prompt (no deterministic merge policy to
  # inherit). All are starting values, to be calibrated by a post-run measurement pass
  # over the real JDFN role clusters (mirroring 3.5's measure-after pattern). They live
  # in the UNHASHED `harmonization.yaml` (a merge-policy change must not churn the digest
  # that identifies which rules SCORED a JD).
  - id: HR-167
    question: >-
      How should the harmonization engine choose the canonical TITLE for a role cluster's
      merged draft?
    config:
      file: harmonization.yaml
      path: harmonization.title_policy
    current_default: modal_normalized
    provenance: our_invention
    tier: hr_informed
    why_it_matters: >-
      The draft's title is descriptive, not authoritative (a human approves it later).
      `modal_normalized` groups members by their `normalize_title` stem, takes the
      most-populous group (the role the cluster mostly is), and picks the representative
      raw title by SHORTEST-then-lexicographic — a deterministic tie-break so the same
      member SET yields a byte-identical draft in any order. It does NOT rewrite the title
      (that is 4.2). `first_raw` is the trivial alternative (lexicographically-first raw
      title, modality ignored). MEASURED (1,801 JDFN clusters): the modal role DOMINATES —
      72% (1,297) carry a single distinct normalized title, and the modal-group fraction
      spikes at 0.9–1.0 (1,308 clusters), so representative-of-modal reflects what the
      cluster mostly is. Kept.
    impact_if_changed: >-
      Does NOT move `rules_version` (harmonization.yaml is unhashed). Pure, report-only —
      it only changes the drafted title a human reviews. Pinned by mutation in the pure
      title-selection test (a cluster whose modal-group representative differs from the
      lexicographically-first raw title flips its drafted title when set to `first_raw`).
    status: open

  - id: HR-168
    question: >-
      How should the engine pick which member's POSITION SUMMARY becomes the draft's
      summary (with no rewrite)?
    config:
      file: harmonization.yaml
      path: harmonization.summary_policy
    current_default: within_target_then_central
    provenance: our_invention
    tier: hr_informed
    why_it_matters: >-
      4.1 is deterministic and LLM-free, so it SELECTS an existing member summary verbatim
      rather than composing one (rewrite is 4.2). `within_target_then_central` prefers a
      summary already inside SFU's published 100–150-word range
      (`thresholds.summary_min_words`/`_max_words` — one rulebook fact, one home), then the
      most-central (highest token-Jaccard to the others), falling back to most-central over
      all when none is in range. `most_central` drops the in-range preference. Choosing an
      in-range summary is what keeps the draft from tripping SUMMARY-LENGTH — the single
      biggest operative gate (HANDOFF: 134 of 187 current-practice blocks). MEASURED (1,798
      multi-member JDFN clusters): an in-range (100–150w) summary exists in 731 clusters and
      is chosen every time one exists; 1,050 have a summary but none in range and fall back
      to most-central; the remaining ~17 carry no member summary at all. The in-range
      preference engages whenever it possibly can. Kept.
    impact_if_changed: >-
      Does NOT move `rules_version`. Pure, report-only. Pinned by mutation in the pure
      summary-selection test (a cluster whose most-central summary is OUT of range but has
      an in-range alternative picks the in-range one by default, and the out-of-range
      central one when set to `most_central`).
    status: open

  - id: HR-169
    question: >-
      What should the engine do with members' ADDITIONAL CONTEXTUAL INFORMATION when
      merging a cluster?
    config:
      file: harmonization.yaml
      path: harmonization.additional_context_policy
    current_default: drop
    provenance: our_invention
    tier: hr_informed
    why_it_matters: >-
      Additional context is free-text and often position-specific (one incumbent's parking,
      one office's hours), so a union across members is noisy. `drop` omits it from the
      draft (the reviewer/LLM pass can add role-level context deliberately); `longest`
      carries the single longest member note verbatim. MEASURED (7,391 JDFN members across
      1,801 clusters): only 44 members (0.6%) carry any additional_context, and just 12
      clusters have more than one — so a union would be near-empty and noisy where present.
      `drop` justified; kept.
    impact_if_changed: >-
      Does NOT move `rules_version`. Pure, report-only. Pinned by mutation in the pure
      section-selection test (a cluster with per-member context yields no
      `additional_context` by default and the longest note when set to `longest`).
    status: open

  - id: HR-170
    question: >-
      How should the engine set the boilerplate PRESENCE booleans (About SFU, territorial
      acknowledgement, employment equity) on the merged draft?
    config:
      file: harmonization.yaml
      path: harmonization.boilerplate_presence_policy
    current_default: or_across_members
    provenance: our_invention
    tier: hr_informed
    why_it_matters: >-
      The model carries these as presence BOOLEANS, not boilerplate TEXT (bank/render.py),
      so a draft asserting "present" still cannot render the mandated paragraphs — a
      re-parse trips SFU-COMP-ABOUT / the footer gates regardless. `or_across_members`
      asserts present iff ANY member had it — the honest reading. MEASURED (1,801 JDFN
      clusters): members frequently DISAGREE on presence — mixed in 106 (about_sfu) / 129
      (employment_equity) / 179 (territorial) clusters — so the OR really engages, and
      asserting present iff any member carried it is the defensible reading of a merge.
      ⚠ This flips to `all_present` ONLY IF HR ratifies composer auto-insert of the footer
      (an HR-pending decision — see the HR-DECISION-MATRIX footer question); shipping
      `all_present` now would pre-empt that ruling and make the draft claim compliance it
      does not carry. Kept, pending HR's footer ruling.
    impact_if_changed: >-
      Does NOT move `rules_version`. Pure, report-only. Pinned by mutation in the
      draft-is-a-draft test (a cluster whose members all LACK the footer yields
      `territorial_acknowledgement_present=False` by default — so the draft honestly trips
      the footer gate — and True when set to `all_present`).
    status: open

  - id: HR-171
    question: >-
      At what token-Jaccard similarity should two DUTY statements be treated as the same
      duty and collapsed onto one representative?
    config:
      file: harmonization.yaml
      path: harmonization.duty_dedup_jaccard_min
    current_default: 0.7
    provenance: our_invention
    tier: technical
    why_it_matters: >-
      Duties are unioned across members and near-identical statements deduped so the draft
      carries each real duty once (coverage-ordered). Also reused for near-identical
      QUALIFICATION-text dedup (one Jaccard threshold, one home). Too low welds distinct
      duties; too high leaves obvious paraphrases as separate duties and burns the
      `max_duties` budget. CALIBRATED (1,801 JDFN clusters): the pairwise duty-Jaccard
      distribution is strongly BIMODAL — a "distinct" mass below 0.15 (>900k pairs) and a
      "near-identical" mode from 0.85 rising to 109,797 pairs at 0.95–1.00 — separated by a
      broad flat valley from 0.45 to 0.80 (every bin <=628 pairs) whose GLOBAL MINIMUM is
      the 0.70–0.75 bin (288 pairs). 0.7 sits on the valley floor, and the outcome is nearly
      threshold-insensitive there: total deduped duties 9,419 (at 0.5) -> 9,660 (0.7) ->
      9,786 (0.8). Kept at 0.7 — valley-floor placement, and merging is the destructive
      direction.
    impact_if_changed: >-
      Does NOT move `rules_version`. Pure, report-only. Pinned by a BOUNDARY mutation in the
      duty-dedup test: a duty pair whose exact token-Jaccard is 0.75 collapses to one
      representative at the shipped 0.7 and splits into two when the knob is raised past it
      (0.8) — the deduped duty count goes 1 -> 2 (red).
    status: open

  - id: HR-172
    question: >-
      How many deduped duties may a merged draft carry before the extras are dropped and
      the draft is flagged for HR review?
    config:
      file: harmonization.yaml
      path: harmonization.max_duties
    current_default: 12
    provenance: our_invention
    tier: hr_informed
    why_it_matters: >-
      Above this many deduped duties, the top-by-member-coverage duties are kept and the
      draft is FLAGGED `duties_over_max` (never a silent drop — HR eyeballs it). CALIBRATED
      (measured over 1,801 JDFN clusters): the deduped-duty count spikes at exactly 12 —
      237 real clusters sit at the model's own `SFUJobDescription.duties` cap
      (`max_length=12`, parsed_jd.py) — and the provisional cap of 10 flagged 374 clusters
      (20.8%), 288 of which held 11–12 duties the model could have kept. Raised 10 → 12 so
      the flag fires only when the model cap forces a REAL drop (86 clusters, 4.8%):
      non-destructive, and the flag is now honest. SFU's Toolkit guidance is "3–5 major
      duties", but real clusters carry far more and dropping a real duty is destructive.
      Still `open` — the model's 12-duty ceiling is itself our_invention, not an SFU number.
    impact_if_changed: >-
      Does NOT move `rules_version`. Pure, report-only. Pinned by a BOUNDARY mutation in the
      duty-cap test: a cluster that dedups to exactly 12 distinct duties keeps all 12 and
      does NOT flag at the shipped 12, and drops to the top 11 with a `duties_over_max` flag
      when the cap is lowered to 11 — so reverting the YAML to 10 turns a behavioural test
      red even with the register silenced.
    status: open

  - id: HR-173
    question: >-
      What fraction of a cluster's members must require a skill before it is treated as a
      CORE qualification (kept) rather than an incidental one (dropped)?
    config:
      file: harmonization.yaml
      path: harmonization.core_skill_min_fraction
    current_default: 0.5
    provenance: our_invention
    tier: hr_informed
    why_it_matters: >-
      The KSA rebuild keeps a skill token's representative qualification iff at least this
      fraction of members require it (at/above, `>=`), and drops one-offs — SFU is
      minimum-not-desired, so an incidental skill is not carried as "desired". CALIBRATED
      (1,801 JDFN clusters): skill-frequency is bimodal — a spike at 0.9–1.0 (21,335 skill
      tokens required by ~all members) with a sparse middle — so 0.5 sits in the valley,
      robustly away from either mode. The `no_core_skills` rate is FLAT at 852–854 clusters
      across candidate fractions 0.3–0.7: it is dominated by the ~47% of clusters that carry
      no skill quals AT ALL (the keyword bag is empty — a known parser limitation), not by
      this fraction. Kept at 0.5 — robustly placed in the sparse middle; the binding
      constraint is skill-qual absence, not the threshold.
    impact_if_changed: >-
      Does NOT move `rules_version`. Pure, report-only. Pinned by a BOUNDARY mutation in the
      KSA test: a skill required by exactly 2 of 4 members (fraction 0.5) is CORE at the
      shipped 0.5 and DROPPED when the knob is raised to 0.6 (the surviving qualification
      disappears — red).
    status: open

  - id: HR-174
    question: >-
      How should SECURITY qualifications (e.g. a criminal-record check) be combined across a
      cluster's members?
    config:
      file: harmonization.yaml
      path: harmonization.security_policy
    current_default: union
    provenance: our_invention
    tier: hr_policy
    why_it_matters: >-
      A security requirement is a hard legal/role constraint, so `union` keeps every
      distinct security qualification ANY member states (deduped near-identical) — a
      requirement one member states is real even if the others omit it. `core_only` instead
      keeps a security qualification only when required by >= `core_skill_min_fraction` of
      members (treating it like a skill), which risks dropping a genuine requirement a
      single JD carried. ⚠ COUPLING: under `core_only` this SHARES `core_skill_min_fraction`
      (HR-173) — re-calibrating that knob would move the security threshold too. MEASURED
      (1,801 JDFN clusters): ZERO clusters carry ANY security qualification archive-wide —
      the JDFN parser extracts none — so union vs core_only is INERT and untestable on this
      corpus. Kept at `union` as the safe no-op; revisit if security extraction lands.
    impact_if_changed: >-
      Does NOT move `rules_version`. Pure, report-only. Pinned by mutation in the KSA
      security test (a security qualification stated by only 1 of 3 members survives under
      `union` and is dropped under `core_only`).
    status: open

  - id: HR-175
    question: >-
      How should the required EDUCATION and EXPERIENCE bars be chosen when a cluster's
      members disagree?
    config:
      file: harmonization.yaml
      path: harmonization.seniority_bar_policy
    current_default: max
    provenance: our_invention
    tier: hr_policy
    why_it_matters: >-
      `max` takes the highest bar any member states (a masters over a bachelors, 5 years
      over 3) and emits the representative qualification whose parsed bar matches — the
      conservative "the role needs at least the strongest stated bar" reading. `modal` takes
      the most common bar instead, which better reflects the typical member but can
      understate a genuinely senior role. The bar is read from the SAME parsers
      `build_job_signals` uses (`education_level_from_text` / `experience_years_from_text`),
      so it never manufactures a bar no member stated. MEASURED (1,801 JDFN clusters): bars
      rarely diverge — education spread is 0 in 817/844 clusters that state one, experience
      spread is 0 in 756/843 — and `max` differs from `modal` in only 16 (education) / 61
      (experience) clusters. Kept at `max` (do not understate a stated requirement). ⚠ On
      those ~77 divergent clusters, max-vs-modal is arguably an HR POLICY call, not a pure
      measurement — flag it for the 4.5 pilot.
    impact_if_changed: >-
      Does NOT move `rules_version`. Pure, report-only. Pinned by mutation in the KSA
      seniority test (a cluster mixing a bachelors and a masters emits the masters
      qualification under `max` and the modal (bachelors) one under `modal`).
    status: open

