      SFUJobDescription schema as JSON, so JSON-schema adherence matters most. `gpt-oss:120b`
      is the strongest general instruct on `aria-gb10-2` today (available alternatives:
      gpt-oss:20b, qwen3.5:latest, gemma4:26b, llama4:latest). It is a RULEBOOK decision,
