  - id: HR-181
    question: >-
      Should the anti-fabrication guard run at all on the rewrite output?
    config:
      file: rewrite.yaml
      path: rewrite.anti_fabrication_enabled
    current_default: true
    provenance: our_invention
    tier: hr_informed
    why_it_matters: >-
      THE core safety of 4.2a. The rewrite may rephrase the grounded draft but must not
      INTRODUCE skills/duties/qualifications the merge draft did not contain. With the guard
      ON, any output qualification whose skill/knowledge/ability content is not grounded in
      the draft's vocabulary is SCRUBBED (dropped, recorded), and a duty with no token
      overlap to any draft duty is FLAGGED (recorded, not dropped). `false` ships the model's
      output unscrubbed — the escape hatch, registered so flipping it can never be quiet.
      There is no reason to ship it off; it exists so a deliberate off-switch is a visible,
      ratifiable decision rather than a code edit. PROVISIONAL calibration of the thresholds
      below, but the guard itself should stay ON.
    impact_if_changed: >-
      Does NOT move `rules_version`. Pinned BY MUTATION (acceptance #2): with the guard on, a
      fake LLM that injects a skill NOT in the merge draft has it scrubbed and absent from the
      returned draft; flip this to `false` (and update this entry so the drift alarm stays
      silent) and a BEHAVIOURAL assertion — the injected skill is gone — goes red.
    status: open

  - id: HR-182
    question: >-
      How should the guard decide a rewritten qualification is grounded in the merge draft's
      vocabulary?
    config:
      file: rewrite.yaml
      path: rewrite.skill_grounding_policy
    current_default: token_overlap
    provenance: our_invention
    tier: technical
    why_it_matters: >-
      `token_overlap` keeps a qualification iff the fraction of its content tokens present in
      the draft's vocabulary (built from the draft's own text + its member-derived
      skill-frequency names) reaches `skill_grounding_threshold` — tolerant of rephrasing,
      strict about wholly new content. `all_grounded` keeps it only if EVERY content token is
      in the vocabulary (the threshold is inert under it — a documented coupling, mirroring
      security_policy/core_skill_min_fraction), which is stricter and would scrub a
      legitimate synonym. PROVISIONAL — calibrate against real rewrites at the 4.5 pilot.
    impact_if_changed: >-
      Does NOT move `rules_version`. Pinned by mutation in the anti-fabrication test (a
      qualification that is partially grounded is KEPT under `token_overlap` at the shipped
      threshold and SCRUBBED under `all_grounded`).
    status: open

  - id: HR-183
    question: >-
      What fraction of a rewritten qualification's content tokens must be grounded in the
      merge draft for it to be kept?
    config:
      file: rewrite.yaml
      path: rewrite.skill_grounding_threshold
    current_default: 0.5
    provenance: our_invention
    tier: technical
    why_it_matters: >-
      Under `token_overlap`, a qualification is KEPT iff at least this fraction of its content
      tokens (stopword/short-token filtered, the same filter the skill signals use) appear in
      the draft's vocabulary; below it the qualification is SCRUBBED and recorded. Too high
      scrubs legitimate rephrasings; too low lets fabricated content through. 0.5 is a
      provisional midpoint. NOT backed by measured evidence — calibrate at the 4.5 pilot.
    impact_if_changed: >-
      Does NOT move `rules_version`. Pinned by a BOUNDARY mutation in the anti-fabrication
      test (a qualification whose grounded-token fraction sits just at 0.5 is kept at the
      shipped threshold and scrubbed when the knob is raised past it).
    status: open

  - id: HR-184
    question: >-
      Below what token-Jaccard with any draft duty should a rewritten duty be flagged for
      HR review?
    config:
      file: rewrite.yaml
      path: rewrite.duty_flag_threshold
    current_default: 0.2
    provenance: our_invention
    tier: hr_informed
    why_it_matters: >-
      A rewritten duty is FLAGGED (recorded in the anti-fabrication record, never dropped)
      when its best token-Jaccard against any draft duty falls below this — the signal that
      the model may have invented a duty rather than reworded one. Duties are flagged, not
      scrubbed, because a legitimate rewrite can rephrase heavily; the human reviewer (4.4)
      decides. Too high floods the reviewer; too low never catches an invented duty. 0.2 is a
      provisional low bar. NOT measured — calibrate at the 4.5 pilot.
    impact_if_changed: >-
      Does NOT move `rules_version`. Pinned by mutation in the anti-fabrication test (a duty
      with no overlap to any draft duty is flagged at the shipped threshold; raising the knob
      flags a duty that shared some overlap, and disabling the guard clears the flags).
    status: open

