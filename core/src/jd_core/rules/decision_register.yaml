# SFU HR DECISION REGISTER — RULEBOOK AS DATA (CLAUDE.md §2), and the ledger for
# CLAUDE.md §1 (HUMAN APPROVAL: nothing about the approval bar is ours to settle).
#
# WHAT THIS IS
# Every policy call JD Bank currently makes *by default* because SFU HR has not yet
# made it. Each entry names the question in HR's language, the value we ship today,
# EXACTLY where that value is configured, and — the column that matters most —
# whether the default came from SFU's published rulebook, from the earlier pipeline we
# inherited, or from nobody but us.
#
# WHY IT IS DATA AND NOT A DOCUMENT
# A prose register rots silently, and a rotted register is worse than none: it makes
# an unratified default *look* ratified. This file is machine-checked against the
# rules it describes, three ways, all build-breaking (see rules/loader.py):
#
#   1. every `config` path must RESOLVE against the real loaded rules — rename or
#      delete a config key and the loader raises RulesError (loader: at load);
#   2. every `current_default` must EQUAL the live value at that path — tune a
#      threshold in YAML without telling HR and `get_rules()` and `make gates` fail
#      (loader: `check_register`);
#   3. every parameter on the DECISION SURFACE (enumerated from the rules
#      themselves: each gate, threshold, penalty, grade band, coded-term tier,
#      restricted title, and catalogued rule severity) must be either an entry
#      below or an explicit `trivial:` exemption WITH A REASON — add a gate or a
#      threshold and forget to decide, and the build fails.
#
# So: "review the config against the register later" is not a promise, it is a gate.
# The human-readable view (docs/decisions/HR-DECISION-REGISTER.md) is RENDERED from
# this file by `make register` and drift-checked in CI — never hand-edited.
#
# HOW TO CHANGE A DEFAULT (no code change, ever)
#   1. edit the value in its rules YAML;
#   2. update this register's `current_default` to match, and set `status: ratified`
#      with `decided_by` / `decided_on` / `decision_note` if HR made the call.
# Two data edits. Nothing in src/jd_core/quality/ is touched.
#
# FIELDS
#   id               stable HR-###; never reused
#   question         the decision, as HR would ask it
#   config           file + dotted path into the loaded rules (loader resolves it)
#   current_default  what we ship — cross-checked against the live value
#   provenance       sfu_rulebook  (transcribed; MUST cite source_part)
#                    prior_calibration (inherited from the earlier build; NOT SFU-published)
#                    our_invention (JD Bank's own default; nobody ratified it)
#   tier             WHO IS ASKED — required, no default (see below)
#   status           open | ratified | deferred
#                    ratified REQUIRES decided_by + decided_on + decision_note;
#                    open FORBIDS them (an open decision with a decider is a lie).
#
# THE TIER, AND WHY IT EXISTS
# This register does two incompatible jobs. It is (a) the list of policy calls SFU
# HR must sign, and (b) the completeness ledger that stops an engineer tuning a
# threshold silently. Job (b) requires registering embedding dimensions, MinHash
# band counts and model temperatures — parameters HR must NEVER be handed. Job (a)
# is unanswerable while they are mixed in: handed all of them at once, an HR
# workshop bounces the ask, and that is exactly what happened.
#
#   hr_policy    The answer changes what PASSES, FAILS, BLOCKS or SCORES — or it is
#                SFU's own published wording. HR is accountable and the bar is
#                unsigned until they rule. THIS TIER, AND ONLY THIS TIER, IS THE ASK.
#   hr_informed  The answer changes what a reviewer is SHOWN, or what a DRAFT
#                contains before a human rules on it — never whether a JD passes.
#                HR may object and must be able to find it; the default does not
#                need a signature to be legitimate.
#   technical    Plumbing: model names, dimensions, timeouts, retries, extraction
#                regexes, index parameters. A wrong value here is an engineering
#                bug, not a policy error.
#
# NOTHING BECOMES UNREGISTERED. Every entry keeps its id and every build-breaking
# check above still walks all of them — tune a `technical` threshold without
# updating its `current_default` and the build fails exactly as before. The tier
# changes the AUDIENCE, never the coverage.
#
# Two consequences worth stating, because both are load-bearing:
#   * `tier` has NO DEFAULT. A new parameter cannot be filed into a tier by
#     omission — which is how 197 undifferentiated entries accumulated.
#   * comparison.yaml and hay_signals.yaml may never be `hr_policy`. ADR-007
#     disclaims them as NOT formal classification and `models/bank.py` makes a Hay
#     grade unrepresentable; asking HR to ratify a similarity weight would
#     contradict both. A test enforces it.
#
# COMPARISON CONTRACT (what `current_default` is written as)
#   scalar -> itself · set -> its sorted members · mapping -> the WHOLE mapping,
#   keys and values (values carry policy too: `ksa_rank`'s values ARE the
#   Knowledge -> Skills -> Abilities order that a blocking gate enforces) ·
#   list -> file order · regex -> its pattern source · a set member ->
#   `path.<member>` resolves to a bool, which is how a single contested entry in a
#   116-word glossary is pinned without inlining the glossary twice.
#
# provenance of the register itself: the tensions recorded here surfaced while
# building Phase 2.1 (rules-as-data), 2.2 (validators) and 2.3 (gate runner); the
# "FOR HR TO DECIDE" prose in gates.yaml is their prose ancestor — this file is the
# enforced version of it.
version: jd_rules_sfu_v4

decisions:
  # ═══ THE APPROVAL BAR ═══════════════════════════════════════════════════════
  # The four entries below are the whole "may a human approve this JD?" policy.
  # None of the numbers is SFU's. Ratify these first.

  - id: HR-001
    question: >-
      What quality score must a job description reach before an HR reviewer is
      allowed to approve it?
    config:
      file: gates.yaml
      path: gates.SFU-APPROVE-SCORE-FLOOR.min_score
    current_default: 60.0
    provenance: our_invention
    tier: hr_policy
    why_it_matters: >-
      This is the single number that decides how much of the archive is even
      presentable for review. It is OUR roll-up of the rulebook, not a number SFU
      published anywhere — SFU's rulebook names conditions ("never approve if…"),
      never a score. We chose 60 to line up with the C grade band.
      ✅ THE PHASE-2.5 ARCHIVE BASELINE HAS NOW TESTED THIS NUMBER AGAINST ALL 14,565
      REAL JDs, AND IT SURVIVES. Measured on the CURRENT-PRACTICE COHORT (defined below):
      the median JD scores 77.3 (mean 76.4, range 47.5-95.0), and 869 of 874 — 99.4% —
      clear the floor of 60. The floor rejects FIVE files. Grades: 5 A, 509 B, 355 C,
      5 D, and ZERO F. The archive ratifies the bar; it does not kill it.
      ⚠ BUT READ HR-004 BEFORE RATIFYING: 60 is not the number that is actually stopping
      anything. Of the 246 current-practice JDs that cannot be approved, this floor blocks
      5 and the grade floor 5, while two FORMATTING gates block 134 and 104. HR would be
      ratifying a score bar that is very nearly inert.
      ⚠ AND DO NOT READ THE WHOLE-ARCHIVE NUMBER AS QUALITY. Across all 6,259 `new`-era
      JDs the score distribution is BIMODAL (a mode at 10-29, n=1,304; a mode at 60-79,
      n=3,929; a valley at 30-59, n=580) and this floor does sit in the valley — but the
      two modes are NOT good JDs and bad JDs. They are JDs that carry the territorial
      acknowledgement and JDs that do not (see HR-109). The floor is separating a document
      era, not a quality level, and read carelessly that would look like a ringing
      endorsement of 60 when it is really an artefact.
      COHORT DEFINITION (used by HR-001..HR-005, HR-019/020, HR-047, HR-109..HR-111, and
      reproducible from `docs/baseline/` with one filter): "current practice" = the 874
      `new`-era JDs on which SFU-COMP-TERRITORIAL did NOT fire, i.e. the validator found
      SFU's mandated acknowledgement actually present. A raw-text scan of all 6,259
      new-era JDs puts SFU-COMP-TERRITORIAL's false-positive rate at ~0.2% (10 files), so
      a text-presence cohort is ~883 and every figure above moves by under one point.
    impact_if_changed: >-
      Directly sets the size of the review queue. Raising it to 70 turns every
      C-grade JD into a blocked draft; lowering it to 50 lets D-grade JDs through
      to a reviewer. MEASURED against the current-practice cohort: raising the floor to
      70 would newly block 111 of 874 JDs (the 106 in the 60-69 band plus those already
      below); lowering it to 50 would release 4 of the 5 it currently rejects. So the
      knob is real but the region it operates in is nearly empty — which is the finding.
      RECOMMENDATION TO HR: ratify 60. It is defensible against the real corpus, it
      rejects almost nothing that current practice produces, and no evidence was found
      that it is wrong. It stays `open` because only SFU HR can ratify it; JD Bank does
      not get to mark its own homework.
    status: open

  - id: HR-002
    question: What quality grade must a job description reach before approval?
    config:
      file: gates.yaml
      path: gates.SFU-APPROVE-GRADE-FLOOR.min_grade
    current_default: C
    provenance: our_invention
    tier: hr_policy
    why_it_matters: >-
      A second, independent floor next to the score floor (HR-001). The grade
      letter is what a reviewer actually sees, so this is the bar in the language
      the dashboard speaks. Also not an SFU number.
      ✅ MEASURED (Phase 2.5, current-practice cohort — see HR-001 for the definition):
      the grade floor blocks 5 of 874. The grade distribution is 5 A / 509 B / 355 C /
      5 D / ZERO F — i.e. essentially the whole cohort already sits at C or above, and a
      C floor is where the population naturally begins rather than a bar it has to clear.
      ⚠ Like HR-001, this is nearly inert: 5 blocks, against 134 and 104 for two
      formatting gates (HR-004). HR should not mistake it for the operative bar.
    impact_if_changed: >-
      Deliberately a separate knob from HR-001 and today aligned with it (grade C
      starts at 60.0 — HR-015). They can be tuned apart, but if they disagree the
      stricter one silently wins, which is confusing to a reviewer. Ratify them
      together. MEASURED: raising the floor to B would newly block the 355 C-grade JDs —
      41% of everything current practice produces — turning a nearly-inert gate into the
      single largest blocker in the system. That is the asymmetry to be aware of: this
      knob is quiet at C and violent at B.
      RECOMMENDATION TO HR: ratify C, together with HR-001. Stays `open` — only SFU HR
      can ratify.
    status: open

  - id: HR-003
    question: >-
      At what finding severity does an outstanding problem make approval
      impossible, regardless of score?
    config:
      file: gates.yaml
      path: gates.SFU-APPROVE-SEVERITY-FLOOR.min_severity
    current_default: high
    provenance: our_invention
    tier: hr_policy
    why_it_matters: >-
      The backstop: any finding at this severity or worse blocks approval even if
      the JD scores well. It is also the only gate that catches findings with no
      rule id at all — i.e. the Phase-5 LLM pass. Today only three rules are
      `high` (no summary / no duties / no qualifications).
      ✅ MEASURED (Phase 2.5, current-practice cohort — definition in HR-001): the
      severity floor blocks 7 of 874. It behaves exactly as a backstop should — it almost
      never fires on a JD written under current practice, and when it does, the JD is
      genuinely missing a mandatory section. No evidence was found that `high` is wrong.
    impact_if_changed: >-
      Lowering it to `medium` would block on missing Decision-Making, missing
      Problem-Solving, banned qualification phrases, leftover placeholders and any
      coded term flagged `medium` — a very large share of the archive at once. That is
      no longer a guess: SFU-QUAL-BANNED-PHRASE alone has a KNOWN scoping bug (it scans
      the whole document though its rule text says Qualifications only — see the project
      backlog), so lowering this floor would promote a bug straight to blocking. Fix the
      scoping bug first, then reconsider.
      RECOMMENDATION TO HR: ratify `high`. Stays `open` — only SFU HR can ratify.
    status: open

  - id: HR-004
    question: >-
      Which rulebook failures should make approval impossible — the "never approve
      if…" list?
    config:
      file: gates.yaml
      path: gates.blocking_rule_ids
    current_default:
      - SFU-AUTH-SUMMARY-CONDITIONS
      - SFU-AUTH-SUMMARY-INCUMBENT
      - SFU-COMP-DUTIES
      - SFU-COMP-EDI
      - SFU-COMP-QUALS
      - SFU-COMP-SUMMARY
      - SFU-COMP-TERRITORIAL
      - SFU-GATE-DUTY-PCT
      - SFU-GATE-KSA-ORDER
      - SFU-GATE-SENIOR-TITLE
      - SFU-QUAL-BANNED-PHRASE
      - SFU-QUAL-EQUIVALENT
      - SFU-STRUCT-PLACEHOLDER
      - SFU-STRUCT-SUMMARY-TOO-LONG
    provenance: our_invention
    tier: hr_policy
    why_it_matters: >-
      THE master list, and the most reviewable line in the whole system: it is the
      complete set of rule failures that disable the approve button. The selection
      is ours. Notably ABSENT and therefore NOT blocking today — each a live
      question for HR: coded/gendered terms (SFU-LANG-CODED, HR-028/HR-029), a JD
      with more than five duties (SFU-STRUCT-DUTIES-TOO-MANY, HR-036), a missing
      Impact-of-Decision-Making or Problem-Solving section (HR-034/HR-035), and
      the three restricted-title rules (HR-030/HR-032/HR-033).
      ⚠⚠ THE SINGLE MOST IMPORTANT THING PHASE 2.5 LEARNED, AND HR MUST SEE IT BEFORE
      RATIFYING ANYTHING: **THE OPERATIVE APPROVAL BAR IS NOT THE SCORE FLOOR — IT IS TWO
      FORMATTING GATES.** Of the 246 current-practice JDs that cannot be approved
      (cohort defined in HR-001), the blocking gates are:
        SFU-APPROVE-SUMMARY-LENGTH     134  (54.5%)   <- the summary is too short/long
        SFU-APPROVE-QUAL-MINIMUM       104  (42.3%)
        SFU-APPROVE-QUAL-EQUIVALENT     42  (17.1%)
        SFU-APPROVE-EDI-FOOTER          10  ( 4.1%)   <- and these 10 are FALSE POSITIVES
        SFU-APPROVE-SUMMARY-CONDITIONS   9  ( 3.7%)
        SFU-APPROVE-MANDATORY-SECTIONS   7  ( 2.8%)   <- non-overridable (HR-005)
        SFU-APPROVE-SEVERITY-FLOOR       7  ( 2.8%)   (HR-003)
        SFU-APPROVE-SCORE-FLOOR          5  ( 2.0%)   (HR-001)
        SFU-APPROVE-GRADE-FLOOR          5  ( 2.0%)   (HR-002)
      HR believes it is ratifying a quality bar. It is in fact ratifying a WORD-COUNT
      RANGE on the position summary (HR-019 / HR-020) and a qualifications-completeness
      rule. The score floor of 60 — the number everyone will argue about — turns away
      five files. That is not an argument for changing anything; it is an argument for
      knowing what is actually being decided.
    impact_if_changed: >-
      Adding one id to a gate's `rule_ids` promotes that rule to blocking with no
      code change. This register entry is what makes such a promotion visible: the
      build fails until this list is updated, so a rule can never quietly start —
      or stop — blocking approval.
      ⚠ SFU-COMP-TERRITORIAL and SFU-COMP-EDI are on this list, and on the archive as it
      stands that makes them a DATE DETECTOR rather than a quality gate (HR-109). They
      block 86.2% of the `new` era — not because those JDs are bad, but because SFU's own
      acknowledgement rollout was still in progress when they were written. Removing them
      from the blocking set is one of the options open to HR; so is leaving them and
      accepting that pre-2024 JDs must be re-issued before they can be approved. Both are
      legitimate. Neither is JD Bank's call, and NOTHING HAS BEEN CHANGED.
    status: open

  - id: HR-005
    question: >-
      Which gates may a reviewer NEVER waive, even with a written justification in
      the audit log?
    config:
      file: gates.yaml
      path: gates.non_overridable_gate_ids
    current_default:
      - SFU-APPROVE-MANDATORY-SECTIONS
      - SFU-APPROVE-NO-PLACEHOLDERS
    provenance: our_invention
    tier: hr_policy
    why_it_matters: >-
      Every other gate is overridable: a reviewer who judges a block to be a false
      positive waives it WITH A WRITTEN REASON, which is exactly the audit trail
      CLAUDE.md §1 asks for. These two are absolute — a JD with no summary, duties
      or qualifications, and a draft still carrying the template's own
      instructional text. We asserted that no override could reasonably speak to
      either.
    impact_if_changed: >-
      Removing a gate from this set hands reviewers discretion they do not have
      today; adding one takes discretion away. Flipping ANY gate's `overridable`
      flag moves this list and breaks the build until HR is told.
      ✅ MEASURED (Phase 2.5): on the current-practice cohort (HR-001) the un-waivable
      set almost never fires — SFU-APPROVE-MANDATORY-SECTIONS blocks 7 of 874, and
      SFU-APPROVE-NO-PLACEHOLDERS blocks **ZERO**. Both blocks are, on inspection,
      correct: a JD really is missing a mandatory section. Taking a reviewer's discretion
      away is only defensible when the gate is never wrong, and on current practice these
      two are not wrong.
      ⚠ The legacy corpus is a different story, and it is the reason HR-047 exists:
      SFU-APPROVE-NO-PLACEHOLDERS makes 29.4% of the WHOLE archive permanently
      un-approvable with no waiver available. See HR-047 — that is a legacy-corpus
      problem, not a current-practice one.
    status: open

  - id: HR-006
    question: >-
      Which template sections are so essential that a job description without them
      cannot be reviewed at all?
    config:
      file: gates.yaml
      path: gates.SFU-APPROVE-MANDATORY-SECTIONS.rule_ids
    current_default:
      - SFU-COMP-SUMMARY
      - SFU-COMP-DUTIES
      - SFU-COMP-QUALS
    provenance: our_invention
    tier: hr_policy
    why_it_matters: >-
      This is the un-waivable gate (HR-005), so its membership is the strongest
      claim in the policy. SFU's Part 2 template makes ALL its sections mandatory;
      restricting the absolute bar to these three is our call. Impact of Decision
      Making and Problem Solving — both Hay evaluation inputs — are deliberately
      NOT here (HR-034 / HR-035).
    impact_if_changed: >-
      Anything added here becomes un-waivable: no reviewer, no reason, no override.
      A large slice of the legacy archive would become permanently un-approvable
      until rewritten.
    status: open

  - id: HR-007
    question: >-
      Should a draft that still contains the template's own instructional text be
      un-waivably blocked?
    config:
      file: gates.yaml
      path: gates.SFU-APPROVE-NO-PLACEHOLDERS.rule_ids
    current_default:
      - SFU-STRUCT-PLACEHOLDER
    provenance: our_invention
    tier: hr_policy
    why_it_matters: >-
      The second un-waivable gate (HR-005). It fires on the literal placeholder
      markers in markers.yaml — and one of those markers is the phrase "action
      verb" (HR-047). A real JD that happens to contain that phrase is therefore
      blocked with NO override available. That combination is a trap worth HR's
      attention.
    impact_if_changed: >-
      Making this gate overridable (or narrowing the marker list) would let a
      reviewer waive a false positive. Leaving it as-is keeps genuinely unfinished
      drafts out of review at the cost of the false positives in HR-047.
    status: open

  # ═══ SCORING CALIBRATION ════════════════════════════════════════════════════
  # Inherited wholesale from the earlier pipeline (RULES_VERSION jd_rules_sfu_v3).
  # SFU publishes no scoring model at all — this entire section is a roll-up we
  # invented in order to have a number to sort a 4,600-JD archive by.

  - id: HR-008
    question: How many points should a HIGH-severity problem cost a job description?
    config:
      file: scoring.yaml
      path: scoring.severity_penalty.high
    current_default: 20.0
    provenance: prior_calibration
    tier: hr_policy
    why_it_matters: >-
      Sets what "high" means numerically. Three high-severity findings (missing
      summary + duties + qualifications) take a JD from 100 to ~59 — just under the
      approval floor (HR-001). The calibration and the floor were tuned to agree;
      moving either alone breaks that agreement.
    impact_if_changed: >-
      Moves every score in the archive and therefore the whole grade distribution.
    status: open

  - id: HR-009
    question: How many points should a MEDIUM-severity problem cost?
    config:
      file: scoring.yaml
      path: scoring.severity_penalty.medium
    current_default: 10.0
    provenance: prior_calibration
    tier: hr_policy
    why_it_matters: >-
      The tier most SFU never-approve conditions sit in (duty percentages, banned
      qualification phrases, leftover placeholders, most coded terms).
    impact_if_changed: >-
      Six medium findings currently cost ~28 points, not 60, because of the decay
      factor (HR-012). Raising this without revisiting the decay changes that
      arithmetic sharply.
    status: open

  - id: HR-010
    question: How many points should a LOW-severity problem cost?
    config:
      file: scoring.yaml
      path: scoring.severity_penalty.low
    current_default: 5.0
    provenance: prior_calibration
    tier: hr_policy
    why_it_matters: >-
      The drafting-nudge tier: action verbs, "how and why" detail, proficiency
      modifiers, a thin summary. These are the findings the archive fires most.
    impact_if_changed: >-
      Because low-severity findings are common, this is the knob most likely to
      move the median JD across the approval floor in either direction.
    status: open

  - id: HR-011
    question: Should advisory (INFO) findings cost any score at all?
    config:
      file: scoring.yaml
      path: scoring.severity_penalty.info
    current_default: 0.0
    provenance: prior_calibration
    tier: hr_policy
    why_it_matters: >-
      Zero, today: `info` findings appear on the reviewer's checklist but are
      free. That is what makes the two unverifiable restricted-title checks
      (Registrar, Human Resources — HR-032 / HR-033) harmless.
    impact_if_changed: >-
      Giving `info` a non-zero cost would make every advisory observation drag the
      grade, including checks we KNOW cannot verify their own context.
    status: open

  - id: HR-012
    question: >-
      Should the second, third and fourth problem of the same severity cost less
      than the first?
    config:
      file: scoring.yaml
      path: scoring.severity_decay
    current_default: 0.7
    provenance: prior_calibration
    tier: hr_policy
    why_it_matters: >-
      Diminishing returns: the k-th finding in a tier costs penalty × 0.7^k, so a
      tier can never cost more than penalty ÷ (1 − 0.7). A wall of minor nudges
      therefore cannot alone force an F, while genuine high-severity failures
      still drive a low grade. It is the reason a badly-extracted legacy document
      does not automatically score zero.
    impact_if_changed: >-
      At 1.0 (no decay) a JD with ten low findings would score 50 and be blocked.
      At 0.0 only the worst finding in each tier would count at all.
    status: open

  - id: HR-013
    question: What score earns an A?
    config:
      file: scoring.yaml
      path: scoring.grade_bands.A.min_score
    current_default: 90.0
    provenance: prior_calibration
    tier: hr_policy
    why_it_matters: The grade letters are what HR sees on the dashboard and in reports.
    impact_if_changed: Re-labels the archive; does not by itself change what is approvable.
    status: open

  - id: HR-014
    question: What score earns a B?
    config:
      file: scoring.yaml
      path: scoring.grade_bands.B.min_score
    current_default: 75.0
    provenance: prior_calibration
    tier: hr_policy
    why_it_matters: The grade letters are what HR sees on the dashboard and in reports.
    impact_if_changed: Re-labels the archive; does not by itself change what is approvable.
    status: open

  - id: HR-015
    question: What score earns a C — and is C really the pass mark?
    config:
      file: scoring.yaml
      path: scoring.grade_bands.C.min_score
    current_default: 60.0
    provenance: prior_calibration
    tier: hr_policy
    why_it_matters: >-
      This band is load-bearing: the grade floor (HR-002) is C and the score floor
      (HR-001) is 60.0, so this number is where the two floors meet. It is the de
      facto definition of "good enough to review".
    impact_if_changed: >-
      Changing it without changing HR-001 and HR-002 silently decouples the score
      floor from the grade floor.
    status: open

  - id: HR-016
    question: What score earns a D (rather than an F)?
    config:
      file: scoring.yaml
      path: scoring.grade_bands.D.min_score
    current_default: 40.0
    provenance: prior_calibration
    tier: hr_policy
    why_it_matters: >-
      Both D and F are below the approval floor, so this line only affects how a
      failing JD is *reported* — "needs work" vs "start over".
    impact_if_changed: Cosmetic for approval; matters for how the archive triage reads.
    status: open

  - id: HR-017
    question: Should a flawless job description score 100?
    config:
      file: scoring.yaml
      path: scoring.max_score
    current_default: 100.0
    provenance: prior_calibration
    tier: hr_policy
    why_it_matters: >-
      The perfect-JD baseline every penalty is subtracted from, and therefore the
      scale the approval floor (HR-001) and the grade bands are measured on. The earlier build
      hardcoded it as a literal in Python; it is data here precisely so it is
      visible.
    impact_if_changed: >-
      Changing the top of the scale silently rescales HR-001, HR-002 and every
      grade band at once. In practice: don't — tune the penalties and floors.
    status: open

  - id: HR-018
    question: Should the score bottom out at 0, or can it go negative?
    config:
      file: scoring.yaml
      path: scoring.min_score
    current_default: 0.0
    provenance: prior_calibration
    tier: hr_policy
    why_it_matters: >-
      The floor a saturating pile of findings stops at. Keeps a badly-extracted
      legacy `.doc` from producing a meaningless −40.
    impact_if_changed: Presentation of the worst documents only; nothing is approvable there anyway.
    status: open

  # ═══ THRESHOLDS ═════════════════════════════════════════════════════════════

  - id: HR-019
    question: >-
      SFU's template says a Position Summary is 100–150 words. Should a SHORT
      summary (under 100) be flagged at all — and should it ever block approval?
    config:
      file: thresholds.yaml
      path: thresholds.summary_min_words
    current_default: 100
    provenance: sfu_rulebook
    tier: hr_policy
    source_part: Part 2B
    why_it_matters: >-
      Note the asymmetry, which is the real question here. SFU states a MAXIMUM
      ("100-150 words MAXIMUM") and its Part 11.6 never-approve list names only the
      over-run. So the 100-word floor is rulebook text, but CHOOSING TO FIRE on it
      is ours: SFU-STRUCT-SUMMARY-TOO-SHORT is a `low` advisory that costs score and
      does NOT block (HR-038). A 60-word summary that says everything necessary is
      penalised today.
    impact_if_changed: >-
      Raising it makes more of the archive score lower; setting the rule
      non-firing would require removing the check, which is a rulebook question,
      not a code one.
      ✅ MEASURED (Phase 2.5, current-practice cohort — definition in HR-001): the
      under-run fires on 340 of 874 JDs (38.9%) — so more than a third of everything SFU
      writes today has a summary under 100 words — and because we chose NOT to gate it, it
      blocks ZERO of them. The asymmetry this entry describes is real, it is large, and
      it is currently working as intended: 340 JDs are nudged, none are stopped. Had we
      gated the under-run "for symmetry", it would instantly have become the single
      largest blocker in the system.
    status: open

  - id: HR-020
    question: Is 150 words the hard maximum for a Position Summary?
    config:
      file: thresholds.yaml
      path: thresholds.summary_max_words
    current_default: 150
    provenance: sfu_rulebook
    tier: hr_policy
    source_part: Part 2B
    why_it_matters: >-
      This one IS an SFU never-approve condition, and we gate it: a summary over
      150 words blocks approval (overridable). It is the only two-sided threshold
      whose over-run blocks and whose under-run does not.
      ⚠⚠ MEASURED (Phase 2.5): **THIS IS THE #1 OPERATIVE APPROVAL BAR IN THE ENTIRE
      SYSTEM.** On the current-practice cohort (874 JDs — definition in HR-001), 246
      cannot be approved, and SFU-APPROVE-SUMMARY-LENGTH blocks **134 of them (54.5%)** —
      every one of them driven by SFU-STRUCT-SUMMARY-TOO-LONG, i.e. by this number. For
      comparison, the score floor everyone will argue about (HR-001) blocks 5.
      So: whatever HR believes it is ratifying when it ratifies "the approval bar", the
      thing that is actually turning JDs away is a 150-WORD LIMIT ON THE POSITION SUMMARY.
      It is the most consequential integer in the rulebook, and — unlike the score floor —
      it is genuinely SFU's own (Part 2B, and Part 11.6 names the over-run explicitly).
      That is the good news: the bar that is really operating is the one bit of it SFU
      actually published.
    impact_if_changed: >-
      Legacy JDs commonly run long. This threshold is a major driver of how many
      archive documents are blocked on first pass — MEASURED: 134 of the 246 unapprovable
      current-practice JDs, more than all other gates combined bar one. Moving it is the
      single highest-leverage change available to HR: relaxing it to, say, 200 words would
      release the majority of the review queue at a stroke; tightening it would swamp the
      queue. Because it is SFU's own published number, JD Bank recommends NOT moving it —
      but HR should ratify it knowing that this, not the score, is the bar.
    status: open

  - id: HR-021
    question: >-
      SFU says 3–5 major responsibilities. Should FEWER than 3 duties be flagged —
      and should it block?
    config:
      file: thresholds.yaml
      path: thresholds.duties_min
    current_default: 3
    provenance: sfu_rulebook
    tier: hr_policy
    source_part: Part 2C
    why_it_matters: >-
      Rulebook text, but the same asymmetry as HR-019: SFU names the over-run as
      the defect ("more than 3-5 main responsibilities"). Firing on the under-run
      is our choice, and it is advisory only (HR-037).
    impact_if_changed: >-
      Duty granularity is an authoring judgement — one author's 2 duties are
      another's 4. Blocking on this would be blocking on a formatting call.
    status: open

  - id: HR-022
    question: Is 5 the maximum number of major duties?
    config:
      file: thresholds.yaml
      path: thresholds.duties_max
    current_default: 5
    provenance: sfu_rulebook
    tier: hr_policy
    source_part: Part 2C
    why_it_matters: >-
      Rulebook text. But see HR-036: exceeding it does NOT block approval today,
      even though this is the side SFU actually names. That is the single biggest
      "we defaulted to leniency" call in the policy.
    impact_if_changed: >-
      Gating the over-run (a one-line YAML edit — add SFU-STRUCT-DUTIES-TOO-MANY to
      a gate's rule_ids) would block a large slice of the archive on a duty-count
      technicality. HR to ratify.
    status: open

  - id: HR-023
    question: >-
      Duty time-allocations must total 100%. How much rounding slack do we allow at
      the bottom?
    config:
      file: thresholds.yaml
      path: thresholds.duty_allocation_total_min
    current_default: 99
    provenance: our_invention
    tier: hr_policy
    why_it_matters: >-
      SFU says 100%, full stop (Part 11.6, an explicit never-approve condition).
      The 99–101 tolerance is a rounding window WE invented so that a JD whose
      duties are 33/33/33 is not blocked over 1%.
    impact_if_changed: >-
      Tightening to exactly 100 would block every JD whose percentages were written
      by hand and round; widening it lets genuinely wrong allocations through a
      gate SFU explicitly named.
    status: open

  - id: HR-024
    question: How much rounding slack at the top of the duty-percentage total?
    config:
      file: thresholds.yaml
      path: thresholds.duty_allocation_total_max
    current_default: 101
    provenance: our_invention
    tier: hr_policy
    why_it_matters: The upper half of the invented rounding window in HR-023.
    impact_if_changed: See HR-023 — ratify the window as a pair.
    status: open

  - id: HR-025
    question: >-
      Should the "duties must total 100%" check run on a JD that lists only ONE
      time allocation?
    config:
      file: thresholds.yaml
      path: thresholds.duty_allocation_min_count
    current_default: 2
    provenance: our_invention
    tier: hr_policy
    why_it_matters: >-
      It does not today. The check only runs when at least two parenthesized "(NN%)"
      allocations are present, so a JD with a single duty marked "(50%)" — an
      obviously incomplete document — SILENTLY PASSES an SFU never-approve gate.
      The threshold exists to avoid false positives on documents where extraction
      found one stray percentage; the cost is this escape.
    impact_if_changed: >-
      Setting it to 1 closes the escape and will fire on legacy documents whose
      extraction produced a single spurious "(100%)". Worth measuring against the
      Phase-2.5 archive baseline before deciding.
    status: open

  - id: HR-026
    question: >-
      How many offending items should a single finding name before it says "and
      others"?
    config:
      file: thresholds.yaml
      path: thresholds.max_listed
    current_default: 5
    provenance: prior_calibration
    tier: technical
    why_it_matters: >-
      Presentation, but not nothing: a JD with twelve non-approved action verbs
      shows the reviewer five of them. The reviewer sees a partial list and may not
      realise it is partial.
    impact_if_changed: >-
      Purely what the reviewer reads; changes no decision. Judged low-stakes, but
      registered rather than waved through because it shapes what a human sees
      before pressing approve.
    status: open

  - id: HR-027
    question: >-
      How many rule ids may a blocked-approval reason cite? (A second, independent
      copy of HR-026.)
    config:
      file: gates.yaml
      path: gates.max_listed
    current_default: 5
    provenance: prior_calibration
    tier: technical
    why_it_matters: >-
      FOUND WHILE BUILDING THIS REGISTER: `max_listed` exists TWICE — once in
      thresholds.yaml (used by the validators, HR-026) and once in gates.yaml (used
      by the gate runner). They are independent knobs that happen to hold the same
      number, and NOTHING keeps them in step. Registering both at least makes a
      divergence visible.
    impact_if_changed: >-
      Presentation only, but the duplication is a maintenance trap: an editor who
      changes "the" cap will likely change one of the two.
    status: open

  # ═══ INCLUSIVE LANGUAGE ═════════════════════════════════════════════════════

  - id: HR-028
    question: >-
      Three words on SFU's own replace-list — "individual", "honest", "trust" — are
      demoted to LOW severity here. Is that right?
    config:
      file: coded_terms.yaml
      path: coded_terms.low
    current_default:
      he/she: '"they" or "the incumbent"'
      his/her: '"their" or "the incumbent''s"'
      honest: '"candid"'
      individual: '"single"/"lone", or "position"/"role" (as "this individual")'
      s/he: '"they" or "the incumbent"'
      trust: '"reliable"'
    provenance: our_invention
    tier: hr_policy
    why_it_matters: >-
      SFU's Part 6 lexicon lists these as terms to replace. We demoted them to
      `low` because they over-fire on ordinary JD prose ("the individual is
      responsible for…", "maintains the trust of stakeholders"), where a `medium`
      finding would drag the grade on a false positive. That demotion is OUR call,
      not SFU's. The generic pronouns (he/she, s/he, his/her) sit here too, though
      those are unambiguous.
    impact_if_changed: >-
      Promoting them to `medium` doubles their score cost (HR-009 vs HR-010) and
      would fire on a large share of the archive. Note also that NO coded term
      blocks approval today (HR-004) — this is only about score and the reviewer's
      checklist.
    status: open

  - id: HR-029
    question: >-
      NINE of these 31 "coded terms" are NOT on SFU's published list — we added
      them. Does SFU HR adopt them, or should they go?
    config:
      file: coded_terms.yaml
      path: coded_terms.medium
    current_default:
      actress: '"actor"'
      aggressive: '"rapid", "intense", or "large"'
      agreement: '"contract" or "partnership"'
      ambitious: '"motivated"'
      businessman: '"business person" or "executive"'
      chairman: '"chair" or "chairperson"'
      championing: '"advocating" or "promoting"'
      compassionate: '"caring"'
      competitive: '"tough" or "intense"'
      confidential: '"restricted"'
      craftsman: '"artisan" or "craftsperson"'
      dominant: '"top"'
      fireman: '"firefighter"'
      foreman: '"foreperson"'
      guru: '"specialist"'
      in-kind: '"non-monetary"'
      man-hours: '"work hours"'
      mankind: '"humankind"'
      manmade: '"artificial", "manufactured", or "synthetic"'
      manpower: '"workforce" or "staffing"'
      middleman: '"intermediary" or "go-between"'
      ninja: '"expert"'
      persistent: '"tenacious" or "continuing"'
      policeman: '"police officer"'
      repairman: '"technician" or "repairer"'
      rockstar: '"skilled"'
      salesman: '"sales representative"'
      spokesman: '"spokesperson"'
      stewardess: '"flight attendant"'
      waitress: '"server"'
      workman: '"worker"'
    provenance: prior_calibration
    tier: hr_policy
    why_it_matters: >-
      DO NOT READ THIS LIST AS SFU POLICY. It is NOT a transcription of SFU's Part
      6 lexicon, and labelling it as one (which an earlier draft of this register
      did) would invite HR to rubber-stamp our own guesses as their published
      standard. The gendered occupational nouns (chairman, foreman, policeman,
      waitress, manpower, …) ARE SFU's. But NINE terms — aggressive, ambitious,
      championing, competitive, compassionate, confidential, dominant, agreement,
      in-kind — plus the three slang entries (rockstar, ninja, guru) do NOT appear
      in SFU's Part 6 list. The earlier build added them ("plus a few widely-recognised coded
      terms") and we inherited them unexamined. Several over-fire badly on ordinary
      JD prose: "handles confidential information" and "negotiates the agreement"
      are flagged today. "compassionate" is the worst of them: it appears in SFU's OWN
      mandatory About-SFU paragraph. The scan no longer looks inside that paragraph
      (HR-107), so SFU's boilerplate no longer trips our lexicon — but the term is
      still `medium` in a JD's own prose, and it is still not SFU's term. See HR-058.
      ---
      MEASURED over all 14,522 current-parser JDs (2026-08-07), so this is decidable on
      evidence rather than impression. The rule fires on **11,160 documents (76.8%)**,
      19,895 findings. Three terms produce **83% of everything the rule says**, and all
      three are ours, not SFU's: `confidential` **4,320 docs (29.8%)**, `individual`
      **3,719 (25.6%)** and `agreement` **1,678 (11.6%)** — exactly the over-firing this
      entry predicted, now quantified. By contrast the terms HR would most expect to
      matter barely appear: `ambitious` 29 docs, `aggressive` 22, `chairman` 14,
      `workman` 1, and **16 of the 37 terms never fire at all** (ninja, rockstar,
      policeman, salesman, waitress, mankind, …). The single largest real signal in the
      archive is not in this list's disputed part at all: the generic pronoun `his/her`,
      **8,344 docs (57.5%)** — unambiguous, and mechanically fixable.
      Also measured and recorded so it is not re-proposed: a Gender-Decoder-style SOFT
      lexicon (Gaucher et al. 2011) was evaluated as an expansion of this list and
      **rejected** — 99.5% of JDs trip both the masculine and feminine word lists, and
      38-77% of its hits are not gendered lean but stemming collisions and SFU's own
      template headings. See `docs/decisions/coded-language-soft-lexicon.md`.
    impact_if_changed: >-
      Two separate calls. (a) The nine additions: adopt them as SFU policy, or drop
      them. **Dropping just `confidential` and `agreement` would remove ~30% of this
      rule's total findings** — that is the size of the call. (b) The one deliberate
      OMISSION: SFU's list also carries "supporting",
      which we do not flag (SFU marks it "vague — clarify" rather than a hard
      replace, and it appears in almost every JD); adding it would fire on most of
      the archive. Nothing here blocks approval today (HR-004) — it only costs
      score and fills the reviewer's checklist.
    status: open

  # ═══ RESTRICTED TITLES ══════════════════════════════════════════════════════

  - id: HR-030
    question: >-
      Should a job titled "Executive Director" that is NOT in the APEX group be
      blocked — and should the check even run when the employee group is unknown?
    config:
      file: titles.yaml
      path: titles.executive_director.severity
    current_default: low
    provenance: prior_calibration
    tier: hr_policy
    why_it_matters: >-
      Two problems, one entry. (a) The finding is only `low` and does not block
      approval (HR-004), so a mis-titled Executive Director can be approved. (b)
      Worse: THE CHECK SILENTLY PASSES WHEN `employee_group` IS UNPARSED — a legacy
      JD whose group we could not extract escapes the restriction entirely, and
      says nothing about having done so. Restricted titles are an SFU governance
      rule (Part 3.5), so a rule that quietly no-ops is the wrong default.
    impact_if_changed: >-
      Blocking on it would mean blocking JDs whose employee group we cannot read —
      a check that cannot know whether it is right should arguably not gate. The
      real fix may be a third state ("cannot verify") rather than a severity bump.
    status: open

  - id: HR-031
    question: Is "Executive Director" reserved for APEX-classified roles, and only those?
    config:
      file: titles.yaml
      path: titles.executive_director.reserved_for_employee_group
    current_default: apex
    provenance: sfu_rulebook
    tier: hr_policy
    source_part: Part 3.5
    why_it_matters: >-
      The only restricted title whose restriction is checkable from the JD alone
      (the other two need organisational context — HR-032, HR-033). If the APEX
      claim is wrong or out of date, the one title check that CAN fire is firing on
      the wrong condition.
      ⚠ AND A MATCHER DEFECT MEASURED 2026-08-14, recorded here rather than fixed,
      because fixing it changes what the rule finds and that is this entry's subject.
      `titles.restricted.executive_director.phrase` is matched as a SUBSTRING of the
      title, so it also fires on roles that merely REPORT TO an Executive Director.
      Over the live archive at `jd_segmenter_v4`, 5 CUPE documents carry the phrase
      and 3 of them are that near-miss ("Assistant to the Executive Director",
      "Secretary to the Executive Director, Student Affairs …" ×2); the other 2
      ("Executive Director of Development", "Executive Director, Business Career
      Management") are genuine hits which most likely indicate a mis-parsed
      `employee_group` rather than a real CUPE executive — itself worth seeing.
      THE DEFECT IS NOT TEMPLATE-SHAPED and must not be papered over with one:
      CUPE Phase B briefly declared this rule JDFN-only, which would have suppressed
      all five. It judges both templates. The fix is a head-noun check (the title
      must START with the phrase, or the phrase must not be preceded by "to the"),
      which is a change to what the rule catches and therefore HR's to weigh here.
      It is advisory either way — `gates.yaml` omission (b) keeps all three
      restricted titles out of every blocking set.
    impact_if_changed: >-
      Confirm against the current Job Titling Guide. Setting it to null would turn
      this into a third unverifiable advisory.
    status: open

  - id: HR-032
    question: >-
      "Registrar" is reserved for AVPSI Student Services. We cannot verify that from
      a JD — should we still say anything?
    config:
      file: titles.yaml
      path: titles.registrar.severity
    current_default: info
    provenance: prior_calibration
    tier: hr_policy
    why_it_matters: >-
      `info` means: shown on the reviewer's checklist, costs zero score (HR-011),
      blocks nothing. We chose to surface it as a prompt to a human rather than
      pretend to adjudicate it.
    impact_if_changed: >-
      Any severity above `info` starts penalising JDs for a restriction the
      validator cannot actually check.
    status: open

  - id: HR-033
    question: >-
      "Human Resources" is reserved for roles inside SFU HR (elsewhere: "personnel").
      Same unverifiable-context problem — should we still say anything?
    config:
      file: titles.yaml
      path: titles.human_resources.severity
    current_default: info
    provenance: prior_calibration
    tier: hr_policy
    why_it_matters: >-
      As HR-032. Note this rule fires on the SUBSTRING "human resources" in a
      title, so "Human Resources Advisor" inside SFU HR — a correct title — is
      flagged too. Harmless at `info`; not harmless at anything higher.
    impact_if_changed: >-
      Raising the severity would penalise SFU HR's own correctly-titled roles.
    status: open

  # ═══ WHAT COUNTS AS A DEFECT (rule severities that are live questions) ══════

  - id: HR-034
    question: >-
      A JD with no "Impact of Decision Making" section is incomplete. Should it be
