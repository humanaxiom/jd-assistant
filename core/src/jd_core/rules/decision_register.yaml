  # --- comparison: version stamps, not policy ---------------------------------
  - config: {file: comparison.yaml, path: comparison.sim_version}
    reason: >-
      An IDENTITY stamp, not a decision: what a persisted neighbour/cluster was scored
      BY, so an old row stays reconcilable after the formula moves. It decides nothing
      about a JD — every parameter it stamps (the weights, the thresholds) is its own
      register entry, HR-084 … HR-096. It lives in this file rather than in Python
      precisely because bumping it is the same edit as retuning what it describes.
  - config: {file: comparison.yaml, path: comparison.cluster_algo}
    reason: >-
      The same stamp for clustering: which algorithm produced a cluster
      (`connected_components`; Louvain is the documented fallback if it over-merges on
      the real archive). Still not a decision for HR — the numbers that decide what
      actually merges are HR-094 … HR-097 — but the REASON has changed, and the old one
      was the loophole.
      ⚠ CORRECTED IN PHASE 3.1. The old exemption said "naming the algorithm in data does
      not SELECT it", and treated that as harmless. It was the opposite of harmless: the
      field accepted ANY non-empty string, so writing `louvain` here would have STAMPED
      every persisted cluster `louvain` while `build_clusters` went right on running
      connected components — a provenance falsehood (CLAUDE.md non-negotiable #6) baked
      into whatever Phase 3 persists, and the same class of landmine as a gate that
      cannot fire. It was on the backlog with a deadline: "fix before Phase 3 writes a
      cluster row."
      It now names a CLOSED set of the algorithms we implement (`ClusterAlgorithm`), and
      `build_clusters` DISPATCHES on it — so the stamp genuinely selects the algorithm,
      and a data-only "switch" to an unimplemented one fails the rulebook to LOAD rather
      than silently mislabelling clusters. Adding Louvain is now a code change and this
      stamp, together, which is the honest cost a bare string was hiding.

  # --- dedup: a safety valve, not a policy lever -------------------------------
  - config: {file: dedup.yaml, path: dedup.max_candidate_pairs}
    reason: >-
      A safety valve that fails LOUDLY; it cannot change a result, only refuse to
      produce one. If the LSH banding (`bands`/`rows`, HR-136/HR-137) would generate
      more candidate pairs than this, the pass RAISES rather than silently truncating
      the candidate list — which would silently under-report edges with no record that
      it happened, the exact failure shape CLAUDE.md's provenance rule exists to close
      off. MEASURED 70,752 candidates at the shipped banding; the ceiling (250,000)
      sits comfortably above that so it only trips on a genuine misconfiguration (a
      banding tuned so loosely that most of the corpus becomes a candidate of most of
      the rest), never on a normal run. No JD's score, grade, approval, or even which
      DedupEdge rows get written depends on this value — it either lets a normal run
      through unchanged, or stops an abnormal one before it does something expensive
      and probably wrong.

  # --- wjq: mechanical, or decided elsewhere -----------------------------------
  - config: {file: wjq.yaml, path: wjq.marker_corroborating}
    reason: >-
      The looser second tier of the SAME detection decision as HR-141: the union
      name/local (`LOCAL 3338` / `C.U.P.E`) that on their own are too loose to route (each
      also appears when a JDFN JD merely cites the union), so they only route in
      combination. HR-141's `marker_primary` is the decision a reviewer rules on; this is
      its corroboration list.
    covered_by: HR-141
  - config: {file: wjq.yaml, path: wjq.corroborating_min}
    reason: >-
      How many corroborating markers must co-occur to route a document with no primary
      phrase — 2, so a single union mention never routes. Definitional given HR-141's
      two-tier detection: it is loader-checked to be reachable (never more than the number
      of corroborating markers) and is the knob that makes the misroute guard bite.
    covered_by: HR-141
  - config: {file: wjq.yaml, path: wjq.continued_marker}
    reason: >-
      The fixed `(CONTINUED)` suffix a WJQ section repeats its heading with on a later
      page. Definitional given HR-144 (the heading vocabulary): it is stripped before a
      heading is matched so the continuation concatenates onto the same section, exactly
      like the JDFN duplicate-heading rule. A property of SFU's form, not a policy call.
    covered_by: HR-144
  - config: {file: wjq.yaml, path: wjq.frequency_headings}
    reason: >-
      The SAME frequency decision as HR-142, in its OTHER surface form: duties grouped
      under a bare `DAILY` / `WEEKLY` heading rather than tagged per-duty with `(D)`/`(W)`.
      The meanings and the field they populate (`SFUDuty.frequency`) are HR-142's; this
      table only recognises the group-heading spelling of the same tags.
    covered_by: HR-142
  - config: {file: wjq.yaml, path: wjq.instruction_markers}
    reason: >-
      The verbatim template-instruction cruft the form prints for its author ("List the
      duties...", "Check one:", "Occupational Requirement(s): Identify..."). Dropping these
      lines is definitional given the section mapping (HR-144): they are the form's own
      guidance, never a JD's content, so removing them is data cleaning, not a policy call.
    covered_by: HR-144
