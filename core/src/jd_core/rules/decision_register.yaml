  # ── Per-pass reasoning-effort knob (Phase 4.6). HR-191 rewrite, HR-192 audit. ──
  # A reasoning model (gpt-oss:120b) emits a SEPARATE reasoning stream before its answer,
  # and that stream — not the JSON output — dominates latency. MEASURED on `aria-gb10-2`:
  # ~1000 reasoning tokens vs ~164 output tokens per audit (~6x), and `reasoning_effort: low`
  # cuts the reasoning ~5x (1000 -> ~194). So it is a per-pass SPEED/quality tradeoff, and —
  # like `model` / `temperature` — a rulebook decision each pass owns separately: the audit
  # can run cheap while the rewrite keeps full reasoning. `our_invention` (no SFU or the earlier build
  # precedent); both `open`. Lives in the UNHASHED rewrite.yaml / quality.yaml — a
  # reasoning-effort change decides how a JD is WORDED / AUDITED, never how it is SCORED, so
  # it must not churn `rules_version`. `null`/unset sends the parameter NOWHERE (the model's
  # own default = pre-4.6 behaviour).
  - id: HR-191
    question: >-
      How hard should the reasoning model think before rewriting a merge draft — and should
      we constrain its reasoning effort at all?
    config:
      file: rewrite.yaml
      path: rewrite.reasoning_effort
    current_default: null
    provenance: our_invention
    tier: technical
    why_it_matters: >-
      gpt-oss is a reasoning model: it produces a reasoning stream (separate from the JSON
      content) whose length dominates latency — measured ~6x the output tokens, and
      `reasoning_effort: low` cuts it ~5x. But the rewrite produces PROSE, and prose quality
      benefits from full reasoning, so unlike the audit (HR-192, which ships `low`) the
      rewrite leaves this UNSET (`null`): the client sends no `reasoning_effort` and the model
      runs at its own default, exactly as it did before 4.6. Setting it to `low`|`medium`|`high`
      is a deliberate speed/quality trade to make at the 4.5 pilot, not a default to drift.
      PROVISIONAL. NB `high` can exhaust the token budget with reasoning and return empty
      content (observed live), so raising it must be sized against `max_tokens`.
    impact_if_changed: >-
      Does NOT move `rules_version` (rewrite.yaml is unhashed). `null` -> the parameter is
      omitted from the chat request entirely (pre-4.6 behaviour); a level flows straight
      through to the API. Pinned by mutation in the client test (the effort the client sends
      is `rules.rewrite.reasoning_effort`; unset omits the kwarg, a value passes it verbatim).
    status: open

  - id: HR-192
    question: >-
      How hard should the reasoning model think before running the nuanced quality audit?
    config:
      file: quality.yaml
      path: quality.reasoning_effort
    current_default: low
    provenance: our_invention
    tier: technical
    why_it_matters: >-
      The audit reports nuanced findings, each quoted VERBATIM from the JD — it does not need
      deep chain-of-thought. But gpt-oss's reasoning stream dominates latency: MEASURED
      ~1000 reasoning tokens vs ~164 output tokens per audit (~6x), and `reasoning_effort: low`
      cuts the reasoning ~5x (to ~194) with no loss of schema adherence in testing. So `low`
      is the disciplined, far cheaper default. It is SEPARATE from the rewrite's effort
      (HR-191, unset): a rewrite-policy change must not silently move the audit's, which is
      why each pass owns its own knob in its own file. PROVISIONAL — confirm the quality/speed
      trade at the 4.5 pilot.
    impact_if_changed: >-
      Does NOT move `rules_version` (quality.yaml is unhashed). `low` flows through to the
      chat API; set it to `null` and the parameter is omitted (the model runs at full default
      effort — slower). Pinned by mutation in the client generalization test (the effort the
      audit sends is the override `quality.reasoning_effort`; a fake asserts the exact value
      flows through, and that `null` omits the kwarg).
    status: open

  - id: HR-194
    question: >-
      Which bargaining units does the JD Bank serve under the JDFN approval bar — and
      therefore which may the Phase-5 Builder author? Specifically: should CUPE (and
      exempt/`excluded`) roles remain OUT until HR defines a quality bar for them?
    config:
      file: segmentation.yaml
      path: segmentation.jdfn_employee_groups
    current_default: [apsa, apex, poly]
    provenance: our_invention
    tier: hr_policy
    why_it_matters: >-
      This is the scope boundary of the whole product, made explicit. CUPE is ~29.5% of
      the archive (~4,300 WJQ-instrument files, `parser/wjq.py`) — a major bargaining unit,
      not an edge case. It is deliberately absent because there is NO ratified CUPE quality
      bar: the validator (the oracle for everything the Builder does — NN #3) can only
      score the JDFN template, so scoring a CUPE JD on the JDFN gates is a category error
      (the same one HR-143 keeps out of the baseline cohort), and the Builder must not
      offer to author a role it cannot check. Before Phase 5 this list lived as a hardcoded
      tuple in `compose_ui.py`; lifting it here makes "the Bank does not serve ~30% of SFU
      JDs" a decision HR can see and change on purpose, not one made silently by omission —
      exactly what this register exists to prevent. To SERVE CUPE the order is: HR defines a
      CUPE bar (a WJQ ruleset with an oracle) FIRST, THEN a token is added here. Adding one
      without a bar would surface the group in the Builder with nothing behind it. Whether
      that CUPE bar should be built at all is the real open question this entry raises.
      MEASURED 2026-08-14 — the category error is no longer an argument, it is a number
      (`docs/decisions/cupe-scope-measured-2026-08-14.md`). CUPE is 4,440 of 14,522 current
      -parser JDs (30.6%); JDFN is 5,416 (37.3%). Scored through the SHIPPED validator path,
      600 CUPE vs 600 JDFN: mean 51.7 vs 72.4, and **0 of 600 CUPE JDs are approvable**
      (JDFN 11.3%) with no CUPE JD reaching even a B. FOUR rules fire on 100% of CUPE —
      `SFU-COMP-TERRITORIAL`, `SFU-GATE-REL-HEADER`, `SFU-COMP-EDI`, `SFU-COMP-PROBLEM` —
      and by this rulebook's own `evaluable` rationale a rule that cannot NOT fire is a
      constant subtracted from every score, not a quality signal. The mechanism is the WJQ
      form itself: 0.0% of CUPE JDs have a Problem Solving section and 3.1% an Impact of
      Decision Making section, because the instrument never asks for them, while
      `duties_max: 5` (calibrated on a JDFN cohort averaging 3.8 duties) fires on 78.8% of
      a CUPE cohort averaging 9.7. AND THE COST ESTIMATE MOVES THE OTHER WAY: CUPE does not
      parse badly, it parses RICHER — 9.7 duties vs 3.8 and 19.5 qualifications vs 1.0 — so
      the WJQ parser is done and a CUPE bar is a RULES project (which WJQ sections carry a
      quality expectation, and what it is), not a pipeline one.
    impact_if_changed: >-
      Does NOT move `rules_version` (segmentation.yaml is unhashed) but moves
      `Segmentation.stamp`. The list is the employee-group dropdown the Builder offers and
      the only groups it will assemble a draft for. Adding `cupe` here would surface CUPE in
      the Builder and let a user author a CUPE JD that the validator then mis-scores on the
      JDFN bar — do not, until a CUPE bar exists. Pinned by mutation (`test_compose_ui.py`:
      the dropdown equals this list and excludes `cupe`).
    status: open

  # ── How much of `additional_context` the parser keeps (CUPE support, Phase A). ──
  - id: HR-200
    question: >-
      How many characters of a JD's Additional Contextual Information does the parser
      keep? For a CUPE/WJQ document this field holds the seven point-factor sections
      verbatim, so the answer decides how much of a CUPE job description the Bank
      retains at all.
    config:
      file: segmentation.yaml
      path: segmentation.additional_context_max_chars
    current_default: 16000
    provenance: our_invention
    tier: hr_informed
    why_it_matters: >-
      It was 4,000, and not by decision — the parser reused `_MAX_SUMMARY`, the ceiling
      belonging to `position_summary`, a field with entirely different semantics. MEASURED
      consequence over the live archive: 81.4% of CUPE JDs (3,613 of 4,440) sat exactly at
      the cap, against 0% of APSA. Because the cut falls in document order it removed the
      TAIL of the WJQ instrument, so `continuing_education` — the last of the seven
      point-factor sections — survived in only 17.0% of documents. The code called this
      storage "verbatim — lossless" while doing it. FIXING IT RECOVERED THE SECTION:
      re-parsed at the new cap, `continuing_education` is present in 85.8% of CUPE JDs
      (was 17.0%) and `working_conditions` in 95.3% (was 79.0%). 16,000 is chosen against
      a WHOLE-CORPUS measurement, and the history is kept because it is a lesson about
      sampling: a 500-file random sample (149 WJQ documents with context) gave max 9,916,
      so 12,000 was picked for ~21% headroom — and re-parsing all 14,522 files then put TWO
      documents at exactly 12,000, whose true length is 13,379. The sample had UNDERSTATED
      the corpus maximum by 35%, while predicting the corpus MEAN within 2% (5,379 vs
      5,271): a good estimator of the middle and a poor one of the tail, which is the part
      a cap has to clear. 16,000 gives ~20% headroom over the measured corpus maximum. It is
      filed
      `hr_informed` and not `hr_policy` deliberately: there is no policy choice here, only a
      question of fidelity — bigger is simply more faithful up to the point where a bound
      stops being a bound — but HR should know that CUPE job descriptions were previously
      being stored incomplete. It remains a real bound: an unbounded field is how one
      malformed document becomes a database problem.
    impact_if_changed: >-
      Does NOT move `rules_version` (segmentation.yaml is unhashed) but moves
      `Segmentation.stamp`. Raising or lowering it changes what a parsed JD CONTAINS, so it
      requires a `parser_version` bump and a full re-parse of all 14,565 files shipped
      together — bumping without re-parsing leaves every layer querying a version with no
      rows, i.e. an apparently empty Bank (#101 precedent). It must also stay at or below
      `SFUJobDescription.additional_context`'s `max_length` ceiling (20,000): a configured
      cap above it turns a lossy parse into a ValidationError, i.e. a parse failure. Pinned
      by `test_wjq_context_not_truncated.py`.
    status: open

  # ── The CUPE/WJQ numeric profile (CUPE Phase C) ──────────────────────────────
  # The JDFN counterparts are HR-019 … HR-022, and these four are deliberately the
  # same questions asked about the other form. They exist because a number calibrated
  # on one SFU form was being applied to both; whether each WJQ value is RIGHT is HR's
  # call, and changing one is a YAML edit with no code change.
  - id: HR-202
    question: >-
      How many major responsibilities may a CUPE (WJQ) job description list before it
      is marked down? The JDFN form asks for 3-5 (HR-022); the WJQ questionnaire has
      TWELVE duty slots.
    config:
      file: thresholds.yaml
      path: thresholds.wjq.duties_max
    current_default: 12
    provenance: our_invention
    tier: hr_policy
    why_it_matters: >-
      MEASURED over all 4,440 CUPE documents at `jd_segmenter_v4`: `SFU-STRUCT-DUTIES
      -TOO-MANY` fired on 82.3% of them against the JDFN's `duties_max: 5`, and the
      distribution says why — CUPE duty counts are BIMODAL, not averaging anything.
      77.4% of CUPE JDs carry EXACTLY twelve duties and 16.2% carry zero; almost
      nothing sits in between, so the "9.7 average" an earlier version of this work
      quoted describes no actual document. Twelve is the number of duty slots the WJQ
      instrument provides, which makes this a property of the FORM rather than a
      judgement about CUPE job descriptions — the same category as `applies_to`.
      `SFUJobDescription.duties` is independently capped at 12, which is the identical
      fact recorded a third time. Marking a JD down for filling in the form it was
      given is the category error this whole phase exists to remove. ⚠ WHAT THIS DOES
      NOT SETTLE: whether twelve duties is *good practice* is a real question, and SFU
      may well hold that a role described in twelve separate duties needs consolidating
      — but that is an argument to put to CUPE about the WJQ FORM, not a defect to
      charge 3,436 existing job descriptions with.
    impact_if_changed: >-
      Moves `rules_version` (thresholds.yaml is hashed). Lowering it toward the JDFN's 5
      re-applies the finding to ~82% of the CUPE cohort; raising it above 12 has no
      effect, because the parsed model cannot represent a thirteenth duty. Advisory
      either way — `SFU-STRUCT-DUTIES-TOO-MANY` is in no blocking set
      (`gates.yaml` omission (d)), so this costs score, never approval.
    status: open

  - id: HR-203
    question: >-
      What is the minimum number of major responsibilities for a CUPE (WJQ) job
      description? Held at the JDFN's 3 (HR-021).
    config:
      file: thresholds.yaml
      path: thresholds.wjq.duties_min
    current_default: 3
    provenance: our_invention
    tier: hr_policy
    why_it_matters: >-
      Kept at the JDFN value because nothing measured argues against it: the WJQ's
      under-run is rare (`SFU-STRUCT-DUTIES-TOO-FEW` fires on 0.6% of CUPE against
      40.6% of JDFN). Registered rather than silently inherited because a value that is
      the same by DECISION and a value that is the same by OMISSION look identical in
      the YAML and are not the same thing — the omission is what this phase is fixing.
    impact_if_changed: >-
      Moves `rules_version`. Advisory; the rule is in no blocking set.
    status: open

  - id: HR-204
    question: >-
      How long may a CUPE (WJQ) Position Summary be? Held at the JDFN's 150-word
      maximum (HR-020).
    config:
      file: thresholds.yaml
      path: thresholds.wjq.summary_max_words
    current_default: 150
    provenance: our_invention
    tier: hr_policy
    why_it_matters: >-
      ⚠ THIS ONE CORRECTS A FRAMING THIS PROJECT CARRIED FOR SEVERAL DAYS. The plan
      said "CUPE averages 168 words against a 100-150 band", which reads as an argument
      to RAISE the ceiling. Measured over all 4,440 CUPE documents, the distribution
      says the opposite: 39.9% of CUPE summaries fall UNDER 100 words and only 15.1%
      exceed 300 (maximum 671). The 168 mean is a thin heavy tail pulling, not a
      typical document — the median is 108, essentially the JDFN's 102. Raising the
      ceiling would therefore help ~15% of the cohort and abandon the ~40% whose real
      defect is under-run. Held at 150 pending HR, with the finding recorded rather
      than acted on unilaterally.
    impact_if_changed: >-
      Moves `rules_version`. `SFU-STRUCT-SUMMARY-TOO-LONG` currently fires on 27.1% of
      CUPE. It IS gated for the JDFN form (SFU's Part 11.6 names the over-run), so
      unlike the duty count this one can affect approval.
    status: open

  - id: HR-205
    question: >-
      What is the minimum length of a CUPE (WJQ) Position Summary? Held at the JDFN's
      100 words (HR-019).
    config:
      file: thresholds.yaml
      path: thresholds.wjq.summary_min_words
    current_default: 100
    provenance: our_invention
    tier: hr_policy
    why_it_matters: >-
      The knob with the largest measured population behind it and the least evidence
      for a value: 39.9% of CUPE summaries are under 100 words, so this is the CUPE
      cohort's single commonest summary finding — and `SFU-STRUCT-SUMMARY-TOO-SHORT` is
      deliberately in NO blocking set (`gates.yaml` tension #1: the under-run is our
      drafting nudge, not an SFU condition), so today it costs score and blocks nothing.
      Whether the WJQ's shorter summaries are a defect at all, or simply what that form
      elicits, is exactly the sort of question this register exists to put to HR rather
      than answer with a number we picked.
    impact_if_changed: >-
      Moves `rules_version`. Lowering it would silence the CUPE cohort's most frequent
      summary finding; raising it would penalise ~40% of CUPE JDs further. Advisory —
      the rule is in no blocking set.
    status: open

  # ── Do SFU's boilerplate requirements apply to a CUPE/WJQ JD? (CUPE Phase B) ──
  - id: HR-201
    question: >-
      Must a CUPE job description carry SFU's boilerplate — the About SFU block, the
      territorial acknowledgement and the employment-equity statement — the way a JDFN
      one must? The WJQ form does not contain them, so today the three rules that check
      for them are declared JDFN-only and a CUPE JD is not marked down for their absence.
    config:
      file: rule_catalog.yaml
      path: rule_catalog.SFU-COMP-TERRITORIAL.applies_to
    current_default: [jdfn]
    provenance: our_invention
    tier: hr_policy
    why_it_matters: >-
      This is the one genuinely POLICY-shaped question inside an otherwise factual field.
      `applies_to` normally states a fact about the form — the WJQ has no Problem Solving
      section, so a rule checking for one cannot judge it. The boilerplate is different:
      the territorial acknowledgement and the EDI statement are SFU-WIDE commitments, not
      JDFN-template furniture, and one could argue every SFU job description should carry
      them regardless of which form it was written on. MEASURED, all three currently fire
      on ~100% of CUPE documents because the WJQ form simply has no such block — so
      applying them would mark down all 4,440 CUPE JDs for a property of the FORM rather
      than of the job description, while NOT applying them means the Bank holds CUPE JDs
      to a weaker inclusion standard than JDFN ones. The default keeps them JDFN-only
      because scoring a document for lacking a section its official form never provides is
      the category error this whole phase exists to remove — but that is an engineering
      judgement standing in for a policy call, which is exactly what this register is for.
      If HR rules that the boilerplate is universal, the honest fix is the FORM (ask SFU to
      add the block to the WJQ), not a rule that every CUPE JD fails by construction.
      The same question covers `SFU-COMP-ABOUT` and `SFU-COMP-EDI`, which move together.
    impact_if_changed: >-
      🔴 THIS RULING DECIDES WHETHER CUPE JDs CAN BE APPROVED AT ALL — it is not a score
      adjustment, and an earlier version of this entry said it was ("restoring roughly a
      third of the score gap"). MEASURED over the whole archive 2026-08-14
      (`docs/decisions/cupe-phase-b-measured-2026-08-14.md`): `SFU-COMP-TERRITORIAL` and
      `SFU-COMP-EDI` feed the EDI-footer BLOCKING gate, so with them withheld the WJQ
      cohort is approvable at **59.0%** (4,300 documents) and with them applied it was
      **0.0%**. Adding `wjq` to these three rules therefore returns all 4,440 CUPE JDs to
      un-approvable, because the WJQ form contains no such block for them to find — which
      is precisely why the recorded view is that if HR rules the boilerplate universal,
      the honest fix is the FORM. Also moves `rules_version` (rule_catalog.yaml is hashed).
      Pinned by `test_rule_applies_to_template.py`, which fails if the JDFN-only set moves.
    status: open

  # ── Embedding over-length fallback ladder (HR-126 follow-up). ──
  - id: HR-193
    question: >-
      When a JD's serialized text is still too long for the embedding model AFTER
      `max_chars` truncation, what shorter lengths do we retry before giving up?
    config:
      file: embeddings.yaml
      path: embeddings.max_chars_fallback
    current_default: [8000, 6000, 4000]
    provenance: our_invention
    tier: technical
    why_it_matters: >-
      This is the resolution of HR-126's open design decision (see
      `docs/embeddings/max-chars-decision.md`). Re-measured over the v2 corpus, ~11 dense
      WJQ documents exceed the model's 8,192-token window even after `max_chars=10000`
      truncation, so the server 400s and — before this knob — they got NO document vector
      at all (`bad_requests=11`). The runner now re-cuts such a text (on whole-line
      boundaries, mirroring the primary path's whole-unit truncation) to each of these
      caps in turn and embeds the first the server accepts, so the document gets a
      best-effort SHORTER vector rather than a gap. The rungs are token-safe: 8,000 chars
      ≈ ~7.3k tokens even at the densest measured ~1.1 chars/token (under the 8,192 window
      with margin); 6,000/4,000 are backstops. `max_chars` itself is deliberately KEPT at
      10,000 (HR-126) so the 1,389 truncated-but-servable docs keep their fuller vector —
      this ladder only ever runs for the tail the window physically cannot hold. The
      whole-document vector is a retrieval/dedup substrate, never the approval bar, and
      for these long docs the per-section vectors (duties/summary/quals, HR-130) carry the
      role signal in full regardless (option (a)+(c) in the decision doc; chunk-and-pool
      (b) rejected as disproportionate, lowering `max_chars` (d) as strictly worse).
    impact_if_changed: >-
      On the register but NOT in `rules_version` (embeddings.yaml is unhashed) — it does
      move `embeddings.stamp`, so changing it forces a full re-embed, MERGEd in place.
      Empty list `[]` restores the exact pre-HR-193 behavior: an over-window text is
      written off to `bad_requests` with no vector. The loader REJECTS a ladder that does
      not strictly descend (a rung ≥ its predecessor buys nothing) or that contains a
      non-positive rung — but it is deliberately NOT coupled to `max_chars` (the two are
      independent knobs; a rung ≥ `max_chars` is harmlessly skipped at runtime). NOTE the
      one accepted imprecision: a backed-off document's vector is memoised under its
      ORIGINAL `max_chars` text_sha256, which KEEPS skip-first idempotent (an unchanged
      corpus re-embeds nothing — the ~11 are skipped like every other node), at the price
      that for those ~11 nodes the stored sha is the text we intended to embed, not the
      shorter bytes we actually embedded (`truncated=True` flags them partial). Bounded
      and deliberate, not a bug. Pinned by mutation in `test_embeddings_rules.py` (ladder
      moves the stamp; descend/positive validators) and the runner's backoff integration
      tests, incl. the idempotent-second-run assertion (`test_embeddings_store.py`).
    status: open

  # ── The JD Builder's near-duplicate AUTHORING guard (Phase 5.9). ──
  # Advisory only: it shows an author the existing roles that look like the one they
  # are typing, so they clone instead of authoring a tenth near-copy. It never blocks
  # a submission and never publishes (CLAUDE.md §1). NOTE WHAT IS *NOT* REGISTERED
  # HERE: there is no similarity threshold, because the measurement says a threshold
  # cannot exist on this data — see HR-196's `why_it_matters`.
  - id: HR-195
    question: >-
      When the Builder warns an author that their new job description looks like roles
      SFU already has, how many of those existing roles should it list?
    config:
      file: dedup.yaml
      path: dedup.authoring_guard.max_matches
    current_default: 5
    provenance: our_invention
    tier: hr_informed
    why_it_matters: >-
      This is how much advice the panel gives while someone is typing, and it is a
      judgement about attention, not a measurement. It is set to 5 because the useful
      signal is concentrated at the very top of the ranking: MEASURED over the live
      `jd_role_embeddings` index (1,797 role vectors), for the 790 roles that have a
      same-title sibling the sibling is in the top 5 for 76% of them and in the top 10
      for 84% — so rows 6-10 add 8 points of recall and double the reading. A shorter
      list (3) is a stronger nudge and misses more real duplicates; a longer one (10)
      turns an advisory panel into a search results page the author will scroll past.
      The panel ALSO states one non-vector fact that carries no cutoff at all — how many
      existing roles already hold the exact same title, and across how many departments
      — and that sentence is unaffected by this number.
    impact_if_changed: >-
      Does NOT move `rules_version` (dedup.yaml is unhashed); it does move `Dedup.stamp`.
      Purely how many rows the Builder's advisory panel shows — it cannot change a
      score, a grade, a gate, a dedup edge or a cluster, and nothing downstream reads
      it. Pinned by mutation (`test_composer_duplicates.py`: retune it to 2 and the
      guard returns 2 matches from a 6-neighbour result).
    status: open

  - id: HR-196
    question: >-
      How much must an author have written before the Builder goes looking for existing
      roles that resemble their draft?
    config:
      file: dedup.yaml
      path: dedup.authoring_guard.min_draft_chars
    current_default: 500
    provenance: our_invention
    tier: technical
    why_it_matters: >-
      Below this length the guard does not run at all — no advice, and no embedding round
      trip. 500 characters is roughly one Position Summary, and MEASURED against the live
      role index a 500-character draft retrieves its own twin BETTER than the full
      document does (14 of 20 in the top 5, versus 11 of 20 for the whole JD); a summary
      retrieves its parent role at 0.968-0.987. Below ~500 retrieval degrades but does not
      collapse, so this is the point at which the answer starts being worth asking for,
      not a quality bar on the draft. Set it lower to advise earlier (and more noisily);
      higher to stay quiet until the draft is substantial.
      ⚠ READ THIS BEFORE ASKING FOR A SIMILARITY THRESHOLD OR A PERCENTAGE. There is
      deliberately no cutoff and no number shown on any row, because the measurement says
      neither can be honest here: same-title role pairs (2,618 genuine duplicates) sit at
      a MEDIAN cosine of 0.9335, while a role's nearest UNRELATED neighbour sits at 0.9604
      — the unrelated neighbour scores HIGHER than the real twin. At a 0.90 cutoff the
      guard would fire on 99.2% of drafts at 22% precision; at 0.97 it would still fire on
      24% and lose most true duplicates; a top1-vs-top2 margin rule fails the same way
      (0.0065 for a true sibling vs 0.0052 for noise). Ranking works, the absolute number
      does not, so the panel ranks and shows no number. A percentage here would repeat the
      defect this project already fixed once in title search, where a 0.013 spread across
      the whole result page rendered as "81%" on every row.
    impact_if_changed: >-
      Does NOT move `rules_version` (dedup.yaml is unhashed); it does move `Dedup.stamp`.
      It gates ONE embedding call per compliance check, so lowering it costs GPU time on
      drafts too thin to match anything, and raising it means an author can get a long way
      into a duplicate before being told. It is a length floor and NOT the empty-draft
      guard: a draft whose serialized text is empty or whitespace is refused
      unconditionally at any setting, because the embedding model turns "" into a constant
      vector that is a plausible nearest neighbour to everything (measured: every empty
      query returned the same role at exactly 0.8038), and the empty check runs FIRST so
      no setting of this floor can switch it off. The rulebook refuses to LOAD a value of
      0 or below: a floor is a length, not an on/off flag. Pinned by mutation
      (`test_composer_duplicates.py`: the same draft embeds at a low floor and does not
      at 500; and a whitespace-only draft LONGER than the floor still never embeds).
    status: open

  - id: HR-197
    question: >-
      How long should the Builder wait for the "roles SFU already has" panel before
      giving up on it and showing the compliance result without it?
    config:
      file: dedup.yaml
      path: dedup.authoring_guard.timeout_seconds
    current_default: 5.0
    provenance: our_invention
    tier: technical
    why_it_matters: >-
      This is a trade between an author's time and the university's. The panel is
      ADVISORY — it never blocks a submission and never changes a compliance verdict —
      so it is worth a couple of seconds of waiting, and it is NOT worth a held
      connection. It exists because the ordinary "if it breaks, carry on without it"
      handling cannot cover every failure: it catches an error, and an inference host
      that is switched off does produce an error quickly (the connection is refused in
      about 5 seconds). What it cannot catch is a host that ACCEPTS the request and then
      never answers — a graphics card wedged by another job, or a network rule that
      silently drops traffic after the connection is made. In that case the underlying
      client would keep waiting, with retries, for the better part of an hour, holding
      both the author's page and one of a small pool of database connections. A handful
      of authors clicking "Check compliance" would then stop the Builder serving anyone.
      5 seconds is chosen as roughly a page load: a working lookup takes well under a
      second, so it is far above normal operation and far below the point where an author
      concludes the Builder is broken.
    impact_if_changed: >-
      Does NOT move `rules_version` (dedup.yaml is unhashed); it does move `Dedup.stamp`.
      It bounds ONE call — the near-duplicate panel on the Builder's Check — and nothing
      else: raising it makes an author wait longer before the panel is silently omitted;
      lowering it may drop the panel on a slow-but-healthy day. When the budget is spent
      the panel is ABSENT, never rendered as "no duplicates found" (an unverified all
      clear is exactly the wrong thing to show). Deliberately NOT the embedding client's
      global timeout, which the archive embedding runs share and may legitimately want
      long. Pinned by mutation in `test_compose_ui.py` (a guard that never returns leaves
      the compliance panel intact and the duplicate panel absent).
    status: open


  - id: HR-198
    question: >-
      How long should the archive search wait for the search index before it gives up
      and tells the author to try again?
    config:
      file: embeddings.yaml
      path: embeddings.interactive_timeout_seconds
    current_default: 10.0
    provenance: our_invention
    tier: technical
    why_it_matters: >-
      The same failure the authoring guard's budget exists for (HR-197), on the page
      where it costs more. The ordinary "if it breaks, carry on" handling catches an
      error, and a switched-off inference host does produce one quickly — the connection
      is refused in about five seconds. What it cannot catch is a host that ACCEPTS the
      request and then never answers: a graphics card wedged by another job, or a
      network rule that silently drops traffic after the connection is made. The
      underlying client would then keep waiting, with retries, for the better part of an
      hour — holding both the author's page and one of a small pool of database
      connections. A handful of searches in that state would stop the Builder serving
      anyone at all. Ten seconds is deliberately longer than the guard's five: the guard
      is advisory, so giving up costs a suggestion panel, whereas this IS the search
      page, and giving up costs the author their result. A working search takes well
      under a second.
    impact_if_changed: >-
      Longer means a stalled search host holds a page and a database connection for
      longer before the author is told anything, and fewer simultaneous searches are
      needed to exhaust the connection pool. Shorter risks abandoning a search that
      would have succeeded — most likely the first search after a quiet period, when the
      model is still loading. Nothing about a job description's score, grade or
      approvability changes either way.
  - id: HR-199
    question: >-
      How long should the Builder's "improve my summary" assistant wait for the writing
      model before it gives the author their page back?
    config:
      file: rewrite.yaml
      path: rewrite.interactive_timeout_seconds
    current_default: 60.0
    provenance: our_invention
    tier: technical
    why_it_matters: >-
      Same protection as HR-198, for the one place the Builder waits on the WRITING
      model rather than the search index, and set higher for an honest reason: writing a
      new summary legitimately takes tens of seconds, where looking something up does
      not. Without a limit, a model that accepts the request and then stalls would hold
      the author's page for the better part of an hour and, worse, the author would have
      no way back to the words they had already typed. When the limit is reached the
      draft is returned to them intact with an explanation — losing half-written work to
      a wedged graphics card is a far worse outcome than not getting a suggestion. This
      is the INTERACTIVE limit only; the offline harmonization rewrite, which works
      through clusters in the background, is deliberately left unbounded by it.
    impact_if_changed: >-
      Longer means an author waits longer, staring at a loading page, before being told
      the assistant is unavailable. Shorter risks cutting off a suggestion that was
      about to arrive — most likely on a large model's first request after a quiet
      period. The suggestion is advisory in either case: it is applied to the summary
      box for the author to review, never published, and the validator scores the result
      regardless.

# ═════════════════════════════════════════════════════════════════════════════
# TRIVIAL — on the decision surface, deliberately NOT a decision for HR.
#
# The coverage check (loader.check_register) demands that EVERY parameter on the
# decision surface is either an entry above or an exemption here WITH A REASON.
# Nothing may be silently skipped. Two honest kinds of exemption:
#   * not a decision at all (presentation, or definitional given something else);
#   * decided elsewhere — `covered_by` names the entry that pins it (validated).
# ═════════════════════════════════════════════════════════════════════════════
trivial:
  # --- archive baseline: presentation ------------------------------------------
  - config: {file: segmentation.yaml, path: segmentation.score_histogram_bin}
    reason: >-
      The width of a score-distribution bucket in the baseline's summary. It changes how
      the SAME scores are drawn, never what any of them is: no JD's score, grade, gate
      decision or segment membership depends on it, and the min / median / mean / max are
      computed from the raw scores, not from the bins. Presentation.

  - config: {file: segmentation.yaml, path: segmentation.evidence_max_chars}
    reason: >-
      How much of a finding's verbatim JD quote is carried into the baseline artifacts
      before truncation. It cannot move a score, a grade, a gate or a segment — the
      findings are complete either way; this only bounds how much JD text a derived
      artifact reproduces. A cap, not a policy call.

  # --- hay signals: presentation ----------------------------------------------
  - config: {file: hay_signals.yaml, path: hay_signals.evidence_cap}
    reason: >-
      How many evidence phrases one Hay factor's signal may CITE. Presentation only:
      the score is computed from every hit and the level is decided before the
      evidence list is truncated, so this cannot move a signal from low to high — it
      only shortens the "why". It is bounded by what `HayFactorSignal.evidence`
      accepts (the rulebook refuses to load if it exceeds that), and the substantive
      calls — which phrases count and what they are worth — are HR-066 … HR-081.

  # --- gates: rankings and presentation ---------------------------------------
  - config: {file: gates.yaml, path: gates.severity_order}
    reason: >-
      The ranking of the severity literals from least to most severe. Any other
      order would be incoherent (it is not a policy choice that `high` outranks
      `low`); the choice of WHERE the floor sits on this ranking is HR-003.

  - config: {file: gates.yaml, path: gates.grade_order}
    reason: >-
      The ranking of the grade literals from worst to best. F < D < C < B < A is
      not a policy choice; where the floor sits on it is HR-002.

