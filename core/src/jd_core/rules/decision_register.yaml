      - organizes
      - outlines
      - oversees
      - participates
      - performs
      - plans
      - prepares
      - processes
      - programs
      - promotes
      - proposes
      - provides
      - purchases
      - receives
      - recommends
      - records
      - repairs
      - reports
      - represents
      - requisitions
      - researches
      - resolves
      - responsible
      - reviews
