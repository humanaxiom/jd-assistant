# LLM harmonize REWRITE pass (Phase 4.2a) — rulebook-as-data (CLAUDE.md §2).
#
# WHAT THIS FILE DECIDES
# ----------------------
# HOW the self-hosted LLM rewrites a Phase-4.1 merge DRAFT (already a valid
# SFUJobDescription) into cleaner, template-faithful prose — which chat model, at what
# temperature/budget, how invalid JSON is retried, and how aggressively the
# anti-fabrication guard scrubs/flag content the model INTRODUCED. It decides NOTHING
# about how a JD is SCORED or APPROVED: the approval bar lives in the HASHED files
# (gates/scoring/rule_catalog/...). A rewrite-policy change must therefore NOT churn
# `rules_version` — that digest identifies *which rules scored a JD*, and rewording a
# draft scores nothing. So, exactly like `harmonization.yaml`, this file is REGISTERED
# and on the decision surface but EXCLUDED from `rules_version` (`loader._UNHASHED_FILES`).
#
# PROVENANCE + CALIBRATION
# ------------------------
# EVERY value here is `our_invention`, `status: open` (HR-176…HR-184). SFU publishes no
# rewrite policy, and hris used an LLM prompt only (no anti-fabrication or grounding
# policy to have inherited). All defaults below are PROVISIONAL STARTING VALUES, to be
# calibrated at the 4.5 pilot — NOT settled, and NOT backed by measured evidence we do
# not yet have. Each register entry says so in `why_it_matters`.
#
# OUT OF SCOPE (do not add knobs for these here): the `jd_quality` nuanced audit pass
# (4.2b), %-rebalance of duty allocations, diff/change-log, review queue, DB persistence.

version: jd_rules_sfu_v4

# --- chat model + sampling ---------------------------------------------------------
# The chat model that rewrites the draft. A rulebook decision (NEVER `settings.agent_model`,
# the harness's own coder-agent model). `gpt-oss:120b` is the strongest general instruct
# on the host today (best JSON-schema adherence for the SFUJobDescription output);
# alternatives available: gpt-oss:20b, qwen3.5:latest, gemma4:26b, llama4:latest. HR-176.
model: gpt-oss:120b

# Sampling temperature. 0.0 -> deterministic: a rewrite is a transform (reword the grounded
# draft), not a brainstorm, and determinism is what makes a re-run reproducible. HR-177.
temperature: 0.0

# How hard the reasoning model thinks before answering. `low`|`medium`|`high`, or `null` to
# send NOTHING (the model's own default = today's behaviour). Unset here ON PURPOSE: the
# rewrite produces PROSE, which full reasoning improves, so — unlike the audit (quality.yaml
# ships `low`) — we do NOT blanket-drop it. Passed through the client like model/temperature;
# UNHASHED (never moves rules_version). HR-191.
reasoning_effort: null

# Token budget for one rewrite completion. HR-178.
#
# MEASURED 2026-10-20 (rewrite pilot, 22 size-stratified v9 clusters, gpt-oss:120b): Ollama
# caps the reasoning stream and the content SEPARATELY at this number. At the old 2048
# (hris's value) 4 of 22 first calls stopped on `length` with an EMPTY reply — every one a
# WJQ or >p90 draft — and were saved only by the single repair retry (HR-179); one success
# used 1,912 of 2,048 content tokens. At 4096 all six re-run clusters (the four that
# truncated + the two largest) finished on the first call, the largest reply using 2,025
# content tokens (~49%). Parser v9 drafts are larger (merged p50 7.5k chars, max 34k).
#
# MEASURED 2026-10-21 (rewrite pilot round 2, 20 clusters, prompt v4): at 4096, 4 of 20
# first calls stopped on `length` with an EMPTY reply, every one in the REASONING phase
# (22.7k–25.1k reasoning characters, no content), and one cluster (d2c41bc7) failed both
# attempts and kept its deterministic draft. Re-run at 8192, all four stopped on the first
# call: peak reasoning ~5,900 tokens (72% of the budget), peak content 3,742 (46%).
max_tokens: 8192

# How many times an INVALID-JSON / schema-mismatch response is re-requested with a terse
# repair nudge before raising LLMOutputInvalidError. Transient network/5xx retries are
# SEPARATE (fixed in the client, never a 400). HR-179.
max_retries: 1

# Which prompt template the rewrite loads (the versioned pair under jd_bank/llm/templates/:
# `<name>.system.j2` + `.user.j2`). The loaded template's own version stamps
# RewrittenDraft.prompt_version. HR-180.
#
# v2 (CUPE Phase D) takes the duty count and the summary band as VARIABLES resolved from
# the drafted form's own profile, instead of inlining SFU's JDFN guidance ("3–5 major
# duties", "100–150 words"). v1 is kept on disk, unedited, because a stamped
# `prompt_version` has to be readable back — every draft in the archive today carries it.
# v3 (parser v9, owner ruling 2026-10-20 Q1): duties carry how/why clauses now. The input
# shows each duty as a "- " line with its clauses indented under it (`jd_text.outline_jd`),
# and rule 3 says to keep that shape. v2 stays on disk unedited, for read-back.
# v4 (rewrite fidelity, 2026-10-20): rule 3 says to MERGE related duties to reach the form's
# limit and never drop a duty area; the section rules say to reword only what THAT section
# states. The input is the merge draft minus the form's own instructions and SFU
# boilerplate (`form_instructions`, `grounding_boilerplate_threshold`). v3 stays on disk.
prompt_version: jd_harmonize_v4

# --- anti-fabrication guard (the heart of 4.2a) ------------------------------------
# Whether the guard runs at all. `true` scrubs ungrounded qualifications and flags
# no-overlap duties; `false` ships the model's output UNSCRUBBED (the escape hatch,
# registered so flipping it cannot be quiet). HR-181.
anti_fabrication_enabled: true

# How a rewritten qualification's grounding is decided against the merge draft's
# vocabulary. `token_overlap`: grounded iff the fraction of its content tokens present in
# the vocabulary reaches `skill_grounding_threshold`. `all_grounded`: grounded only if
# EVERY content token is in the vocabulary (strict; the threshold is inert under it). HR-182.
skill_grounding_policy: token_overlap

# The fraction of a rewritten qualification's content tokens that must appear in the merge
# draft's vocabulary for it to be KEPT. Below it, the qualification is SCRUBBED (dropped)
# and recorded. PROVISIONAL — to be calibrated at the 4.5 pilot. HR-183.
skill_grounding_threshold: 0.5

# How a rewritten duty's how/why CLAUSE is grounded (parser v9 review M2). Prompt v3 forbids
# inventing clauses; this is the check: at least this fraction of a clause's content tokens
# must appear in ONE source duty's headline plus ONE of its clauses (never a union). Below
# it the clause is DROPPED and recorded (`scrubbed_how_why`).
#
# Since 2026-10-20 (rewrite fidelity) the unit may come from ANY source duty, not only the
# one the rewritten duty was matched to: the pilot's model merges duties to reach the
# form's cap, and grounding a merged duty's clauses against one source scrubbed 8 faithful
# clauses on 1d68c603 and all 15 on 22994d3a. Still one unit per test — a clause stitched
# from words scattered across clauses still fails.
#
# The same number is asked from the other end (`duty_coverage_policy`): each SENTENCE of
# every source duty must be covered — this fraction of its tokens — by ONE rewritten duty
# (statement + kept clauses), or it is folded back. Held at the qualification bar (HR-183)
# until a calibration says otherwise. HR-267.
how_why_grounding_threshold: 0.5

# --- rewrite fidelity (owner ruling 2026-10-20: "fix the rewrite first") ------------
# MEASURED on the rewrite pilot (22 size-stratified clusters on the v9 Bank, replies
# recorded and replayed offline through the guard): the guard checked what the model
# ADDED to duties and qualifications only, and never what it LOST anywhere but empty
# sections. Every knob below is `our_invention`, `open`.

# What happens to source DUTY content no rewritten duty covers (by the HR-267 rule, read
# source -> rewrite, one sentence at a time). The JDFN cap is five duties (HR policy,
# `thresholds.duties_max`, untouched) and a twelve-duty merge has to be merged to fit it;
# the pilot's model met the cap by DROPPING areas instead — on 1d68c603 "Community Liaison
# & Committee Representation" and "Research & Museum Career Skills Training" were recorded
# in `removed_duties` and gone from the draft.
#   fold_back (shipped): each uncovered sentence is appended, verbatim, as a how/why clause
#     of the rewritten duty that covers the rest of its source duty best — content is kept
#     and the cap is kept. Recorded in `folded_duty_content`.
#   record_only: the draft keeps the model's duties as returned and each uncovered
#     sentence is listed for the reviewer (`dropped_duty_content`, shown on the review
#     page as "dropped from the merge").
# Visible over silent either way; fold_back because a reviewer reading a five-duty draft
# cannot see what is not on the page. HR-271.
duty_coverage_policy: fold_back

# WHERE fold-back puts a source duty's lost sentences: under the rewritten duty that holds
# the most of that source duty's words — read from what the MODEL wrote, never from what
# was already folded in (that let the first duty to take a fold snowball: one duty took
# 30 of 37 on the pilot's 1d68c603). This is the least share of the source duty's
# content words that duty must hold. Below it the lost content is NOT filed under an
# unrelated duty ("Maintains the departmental website content" under "Coordinates the
# student orientation program"): it comes back as its OWN duty, verbatim, when the form
# has room (`thresholds.duties_max`, HR policy, untouched), and is listed for the reviewer
# otherwise. 0.0 folds under the best match whatever it is. MEASURED (28 recorded pilot
# replies, replayed offline): every fold at 10% or less was unrelated ("approves leaves of
# absence" at 0%, "Research & Museum Career Skills Training" under "Acquire and develop
# museum assets" at 8–10%), the next source duties up were related as duties (11.5%+), though not every
# sentence of them reads right where it lands (11–13%: a list of library associations
# under the budget duty) — the lowest floor that removes the clearly unrelated, not a
# clean line. 15 sentences are now listed
# instead of misfiled; none could become its own duty (every such draft was full). HR-279.
fold_back_relevance_min: 0.11

# The most source sentences fold-back files under ONE rewritten duty; past it the next
# goes to the next-best duty above the HR-279 floor (or, if none, is handled as below the
# floor). 0 = no limit beyond the how/why cap (`segmentation.duty_how_why_max_count`).
# HR-280.
fold_back_max_per_duty: 0

# The sections where a sentence matching SFU boilerplate (HR-273/274) is shown to the
# reviewer as "matched SFU's standard wording and was set aside — check it is not part
# of the role", rather than as standard wording set aside. Display only: what is
# stripped does not change. An Indigenous programs role's duty about events that
# acknowledge the Coast Salish territories matches the acknowledgement and is stripped;
# called "form text", nothing prompted the reviewer to put it back. Qualifications are
# deliberately NOT listed: MEASURED over the 22 pilot merge drafts, all 23 boilerplate
# strips were in Qualifications (9 drafts) and every one was the real EE statement or
# acknowledgement the parser reads in as a qualification line — listing the section would
# put a false "check this" on 41% of drafts. HR-281.
boilerplate_review_sections: [duties, decision_making, problem_solving, relationships]

# How a rewritten DECISION MAKING / PROBLEM SOLVING / RELATIONSHIPS item is grounded: at
# least this fraction of its content tokens must appear in ONE item of the merge draft's
# SAME section (not the whole document — a contact lifted from the duties is not a
# contact the Relationships section states). Below it the item is DROPPED and recorded
# (`scrubbed_items`). Read the other way it decides LOSS: a source item sentence with less
# than this fraction of its tokens in the section's kept items is uncovered
# (`uncovered_items`). One number, both directions, the same rule family as HR-183/HR-267.
# MEASURED: "Approves acquisition, deaccession and loan decisions", "…approves funding
# proposals" (1d68c603, Decision Making) and a WJQ contact list replaced by "Engineering
# Science" contacts its section never names (0a75edf1) all passed the old guard. HR-269.
section_item_grounding_threshold: 0.5

# The sections whose UNCOVERED source items are put back, verbatim, after the rewrite (the
# same "loses nothing" principle as the how/why restore). A section not listed still has
# its losses recorded in `uncovered_items`, and they show on the review page. MEASURED:
# 1d68c603 Decision Making 13 -> 5; a WJQ draft's qualifications 40 -> 15 with "circuit
# fabrication/assembly", "web publishing software" and "instruct others on safe work
# environments" among those gone and nothing recording it. HR-270.
restore_uncovered_items_in: [decision_making, problem_solving, relationships, qualifications]

# Whether a NAMED TERM in a rewritten item — an acronym, or a capitalized word that does
# not start a sentence — must itself appear in the source text the item is grounded in.
# A token-overlap bar cannot see a new name riding on grounded words: "Familiarity with
# international museum standards and conventions (e.g., ICOM Code of Ethics, CITES)"
# has 5 of 9 tokens grounded where the source says only "International Council on
# Museums". Applies to qualifications, how/why clauses and the per-item sections, and
# (review round 1) to duty STATEMENTS, where an ungrounded name FLAGS the duty (HR-184:
# a duty is flagged, never dropped). HR-272.
named_terms_must_be_grounded: true

# Whether every NUMBER in a rewritten item must appear in the text it is grounded in, as
# a named term must (HR-272). Review round 1: a one- or two-digit token was below
# `comparison.skill_min_token_len`, so "2 staff" -> "12 staff" was invisible to every
# grounding test. Numbers are now content tokens whatever their length, and with this on
# an item whose number the source does not state is not grounded. HR-278.
numbers_must_be_grounded: true

# English function words, added to `comparison.skill_stopwords` for the rewrite's
# grounding tests ONLY. That list (HR-150) is a 20-word noise filter for skill bags: it
# drops "management" and "training" but KEEPS "and", "the", "for", "such" as content
# tokens, and every 0.5 bar here (HR-183/267/269) counted them as evidence. MEASURED
# (review round 1, replay of the 22 pilot replies): "Terminates the employment of the
# staff and the volunteers for the orientation." grounded at 4 of 8 on an orientation
# Decision Making item, and on b13e6321 the source sentence "Marketing services on the
# Web and in print media, with posters and brochures, …" was "covered" at exactly 10 of
# 20 by a duty that never mentions marketing — gone from the draft, in no record.
# Negations ("not", "no", "never", "without") are deliberately NOT listed: they are
# the words a reversed claim changes. HR-277.
grounding_stopwords:
  [the, and, for, from, that, this, these, those, are, was, were, will, can, may, its,
   their, our, his, her, who, whom, which, what, when, where, how, why, all, any, each,
   such, into, onto, via, etc, also, other, others, than, then, them, they, has, have,
   had, been, being, both, either, including, include, includes, well, upon, within]

# A source SENTENCE is SFU boilerplate — and its words cannot ground anything — when at
# least this fraction of its content tokens belongs to ONE boilerplate passage
# (`boilerplate.yaml` About SFU / territorial acknowledgement / Employment Equity, plus
# `grounding_extra_boilerplate` below). Matched fuzzily on purpose: the archive's
# territorial acknowledgement spells the nations in their own orthography
# ("xʷməθkʷəy̓əm") where `boilerplate.yaml` folds to ASCII. Boilerplate sentences are also
# left out of the rewrite's input and are never "restored". MEASURED: the merge drafts
# carry the EE statement and the acknowledgement as QUALIFICATION lines (482 and 212 of
# 2,446 v9 drafts; the Coast Salish wording in 377), and on 1d68c603 the model fused them
# into "Commitment to employment equity and respect for Indigenous territories and
# cultures", which their words then grounded. HR-273.
grounding_boilerplate_threshold: 0.8

# Boilerplate wordings the archive carries that `boilerplate.yaml` does not list. Kept here,
# not there, because `boilerplate.yaml` is HASHED (validators read it) and this list only
# decides what may ground a rewrite. MEASURED: 377 of 2,446 v9 drafts. HR-274.
grounding_extra_boilerplate:
  - >-
    We acknowledge the traditional territories of the Coast Salish peoples, on whose lands
    the SFU campuses reside.

# The OLD APSA/WJQ questionnaire's own instructions to the person filling it in. The parser
# reads them into duties, Decision Making, the summary and Relationships, so they reach the
# merge draft. The rewrite removes them from its INPUT: the model never sees them, they
# cannot ground anything, and no restore can put them back (recorded in
# `stripped_source_text`). Matched on the word sequence, so punctuation variants
# (", " / "; ", "i.e." / "i.e.,") match too. MEASURED over the 2,446 v9 drafts (distinct
# drafts carrying each): 745 / 732 / 731 (the three Decision Making questions), 537
# (guidance), 534 (summary), 484 / 475 / 397 (the duty instructions), 279 (contacts),
# 173 + 139 (supervision). On 22994d3a they sat at the head of every source duty, and the
# guard scrubbed all 15 of the model's clauses. ⚠ The deterministic draft (rewrite failed or
# `--no-llm`) still carries them: removing them at the PARSER is the real fix, and it moves
# `PARSER_VERSION` and the placeholder gate (HR-047 reads "action verb" / "how and why")
# — not done here. HR-275.
form_instructions:
  - Starting with those you consider the most important, list and describe the main duties and responsibilities of the position.
  - For each item start with an action verb and briefly describe WHAT is done, HOW it is done and WHY it is done.
  - Indicate in the right hand column the percentage of time spent on each particular task.
  - Give some typical examples of the most important decisions the incumbent is expected to make in carrying out the duties and responsibilities of the position.
  - To what extent can the incumbent rely on established policies or advice from others in making these decisions?
  - Give some examples of the types of decisions the incumbent would refer to his/her supervisor.
  - Give some examples of the types of decisions the incumbent would refer to her/his supervisor.
  - Give some examples of the types of decisions the incumbent would refer to his or her supervisor.
  - Give some examples of the types of decisions the incumbent would refer to the supervisor.
  - Briefly describe the primary function and purpose of the position in one or two sentences.
  - Explain the nature of guidance received and how often work is checked or reviewed.
  - Describe the extent to which the supervisor determines the day to day work load of the position and assists in the completion of duties.
  - Describe the extent to which the supervisor determines the day-to-day workload of the position and assists in the completion of duties.
  - Indicate the number of continuing employees for whom the position is responsible.
  - Indicate the number of employees for whom the position is responsible.
  - List internal and external contacts (i.e., specific positions within own department, other departments, students, faculty, on/off campus vendors, etc.), the duration of each contact (i.e. less than 1 hour at a time, 1-2 hours at a time, more than 2 hours at a time), and the frequency of each contact (i.e. occasional, frequent, or continuous).
  - List internal and external contacts (i.e. specific positions within own department, other departments; students; faculty; on/off campus vendors; etc.), the duration of each contact (i.e. less than 1 hour at a time; 1-2 hours at a time; more than 2 hours at a time) and the frequency of each contact (occasional; frequent; continuous).
  - Type of Contact Duration Frequency

# A .doc converter hard-wraps a long instruction, and the parser makes each wrapped line a
# list ITEM ("(i.e. specific positions within own department, other departments;",
# "continuous)."). A RUN of consecutive list items, each a piece of an instruction's word
# sequence, is that instruction when ONE item of the run alone holds at least this many of
# its words — so the WJQ's real table cells that echo its words ("1 hour", "Occasional",
# "Faculty") are never taken for it, and a short wrapped tail goes with its long line.
# MEASURED: the wrapped contact instruction's first line is an item in 94 v9 drafts'
# contact lists. HR-276.
form_instruction_fragment_min_tokens: 6

# --- rewrite fidelity, round 3 (pilot round 2, 2026-10-21): HR-284…HR-288 -----------

# When is a source duty sentence ALREADY in the draft because the model REWORDED it, so
# that fold-back (HR-271) must not put it back a second time? Covered, in order:
#   1. ONE rewritten duty (the model's own words, unstemmed) holds HR-267's fraction of
#      the sentence's words AND the sentence's named terms (HR-272; a Title Case heading
#      counts only its acronyms and numbers as names);
#   2. or ONE piece of the model's text — a statement or clause cut at ";" and sentence
#      ends, or a comma part of one — has HR-267's fraction of ITS words in the sentence
#      and holds at least this share of the sentence's words (stemmed, HR-285);
#   3. or ONE sentence fold-back already restored holds HR-267's fraction of it (a
#      second member saying the same thing) — never restored text pooled with the
#      model's (round 2, cb73e45c: "careers as they relate to academic programs" read as
#      covered by "programs" plus the just-folded "academic offerings", and was in no
#      record).
# Step 3 also needs the sentence's named terms and numbers in the restored sentence
# (review of c873b13). Step 2 does NOT — measured, requiring them listed 98 more
# sentences, mostly member unit names ("AAE's website"); the cost, a reworded
# sentence losing an audience list silently, is open on HR-284.
# For a how/why CLAUSE the words it shares with its own headline do not count (when at
# least two words remain): what a clause adds is what can be lost — "ordering welcome
# event food" is not covered by a duty saying "Plans the welcome events".
# MEASURED (round-2 replay, 912 source duty sentences): 16 sentences the earlier rule
# folded back beside their rewording are now counted covered — 12 by hand-check genuine
# rewordings ("Monitors possible copyright infringement." vs "…, monitor copyright issues,
# …"; the museum's revenue-stream sentence), 3 PARTIAL ("…budgetary and HR aspects of
# large-scale building projects" vs "building plans and capital project negotiations",
# 44% kept), 1 borderline; and 20 the earlier rule counted covered are now folded or
# listed ("opportunities in Cooperative Education", headings without their name). At 0.25
# false covers appeared ("booking rooms for orientation sessions" covering "booking
# welcome reception rooms catering staff volunteers"); at 0.5 the revenue sentence (48%)
# came back as a duplicate. ⚠ "liaise with Risk Management for insurance" keeps 3 of 12
# words of a sentence whose "$1 M" threshold it lost, and that sentence still comes
# back. HR-284.
reworded_unit_min_share: 0.4

# The suffixes a light stemmer strips before the PIECE and RESTORED coverage tests (HR-284
# steps 2 and 3): the first listed suffix a word ends with is removed when at least four
# letters remain ("s" never after "s"; "ies" -> "y"), then a final "e". So "monitors" /
# "monitor", "manages" / "manage", "images" / "image" are one word. NOT the whole-duty
# test (HR-284 step 1): MEASURED on the round-2 replay, stemming a whole merged duty let
# its generic words "cover" lost sentences — "allocating centrally managed classrooms and
# other academic spaces" by "Determine records needs, priorities…", "consulting … on
# effective data use" by "best practices" — about 8 of 30 newly-covered sentences were
# silent losses. And never the grounding tests (rewrite -> source), so nothing new can
# ground a claim. An empty list switches stemming off. HR-285.
coverage_stem_suffixes: [ies, ing, ed, es, s]

# Abbreviations after which the sentence splitter does NOT end a sentence, besides any
# single-letter initial ("V." in "V. P. Advancement") and dotted acronyms ("B.C."), which
# never end one. MEASURED (round 2): "Collaborates with V. P. Advancement on fundraising
# initiatives." was cut at "V." and "Collaborates with V." folded back as a duty clause of
# its own. "etc." is deliberately NOT listed: it ends a sentence as often as not. HR-286.
sentence_abbreviations: [e.g., i.e., vs., approx., incl., dept., no., dr., mr., mrs., ms., st., ph.d.]

# A source item, or a source sentence, that is a FRAGMENT is never restored on its own as
# a bullet or a how/why clause: it is listed for the reviewer instead (fold-back:
# `dropped_duty_content`; sections and qualifications: `uncovered_items`, not restored).
# A fragment starts with an opening bracket or a comma (a wrapped continuation line:
# "(e.g. lab power supplies, …, curve tracers,"), or ends on a comma, colon or lead-in
# word without a full stop (the template's own lead-ins: "Makes decisions regarding",
# "Solves problems related to", "The Manager is responsible for"). A lowercase start is
# deliberately NOT a fragment: contact labels ("department personnel") and the parser's
# split clause pieces ("identifies priorities") are real content and read as bullets.
# Contact lists use only the cut-off rule below. Separately, an item exactly at the
# parser's own character cap for its field was CUT by the parser, so its last sentence is
# a cut-off ("Partners with a wide circle of contacts and involves" — a 400-character
# contacts item) and is listed, never restored. Duty headlines ending "by" are NOT
# restored alone either; with clauses they come back as their own duty, heading first.
# Section items come back WHOLE (up to a cut-off), never sentence by sentence. MEASURED
# (round-2 replay, 23 replies): restored items that were a lead-in, cut-off or
# continuation line 32 -> 0; 18 duty pieces newly listed instead of folded, every one a
# headline ending "by" / "such as" or a table cut-off.# Review of c873b13: an item ending ";" is NOT a fragment — ";" ends a list item ("Hiring
# of staff;", "Signing authority up to $5,000;") far more often than it wraps one, and
# such an item was listed instead of restored. HR-287.
fragment_pattern:
  pattern: '(?i)(?:^\s*[\(\[,;])|(?:(?:[,:(]|\b(?:and|or|by|to|of|for|with|the|a|an|regarding|concerning|including|related to|responsible for|such as|involves|following))\s*$)'
  ignore_case: false

# How many consecutive contact items one model contact is grounded against (HR-269, read
# for Relationships). The WJQ contact table reaches the merge one CELL per item —
# "Graduate Students", "< 1 hour", "Frequent" — and prompt v4 (rule 8) asks the model to
# keep each contact's duration and frequency WITH it, which no single cell grounds.
# MEASURED (round-2 replay): of 30 contacts scrubbed, 7 were WJQ contacts written with
# their own duration and frequency; 11 were the 0a75edf1 "Engineering Science" contacts
# of another member; 8 would be grounded in the DUTIES and 2 only in the summary — kept
# scrubbed: Relationships keeps same-section grounding (a duty-derived "contact" there was
# "First Nations territories on which SFU campuses are situated"). A model contact is
# grounded in ONE window of up to this many consecutive items of the same list; HR-272
# still requires its names. Scrubbed contacts 30 -> 19. 1 restores the item-only rule.
# HR-288.
relationships_row_window: 3

# The minimum token-Jaccard a rewritten DUTY must share with SOME draft duty. Below it the
# duty is FLAGGED (recorded, never dropped — a duty may legitimately rephrase, so a
# low-overlap duty is an HR eyeball, not a scrub). PROVISIONAL. HR-184.
#
# The same threshold, read in the OTHER direction, decides whether a MERGE duty still has
# a counterpart in the rewrite: a merge duty matching no rewritten duty this closely is
# recorded as REMOVED (`AntiFabricationRecord.removed_duties`), and a rewritten duty that
# DOES match carries its merge duty's `frequency` back. One number, both directions —
# deliberately not a second knob, because "close enough to be the same duty" is one
# question and answering it twice is how two thresholds drift apart.
duty_flag_threshold: 0.2

# May a rewrite handed a draft with NO DUTIES AT ALL return any? `true` (shipped): no —
# every duty it returns is dropped and recorded as `invented_duties`.
#
# 🔴 MEASURED ON THE LIVE BANK 2026-08-22: 153 drafts carry 1,219 duties that NO source
# document states — 101 of the 649 CUPE drafts (15.6%), 996 duties. The chain: the WJQ
# parser recovers no duties from 719 of 4,440 CUPE documents (16.2%, against 2.2% on the
# APSA form); the 4.1 merge correctly produces nothing from nothing; and the rewrite then
# writes eight to twelve plausible, specific duties out of thin air.
#
# Nothing objected, because the duty guard only FLAGS what the model adds and never
# removes it — right when the draft HAS duties to drift from, vacuous when it has none.
# `false` restores the pre-2026-08-22 behaviour. A draft that honestly reports no duties
# fails `SFU-COMP-DUTIES` (the completeness rule for a JD with no duties at all), which
# is the right place for the parser gap to become visible: a fabricated duty list scores
# better and tells the reviewer something untrue about the role. HR-213.
duties_never_invented: true

# Whether a SECTION the 4.1 merge GROUNDED may come back EMPTY from the rewrite.
#
# 🔴 THE MIRROR OF HR-213, AND THE SAME BLIND SIDE ONE DIRECTION OVER. The section guard
# (`_SECTIONS_NEVER_INVENTED`) fires only on EMPTY -> NON-EMPTY: it stops the model
# writing a Problem Solving section onto a CUPE role whose form never asks for one. It
# said nothing about NON-EMPTY -> EMPTY, and its comment asserted that direction "drops
# nothing a source document stated". That was never measured, and it is false.
#
# MEASURED 2026-08-23 over the 50 clusters the v5 producer pass processed before it was
# stopped for this: the merge grounded `relationships` for 43 of them and 11 drafts came
# back WITHOUT it — a 25.6% loss rate — with ZERO sections created. One cluster had all
# 40 members carrying relationships and a merge of `internal=20, external=1`; its draft
# carried none. Against the untouched cohort as a control (90.4% carry-through on the
# same population), that is roughly -3 sigma, not noise.
#
# `true` (shipped): the merge's own section is restored and the name recorded in
# `AntiFabricationRecord.restored_sections`. `false` restores the pre-2026-08-23
# behaviour.
#
# ⚠ WHAT THIS DELIBERATELY DOES NOT DECIDE: a section the model RETURNED is left alone,
# even when it is far thinner than the merge's. The same cluster above compressed twenty
# internal contacts to three on a re-run, which is either acceptable rewording or content
# loss depending on a judgement nobody has made yet. Restoring only the EMPTY case is the
# part that is unambiguous; the compression question is HR's and is not silently answered
# by shipping a threshold here. HR-214.
sections_never_emptied: true

# What DUTY FLOOR the rewrite prompt states. `grounded` (shipped): the number of duties
# THIS merge actually produced, capped by the form's `duties_max`. `form_minimum`: the
# drafted form's own `duties_min` — the pre-HR-209 behaviour. HR-209.
#
# 🔴 MEASURED against the live Bank on 2026-08-19, over the five largest all-CUPE
# clusters: 60 merge duties came back as 36 rewritten ones, and only 10 of those kept a
# `frequency`. Phase D had already fixed the destructive case — the prompt states the
# drafted form's numbers, so a CUPE rewrite asks for `3–12` and not JDFN's `3–5`. What
# was left is quieter: the FLOOR of 3 licenses the model to compress twelve grounded
# duties into seven, and nothing objects. The WJQ profile's `duties_min` is 3 (HR-203),
# so the seven-duty draft passes its own bar; the anti-fabrication guard is looking the
# other way, because it exists to stop the model ADDING.
#
# The floor the REWRITE should state is not the form's — it is what this particular merge
# grounded. A rewrite is a rewording pass: handed twelve duties, its job is to reword
# twelve, not to decide how many duties a role has. The form's `duties_min` stays exactly
# right for the VALIDATOR, which judges a finished JD from any source; it is the wrong
# number to hand a pass whose input is already known.
#
# A SPARSE merge is NOT rounded up to the form's minimum: a cluster that grounded two
# duties has two duties, and asking for three asks the model to invent one. The validator
# reports the under-run (`SFU-COMP-DUTIES`) — the right place for it.
duty_floor_policy: grounded

# Which QUALIFICATION KINDS the rewrite is allowed to author. Everything else the model
# returns is discarded and the 4.1 merge draft's own qualifications of that kind are
# RESTORED verbatim (recorded in `AntiFabricationRecord.restored_bars`). HR-208.
#
# knowledge / skill / ability are free-text competencies — rewording them is the pass's
# job, and the grounding guard (`skill_grounding_*`) polices what it may say. education /
# experience / security are STRUCTURAL BARS the 4.1 merge derives from member signals,
# and a language model has no source for them: it was measured inserting `PhD in
# Astrophysics required` and `Enhanced Reliability security clearance` on a clerical CUPE
# draft, with an empty anti-fabrication record, because the grounding guard read only the
# three kinds below. On an HR system an invented hiring bar is the highest-consequence
# fabrication there is — it is what screens candidates out.
rewritable_qualification_kinds: [knowledge, skill, ability]

# How long ONE INTERACTIVE assist request (the Builder's "improve my summary") may wait
# on the chat model before it gives up and returns the author's page with an
# explanation. NOT the batch budget: the 4.2a harmonization rewrite works through
# clusters offline and may legitimately take far longer, so ChatClient's own default is
# unchanged. Bounds the same accept-then-stall failure the embedding budget does
# (HR-198), and is larger because a generated completion legitimately takes tens of
# seconds where an embedding round trip does not. HR-199.
interactive_timeout_seconds: 60.0
