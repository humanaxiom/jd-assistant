# Compensation Requisition Form (CRF) — field map for the AcroForm filler (Track K, K2).
# Rulebook-as-data (CLAUDE.md §2): which PDF field carries which Bank value lives HERE,
# never in Python. The Bank fills SFU's OWN form; it never redraws it.
#
# WHY A MAP AT ALL: the PDF's field names are unreliable and several are actively
# misleading (`Supervisor Position Title` is the CONTACT person; `OBJECT 4` is PROJECT).
# Every name below was matched to its printed label by drawing the widget rectangles on a
# render (docs/audit/2026-10-19-search-hr-compreq/comp-form-mapping.md, widget_labels.txt).
#
# THE TEMPLATE IS PINNED. `template_sha256` is the sha256 of the shipped PDF ("Updated
# September 17, 2024"). The filler REFUSES a template whose hash differs, and a test fails
# if the PDF's field set differs from `all_fields` — so an SFU revision cannot be filled
# silently against a stale map.
#
# NOT a decision register entry: nothing here is a threshold or a judgement. The map is
# dictated by the form; `employee_group_options` is dictated by the dropdown's own option
# list. Suggested-for-confirmation fields (request type, change boxes, VPA trigger) are out
# of scope for K2 and WILL be rules when built.
version: crf_fields_v1
template_file: CompensationRequisitionForm_2024.pdf
template_sha256: e3616b92be770cc2b4e412fd7099f8509c2e711850ed23821ae3303827c6e790
checkbox_on_value: /Yes

# semantic name -> PDF field name (the ONLY fields the Bank may fill)
prefill_fields:
  position_number: "Position  NA if new"             # General: Position # (N/A Position if new)
  position_title: "Position Title"                   # General: Position Title
  department: "Department"                           # General: Department
  based_on_positions_a: "Text70"                     # Sec A: based off existing? list all position #
  based_on_positions_b: "No      If no specify effective date of changeRow1"  # Sec B: list all position #
  jd_in_word_attached: "Check Box79"                 # Checklist: Job description in Word format
  employee_group: "Employee Group"                   # VPA section: Employee Group (APSA | APEX)
  contact_name: "Supervisor Position Title"          # General: Contact Name & Position Title (the field name is misleading)
  contact_email: "Email_2"                           # General: the Email beside the contact

# Type of request (the five boxes at the top of page 1). Which box is which was read
# off the rendered form (comp-form-mapping.md / evidence/widget_labels.txt). Ticked
# only when the rulebook says so (comp_requisition.tick_request_type, HR-311).
request_type_boxes:
  new_based_on_existing: "Check Box71"   # A. New Position
  reevaluation: "Check Box75"            # B. Re-evaluation
  editorial: "Check Box72"               # C. Editorial Changes
  additional_duties: "Check Box76"       # D. Additional Duties (Temporary)
  other_changes: "Check Box73"           # E. Other Changes

# "Is this based off of an existing position?" — the YES box of each pair (Check
# Box67 / Check Box56 are the No boxes and are never written). Ticked only when that
# section's list is written (comp_requisition.tick_based_on_existing, HR-312).
based_on_existing_yes_boxes:
  based_on_positions_a: "Check Box66"
  based_on_positions_b: "Check Box55"

# Bank employee_group code -> the dropdown option. CUPE / Poly / excluded are NOT options on
# the form, so they map to nothing and the field stays empty (never coerced).
employee_group_options:
  apsa: APSA
  apex: APEX

# CompReqPrefill fields that are carried for the caller (K3's picker, a warning) and are
# NEVER written to the PDF.
unwritten_fields:
  - candidate_positions
  - positions_incomplete
  - reference_grades      # the sources' grades, shown on the page only (HR-314)
  - filled_from_sources   # which facts came from the source files, for the page

# OVERFLOW of the single-line "list all position #" boxes. MEASURED off the template:
# `Text70` (Sec A) is 212.03 pt wide at a FIXED 12 pt Helvetica; a padded id is 8 digits
# = 53.4 pt and ", " is 6.7 pt, so three ids + a "+K more" marker do not fit and TWO
# do (2 ids + " +71 more" = 168 pt). `max_ids` is therefore 2. Sec B's box is wider
# (247.9 pt, auto font) so the same cap is conservative there. A longer list writes the
# first `max_ids` + the marker on the box, and the FULL list under its section label in
# `details_field` (the large multiline "Reason for request" box).
overflow:
  max_ids: 2
  more_template: " +{k} more"
  field_width_pt: 212.0
  font_size_pt: 12
  details_field: "Reason for request and additional information"
  section_labels:
    based_on_positions_a: "Section A"
    based_on_positions_b: "Section B"

# Fields the filler must NEVER write, whatever it is asked.
signature_fields:
  - Signature
  - Signature_2
  - Signature3

