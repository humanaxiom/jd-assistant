# Alembic configuration for JD Bank (async SQLAlchemy).
# Lives at core/ so `docker compose exec api alembic upgrade head` (cwd=/app)
# finds it. The DB URL is resolved in env.py (from src.settings, overridable via
# `-x sqlalchemy.url=...` or Config.set_main_option), so it is intentionally
# blank here — no secrets in the repo.
[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
