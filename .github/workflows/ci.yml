name: CI — Gates Pipeline (Docker-only, ADR-006)

# Docker-only project (ADR-006): no host language runtimes in CI.
# The gate suite runs inside the one-shot `gates` compose service — the exact
# same command as local `make gates`, so local == CI. testcontainers reach the
# host Docker socket at /var/run/docker.sock (preinstalled on ubuntu-latest).

# ⚠ EVERY PR USED TO COST TWO FULL RUNS. `on: push` with no branch filter fired on the
# branch push AND `pull_request` fired on the same commit — 20 minutes of Actions minutes
# to gate one change twice. `push` is now main-only (post-merge verification), so a PR
# costs ONE run and `main` still gets checked after every merge.
#
# `paths-ignore` skips the suite for documentation CI does not validate. Deliberately NOT
# a blanket `**.md`: `docs/decisions/**` holds the HR decision register, which the
# register gate DOES validate against `decision_register.yaml`, and a hand-edit there must
# still be caught. See CLAUDE.md § Change workflow — most docs commit straight to `main`
# and never reach this file at all.
#
# ⚠ NO `!` NEGATION BELOW, deliberately. GitHub's negation semantics in `paths-ignore`
# are order-dependent and easy to get subtly wrong, and getting it wrong here means the
# register gate silently stops running. `docs/decisions/**` is protected by being ABSENT
# from this list rather than by a negated pattern — it therefore always triggers CI.
on:
  push:
    branches: [main]
    paths-ignore: &doc_paths
      - '*.md'
      - 'docs/*.md'
      - 'docs/adr/**'
      - 'docs/archive/**'
      - 'docs/audit/**'
      - 'docs/baseline/**'
      - 'docs/canonical/**'
      - 'docs/cluster/**'
      - 'docs/dedup/**'
      - 'docs/demo/**'
      - 'docs/embeddings/**'
      - 'docs/harmonize/**'
      - 'docs/tasks/**'
  pull_request:
    paths-ignore: *doc_paths

jobs:
  # ─── Gate 0: Branch naming (main is exempt as the protected base) ─────────
  branch-name:
    name: "Gate: branch-name"
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch name
        run: |
          BRANCH="${{ github.head_ref || github.ref_name }}"
          echo "Branch: $BRANCH"
          if [[ "$BRANCH" == "main" ]]; then exit 0; fi
          if [[ ! "$BRANCH" =~ ^(agent|feat|fix|chore)/[a-zA-Z0-9._-]+$ ]]; then
            echo "::error::Branch '$BRANCH' must match (agent|feat|fix|chore)/<slug>"
            exit 1
          fi

  # ─── Gates 1-6: full suite in the Docker `gates` service (== make gates) ──
  gates:
    name: "Gates: ruff · black · mypy · unit · integration · coverage ≥ 80%"
    runs-on: ubuntu-latest
    needs: branch-name
    steps:
      - uses: actions/checkout@v4

      - name: Build gates image
        run: docker compose build gates

      - name: Run full gate suite (Docker-only, identical to local `make gates`)
        run: |
          docker compose run --rm gates sh -c '\
            ruff check src tests && \
            black --check src tests && \
            mypy src --strict && \
            pytest tests/unit tests/integration -m "not live" --cov=src --cov-fail-under=80 --timeout=300 -q'

  # ─── Gate 7: the HR decision register's Markdown view is not stale ────────
  # docs/decisions/HR-DECISION-REGISTER.md is RENDERED from
  # core/src/jd_core/rules/decision_register.yaml — never hand-edited. The gate
  # suite already proves the register matches the live rules; this proves the
  # document SFU HR reads matches the register. (Runs outside the `gates`
  # container, which mounts only ./core and cannot see docs/ — the renderer
  # prints to stdout and the host writes the file. == local `make register-check`.)
  register-drift:
    name: "Gate: HR decision register (docs are in step)"
    runs-on: ubuntu-latest
    needs: branch-name
    steps:
      - uses: actions/checkout@v4

      - name: Build gates image
        run: docker compose build gates

      # The committed file must EXIST and be tracked — otherwise a `git diff` gate
      # would pass vacuously on a register that was never committed at all.
      - name: The rendered register is committed
        run: git ls-files --error-unmatch docs/decisions/HR-DECISION-REGISTER.md

      # Identical to local `make register-check`: the committed Markdown goes IN on
      # stdin and the container diffs it against a fresh render (exit 1 on drift).
      - name: Fail if the committed Markdown drifted from decision_register.yaml
        run: |
          docker compose run --rm -T gates python -m src.jd_core.rules.render --check \
            < docs/decisions/HR-DECISION-REGISTER.md
